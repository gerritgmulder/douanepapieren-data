<!DOCTYPE html>
<html lang="nl">
<head>
<!-- Wie hier binnen mag staat in toegang.js, dezelfde lijst als het dashboard. -->
<script src="toegang.js"></script>
<script>
/* Toegangscontrole. Het dashboard verbergt de tegel al, maar met de terugknop
   is een pagina die een vórige gebruiker opende opnieuw te bereiken. */
(function(){
  var TOEGANG = window.fpToegang ? window.fpToegang.set("uren") : null;
  var email = (localStorage.getItem("fp.email")||"").toLowerCase();
  if (!localStorage.getItem("fp.session")) { location.replace("dashboard.html"); return; }
  if (TOEGANG && TOEGANG.has(email)) return;
  window.fpGeenToegang = true;
  document.write('<style>body{margin:0;font-family:Montserrat,-apple-system,sans-serif;background:#f5f4ef;color:#1f2937}'+
    '.gt{max-width:520px;margin:14vh auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:34px;text-align:center}'+
    '.gt h1{color:#144734;font-size:20px;margin:0 0 10px}.gt p{color:#6b7280;font-size:14px;line-height:1.5}'+
    '.gt a{display:inline-block;margin-top:14px;background:#144734;color:#fff;text-decoration:none;padding:10px 20px;border-radius:8px;font-size:13px}</style>'+
    '<div class="gt"><h1>Geen toegang</h1><p>De tegel Mijn uren is niet beschikbaar voor jouw account.</p>'+
    '<a href="dashboard.html">&larr; Terug naar het dashboard</a></div>');
  window.stop();
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fonteyn — Mijn uren</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ══════════════════════════════════════════════════════════════════════
     MIJN UREN

     Eén knop: Start als je begint, Stop als je klaar bent. De lopende
     registratie staat in de opslag en niet op dit toestel, dus je klokt in
     op je telefoon in de loods en klokt af achter je bureau - dat is precies
     waarom dit op een telefoon thuishoort.

     Vergeten te stoppen kan iedereen overkomen, dus elke regel is achteraf
     bij te stellen en er kan er ook met de hand een bij.

     Je ziet alleen je eigen uren. Dat regelt de worker aan de hand van de
     persoonlijke sleutel; deze pagina stuurt geen naam mee en zou er ook
     niets aan hebben.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --groen:#144734; --groen-donker:#0d3325; --lime:#8bc53f;
  --bg:#f5f4ef; --kaart:#fff; --ink:#1f2937; --grijs:#6b7280; --rand:#e5e7eb;
  --rood:#b91c1c; --waarschuw:#92400e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Montserrat",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);
     color:var(--ink);font-size:15px;-webkit-text-size-adjust:100%}

header{background:var(--groen);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;
       position:sticky;top:0;z-index:20;padding-top:calc(12px + env(safe-area-inset-top))}
header h1{margin:0;font-size:15px;font-weight:600;flex:1}
header a.knop,header button.knop{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);
       border-radius:8px;padding:7px 13px;font:inherit;font-size:12px;cursor:pointer;text-decoration:none}

main{max-width:820px;margin:0 auto;padding:16px;padding-bottom:calc(30px + env(safe-area-inset-bottom))}

/* De klok. Groot genoeg om vanaf een meter afstand te lezen, en de knop
   eronder is met een duim te raken zonder te kijken. */
.klok{background:var(--kaart);border:1px solid var(--rand);border-radius:16px;padding:22px 18px;
      text-align:center;margin-bottom:16px}
.klok.loopt{border-color:var(--lime);background:#fbfdf7}
.klok .tijd{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.1;
            font-variant-numeric:tabular-nums;color:var(--groen)}
.klok .sinds{font-size:12.5px;color:var(--grijs);margin-top:5px}
.klok .waaraan{margin-top:14px}
.klok input[type=text]{width:100%;border:1px solid var(--rand);border-radius:10px;padding:13px;
                       font:inherit;font-size:16px;background:#fff;color:var(--ink);text-align:center}
.klok input:focus{outline:none;border-color:var(--lime)}
.grote{display:block;width:100%;margin-top:14px;border:none;border-radius:14px;padding:19px;
       font:inherit;font-size:18px;font-weight:700;cursor:pointer;color:#12331f;background:var(--lime)}
.grote.stop{background:var(--groen);color:#fff}
.grote:disabled{background:#d1d5db;color:#6b7280}

.balk{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.balk h2{margin:0;font-size:14px;font-weight:600;color:var(--groen);flex:1}
.balk .totaal{font-size:13px;color:var(--grijs);font-variant-numeric:tabular-nums}
.balk select{border:1px solid var(--rand);border-radius:8px;padding:7px 9px;font:inherit;
             font-size:13px;background:#fff;color:var(--ink)}

ul.dagen{list-style:none;margin:0;padding:0}
ul.dagen>li{margin-bottom:14px}
.dagkop{display:flex;align-items:baseline;gap:8px;padding:0 3px 5px}
.dagkop b{font-size:13px;font-weight:600}
.dagkop span{font-size:12px;color:var(--grijs);margin-left:auto;font-variant-numeric:tabular-nums}
.regels{background:var(--kaart);border:1px solid var(--rand);border-radius:12px;overflow:hidden}
.regel{display:flex;align-items:center;gap:11px;padding:12px 14px;border-top:1px solid var(--rand);cursor:pointer}
.regel:first-child{border-top:none}
.regel:active{background:#fafaf8}
.regel .tijden{font-size:13px;font-variant-numeric:tabular-nums;flex:0 0 auto;color:var(--grijs)}
.regel .wat{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.regel .wat.leeg{color:var(--grijs);font-style:italic}
.regel .duur{font-size:14px;font-weight:600;flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--groen)}
.regel .hand{font-size:10px;color:var(--grijs);border:1px solid var(--rand);border-radius:999px;padding:1px 6px}

.leeg{background:var(--kaart);border:1px solid var(--rand);border-radius:12px;padding:30px 20px;
      text-align:center;color:var(--grijs);line-height:1.6}
.fout{background:#fef2f2;border:1px solid #fecaca;color:var(--rood);border-radius:10px;
      padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:12px}
.melding{background:#fff7ed;border:1px solid #fed7aa;color:var(--waarschuw);border-radius:10px;
         padding:13px 15px;font-size:13px;line-height:1.55;margin-bottom:12px}
.bezig{text-align:center;color:var(--grijs);padding:26px;font-size:13px}

/* Een regel aanpassen of met de hand toevoegen. Zelfde venster voor allebei. */
#bewerk{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;
        align-items:flex-end;justify-content:center}
#bewerk.aan{display:flex}
#bewerk .kaart{background:var(--kaart);border-radius:16px 16px 0 0;width:100%;max-width:560px;
               padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));
               max-height:92vh;overflow-y:auto}
#bewerk h3{margin:0 0 14px;font-size:16px;color:var(--groen)}
#bewerk label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--grijs);
              font-weight:500;margin-bottom:11px}
#bewerk input{border:1px solid var(--rand);border-radius:10px;padding:13px;font:inherit;
              font-size:16px;background:#fff;color:var(--ink)}
#bewerk input:focus{outline:none;border-color:var(--lime)}
#bewerk .knoppen{display:flex;gap:8px;margin-top:6px}
#bewerk .knoppen button{flex:1;border-radius:11px;padding:14px;font:inherit;font-size:14px;
                        font-weight:600;cursor:pointer;border:1px solid var(--rand);background:var(--kaart)}
#bewerk .knoppen button.doe{background:var(--groen);color:#fff;border-color:var(--groen)}
#bewerk .weg{width:100%;margin-top:10px;background:transparent;border:none;color:var(--rood);
             font:inherit;font-size:13px;cursor:pointer;padding:10px}
</style>
</head>
<body>

<header>
  <a class="knop" href="dashboard.html">&larr;</a>
  <h1>Mijn uren</h1>
  <button class="knop" id="knopHand">Met de hand</button>
</header>

<main>
  <div id="melding"></div>

  <div class="klok" id="klok">
    <div class="tijd" id="tijd">0:00</div>
    <div class="sinds" id="sinds">Nog niet begonnen vandaag</div>
    <div class="waaraan">
      <input type="text" id="waaraan" placeholder="Waar ben je mee bezig?" autocomplete="off">
    </div>
    <button class="grote" id="knopKlok">Start</button>
  </div>

  <div class="balk">
    <h2>Deze maand</h2>
    <span class="totaal" id="totaal"></span>
    <select id="maand"></select>
  </div>
  <div id="lijst"><div class="bezig">Bezig…</div></div>
</main>

<div id="bewerk">
  <div class="kaart">
    <h3 id="bewerkTitel">Regel aanpassen</h3>
    <div id="bewerkFout"></div>
    <label>Begin<input type="datetime-local" id="vStart"></label>
    <label>Einde<input type="datetime-local" id="vEind"></label>
    <label>Waaraan<input type="text" id="vWat" autocomplete="off"></label>
    <div class="knoppen">
      <button id="bewerkTerug">Laat maar</button>
      <button class="doe" id="bewerkOpslaan">Opslaan</button>
    </div>
    <button class="weg" id="bewerkWeg">Deze regel verwijderen</button>
  </div>
</div>

<script>
"use strict";
if (window.fpGeenToegang) throw new Error("geen toegang");

var WORKER = "https://fonteyn-data-store.g-mulder.workers.dev";
var bezig = null;      // de lopende registratie, of null
var regels = [];
var maandNu = "";
var bewerkt = null;    // de regel die in het venster openstaat, of null bij nieuw
var tikker = null;

function el(id){ return document.getElementById(id); }
function sleutel(){ return localStorage.getItem("fp.mailkey") || ""; }

async function roep(pad, body){
  var k = sleutel();
  if (!k) return { ok:false, error:"opnieuw-inloggen" };
  var h = { "X-Fonteyn-Mail": k };
  if (body) h["Content-Type"] = "application/json";
  try {
    var r = await fetch(WORKER + pad, {
      method: body ? "POST" : "GET", headers: h,
      body: body ? JSON.stringify(body) : undefined,
    });
    return await r.json();
  } catch (e) { return { ok:false, error:"geen-verbinding", uitleg:String(e.message||e) }; }
}

function tekst(s){ var d=document.createElement("div"); d.textContent = s==null?"":s; return d.innerHTML; }

/* Minuten als 7:30, niet als 7,5 - een dienst lees je in uren en minuten. */
function duur(min){
  var m = Math.max(0, Math.round(min));
  return Math.floor(m/60) + ":" + String(m%60).padStart(2,"0");
}
function klokTijd(iso){
  var d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
}
function dagNaam(iso){
  var d = new Date(iso);
  if (isNaN(d)) return "";
  var vandaag = new Date();
  if (d.toDateString() === vandaag.toDateString()) return "Vandaag";
  var gisteren = new Date(vandaag); gisteren.setDate(gisteren.getDate()-1);
  if (d.toDateString() === gisteren.toDateString()) return "Gisteren";
  return d.toLocaleDateString("nl-NL",{weekday:"long",day:"2-digit",month:"2-digit"});
}
function dagSleutel(iso){ var d=new Date(iso); return isNaN(d)?"":d.toDateString(); }

/* Voor de datumvelden: die willen lokale tijd zonder zone, de opslag bewaart
   UTC. Heen en terug rekenen dus, anders schuift alles een of twee uur op. */
function naarVeld(iso){
  var d = new Date(iso);
  if (isNaN(d)) return "";
  var p = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return p.toISOString().slice(0,16);
}
function uitVeld(waarde){
  if (!waarde) return "";
  var d = new Date(waarde);          // wordt als lokale tijd gelezen
  return isNaN(d) ? "" : d.toISOString();
}

function toonFout(r){
  var m = el("melding");
  if (!r || r.ok) { m.innerHTML = ""; return false; }
  if (r.error === "opnieuw-inloggen") {
    m.innerHTML = '<div class="melding">Je sleutel is verlopen. Log opnieuw in op het dashboard, ' +
                  'dan werkt dit weer.</div>';
    return true;
  }
  m.innerHTML = '<div class="fout">' + tekst(r.uitleg || r.error || "Er ging iets mis") + "</div>";
  return true;
}

function tekenKlok(){
  var k = el("klok");
  if (bezig) {
    k.classList.add("loopt");
    var min = (Date.now() - new Date(bezig.start)) / 60000;
    el("tijd").textContent = duur(min);
    el("sinds").textContent = "Bezig sinds " + klokTijd(bezig.start);
    el("knopKlok").textContent = "Stop";
    el("knopKlok").classList.add("stop");
    if (document.activeElement !== el("waaraan")) el("waaraan").value = bezig.omschrijving || "";
  } else {
    k.classList.remove("loopt");
    el("tijd").textContent = "0:00";
    el("sinds").textContent = "Nog niet begonnen";
    el("knopKlok").textContent = "Start";
    el("knopKlok").classList.remove("stop");
  }
}

/* De klok loopt door zolang de pagina openstaat. Elke tien seconden is ruim
   genoeg: de minuten zijn wat telt, en vaker vernieuwen kost alleen batterij. */
function startTikker(){
  if (tikker) clearInterval(tikker);
  tikker = setInterval(function(){ if (bezig) tekenKlok(); }, 10000);
}

function tekenLijst(){
  if (!regels.length) {
    el("lijst").innerHTML = '<div class="leeg">Nog geen uren deze maand.</div>';
    el("totaal").textContent = "";
    return;
  }
  var totaal = regels.reduce(function(n,r){ return n + (r.minuten||0); }, 0);
  el("totaal").textContent = duur(totaal) + " totaal";

  var perDag = [];
  var laatste = null;
  regels.forEach(function(r){
    var d = dagSleutel(r.start);
    if (!laatste || laatste.dag !== d) { laatste = { dag:d, iso:r.start, regels:[] }; perDag.push(laatste); }
    laatste.regels.push(r);
  });

  el("lijst").innerHTML = "<ul class='dagen'>" + perDag.map(function(dag){
    var som = dag.regels.reduce(function(n,r){ return n + (r.minuten||0); }, 0);
    return "<li><div class='dagkop'><b>" + tekst(dagNaam(dag.iso)) + "</b>" +
      "<span>" + duur(som) + "</span></div><div class='regels'>" +
      dag.regels.map(function(r){
        return "<div class='regel' data-id='" + tekst(r.id) + "'>" +
          "<span class='tijden'>" + klokTijd(r.start) + " - " + klokTijd(r.eind) + "</span>" +
          "<span class='wat" + (r.omschrijving ? "" : " leeg") + "'>" +
            tekst(r.omschrijving || "geen omschrijving") + "</span>" +
          (r.metDeHand ? "<span class='hand'>hand</span>" : "") +
          "<span class='duur'>" + duur(r.minuten||0) + "</span></div>";
      }).join("") + "</div></li>";
  }).join("") + "</ul>";

  Array.prototype.forEach.call(el("lijst").querySelectorAll(".regel"), function(d){
    d.onclick = function(){ openBewerk(regels.find(function(r){ return r.id === d.dataset.id; })); };
  });
}

function vulMaanden(){
  var s = el("maand");
  if (s.options.length) return;
  var nu = new Date();
  for (var i = 0; i < 12; i++) {
    var d = new Date(Date.UTC(nu.getFullYear(), nu.getMonth() - i, 1));
    var w = "uren-" + d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,"0");
    var o = document.createElement("option");
    o.value = w;
    o.textContent = d.toLocaleDateString("nl-NL",{month:"long",year:"numeric"});
    s.appendChild(o);
  }
  s.onchange = function(){ maandNu = s.value; haal(); };
}

async function haal(){
  var r = await roep("/uren/lijst" + (maandNu ? "?maand=" + encodeURIComponent(maandNu) : ""));
  if (toonFout(r)) { el("lijst").innerHTML = ""; return; }
  regels = r.regels || [];
  bezig = r.bezig || null;
  maandNu = r.maand;
  vulMaanden();
  el("maand").value = maandNu;
  tekenKlok();
  tekenLijst();
}

el("knopKlok").onclick = async function(){
  var knop = el("knopKlok");
  knop.disabled = true;
  var wat = el("waaraan").value.trim();
  var r = bezig ? await roep("/uren/stop", { omschrijving: wat })
                : await roep("/uren/start", { omschrijving: wat });
  knop.disabled = false;

  if (!r.ok && r.error === "loopt-al") {
    /* Kan gebeuren als je op twee toestellen tegelijk zit. Gewoon overnemen
       wat er loopt in plaats van klagen. */
    bezig = r.bezig; tekenKlok(); return;
  }
  if (toonFout(r)) return;
  if (!bezig) { bezig = r.bezig; el("waaraan").value = bezig.omschrijving || ""; tekenKlok(); }
  else { bezig = null; el("waaraan").value = ""; await haal(); }
};

/* De omschrijving bijwerken terwijl de klok loopt: bij het stoppen gaat mee
   wat er op dat moment in het veld staat, dus hier hoeft niets bewaard. */

function openBewerk(r){
  bewerkt = r || null;
  el("bewerkFout").innerHTML = "";
  el("bewerkTitel").textContent = r ? "Regel aanpassen" : "Uren met de hand";
  el("bewerkWeg").style.display = r ? "" : "none";
  if (r) {
    el("vStart").value = naarVeld(r.start);
    el("vEind").value = naarVeld(r.eind);
    el("vWat").value = r.omschrijving || "";
  } else {
    var nu = new Date();
    var eerder = new Date(nu.getTime() - 3600000);
    el("vStart").value = naarVeld(eerder.toISOString());
    el("vEind").value = naarVeld(nu.toISOString());
    el("vWat").value = "";
  }
  el("bewerk").classList.add("aan");
}
function sluitBewerk(){ el("bewerk").classList.remove("aan"); bewerkt = null; }

el("knopHand").onclick = function(){ openBewerk(null); };
el("bewerkTerug").onclick = sluitBewerk;
el("bewerk").onclick = function(e){ if (e.target === el("bewerk")) sluitBewerk(); };

el("bewerkOpslaan").onclick = async function(){
  var start = uitVeld(el("vStart").value);
  var eind  = uitVeld(el("vEind").value);
  if (!start || !eind) {
    el("bewerkFout").innerHTML = '<div class="fout">Vul een begin- en een eindtijd in.</div>';
    return;
  }
  el("bewerkOpslaan").disabled = true;
  var r = bewerkt
    ? await roep("/uren/wijzig", { id:bewerkt.id, maand:maandNu, start:start, eind:eind,
                                   omschrijving: el("vWat").value.trim() })
    : await roep("/uren/toevoegen", { start:start, eind:eind, omschrijving: el("vWat").value.trim() });
  el("bewerkOpslaan").disabled = false;
  if (!r.ok) {
    el("bewerkFout").innerHTML = '<div class="fout">' + tekst(r.uitleg || r.error) + "</div>";
    return;
  }
  sluitBewerk();
  await haal();
};

el("bewerkWeg").onclick = async function(){
  if (!bewerkt) return;
  var r = await roep("/uren/wijzig", { id:bewerkt.id, maand:maandNu, verwijderen:true });
  if (!r.ok) { el("bewerkFout").innerHTML = '<div class="fout">' + tekst(r.uitleg || r.error) + "</div>"; return; }
  sluitBewerk();
  await haal();
};

/* Terug uit de achtergrond: de klok kan minuten of uren verder staan, en er
   kan op een ander toestel gestart of gestopt zijn. */
document.addEventListener("visibilitychange", function(){
  if (!document.hidden) haal();
});

startTikker();
haal();
</script>
</body>
</html>
