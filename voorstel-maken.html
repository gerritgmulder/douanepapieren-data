<meta charset="utf-8">

<script src="taal.js"></script>
<script src="kop.js"></script>

<script>
  (function(){
    if (!localStorage.getItem("fp.session")) { location.replace("dashboard.html"); return; }
    var ik = (localStorage.getItem("fp.email")||"").toLowerCase();
    if (window.fpToegang && !fpToegang.mag("voorstel-maken", ik)) {
      document.addEventListener("DOMContentLoaded", function(){
        document.body.innerHTML = '<div style="max-width:420px;margin:14vh auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:34px;text-align:center;font-family:Montserrat,system-ui,sans-serif">' +
          '<h2 style="color:#144734;margin:0 0 8px">Voorstel maken</h2><p style="color:#6b7280">Deze tegel is voor de adviseurs.</p>' +
          '<a href="dashboard.html">&larr; Terug naar het dashboard</a></div>';
      });
    }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voorstel maken - Fonteyn Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ═════════════════════════════════════════════════════════════════
     VOORSTEL MAKEN - de plek waar een voorstel voor een klant ontstaat

     Gerrit (30 okt 2026): niemand maakt nog een offerte in Logic4. Een
     voorstel begint hier: klantgegevens, dan de mail "Bevestig je gegevens",
     en pas als de klant op "Klopt" heeft geklikt (of het zelf heeft
     aangepast) komt de offerte in Logic4 en kunnen er regels bij. Alles wat
     het offertescherm van Logic4 heeft, kan hier ook.

     De motor staat in data-worker/src/voorstel.js (routes /voorstel/...),
     de pagina voor de klant op /bevestig.

     OTA: staat in manifest.json. Nooit opnieuw installeren.
     ═════════════════════════════════════════════════════════════════ -->
<style>
:root{ --groen:#144734; --lime:#8bc53f; --ink:#1f2937; --grijs:#6b7280; --rand:#e5e7eb; --bg:#f5f4ef; --rood:#b91c1c; --oranje:#b45309; }
*{box-sizing:border-box}
body{margin:0;font-family:"Montserrat",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px}
header{background:var(--groen);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:16px;font-weight:600;flex:1}
main{max-width:1100px;margin:16px auto;padding:0 14px 60px}
body.demo main{max-width:1440px}
.kaart{background:#fff;border:1px solid var(--rand);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.kaart h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--groen);display:flex;align-items:center;gap:8px;white-space:nowrap}
.kaart h2 .rechts{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.lead{color:var(--grijs);font-size:12.5px;margin:0 0 10px;line-height:1.5}
.stappen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stap{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--grijs)}
.stap b{display:block;color:var(--ink);font-size:13px;white-space:nowrap}
.stap.nu{border-color:var(--lime);box-shadow:0 0 0 2px #8bc53f33}.stap.klaar{background:#f0f7e8;border-color:#cfe4b5}
.raster{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 10px}
.raster > div{min-width:0}
.s1{grid-column:span 1}.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
/* Dolf (video 6 nov 2026): "het is een heel scherm, een heel gezoek". Invullen gaat onder elkaar. */
.raster.onder{grid-template-columns:minmax(0,1fr);max-width:560px}
.raster.onder > div{grid-column:1 / -1}
.btw-uitleg{font-size:11.5px;margin-top:4px;color:var(--grijs)}.btw-uitleg.goed{color:#15803d}.btw-uitleg.let{color:var(--oranje)}
.auto{font-size:12.5px;padding:7px 9px;border:1px dashed var(--rand);border-radius:8px;background:#fafaf7;color:#4b5563}
.beursomzet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.beursomzet div{background:#f8faf5;border:1px solid #e3ecd6;border-radius:10px;padding:8px 10px}.beursomzet b{display:block;font-size:16px;color:var(--groen)}
.beursomzet span{font-size:11.5px;color:var(--grijs)}
@media(max-width:760px){.beursomzet{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.raster{grid-template-columns:repeat(2,1fr)}.s1,.s2,.s3{grid-column:span 1}.s4,.s6{grid-column:span 2}.stappen{grid-template-columns:1fr}}
label.l{display:block;font-size:11px;color:var(--grijs);margin:0 0 3px;white-space:nowrap}
input,select,textarea{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--rand);border-radius:8px;background:#fff;color:var(--ink)}
input:disabled,select:disabled,textarea:disabled{background:#f7f7f4;color:#4b5563}
textarea{min-height:64px;resize:vertical}
.vink{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}.vink input{width:auto}
.knoppen{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
button{font:inherit;font-size:13px;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--rand);background:#fff;color:var(--ink);white-space:nowrap}
button.doe{background:var(--groen);color:#fff;border-color:var(--groen);font-weight:600}
button.klein{padding:4px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
.melding{font-size:12.5px;min-height:16px}.melding.fout{color:var(--rood)}.melding.goed{color:#15803d}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.chip.concept{background:#f3f4f6;color:#4b5563}.chip.wacht{background:#fef3c7;color:#92400e}
.chip.bevestigd{background:#dbeafe;color:#1d4ed8}.chip.in-logic4{background:#dcfce7;color:#15803d}.chip.gesloten{background:#f3f4f6;color:#9ca3af}
.lijst{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.lijst th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--grijs);padding:6px 8px;border-bottom:1px solid var(--rand);white-space:nowrap}
.lijst td{padding:7px 8px;border-bottom:1px solid #f0f0ea;vertical-align:middle;overflow-wrap:break-word}
.lijst tr.rij{cursor:pointer}.lijst tr.rij:hover td{background:#f8faf5}
.regels{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.regels th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--grijs);padding:5px 4px;border-bottom:1px solid var(--rand);white-space:nowrap}
.regels td{padding:5px 4px;border-bottom:1px solid #f0f0ea;vertical-align:middle;overflow-wrap:break-word}
.regels td input{padding:5px 6px;font-size:12.5px}
.regels .getal{text-align:right}
.regels tr.weg td{color:#9ca3af;text-decoration:line-through}
.regels tr.weg td:last-child{text-decoration:none}
@media(max-width:760px){.regels .smal{display:none}}
.slot{border:1px dashed #d1d5db;border-radius:10px;padding:16px;text-align:center;color:var(--grijs);background:#fafaf7}
.zoek{position:relative}
.treffers{position:absolute;left:0;right:0;top:100%;z-index:5;background:#fff;border:1px solid var(--rand);border-radius:8px;box-shadow:0 8px 24px #0002;max-height:300px;overflow:auto}
.treffers div{padding:7px 10px;cursor:pointer;border-bottom:1px solid #f3f3ef}.treffers div:hover{background:#f0f7e8}
.treffers small{color:var(--grijs)}
.totaal{display:grid;grid-template-columns:auto auto;gap:3px 18px;justify-content:end;font-size:13px;margin-top:10px}
.totaal span:nth-child(odd){color:var(--grijs);text-align:right}.totaal span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.totaal .groot{font-weight:700;font-size:14px;color:var(--ink)}
.log{font-size:12px;color:var(--grijs);line-height:1.6;max-height:180px;overflow:auto}
.verschil{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:12.5px}
.verschil b{color:var(--oranje)}
.verberg{display:none}
.pc-uitleg{font-size:11.5px;color:var(--grijs);min-height:0;margin-top:-2px}.pc-uitleg.goed{color:#15803d}.pc-uitleg.let{color:var(--oranje)}
.treffers div.art{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.treffers div.art .p{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.treffers div.art small{grid-column:2 / 4}
.treffers div.art.weg{color:#9ca3af}
.treffers div.actief{background:#f0f7e8}
.treffers .meer{color:var(--grijs);font-size:11.5px;cursor:default;background:#fafaf7}
/* Live: de klant bevestigt en je ziet het gebeuren (Gerrit, 4 nov 2026) */
.live{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--grijs);margin-top:8px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--lime);display:inline-block;animation:puls 1.4s infinite}
@keyframes puls{0%{box-shadow:0 0 0 0 #8bc53f99}70%{box-shadow:0 0 0 9px #8bc53f00}100%{box-shadow:0 0 0 0 #8bc53f00}}
.nieuwsbalk{background:#dcfce7;border:1px solid #86efac;color:#14532d;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;font-weight:600;animation:inkomen .5s ease-out}
@keyframes inkomen{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.oplicht{animation:oplicht 2.2s ease-out}
@keyframes oplicht{0%{box-shadow:0 0 0 3px var(--lime);background:#f0f7e8}100%{box-shadow:0 0 0 0 transparent}}
/* Demo: links de tegel, rechts de telefoon van de klant */
.demo-band{background:#fef3c7;border:1px solid #fcd34d;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:#78350f}
.demo-band b{white-space:nowrap}
.demo-wat{background:#fff;border:1px solid var(--rand);border-left:4px solid var(--lime);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;line-height:1.5}
.demo-wat b{color:var(--groen)}
.demo-raam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.demo-raam > .tel-plek{position:sticky;top:12px}
@media(max-width:900px){.demo-raam{grid-template-columns:1fr}.demo-raam > .tel-plek{position:static}}
.tel{width:292px;max-width:100%;margin:0 auto;background:#111;border-radius:36px;padding:12px;box-shadow:0 10px 30px #0003}
.tel-scherm{background:#f5f4ef;border-radius:26px;overflow:hidden;height:560px;position:relative}
.tel-scherm iframe{border:0;width:100%;height:100%;display:block;background:#f5f4ef}
.tel-leeg{display:flex;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center;color:var(--grijs);font-size:12.5px;line-height:1.5}
.tel-kop{color:#d1d5db;font-size:11px;text-align:center;margin:0 0 8px}
.tel-onder{text-align:center;color:var(--grijs);font-size:11.5px;margin-top:8px}
</style>
</head>
<body>
<header>
  <a class="fp-kop-knop" href="dashboard.html">&larr; Dashboard</a>
  <h1>📝 Voorstel maken</h1>
  <button type="button" class="fp-kop-knop" id="demoKnop" title="Het Dashboard laat met een voorbeeldklant zien hoe een voorstel werkt, van klantgegevens tot aanbetaling. Er gaat niets naar Logic4 of naar een klant.">▶ Demo</button>
  <button type="button" class="fp-kop-knop" id="lijstKnop" title="Het Dashboard laat al je voorstellen zien">Mijn voorstellen</button>
  <button type="button" class="fp-kop-knop" id="nieuwKnop" title="Het Dashboard begint een nieuw voorstel met lege klantgegevens">+ Nieuw voorstel</button>
</header>
<main><div id="demoBoven"></div><div id="raam"><div id="vak"></div><div id="telPlek" class="tel-plek verberg"></div></div></main>

<script>
var ik = (localStorage.getItem("fp.email")||"").toLowerCase();
/* Lokaal proberen kan met ?w=http://localhost:8787 (alleen op localhost). */
var W = (location.hostname === "localhost" && new URLSearchParams(location.search).get("w")) || "https://fonteyn-data-store.g-mulder.workers.dev";
function teamKey(){ return localStorage.getItem("fp.teamkey")||""; }
function $(id){ return document.getElementById(id); }
function esc(x){ return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function geld(v){ return "€ "+(Number(v)||0).toLocaleString("nl-NL",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function wanneer(ts){ if(!ts) return ""; var d=new Date(ts); return d.toLocaleDateString("nl-NL",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}); }
async function api(pad, body){
  // In de demo blijft alles in de tegel; zoeken in Logic4 gaat wel echt (alleen lezen).
  if (DEMO && body && pad !== "/voorstel/demo" && pad !== "/voorstel/btw") return demoApi(pad, body);
  var r = await fetch(W+pad, { method: body ? "POST" : "GET", headers:{ "X-Fonteyn-Auth": teamKey(), "X-Fonteyn-User": ik, "Content-Type":"application/json" }, body: body ? JSON.stringify(body) : undefined });
  var j = await r.json().catch(function(){ return null; });
  if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || ("Het Dashboard wacht nog op antwoord (" + r.status + "). Probeer het zo nog eens."));
  return j;
}
function log(actie, detail){ try{ if (window.fpLog) window.fpLog(actie, detail||""); }catch(e){} }
var STATUS = { "concept":"Concept", "wacht":"Wacht op de klant", "bevestigd":"Bevestigd", "in-logic4":"Bezig", "gesloten":"Gesloten" };

/* ── Overzicht ───────────────────────────────────────────────────────── */
var alleTonen = false;
async function overzicht(){
  wachtStop();
  if (DEMO) demoStop();
  history.replaceState(null, "", location.pathname + (location.search.indexOf("w=")>=0 ? "?w="+encodeURIComponent(W) : ""));
  $("vak").innerHTML = '<div class="kaart"><p class="lead">Even laden…</p></div>';
  try{
    var j = await api("/voorstel/lijst" + (alleTonen ? "?alle=1" : ""));
    var l = j.voorstellen || [];
    $("vak").innerHTML = '<div class="kaart"><h2>Voorstellen' +
      (j.beheer ? '<span class="rechts"><label class="vink"><input type="checkbox" id="alleV"'+(alleTonen?' checked':'')+'> Van iedereen</label></span>' : '') + '</h2>' +
      '<p class="lead">Een voorstel begint met de gegevens van de klant. De klant bevestigt ze via een mail; daarna vul je het voorstel verder in.</p>' +
      (l.length ? '<table class="lijst"><colgroup><col style="width:28%"><col style="width:16%"><col style="width:18%"><col style="width:14%"><col style="width:12%"><col style="width:12%"></colgroup>' +
        '<thead><tr><th>Klant</th><th>Plaats</th><th>Status</th><th>Logic4</th><th>Adviseur</th><th>Gewijzigd</th></tr></thead><tbody>' +
        l.map(function(v){ return '<tr class="rij" data-id="'+esc(v.id)+'"><td><b>'+esc(v.klant||"(nog zonder naam)")+'</b><br><small style="color:#6b7280">'+esc(v.email)+'</small></td><td>'+esc(v.plaats)+'</td>' +
          '<td><span class="chip '+esc(v.status)+'">'+esc(STATUS[v.status]||v.status)+'</span>'+(v.aangepast?' <span title="De klant heeft de gegevens zelf aangepast">✎</span>':'')+'</td>' +
          '<td>'+(v.orderid?esc(v.orderid):'')+'</td><td>'+esc(String(v.adviseur||"").replace(/@.*/,""))+'</td><td>'+esc(wanneer(v.gewijzigd))+'</td></tr>'; }).join("") + '</tbody></table>'
        : '<div class="slot">Nog geen voorstellen. Begin met <b>+ Nieuw voorstel</b>.</div>') + '</div>' +
      '<div id="beursVak"></div><div id="instVak"></div>';
    Array.prototype.forEach.call(document.querySelectorAll("tr.rij"), function(tr){ tr.onclick = function(){ openen(tr.dataset.id); }; });
    if ($("alleV")) $("alleV").onchange = function(){ alleTonen = this.checked; overzicht(); };
    await keuzesLaden();
    beursKaart();
    if (BEHEER) instKaart();
  }catch(e){ $("vak").innerHTML = '<div class="kaart"><p class="melding fout">'+esc(e.message)+'</p></div>'; }
}

/* Beursomzet (Dolf, 6 nov 2026): wat er op de beurs is verkocht, zonder
   dat iemand het hoeft op te tellen. Van een week voor tot een maand na de beurs. */
async function beursKaart(naam){
  var vak = $("beursVak"); if (!vak) return;
  var nu = new Date().toISOString().slice(0, 10);
  var dichtbij = (BEURZEN||[]).filter(function(b){ var van = new Date(b.van), tot = new Date(b.tot); return nu >= new Date(van - 7*864e5).toISOString().slice(0,10) && nu <= new Date(+tot + 31*864e5).toISOString().slice(0,10); });
  if (!naam && !dichtbij.length && !BEURS_ALLES) return;
  if (!naam && dichtbij.length) naam = dichtbij[0].naam;
  try {
    var j = await api("/voorstel/beursomzet" + (naam ? "?naam=" + encodeURIComponent(naam) : ""));
    if (!j.beurs || !$("beursVak")) return;
    var t = j.totaal || { voorstellen: 0, voorstelTotaal: 0, orders: 0, orderTotaal: 0, betaald: 0 };
    var b = j.beurs, d = function(x){ return new Date(x + "T12:00").toLocaleDateString("nl-NL", { day: "numeric", month: "long" }); };
    vak.innerHTML = '<div class="kaart"><h2>🎪 Beursomzet' + ((j.beurzen||[]).length > 1 ? '<span class="rechts"><select id="beursKies" title="Het Dashboard laat de omzet van deze beurs zien">' + j.beurzen.map(function(x){ return '<option'+(x.naam===b.naam?' selected':'')+'>'+esc(x.naam)+'</option>'; }).join("") + '</select></span>' : '') + '</h2>' +
      '<p class="lead"><b>' + esc(b.naam) + '</b>, ' + esc(d(b.van)) + ' t/m ' + esc(d(b.tot)) + '. Voorstellen die in deze dagen zijn begonnen tellen vanzelf mee' + (j.alles ? '' : ' (hier staan alleen die van jou)') + '.</p>' +
      '<div class="beursomzet"><div><b>' + t.voorstellen + '</b><span>voorstellen</span></div><div><b>' + esc(geld(t.voorstelTotaal)) + '</b><span>waarde van de voorstellen</span></div>' +
      '<div><b>' + t.orders + '</b><span>orders (aanbetaald)</span></div><div><b>' + esc(geld(t.orderTotaal)) + '</b><span>beursomzet, waarvan ' + esc(geld(t.betaald)) + ' betaald</span></div></div>' +
      (j.alles && (j.per||[]).length ? '<table class="lijst"><thead><tr><th>Adviseur</th><th>Voorstellen</th><th>Waarde</th><th>Orders</th><th>Omzet</th></tr></thead><tbody>' +
        j.per.map(function(x){ return '<tr><td>'+esc(String(x.wie).replace(/@.*/,""))+'</td><td>'+x.voorstellen+'</td><td>'+esc(geld(x.voorstelTotaal))+'</td><td>'+x.orders+'</td><td>'+esc(geld(x.orderTotaal))+'</td></tr>'; }).join("") + '</tbody></table>' : '') + '</div>';
    if ($("beursKies")) $("beursKies").onchange = function(){ beursKaart(this.value); };
  } catch(e) { vak.innerHTML = ""; }
}
/* Instellingen voor de beheerders (Dolf): welke vervoerders de adviseurs
   zien, wie met welke code een aangepaste aanbetaling mag doen, en de beurzen. */
async function instKaart(){
  var vak = $("instVak"); if (!vak) return;
  vak.innerHTML = '<div class="kaart"><h2>⚙️ Instellingen <span class="rechts"><button type="button" class="klein" id="instOpen" title="Het Dashboard laat de instellingen van deze tegel zien">Openen</button></span></h2><p class="lead" style="margin:0">Vervoerders, codes voor een aangepaste aanbetaling en de beurzen. Alleen voor de beheerders.</p><div id="instIn"></div></div>';
  $("instOpen").onclick = async function(){
    this.disabled = true;
    try { var j = await api("/voorstel/instellingen"); instTeken(j.instellingen, j.transporteurs || []); }
    catch(e) { $("instIn").innerHTML = '<p class="melding fout">' + esc(e.message) + '</p>'; this.disabled = false; }
  };
}
function instTeken(inst, alle){
  var aan = (inst.transporteurs||[]).map(String);
  var codes = (inst.codes||[]).concat([{ naam: "", code: "" }]), beurzen = (inst.beurzen||[]).concat([{ naam: "", van: "", tot: "" }]);
  $("instIn").innerHTML =
    '<h3 style="font-size:13px;margin:14px 0 6px">Vervoerders die de adviseurs zien</h3><div style="columns:2 260px;font-size:12.5px">' +
      alle.map(function(x){ return '<label class="vink" style="margin:2px 0"><input type="checkbox" data-tr="'+esc(x.id)+'"'+(aan.indexOf(String(x.id))>=0?' checked':'')+'> '+esc(x.naam)+(x.bedrag?' <small style="color:#6b7280">'+esc(geld(x.bedrag))+' ex</small>':'')+'</label>'; }).join("") + '</div>' +
    '<h3 style="font-size:13px;margin:14px 0 6px">Codes voor een aangepaste aanbetaling</h3><p class="lead">Wie een code heeft, kan bij Betalen kiezen voor Aangepast en zelf het bedrag invullen.</p>' +

/* Zoekveld met een lijstje eronder. Wacht even tot er niet meer getypt wordt.
   Pijltjes kiezen, Enter neemt de gekozen (of de code die precies klopt). */
function zoeker(inp, lijst, pad, html, kies, precies){
  var tik = null, laatste = null, keuze = -1, vraag = "";
  function rijen(){ return lijst.querySelectorAll("[data-i]"); }
  function markeer(){ Array.prototype.forEach.call(rijen(), function(d, i){ d.classList.toggle("actief", i === keuze); if (i === keuze) d.scrollIntoView({ block: "nearest" }); }); }
  async function zoek(q){
    var j = await api(pad(q));
    if (inp.value.trim() !== q) return null;
    laatste = j; vraag = q; keuze = -1; lijst.innerHTML = html(j); lijst.classList.remove("verberg");
    Array.prototype.forEach.call(rijen(), function(d){ d.onmousedown = function(e){ e.preventDefault(); }; d.onclick = function(){ lijst.classList.add("verberg"); kies(laatste, Number(d.dataset.i)); }; });
    return j;
  }
  inp.oninput = function(){
    clearTimeout(tik);
    var q = inp.value.trim();
    if (q.length < 2) { lijst.classList.add("verberg"); return; }
    tik = setTimeout(function(){ zoek(q).catch(function(e){ lijst.innerHTML = '<div><small>'+esc(e.message)+'</small></div>'; lijst.classList.remove("verberg"); }); }, 300);
  };
  inp.onkeydown = async function(e){
    var n = rijen().length, open = !lijst.classList.contains("verberg");
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && n && open) {
      e.preventDefault(); keuze = Math.max(0, Math.min(n - 1, keuze + (e.key === "ArrowDown" ? 1 : -1))); markeer();
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (open && keuze >= 0 && rijen()[keuze]) return rijen()[keuze].click();
      var q = inp.value.trim(); if (q.length < 2) return;
      clearTimeout(tik);
      try {
        var j = (vraag === q && laatste) ? laatste : await zoek(q);
        var p = j && precies ? precies(j, q) : -1;
        if (p >= 0) { lijst.classList.add("verberg"); kies(j, p); }
        else if (rijen().length) { lijst.classList.remove("verberg"); keuze = 0; markeer(); }
      } catch(x) {}
    } else if (e.key === "Escape") lijst.classList.add("verberg");
  };
  inp.onblur = function(){ setTimeout(function(){ lijst.classList.add("verberg"); }, 200); };
  inp.onfocus = function(){ if (laatste && inp.value.trim() === vraag && rijen().length) lijst.classList.remove("verberg"); };
}

/* Postcode en huisnummer: straat en plaats komen er vanzelf bij (Gerrit,
   4 nov 2026). Uit de gratis adressenlijst van de overheid (PDOK), alleen
   voor adressen in Nederland. Lukt het niet, dan typ je ze gewoon zelf. */
function postcodeKoppel(soort, uitleg){
  function v(n){ return document.querySelector('[data-'+soort+'="'+n+'"]'); }
  var pc = v("postcode"), nr = v("huisnummer"), land = v("land"), tik = null, beurt = 0;
  if (!pc || !nr || pc.disabled) return;
  function zeg(t, cls){ if (uitleg) { uitleg.textContent = t; uitleg.className = "s6 pc-uitleg " + (cls||""); } }
  async function pdok(q, type){
    var r = await fetch("https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?rows=1&fl=straatnaam,woonplaatsnaam&fq=type:"+type+"&q="+encodeURIComponent(q));
    var j = await r.json();
    return ((j.response||{}).docs||[])[0] || null;
  }
  function zoek(){
    clearTimeout(tik);
    var p = pc.value.replace(/\s+/g, "").toUpperCase(), n = (nr.value.match(/\d+/)||[""])[0], l = ((land && land.value) || "NL").trim().toUpperCase();
    if (l && l !== "NL") { zeg(""); return; }
    if (!/^\d{4}[A-Z]{2}$/.test(p)) { zeg(p.length >= 4 ? "" : ""); return; }
    var mijn = ++beurt;
    tik = setTimeout(async function(){
      try {
        var d = n ? await pdok("postcode:"+p+" and huisnummer:"+n, "adres") : null;
        var los = d ? null : await pdok("postcode:"+p, "postcode");
        if (mijn !== beurt) return;
        var g = d || los;
        if (!g) { zeg("Deze postcode staat niet in de adressenlijst. Typ straat en plaats zelf.", "let"); return; }
        v("straat").value = g.straatnaam || ""; v("plaats").value = g.woonplaatsnaam || "";
        if (d) zeg("✓ " + g.straatnaam + " " + n + ", " + g.woonplaatsnaam, "goed");
        else if (n) zeg("Straat en plaats gevonden. Kijk het huisnummer even na: " + n + " staat niet bij deze postcode.", "let");
        else zeg("✓ " + g.straatnaam + ", " + g.woonplaatsnaam + ". Vul nog het huisnummer in.", "goed");
      } catch(e) { zeg(""); }
    }, 250);
  }
  pc.addEventListener("input", zoek); nr.addEventListener("input", zoek);
  if (land) land.addEventListener("input", zoek);
}

  else if (V.status === "gesloten") t = "<b>Gesloten.</b> Zo sluit je een voorstel af dat niet doorgaat. Klik op <b>Opnieuw</b> om de demo nog eens te doen.";
  else if (ORDER && Number(ORDER.statusId) !== 4) t = "<b>Klaar.</b> De klant heeft aanbetaald en het voorstel is nu een order in Logic4. Zo gaat het van klant tot order. Klik op <b>Opnieuw</b> om de demo nog eens te doen.";
  else if (!regels) t = "<b>Stap 3. Het voorstel invullen.</b> De gegevens zijn nu open. Zoek een artikel zoals in Logic4: op code, naam of een paar woorden (bijvoorbeeld <i>spa</i> of <i>lyon wit</i>). Kies met de pijltjes en zet het erop met Enter.";
  else if (!(V.voorstelVerstuurd||[]).length) t = "<b>Stap 4. Naar de klant.</b> Pas prijzen of korting aan als je wilt. Klik daarna onderaan op <b>Voorbeeld en versturen</b> en dan op <b>Versturen</b>.";
  else t = "<b>Stap 5. Aanbetalen.</b> De klant heeft het voorstel op de telefoon. Klik in de telefoon op <b>Bekijk je voorstel</b> en daarna op <b>Aanbetalen</b>. Het voorstel wordt meteen een order.";
  $("demoBoven").innerHTML = '<div class="demo-band"><b>▶ Demo</b><span>Een voorbeeld met een verzonnen klant. Er gaat niets naar Logic4, naar een klant of naar de bank.</span>' +
    '<span style="margin-left:auto;display:flex;gap:8px"><button type="button" class="klein" id="demoOpnieuw" title="Het Dashboard begint de demo opnieuw">Opnieuw</button><button type="button" class="klein" id="demoUit" title="Het Dashboard sluit de demo en laat je voorstellen zien">Demo sluiten</button></span></div>' +
    '<div class="demo-wat">' + t + '</div>';
  $("demoOpnieuw").onclick = demoStart;
  $("demoUit").onclick = overzicht;
}
