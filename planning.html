<!DOCTYPE html>
<html lang="nl">
<head>
<!-- Wie hier binnen mag staat in toegang.js, dezelfde lijst als het dashboard. -->
<script src="toegang.js"></script>
<script src="taal.js"></script>
<script src="kop.js"></script>
<script>
/* Toegangscontrole. Het dashboard verbergt de tegel al, maar met de terugknop
   is een pagina die een vórige gebruiker opende opnieuw te bereiken. */
(function(){
  var TOEGANG = window.fpToegang ? window.fpToegang.set("planning") : null;
  var email = (localStorage.getItem("fp.email")||"").toLowerCase();
  if (!localStorage.getItem("fp.session")) { location.replace("dashboard.html"); return; }
  if (TOEGANG && TOEGANG.has(email)) return;
  window.fpGeenToegang = true;
  document.write('<style>body{margin:0;font-family:Montserrat,-apple-system,sans-serif;background:#f5f4ef;color:#1f2937}'+
    '.gt{max-width:520px;margin:14vh auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:34px;text-align:center}'+
    '.gt h1{color:#144734;font-size:20px;margin:0 0 10px}.gt p{color:#6b7280;font-size:14px;line-height:1.5}'+
    '.gt a{display:inline-block;margin-top:14px;background:#144734;color:#fff;text-decoration:none;padding:10px 20px;border-radius:8px;font-size:13px}</style>'+
    '<div class="gt"><h1>Geen toegang</h1><p>De tegel Planning is niet beschikbaar voor jouw account.</p>'+
    '<a href="dashboard.html">&larr; Terug naar het dashboard</a></div>');
  window.stop();
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fonteyn — Planning</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ══════════════════════════════════════════════════════════════════════
     PLANNING - weekagenda van de afdeling Spa planning

     Gerrit (24 aug 2026, met een schermafdruk van zijn Outlook erbij):
     de planning moet eruitzien als een echte agenda. Dus: een tijdraster
     met de uren onder elkaar, de hele week inclusief het weekend, door
     alle weken van het jaar te bladeren, categorieën met een eigen kleur,
     en op elke afspraak zichtbaar wie hem heeft ingepland.

     Een afspraak zonder tijd valt in de "hele dag"-strook bovenin, net als
     in Outlook. Afspraken die elkaar overlappen komen naast elkaar te
     staan. De rode lijn is het nu-moment.

     De afspraken staan in de bucket 'planning' bij de worker; iedereen van
     de afdeling kijkt dus naar dezelfde agenda. Bewaren leest eerst de
     verse stand en past dan alleen de eigen wijziging toe, zodat twee
     planners elkaar niet overschrijven.

     OTA: staat in manifest.json. Nooit opnieuw installeren.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --groen:#144734; --groen-donker:#0d3325; --lime:#8bc53f;
  --bg:#f5f4ef; --kaart:#fff; --ink:#1f2937; --grijs:#6b7280; --rand:#e5e7eb;
  --rood:#b91c1c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Montserrat",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);
     color:var(--ink);font-size:14px;-webkit-text-size-adjust:100%}

header{background:var(--groen);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;
       position:sticky;top:0;z-index:20;padding-top:calc(12px + env(safe-area-inset-top))}
header h1{margin:0;font-size:15px;font-weight:600;flex:1}
header a.knop,header button.knop{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);
       border-radius:8px;padding:7px 13px;font:inherit;font-size:12px;cursor:pointer;text-decoration:none}
header .wie{font-size:11px;opacity:.75}

main{max-width:1500px;margin:0 auto;padding:14px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}

/* ── weekbalk ── */
.weekbalk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.weekbalk h2{margin:0;font-size:16px;color:var(--groen);flex:1;min-width:200px}
.weekbalk button,.weekbalk input[type=date]{background:#fff;border:1px solid var(--rand);border-radius:9px;
       padding:8px 13px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.weekbalk button:hover{border-color:var(--lime)}
.weekbalk button.nieuw{background:var(--groen);color:#fff;border:0;font-weight:600}
.weekbalk button.nieuw:hover{background:var(--groen-donker)}
.weekbalk input[type=date]{cursor:text;color:var(--grijs);width:150px}

/* ── legenda: de categorieën, tevens filter ── */
.legenda{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cat-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rand);background:#fff;
       border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;user-select:none}
.cat-chip .bol{width:10px;height:10px;border-radius:50%}
/* Live meekijken: wie er nog meer in de agenda zit, en een kort seintje als
   een collega net iets heeft veranderd. */
.live-wie{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--grijs);margin-left:auto}
.live-stip{width:8px;height:8px;border-radius:50%;background:#8bc53f;box-shadow:0 0 0 3px rgba(139,197,63,.25)}
/* Stip voor de betaalstand van de order: groen betaald, oranje aanbetaald,
   rood niets binnen. Geen ordernummer of onbekende order = geen stip. */
.betaalstip{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;
       vertical-align:middle;flex:0 0 auto}
.legenda .betaal-uitleg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--grijs);margin-left:4px}
.live-melding{font-size:12px;color:var(--groen);font-weight:600;opacity:0;transition:opacity .3s;margin-left:10px;white-space:nowrap}
#legendaChips{display:inline-flex;gap:8px;flex-wrap:wrap}
.cat-chip.uit{opacity:.35}
.cat-chip.uit .bol{background:#d1d5db!important}

/* ── het agendaraster ── */
.agenda{background:#fff;border:1px solid var(--rand);border-radius:12px;overflow:hidden}
.agenda-scroll{overflow:auto;max-height:calc(100vh - 240px);min-height:420px;position:relative}
.rooster{display:grid;grid-template-columns:52px repeat(7,minmax(120px,1fr));min-width:900px}
.dag-kop{position:sticky;top:0;background:#fff;z-index:6;border-bottom:1px solid var(--rand);
       padding:8px 8px 6px;text-align:left}
.dag-kop .dnaam{font-size:11px;color:var(--grijs);text-transform:lowercase}
.dag-kop .dnum{font-size:17px;font-weight:700;color:var(--ink);line-height:1.2}
.dag-kop.vandaag .dnum{color:#fff;background:var(--groen);border-radius:50%;display:inline-block;
       width:28px;height:28px;text-align:center;line-height:28px;font-size:14px}
.hoek{position:sticky;top:0;left:0;background:#fff;z-index:8;border-bottom:1px solid var(--rand)}
.heledag-cel{border-bottom:1px solid var(--rand);border-left:1px solid #f3f4f6;padding:3px 3px 5px;min-height:26px}
.heledag-label{border-bottom:1px solid var(--rand);font-size:10px;color:var(--grijs);text-align:right;
       padding:6px 6px 0;position:sticky;left:0;background:#fff;z-index:5}
.uur-label{font-size:10px;color:var(--grijs);text-align:right;padding-right:6px;transform:translateY(-6px);
       position:sticky;left:0;background:#fff;z-index:5}
.dag-cel{position:relative;border-left:1px solid #f3f4f6}
.dag-cel.weekend{background:#fafaf7}
.uurlijn{position:absolute;left:0;right:0;border-top:1px solid #f3f4f6;pointer-events:none}
.nu-lijn{position:absolute;left:0;right:0;border-top:2px solid #c8102e;z-index:4;pointer-events:none}
.nu-lijn::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:#c8102e}

/* ── afspraakblok in het raster ── */
.blok{position:absolute;border-radius:7px;padding:4px 6px;font-size:11px;line-height:1.3;cursor:pointer;
      overflow:hidden;border-left:4px solid;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.blok:hover{box-shadow:0 3px 10px rgba(0,0,0,.18);z-index:5!important}
.blok .t{font-weight:700;font-size:10.5px}
.blok .k{font-weight:600;font-size:11.5px}
.blok .s{opacity:.8;font-size:10.5px}
.blok .d{opacity:.7;font-size:10px;font-style:italic}
.blok.klaar{opacity:.42}
/* Slepen en vergroten. De greep is een strookje onderaan het blok; hij valt
   niet op tot je er met de muis overheen gaat. */
.blok{cursor:grab}
.blok.sleept{cursor:grabbing;opacity:.85;box-shadow:0 8px 22px rgba(0,0,0,.28);z-index:60!important}
.blok .greep{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.blok:hover .greep{background:linear-gradient(to bottom,transparent,rgba(0,0,0,.14))}
body.bezig-slepen{cursor:grabbing;user-select:none}
/* Wie het heeft ingepland: een rondje met de eerste letter, rechtsboven. */
.blok .planner{position:absolute;top:3px;right:4px;width:15px;height:15px;border-radius:50%;
      background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.12);font-size:9px;font-weight:700;
      line-height:14px;text-align:center;color:#444;z-index:2}
/* De naam is aanklikbaar om hem direct aan te passen. */
.blok .k[data-bewerk]{cursor:text}
.blok .k[data-bewerk]:hover{text-decoration:underline dotted;text-underline-offset:2px}
.blok .naamvak{width:100%;border:1px solid var(--lime);border-radius:4px;padding:0 3px;
      font:inherit;font-size:11.5px;font-weight:600;background:#fff}
/* Het vlaggetje dat tijdens het slepen laat zien waar je uitkomt. */
.sleeptip{position:fixed;z-index:200;background:#111827;color:#fff;font-size:11.5px;font-weight:600;
      padding:4px 9px;border-radius:6px;pointer-events:none;white-space:nowrap;display:none;
      box-shadow:0 4px 14px rgba(0,0,0,.3)}
.blok.klaar .k{text-decoration:line-through}
.hd-blok{border-radius:6px;border-left:4px solid;padding:2px 6px;font-size:11px;font-weight:600;
      margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-blok.klaar{opacity:.42;text-decoration:line-through}

/* ── telefoonweergave: dagen onder elkaar ── */
.lijst{display:none}
@media (max-width:820px){
  .agenda{display:none}
  .lijst{display:block}
}
.dagkaart{background:var(--kaart);border:1px solid var(--rand);border-radius:12px;padding:10px;margin-bottom:10px}
.dagkaart.vandaag{border-color:var(--lime);box-shadow:0 0 0 2px rgba(139,197,63,.25)}
.dagkaart h3{margin:0 0 2px;font-size:12.5px;color:var(--groen)}
.dagkaart .datum{font-size:11px;color:var(--grijs);margin-bottom:9px}
.dagkaart .leeg{font-size:12px;color:#d1d5db;padding:2px 0}
.afs{border:1px solid var(--rand);border-left:4px solid;border-radius:9px;padding:8px 9px;margin-bottom:7px;cursor:pointer;background:#fff}
.afs.klaar{opacity:.45}
.afs.klaar .klant{text-decoration:line-through}
.afs .kop{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.afs .tijd{font-weight:700;font-size:12.5px}
.afs .badge{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:1px 6px;border-radius:4px}
.afs .klant{font-size:13px;font-weight:600;margin-top:3px;line-height:1.35}
.afs .sub{font-size:11.5px;color:var(--grijs);margin-top:2px;line-height:1.45}
.plus{display:block;width:100%;margin-top:6px;background:none;border:1px dashed var(--rand);
       border-radius:8px;color:var(--grijs);font:inherit;font-size:12px;padding:7px;cursor:pointer}
.plus:hover{border-color:var(--lime);color:var(--groen)}

/* ── servicemeldingen uit Logic4 ── */
.its{background:#fff;border:1px solid var(--rand);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:none}
.its.aan{display:block}
.its-kop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.its-kop h3{margin:0;font-size:14px;color:var(--groen);flex:1}
.its-kop input{border:1px solid var(--rand);border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;width:220px}
.its-rij{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-top:1px solid #f3f4f6}
.its-rij .mid{flex:1;min-width:0}
.its-rij .naam{font-size:13px;font-weight:600}
.its-rij .naam .nr{color:var(--grijs);font-weight:400;font-size:11.5px}
.its-rij .sub{font-size:11.5px;color:var(--grijs);margin-top:2px;line-height:1.45}
.its-rij .om{font-size:12px;color:#4b5563;margin-top:3px;line-height:1.45}
.its-rij .telaat{color:var(--rood);font-weight:600}
.its-rij button{background:var(--groen);color:#fff;border:0;border-radius:8px;padding:8px 13px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;flex:none}
.its-rij button:hover{background:var(--groen-donker)}
.its-rij .alGepland{background:#e8f2d9;color:#3f6b21;border-radius:8px;padding:8px 13px;font-size:12px;font-weight:600;flex:none}
.its-meer{display:block;width:100%;margin-top:8px;background:none;border:1px dashed var(--rand);border-radius:8px;color:var(--grijs);font:inherit;font-size:12px;padding:8px;cursor:pointer}
.its-leeg{font-size:12.5px;color:var(--grijs);padding:6px 0}

/* ── routeknop ── */
.route-knop{background:none;border:0;cursor:pointer;font-size:14px;padding:2px 4px;border-radius:6px;float:right}
.route-knop:hover{background:#eef4e8}
.route-menu{position:absolute;background:#fff;border:1px solid var(--rand);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:30;padding:6px;min-width:170px}
.route-menu button{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;font-size:13px;padding:8px 10px;border-radius:7px;cursor:pointer}
.route-menu button:hover{background:#f4f9ec}

/* ── formulier (laag over de pagina) ── */
/* ── Routebord ────────────────────────────────────────────────────────
   Zo werkt de planning echt (Gerrit, 7 sep 2026, met de Outlook-agenda van
   de afdeling ernaast): per dag rijden er een paar routes, en elke route is
   een kolom met stops eronder. "Op maandag heb je route 1, route 2, route 3.
   En zo iedere dag. Ik wil dus dat je echt routes kunt toevoegen op een dag
   en die kunt vullen."

   Een tijdraster past daar niet op: de stops staan niet op een tijdstip maar
   op een volgorde binnen de route. Vandaar dit bord: dagen naast elkaar, in
   elke dag de routes naast elkaar, in elke route de stops onder elkaar. */
/* De dagen naast elkaar. Een dag met drie routes hoort breder te zijn dan een
   dag met één; anders vallen de laatste routes buiten beeld en zie je precies
   niet wat je zoekt. De breedte wordt per dag gezet uit het aantal routes. */
.bord{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}
.borddag{background:var(--kaart);border:1px solid var(--rand);border-radius:12px;overflow:hidden;
      flex:0 0 auto;display:flex;flex-direction:column}
.borddag.vandaag{border-color:var(--lime);box-shadow:0 0 0 2px rgba(139,197,63,.25)}
.borddag > h3{margin:0;padding:8px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;
      background:var(--groen);color:#fff;display:flex;align-items:center;gap:8px}
.borddag > h3 .dd{margin-left:auto;font-weight:400;opacity:.85;text-transform:none;letter-spacing:0}
.dagbalken{padding:5px 6px 0;display:flex;flex-direction:column;gap:3px}
.dagbalk{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
      border-radius:5px;padding:2px 7px;cursor:pointer;background:#eef0f2;color:#4b5563}
.dagbalk.let{background:#fee2e2;color:#b91c1c}
.routes{display:flex;gap:6px;padding:6px;align-items:stretch}
.route{flex:1 1 0;min-width:0;border:1px solid var(--rand);border-radius:9px;background:#fff;
      display:flex;flex-direction:column;min-height:60px}
.route.sleepdoel{border-color:var(--lime);box-shadow:0 0 0 2px rgba(139,197,63,.35)}
.route > h4{margin:0;padding:5px 7px;font-size:11.5px;background:#f3f6f4;border-bottom:1px solid var(--rand);
      border-radius:8px 8px 0 0;display:flex;align-items:center;gap:5px;line-height:1.25}
.route > h4 .nr{background:var(--groen);color:#fff;border-radius:4px;padding:0 5px;font-weight:700;flex:0 0 auto}
.route > h4 .wie{font-weight:700;color:var(--ink);flex:1;min-width:0;cursor:text;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route > h4 .wie:hover{text-decoration:underline dotted;text-underline-offset:2px}
.route > h4 .weg{background:none;border:0;color:var(--grijs);cursor:pointer;font-size:13px;line-height:1;padding:0 2px}
.route > h4 .weg:hover{color:var(--rood)}
.route .stops{padding:4px;display:flex;flex-direction:column;gap:3px;flex:1}
.route .leegdrop{font-size:10.5px;color:#c9cfcb;text-align:center;padding:8px 2px}
.stop{border-radius:6px;border-left:4px solid;padding:3px 6px;font-size:11px;line-height:1.35;cursor:grab;
      background:#fff;border-top:1px solid var(--rand);border-right:1px solid var(--rand);border-bottom:1px solid var(--rand)}
.stop.sleept{opacity:.5}
.stop .kl{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop .rg{color:var(--grijs);font-size:10.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop.letop{background:#fee2e2;border-color:#b91c1c}
.stop.klaar{opacity:.45}
.stop.klaar .kl{text-decoration:line-through}
.route .plusstop{margin:0 4px 4px;background:none;border:1px dashed var(--rand);border-radius:6px;
      color:var(--grijs);font:inherit;font-size:10.5px;padding:3px;cursor:pointer}
.route .plusstop:hover{border-color:var(--lime);color:var(--groen)}
.plusroute{margin:0 6px 7px;background:none;border:1px dashed var(--rand);border-radius:8px;
      color:var(--grijs);font:inherit;font-size:11.5px;padding:5px;cursor:pointer;width:calc(100% - 12px)}
.plusroute:hover{border-color:var(--lime);color:var(--groen)}
.dagnotitie{margin:0 6px 7px;font-size:10.5px;color:var(--grijs);border-top:1px dashed var(--rand);padding-top:5px;cursor:text}
.dagnotitie:hover{color:var(--ink)}
.weergavekeus{display:inline-flex;border:1px solid var(--rand);border-radius:9px;overflow:hidden;background:#fff}
.weergavekeus button{border:0;background:#fff;font:inherit;font-size:12px;padding:7px 13px;cursor:pointer;color:var(--grijs)}
.weergavekeus button.aan{background:var(--groen);color:#fff;font-weight:600}

/* Het afsprakenvenster moet op élk bureaubladscherm passen zonder scrollen.
   Gerrit (7 sep 2026): "Nieuwe afspraak plannen, dat venster moet zo gemaakt
   zijn dat je niet hoeft te scrollen op welk desktopscherm dan ook."
   Een laptop van 1366x768 houdt ongeveer 660 pixels over; daar past dit in
   door twee kolommen te gebruiken en de tussenruimtes te halveren. */
.laag{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;
      align-items:center;justify-content:center;padding:12px;overflow-y:auto}
.formkaart{background:#fff;border-radius:14px;max-width:720px;width:100%;padding:16px 18px;margin:auto}
.formkaart h3{margin:0 0 8px;font-size:15px;color:var(--groen)}
.formkaart label{display:block;font-size:11.5px;color:var(--grijs);margin:8px 0 3px}
.formkaart input,.formkaart select,.formkaart textarea{width:100%;padding:6px 9px;border:1px solid var(--rand);
      border-radius:8px;font:inherit;font-size:13px;color:var(--ink);background:#fff}
.formkaart textarea{resize:vertical;min-height:38px}
.formkaart input:focus,.formkaart select:focus,.formkaart textarea:focus{outline:2px solid var(--lime);outline-offset:-1px}
.formkaart .rij{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.formkaart .rij2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
/* Twee kolommen naast elkaar: links de afspraak, rechts de klantgegevens.
   Op een smal scherm vallen ze onder elkaar en mag er wél gescrold worden. */
.formkaart .kolommen{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:640px){ .formkaart .kolommen{grid-template-columns:1fr} }
.formkaart .knoppen{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.formkaart .knoppen button{font:inherit;font-size:13.5px;border-radius:9px;padding:11px 18px;cursor:pointer}
.formkaart .doe{background:var(--groen);color:#fff;border:0;font-weight:600;flex:1}
.formkaart .doe:hover{background:var(--groen-donker)}
.formkaart .weg{background:#fff;border:1px solid #fecaca;color:var(--rood)}
.formkaart .terug{background:#fff;border:1px solid var(--rand);color:var(--grijs)}
.catkeus{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px}
.catkeus button{display:flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;padding:9px 10px;
      border-radius:9px;border:2px solid var(--rand);background:#fff;cursor:pointer;font-weight:600;color:var(--ink)}
.catkeus .bol{width:11px;height:11px;border-radius:50%;flex:none}
.melding{font-size:12.5px;color:var(--rood);min-height:16px;margin-top:8px}
.gepland-door{font-size:11.5px;color:var(--grijs);margin-top:10px}
</style>
</head>
<body>

<header>
  <a class="knop" href="dashboard.html">&larr;</a>
  <h1>📅 Planning</h1>
  <span class="wie" id="wie"></span>
  <button class="knop" id="uitKnop" type="button">Uitloggen</button>
</header>

<main>
  <div class="weekbalk">
    <h2 id="weekTitel">Week</h2>
    <button type="button" id="vorige" title="Vorige week">&larr;</button>
    <button type="button" id="vandaagKnop">Vandaag</button>
    <button type="button" id="volgende" title="Volgende week">&rarr;</button>
    <input type="date" id="springNaar" title="Spring naar de week van deze datum">
    <button type="button" id="itsKnop">🔧 Servicemeldingen</button>
    <button type="button" class="nieuw" id="nieuwKnop">+ Afspraak</button>
    <span class="weergavekeus" id="weergaveKeus">
      <button type="button" data-weergave="routes" class="aan">Routes</button>
      <button type="button" data-weergave="tijd">Tijdraster</button>
    </span>
  </div>
  <div class="legenda" id="legenda">
    <!-- Wie er nog meer in de agenda kijkt, en een kort seintje als een
         collega net iets heeft veranderd. -->
    <span id="liveAanwezig" class="live-wie"></span>
    <span id="liveMelding" class="live-melding"></span>
  </div>

  <!-- Servicemeldingen uit Logic4 (ITS), status Inplannen. Aanklikken zet de
       melding als afspraak in de week, met naam, adres en telefoon erbij. -->
  <div class="its" id="itsPaneel">
    <div class="its-kop">
      <h3 id="itsTitel">Servicemeldingen uit Logic4</h3>
      <input type="search" id="itsZoek" placeholder="Zoek op naam, plaats of klus…">
    </div>
    <div id="itsLijst"><div class="its-leeg">Bezig met ophalen…</div></div>
  </div>

  <!-- het routebord: per dag de routes naast elkaar -->
  <div id="bord" class="bord"></div>

  <!-- brede schermen: het tijdraster -->
  <div class="agenda" id="agendaHouder">
    <div class="agenda-scroll" id="agendaScroll">
      <div class="rooster" id="rooster"></div>
    </div>
  </div>

  <!-- telefoon: de dagen onder elkaar -->
  <div class="lijst" id="lijst"></div>
</main>

<div id="laagHouder"></div>

<script>
"use strict";

var W = "https://fonteyn-data-store.g-mulder.workers.dev";
var BUCKET = "planning";
var DAGEN = ["Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag","Zondag"];
var DAGKORT = ["ma","di","wo","do","vr","za","zo"];
var MAANDEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];

/* De categorieën. De sleutel wordt opgeslagen, dus die verandert nooit meer;
   naam en kleur mogen wel. 'levering' en 'service' waren er vanaf dag één,
   de rest kwam er op 24 aug 2026 bij ("en nog andere logische categorieën"). */
var CATS = {
  levering:     { naam:"Levering",              kleur:"#8bc53f", zacht:"#f1f8e5" },
  service:      { naam:"Service",               kleur:"#f59e0b", zacht:"#fef3d8" },
  ophalen:      { naam:"Ophalen / retour",      kleur:"#3b82f6", zacht:"#e3edfd" },
  bezichtiging: { naam:"Showroom / bezichtiging", kleur:"#a855f7", zacht:"#f3e8fd" },
  intern:       { naam:"Intern / overig",       kleur:"#6b7280", zacht:"#eef0f2" },
};
function cat(a){ return CATS[a.soort] || CATS.intern; }

var UUR_VAN = 6, UUR_TOT = 22;      // het raster loopt van 06:00 tot 22:00
var UUR_PX = 46;                    // hoogte van één uur

var ik = (localStorage.getItem("fp.email")||"").toLowerCase();
var afspraken = [];
var maandag = weekStart(new Date());
var filterUit = {};                 // categorie-sleutel -> true als uitgevinkt

function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function teamKey(){ return localStorage.getItem("fp.teamkey")||""; }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function weekStart(d){
  var k = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  k.setDate(k.getDate() - (k.getDay()+6)%7);
  return k;
}
function weekNr(d){
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  var w1 = new Date(t.getFullYear(),0,4);
  return 1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7);
}
/* "gerwin@fonteyn.nl" of "fonteyn.gerwin" wordt "Gerwin" - dezelfde regel als
   het dashboard, zodat een naam er overal hetzelfde uitziet. */
function voornaam(wie){
  if (!wie) return "";
  var lokaal = String(wie).split("@")[0].replace(/^fonteyn\./i,"");
  return lokaal.split(/[.\-_]/).filter(Boolean).map(function(d){
    return d.charAt(0).toUpperCase()+d.slice(1).toLowerCase(); }).join(" ");
}
/* De naam van wie iets plande. Mike werkt op het service-account, dus
   "Servicespa" moet als Mike in beeld komen; de rest volgt de gewone regel.
   Namen van de afdeling (Gerrit, 7 sep 2026): Mike, Gerwin, Kevin, Bert-Jan,
   Tim en Bart. */
var PLANNERS = { "servicespa":"Mike", "bertjan":"Bert-Jan", "bart.vdb":"Bart",
                 "tim.geerestein":"Tim", "fonteynbot":"Fonteynbot" };
function planNaam(wie){
  var lokaal = String(wie||"").split("@")[0].replace(/^fonteyn\./i,"").toLowerCase();
  return PLANNERS[lokaal] || voornaam(wie);
}
function minuten(t){ var m = String(t||"").match(/^(\d{1,2}):(\d{2})/); return m ? (+m[1])*60+(+m[2]) : null; }
function tijdStr(min){ return String(Math.floor(min/60)).padStart(2,"0")+":"+String(min%60).padStart(2,"0"); }

/* ── opslag ── */
async function lees(){
  try{
    var r = await fetch(W+"/data/"+BUCKET, { headers:{ "X-Fonteyn-Auth": teamKey() } });
    if(!r.ok) return null;
    var j = await r.json();
    // De routes en de dagnotities zitten in dezelfde bucket; die halen we hier
    // meteen op zodat het bord ze heeft.
    routesPerDag = (j && j.routes && typeof j.routes==="object") ? j.routes : {};
    dagNotities  = (j && j.notities && typeof j.notities==="object") ? j.notities : {};
    return (j && Array.isArray(j.afspraken)) ? j.afspraken : [];
  }catch(e){ return null; }
}
async function bewaar(wijzig){
  /* Verse gegevens ophalen, wijzigen, alles terugschrijven. LET OP: hier
     stond eerder alleen { afspraken }, en dat zou de routes en de
     dagnotities bij elke wijziging aan een afspraak wissen - KV kent alleen
     'vervang alles'. */
  var r0 = await fetch(W+"/data/"+BUCKET, { headers:{ "X-Fonteyn-Auth": teamKey() } });
  if (!r0.ok) throw new Error("De opslag is niet bereikbaar. Probeer het zo nog eens.");
  var j = await r0.json();
  var routes   = (j && j.routes && typeof j.routes==="object") ? j.routes : {};
  var notities = (j && j.notities && typeof j.notities==="object") ? j.notities : {};
  afspraken = wijzig(Array.isArray(j.afspraken) ? j.afspraken : []);
  routesPerDag = routes; dagNotities = notities;
  var r = await fetch(W+"/data/"+BUCKET, { method:"PUT",
    headers:{ "Content-Type":"application/json", "X-Fonteyn-Auth": teamKey() },
    body: JSON.stringify({ afspraken: afspraken, routes: routes, notities: notities }) });
  if(!r.ok) throw new Error("Bewaren mislukte (HTTP "+r.status+").");
  // De anderen die de agenda openhebben laten weten dat er iets veranderd is.
  liveStuur({ soort:"gewijzigd", wat:"planning" });
}

/* ── live meekijken ──────────────────────────────────────────────────
   Gerrit (7 sep 2026): de agenda moet live zijn. Voegt Kevin iets toe, dan
   ziet Gerwin het; haalt Kevin het weer weg, dan hoort het bij Gerwin ook te
   verdwijnen - en dat laatste ging mis, want zonder verbinding zag je alleen
   je eigen scherm van een minuut geleden.

   De kamer stuurt geen afspraken rond maar alleen een seintje "er is iets
   veranderd". Iedereen leest daarop de bucket opnieuw. Dat is bewust: een
   verwijderde afspraak is geen veld dat verandert maar een regel die er niet
   meer is, en die krijg je met losse veldjes nooit goed weg. Zo blijft KV de
   enige waarheid en klopt toevoegen, wijzigen én verwijderen.

   Valt de verbinding weg, dan werkt alles gewoon door: er staat een
   verversing van een halve minuut onder. */
var liveWs = null, liveKlaar = false, liveAanwezig = [];
function liveStuur(obj){
  if (liveKlaar && liveWs && liveWs.readyState === 1) { try{ liveWs.send(JSON.stringify(obj)); }catch(e){} }
}
function liveStart(){
  if (!teamKey()) return;
  try { liveWs = new WebSocket("wss://fonteyn-data-store.g-mulder.workers.dev/live/planning"); }
  catch(e){ return; }
  liveWs.addEventListener("open", function(){
    liveWs.send(JSON.stringify({ soort:"hallo", sleutel: teamKey(), wie: ik || "onbekend" }));
  });
  liveWs.addEventListener("message", function(ev){
    var d = null; try { d = JSON.parse(ev.data); } catch(e){ return; }
    if (d.soort === "welkom"){ liveKlaar = true; liveAanwezig = d.aanwezig||[]; toonAanwezig(); return; }
    if (d.soort === "erbij"){ if (liveAanwezig.indexOf(d.wie)<0) liveAanwezig.push(d.wie); toonAanwezig(); return; }
    // (dubbele namen kunnen ontstaan als iemand twee vensters open heeft)
    if (d.soort === "weg"){ liveAanwezig = liveAanwezig.filter(function(w){ return w!==d.wie; }); toonAanwezig(); return; }
    if (d.soort === "gewijzigd") ververs(d.wie);
  });
  liveWs.addEventListener("close", function(){
    liveKlaar = false; liveAanwezig = []; toonAanwezig();
    setTimeout(liveStart, 5000 + Math.random()*5000);
  });
  liveWs.addEventListener("error", function(){ try{ liveWs.close(); }catch(e){} });
}
/* Opnieuw ophalen en tekenen. Staat er een formulier open, dan wachten we:
   iemand midden in een afspraak het scherm onder handen wegtrekken is erger
   dan een paar seconden later bijwerken. */
var verversTimer = null;
async function ververs(doorWie){
  if (document.querySelector(".laag")) { clearTimeout(verversTimer); verversTimer = setTimeout(ververs, 1500); return; }
  var vers = await lees();
  if (vers === null) return;
  afspraken = vers;
  teken();
  if (doorWie && doorWie !== ik) meldBijgewerkt(doorWie);
}
/* Kort zichtbaar maken dat het scherm net is bijgewerkt door een collega.
   Zonder dat lijkt het alsof de agenda uit zichzelf verspringt. */
var meldTimer = null;
function meldBijgewerkt(wie){
  var el = $("liveMelding");
  if (!el) return;
  el.textContent = "Bijgewerkt door " + voornaam(wie);
  el.style.opacity = "1";
  clearTimeout(meldTimer);
  meldTimer = setTimeout(function(){ el.style.opacity = "0"; }, 4000);
}
function toonAanwezig(){
  var el = $("liveAanwezig");
  if (!el) return;
  /* Iemand met twee vensters open staat twee keer in de lijst; dan las het
     als "Gerwin, Gerwin kijken mee". Eén keer per persoon is genoeg. */
  var anderen = liveAanwezig.filter(function(w,i){ return w !== ik && liveAanwezig.indexOf(w)===i; });
  el.innerHTML = anderen.length
    ? '<span class="live-stip"></span>' + anderen.map(function(w){ return esc(voornaam(w)); }).join(", ") +
      (anderen.length===1 ? " kijkt mee" : " kijken mee")
    : "";
}

/* ── betaald, aanbetaald of niets ────────────────────────────────────
   Gerrit (7 sep 2026): "Bij Planning wil ik kunnen zien (met groen, oranje,
   rood) of een order volledig is betaald, aanbetaald of niet betaald."

   De afspraak heeft al een veld ordernummer. Daarmee vragen we bij Logic4 op
   wat de order kost en wat er binnen is. De worker onthoudt dat tien minuten,
   dus bladeren door de weken kost bijna niets.

   Staat er geen ordernummer op de afspraak, of kent Logic4 het nummer niet,
   dan komt er GEEN stip. Grijs zou "niet betaald" kunnen suggereren en dat
   weten we juist niet. */
var betaald = {};        // ordernummer -> {stand, bedrag, betaald, status}
var betaaldBezig = false;
var BETAALD = {
  betaald:    { kleur:"#3e7d3f", naam:"volledig betaald" },
  aanbetaald: { kleur:"#e0a300", naam:"aanbetaald" },
  open:       { kleur:"#c8102e", naam:"niet betaald" },
};
function betaalStip(a){
  var nr = String(a.ordernr||"").trim();
  if (!nr) return "";
  var b = betaald[nr];
  if (!b || !BETAALD[b.stand]) return "";
  var t = BETAALD[b.stand];
  var uitleg = "Order "+nr+": "+t.naam;
  if (b.bedrag) uitleg += " - "+euro(b.betaald)+" van "+euro(b.bedrag);
  if (b.status) uitleg += " ("+b.status+")";
  return '<span class="betaalstip" style="background:'+t.kleur+'" title="'+esc(uitleg)+'"></span>';
}
function euro(n){ return "\u20ac " + Number(n||0).toLocaleString("nl-NL",{minimumFractionDigits:2,maximumFractionDigits:2}); }
/* Alleen de ordernummers die nu in beeld staan opvragen. De worker haalt er
   maximaal dertig per keer op (een worker mag beperkt naar buiten); is er
   meer nodig, dan vraagt hij vanzelf de rest in een tweede ronde. */
async function haalBetaald(){
  if (betaaldBezig || !teamKey()) return;
  var nrs = {};
  weekLijst().forEach(function(d){ d.items.forEach(function(a){
    var nr = String(a.ordernr||"").trim();
    if (/^\d{4,12}$/.test(nr) && !betaald[nr]) nrs[nr] = 1;
  }); });
  var lijst = Object.keys(nrs);
  if (!lijst.length) return;
  betaaldBezig = true;
  try{
    var r = await fetch(W+"/planning/betaalstatus?orders="+lijst.join(","), { headers:{ "X-Fonteyn-Auth": teamKey() } });
    var j = await r.json();
    if (j && j.ok){
      Object.keys(j.orders||{}).forEach(function(k){ betaald[k] = j.orders[k]; });
      /* Nummers die Logic4 niet kent onthouden we óók, als "geen stand".
         Zonder dat zouden ze bij elke keer tekenen opnieuw worden opgevraagd
         en blijft het scherm zichzelf aan het bevragen. */
      if (!j.restant) lijst.forEach(function(nr){ if (!betaald[nr]) betaald[nr] = { stand:null }; });
      teken();
      // Nog niet alles opgehaald? Dan zo de rest.
      if (j.restant > 0) setTimeout(function(){ betaaldBezig = false; haalBetaald(); }, 400);
    }
  }catch(e){}
  betaaldBezig = false;
}

/* ── legenda + filter ── */
function tekenLegenda(){
  /* De twee live-vakjes staan vast in de balk; alleen de categorie-chips
     worden opnieuw getekend. Anders zou het seintje van een collega
     verdwijnen zodra iemand een filter aanklikt. */
  var houder = $("legendaChips");
  if (!houder) {
    houder = document.createElement("span");
    houder.id = "legendaChips";
    $("legenda").insertBefore(houder, $("liveAanwezig"));
  }
  houder.innerHTML = Object.keys(CATS).map(function(k){
    var c = CATS[k];
    return '<span class="cat-chip'+(filterUit[k]?" uit":"")+'" data-cat="'+k+'" title="Klik om deze categorie te tonen of te verbergen">'+
      '<span class="bol" style="background:'+c.kleur+'"></span>'+esc(c.naam)+'</span>';
  }).join("");
  houder.innerHTML += '<span class="betaal-uitleg" title="De stip voor de klantnaam laat zien hoe de order ervoor staat. Geen stip = geen ordernummer op de afspraak.">'+
    Object.keys(BETAALD).map(function(k){
      return '<span class="betaalstip" style="background:'+BETAALD[k].kleur+'"></span>'+esc(BETAALD[k].naam); }).join(" ")+'</span>';
  toonAanwezig();
  document.querySelectorAll(".cat-chip").forEach(function(ch){
    ch.addEventListener("click", function(){
      filterUit[ch.dataset.cat] = !filterUit[ch.dataset.cat];
      tekenLegenda(); teken();
    });
  });
}

/* ── weekgegevens ── */
function weekLijst(){
  var uit = [];
  for (var i=0;i<7;i++){
    var dag = new Date(maandag); dag.setDate(dag.getDate()+i);
    var dISO = iso(dag);
    uit.push({ datum: dag, iso: dISO,
      items: afspraken.filter(function(a){ return a.datum===dISO && !filterUit[a.soort]; })
        .sort(function(a,b){ return String(a.tijd||"99").localeCompare(String(b.tijd||"99")); }) });
  }
  return uit;
}
function titel(){
  var einde = new Date(maandag); einde.setDate(einde.getDate()+6);
  $("weekTitel").textContent = "Week "+weekNr(maandag)+" · "+
    maandag.getDate()+" "+MAANDEN[maandag.getMonth()]+" - "+einde.getDate()+" "+MAANDEN[einde.getMonth()]+" "+einde.getFullYear();
}

/* ── het tijdraster (brede schermen) ──
   Afspraken met een tijd komen als blok op de juiste hoogte; wie elkaar
   overlappen worden over kolommetjes verdeeld, net als in Outlook.
   Zonder tijd = de "hele dag"-strook bovenin. */
function teken(){
  titel();
  var week = weekLijst();
  haalBetaald();
  var routeStand = weergave === "routes";
  $("bord").style.display = routeStand ? "" : "none";
  var ah = $("agendaHouder"); if (ah) ah.style.display = routeStand ? "none" : "";
  var lj = $("lijst"); if (lj) lj.style.display = routeStand ? "none" : "";
  /* Op het bord staan de dagen naast elkaar en schuift het horizontaal; dat
     werkt ook op een telefoon, dus daar is geen aparte lijstweergave voor
     nodig. */
  if (routeStand){ tekenBord(); if (itsMeldingen !== null) itsTeken(); return; }
  var vandaagISO = iso(new Date());
  var uren = UUR_TOT - UUR_VAN;

  var html = '<div class="hoek"></div>';
  week.forEach(function(w,i){
    var route = w.items.some(function(a){ return a.plaats && !a.klaar; })
      ? '<button type="button" class="route-knop" data-datum="'+w.iso+'" title="Route van deze dag in Google Maps">🚗</button>' : "";
    html += '<div class="dag-kop'+(w.iso===vandaagISO?" vandaag":"")+'">'+route+
      '<span class="dnaam">'+DAGKORT[i]+'</span><br><span class="dnum">'+w.datum.getDate()+'</span></div>';
  });

  html += '<div class="heledag-label">hele dag</div>';
  week.forEach(function(w){
    var hd = w.items.filter(function(a){ return minuten(a.tijd)===null; });
    html += '<div class="heledag-cel">'+hd.map(function(a){
      var c = cat(a);
      return '<div class="hd-blok'+(a.klaar?" klaar":"")+'" data-id="'+esc(a.id)+'" style="background:'+c.zacht+';border-left-color:'+c.kleur+'">'+
        betaalStip(a)+esc(a.klant||c.naam)+(a.wie?' · '+esc(a.wie):'')+'</div>';
    }).join("")+'</div>';
  });

  // urenkolom + 7 dagkolommen
  html += '<div style="height:'+(uren*UUR_PX)+'px;position:relative">';
  for (var u=UUR_VAN; u<=UUR_TOT; u++)
    html += '<div class="uur-label" style="position:absolute;right:0;top:'+((u-UUR_VAN)*UUR_PX)+'px;width:100%">'+String(u).padStart(2,"0")+'</div>';
  html += '</div>';

  week.forEach(function(w,di){
    var isWeekend = di>=5;
    html += '<div class="dag-cel'+(isWeekend?" weekend":"")+'" data-datum="'+w.iso+'" style="height:'+(uren*UUR_PX)+'px">';
    for (var u2=1; u2<uren; u2++) html += '<div class="uurlijn" style="top:'+(u2*UUR_PX)+'px"></div>';
    if (w.iso===vandaagISO){
      var nu = new Date(); var nm = nu.getHours()*60+nu.getMinutes();
      var y = (nm - UUR_VAN*60)/60*UUR_PX;
      if (y>0 && y<uren*UUR_PX) html += '<div class="nu-lijn" style="top:'+y+'px"></div>';
    }
    html += blokken(w.items) + '</div>';
  });

  $("rooster").innerHTML = html;

  // telefoonweergave
  $("lijst").innerHTML = week.map(function(w,i){
    var route = w.items.some(function(a){ return a.plaats && !a.klaar; })
      ? '<button type="button" class="route-knop" data-datum="'+w.iso+'" title="Route van deze dag in Google Maps">🚗</button>' : "";
    return '<div class="dagkaart'+(w.iso===vandaagISO?" vandaag":"")+'">'+route+
      '<h3>'+DAGEN[i]+'</h3><div class="datum">'+w.datum.getDate()+' '+MAANDEN[w.datum.getMonth()]+'</div>'+
      (w.items.length ? w.items.map(kaartje).join("") : '<div class="leeg">Nog niets gepland</div>')+
      '<button type="button" class="plus" data-datum="'+w.iso+'">+ afspraak</button></div>';
  }).join("");

  /* Klikken opent het formulier. Bij een blok in het raster geldt dat alleen
     als er niet gesleept is en niet op de naam is geklikt - dat wordt hieronder
     afgehandeld. */
  document.querySelectorAll(".hd-blok,.afs").forEach(function(k){
    k.addEventListener("click", function(e){ e.stopPropagation(); openForm(k.dataset.id); });
  });
  document.querySelectorAll(".blok").forEach(koppelBlok);
  document.querySelectorAll(".plus").forEach(function(k){
    k.addEventListener("click", function(){ openForm(null, k.dataset.datum); });
  });
  document.querySelectorAll(".route-knop").forEach(function(k){
    k.addEventListener("click", function(e){ e.stopPropagation(); routeKies(k.dataset.datum, k); });
  });
  // Ook het meldingenpaneel bijwerken: "in de planning" kan veranderd zijn.
  if (itsMeldingen !== null) itsTeken();
  // Klik op een leeg stuk dag = nieuwe afspraak op dat tijdstip, afgerond op het halve uur.
  document.querySelectorAll(".dag-cel").forEach(function(cel){
    cel.addEventListener("click", function(e){
      if (e.target!==cel && !e.target.classList.contains("uurlijn")) return;
      var y = e.offsetY, min = UUR_VAN*60 + Math.round(y/UUR_PX*60/30)*30;
      openForm(null, cel.dataset.datum, tijdStr(Math.max(UUR_VAN*60, Math.min(UUR_TOT*60-30, min))));
    });
  });
}

/* ── ROUTEBORD ───────────────────────────────────────────────────────
   Per dag een paar routes, per route de stops eronder. De routes staan in
   dezelfde bucket als de afspraken, onder 'routes', per datum:

     routes: { "2026-09-07": [ {nr:1, wie:"Kevin"}, {nr:2, wie:"Gerwin"} ] }
     notities: { "2026-09-07": "MAX 2 ROUTES · route 1 alleen" }

   Een afspraak hoort bij een route via het veld 'route' (het nummer). Zit er
   geen nummer op, dan staat hij in de eerste route van die dag - anders zou
   een afspraak die vanuit Voorraadbeheer of de servicemeldingen binnenkomt
   nergens te zien zijn.

   De tijd blijft gewoon op de afspraak staan; die telt in het tijdraster en
   in de stop-regel. Op het bord gaat het om de volgorde binnen de route, en
   die volgt de tijd. */
var weergave = "routes";
try { var w0 = localStorage.getItem("fp.planweergave"); if (w0==="tijd"||w0==="routes") weergave = w0; } catch(e){}
var routesPerDag = {}, dagNotities = {};

function routesVan(dISO){
  var r = routesPerDag[dISO];
  if (Array.isArray(r) && r.length) return r;
  return [{ nr:1, wie:"" }];               // elke dag heeft er minstens één
}
function stopsVan(dISO, nr, eerste){
  return afspraken.filter(function(a){
    if (a.datum !== dISO || filterUit[a.soort]) return false;
    var rn = Number(a.route) || 0;
    return rn === nr || (!rn && eerste);
  }).sort(function(x,y){ return String(x.tijd||"99").localeCompare(String(y.tijd||"99")); });
}

function tekenBord(){
  var week = weekLijst();
  var vandaagISO = iso(new Date());
  var html = "";
  week.forEach(function(w,i){
    var routes = routesVan(w.iso);
    /* Ongeveer 150 pixels per route, plus de randen. Eén route wordt dus
       een smalle kolom en drie routes een brede - net als op het bord waar de
       afdeling nu naar kijkt. */
    var breed = Math.max(190, routes.length * 150 + 14);
    html += '<div class="borddag'+(w.iso===vandaagISO?" vandaag":"")+'" data-datum="'+w.iso+'" style="width:'+breed+'px">'+
      '<h3>'+DAGEN[i]+'<span class="dd">'+w.datum.getDate()+' '+MAANDEN[w.datum.getMonth()]+'</span></h3>'+
      '<div class="routes">'+
      routes.map(function(r, ri){
        var stops = stopsVan(w.iso, r.nr, ri===0);
        return '<div class="route" data-datum="'+w.iso+'" data-nr="'+r.nr+'">'+
          '<h4><span class="nr">'+r.nr+'</span>'+
            '<span class="wie" data-datum="'+w.iso+'" data-nr="'+r.nr+'" title="Klik om de naam aan te passen">'+
              (r.wie ? esc(r.wie) : '<span style="color:#c9cfcb;font-weight:400">wie rijdt?</span>')+'</span>'+
            '<button type="button" class="weg routeWeg" data-datum="'+w.iso+'" data-nr="'+r.nr+'" title="Deze route weghalen">&times;</button>'+
          '</h4>'+
          '<div class="stops">'+
            (stops.length ? stops.map(stopHtml).join("") : '<div class="leegdrop">sleep hier een stop</div>')+
          '</div>'+
          '<button type="button" class="plusstop" data-datum="'+w.iso+'" data-nr="'+r.nr+'">+ stop</button>'+
        '</div>';
      }).join("")+
      '</div>'+
      '<button type="button" class="plusroute" data-datum="'+w.iso+'">+ route</button>'+
      '<div class="dagnotitie" data-datum="'+w.iso+'" title="Klik om een notitie voor deze dag te zetten">'+
        (dagNotities[w.iso] ? esc(dagNotities[w.iso]) : "notitie voor deze dag…")+'</div>'+
    '</div>';
  });
  $("bord").innerHTML = html;
  koppelBord();
}
function stopHtml(a){
  var c = cat(a);
  var regel = [a.plaats, a.wat, a.ordernr].filter(Boolean).join(" - ");
  return '<div class="stop'+(a.klaar?" klaar":"")+(a.letop?" letop":"")+'" draggable="true" data-id="'+esc(a.id)+'"'+
    ' style="border-left-color:'+c.kleur+'" title="'+esc((a.tijd?a.tijd+"  ":"")+(a.klant||"")+(regel?"  -  "+regel:""))+'">'+
    betaalStip(a)+'<span class="kl">'+(a.tijd?esc(a.tijd)+" ":"")+esc(a.klant||c.naam)+'</span>'+
    (regel?'<span class="rg">'+esc(regel)+'</span>':"")+
    (a.wie?'<span class="rg">\ud83d\udc64 '+esc(a.wie)+'</span>':"")+'</div>';
}

function koppelBord(){
  // stop aanklikken = het formulier; slepen = naar een andere route of dag
  $("bord").querySelectorAll(".stop").forEach(function(el){
    el.addEventListener("click", function(){ if(!el.dataset.gesleept) openForm(el.dataset.id); delete el.dataset.gesleept; });
    el.addEventListener("dragstart", function(e){
      e.dataTransfer.setData("text/plain", el.dataset.id);
      e.dataTransfer.effectAllowed = "move";
      el.classList.add("sleept");
    });
    el.addEventListener("dragend", function(){ el.classList.remove("sleept"); });
  });
  $("bord").querySelectorAll(".route").forEach(function(r){
    r.addEventListener("dragover", function(e){ e.preventDefault(); r.classList.add("sleepdoel"); });
    r.addEventListener("dragleave", function(){ r.classList.remove("sleepdoel"); });
    r.addEventListener("drop", async function(e){
      e.preventDefault(); r.classList.remove("sleepdoel");
      var id = e.dataTransfer.getData("text/plain");
      var a = afspraken.find(function(x){ return x.id===id; });
      if (!a) return;
      var nieuweDatum = r.dataset.datum, nieuwNr = Number(r.dataset.nr);
      if (a.datum===nieuweDatum && (Number(a.route)||0)===nieuwNr) return;
      var el = $("bord").querySelector('.stop[data-id="'+CSS.escape(id)+'"]');
      if (el) el.dataset.gesleept = "1";
      try{
        await bewaar(function(lijst){
          var i = lijst.findIndex(function(x){ return x.id===id; });
          if (i>=0) lijst[i] = Object.assign({}, lijst[i], { datum:nieuweDatum, route:nieuwNr,
            gewijzigdDoor:ik, gewijzigd:new Date().toISOString() });
          return lijst;
        });
        try{ if(window.fpLog) window.fpLog("stop-verplaatst",(a.klant||"")+" -> "+nieuweDatum+" route "+nieuwNr); }catch(e){}
        teken();
      }catch(err){ alert(err.message); }
    });
  });
  // + stop, + route, route weghalen, naam van de rijder, dagnotitie
  $("bord").querySelectorAll(".plusstop").forEach(function(b){
    b.addEventListener("click", function(){
      openForm(null, b.dataset.datum, "", { route: Number(b.dataset.nr) });
    });
  });
  $("bord").querySelectorAll(".plusroute").forEach(function(b){
    b.addEventListener("click", function(){ voegRouteToe(b.dataset.datum); });
  });
  $("bord").querySelectorAll(".routeWeg").forEach(function(b){
    b.addEventListener("click", function(e){ e.stopPropagation(); haalRouteWeg(b.dataset.datum, Number(b.dataset.nr)); });
  });
  $("bord").querySelectorAll(".route .wie").forEach(function(el){
    el.addEventListener("click", function(){ bewerkRijder(el); });
  });
  $("bord").querySelectorAll(".dagnotitie").forEach(function(el){
    el.addEventListener("click", function(){ bewerkDagnotitie(el); });
  });
}

/* Routes en dagnotities bewaren. Ze zitten in dezelfde bucket als de
   afspraken, dus lezen-wijzigen-terugschrijven op de VERSE lijst - anders
   gooit dit scherm weg wat een collega net heeft gedaan. */
async function bewaarBord(wijzig){
  var r = await fetch(W+"/data/"+BUCKET, { headers:{ "X-Fonteyn-Auth": teamKey() } });
  if (!r.ok) throw new Error("De opslag is niet bereikbaar. Probeer het zo nog eens.");
  var j = await r.json();
  var data = { afspraken: Array.isArray(j.afspraken)?j.afspraken:[],
               routes: (j.routes && typeof j.routes==="object") ? j.routes : {},
               notities: (j.notities && typeof j.notities==="object") ? j.notities : {} };
  wijzig(data);
  var put = await fetch(W+"/data/"+BUCKET, { method:"PUT",
    headers:{ "Content-Type":"application/json", "X-Fonteyn-Auth": teamKey() },
    body: JSON.stringify(data) });
  if (!put.ok) throw new Error("Bewaren mislukte (HTTP "+put.status+").");
  afspraken = data.afspraken; routesPerDag = data.routes; dagNotities = data.notities;
  liveStuur({ soort:"gewijzigd", wat:"planning" });
}
async function voegRouteToe(dISO){
  try{
    await bewaarBord(function(d){
      var lijst = Array.isArray(d.routes[dISO]) && d.routes[dISO].length ? d.routes[dISO] : [{nr:1,wie:""}];
      var nr = Math.max.apply(null, lijst.map(function(x){ return Number(x.nr)||0; })) + 1;
      lijst.push({ nr:nr, wie:"" });
      d.routes[dISO] = lijst;
    });
    try{ if(window.fpLog) window.fpLog("route-toegevoegd", dISO); }catch(e){}
    teken();
  }catch(e){ alert(e.message); }
}
async function haalRouteWeg(dISO, nr){
  var stops = stopsVan(dISO, nr, routesVan(dISO)[0].nr===nr);
  if (stops.length && !confirm("Route "+nr+" heeft "+stops.length+" stop(s). Die komen in de eerste route te staan. Doorgaan?")) return;
  try{
    await bewaarBord(function(d){
      var lijst = (d.routes[dISO]||[]).filter(function(x){ return Number(x.nr)!==nr; });
      d.routes[dISO] = lijst.length ? lijst : [{nr:1,wie:""}];
      var eerste = Number(d.routes[dISO][0].nr)||1;
      d.afspraken.forEach(function(a){ if (a.datum===dISO && Number(a.route)===nr) a.route = eerste; });
    });
    try{ if(window.fpLog) window.fpLog("route-verwijderd", dISO+" route "+nr); }catch(e){}
    teken();
  }catch(e){ alert(e.message); }
}
/* De naam van wie de route rijdt. Vaak twee namen ("BART EN JOEY"), dus een
   vrij tekstveld en geen keuzelijst. */
function bewerkRijder(el){
  if (el.dataset.bezig) return;
  el.dataset.bezig = "1";
  var dISO = el.dataset.datum, nr = Number(el.dataset.nr);
  var oud = ((routesVan(dISO).find(function(x){ return Number(x.nr)===nr; })||{}).wie)||"";
  el.innerHTML = "";
  var vak = document.createElement("input");
  vak.className = "naamvak"; vak.value = oud; vak.maxLength = 60;
  vak.style.width = "100%";
  el.appendChild(vak); vak.focus(); vak.select();
  var af = false;
  async function klaar(bewaren){
    if (af) return; af = true;
    var nieuw = vak.value.trim();
    el.removeAttribute("data-bezig");
    if (!bewaren || nieuw === oud) { teken(); return; }
    try{
      await bewaarBord(function(d){
        var lijst = Array.isArray(d.routes[dISO]) && d.routes[dISO].length ? d.routes[dISO] : [{nr:1,wie:""}];
        var r = lijst.find(function(x){ return Number(x.nr)===nr; });
        if (r) r.wie = nieuw; else lijst.push({ nr:nr, wie:nieuw });
        d.routes[dISO] = lijst;
      });
      try{ if(window.fpLog) window.fpLog("route-rijder-gezet", dISO+" route "+nr+": "+nieuw); }catch(e){}
    }catch(err){ alert(err.message); }
    teken();
  }
  vak.addEventListener("keydown", function(e){
    if (e.key==="Enter"){ e.preventDefault(); klaar(true); }
    if (e.key==="Escape"){ e.preventDefault(); klaar(false); }
  });
  vak.addEventListener("blur", function(){ klaar(true); });
}
/* De regels onderaan de dag: "MAX 2 ROUTES", "route 1 alleen". */
function bewerkDagnotitie(el){
  if (el.dataset.bezig) return;
  el.dataset.bezig = "1";
  var dISO = el.dataset.datum, oud = dagNotities[dISO] || "";
  el.innerHTML = "";
  var vak = document.createElement("input");
  vak.className = "naamvak"; vak.value = oud; vak.maxLength = 160; vak.style.width = "100%";
  vak.placeholder = "bijv. MAX 2 ROUTES - route 1 alleen";
  el.appendChild(vak); vak.focus(); vak.select();
  var af = false;
  async function klaar(bewaren){
    if (af) return; af = true;
    var nieuw = vak.value.trim();
    el.removeAttribute("data-bezig");
    if (!bewaren || nieuw === oud) { teken(); return; }
    try{
      await bewaarBord(function(d){ if (nieuw) d.notities[dISO] = nieuw; else delete d.notities[dISO]; });
      try{ if(window.fpLog) window.fpLog("dagnotitie-gezet", dISO+": "+nieuw); }catch(e){}
    }catch(err){ alert(err.message); }
    teken();
  }
  vak.addEventListener("keydown", function(e){
    if (e.key==="Enter"){ e.preventDefault(); klaar(true); }
    if (e.key==="Escape"){ e.preventDefault(); klaar(false); }
  });
  vak.addEventListener("blur", function(){ klaar(true); });
}

/* ── slepen, vergroten en direct bewerken ────────────────────────────
   Gerrit (7 sep 2026): "Agendapunten moeten ook versleepbaar zijn (groter te
   maken, verslepen van dag, etc.). Het moet ook zeer makkelijk aanpasbaar
   zijn (even aanklikken en direct de tekst kunnen aanpassen)."

   Drie dingen op hetzelfde blok, dus ze moeten elkaar niet in de weg zitten:
     - slepen aan het blok         -> andere dag en/of ander tijdstip
     - slepen aan de onderrand     -> langer of korter
     - klikken op de naam          -> naam direct aanpassen
     - klikken op de rest          -> het hele formulier

   Onderscheid tussen klikken en slepen: pas ná vier pixels beweging is het
   slepen. Anders zou elke trillende muisklik de afspraak verzetten.

   Alles gaat in stapjes van een kwartier; dat is fijn genoeg om precies te
   plannen en grof genoeg om niet op 09:07 uit te komen. */
var SNAP = 15;                       // minuten
function koppelBlok(el){
  el.addEventListener("mousedown", startSleep);
  var naam = el.querySelector('[data-bewerk="klant"]');
  if (naam) naam.addEventListener("click", function(e){
    if (el.dataset.gesleept) return;
    e.stopPropagation();
    bewerkNaam(el, naam);
  });
  el.addEventListener("click", function(e){
    if (el.dataset.gesleept) { delete el.dataset.gesleept; return; }
    if (e.target.closest('[data-bewerk="klant"]') || e.target.classList.contains("greep")) return;
    e.stopPropagation();
    openForm(el.dataset.id);
  });
}
function startSleep(e){
  if (e.button !== 0) return;
  var el = e.currentTarget;
  var a = afspraken.find(function(x){ return x.id===el.dataset.id; });
  if (!a) return;
  var rekken = e.target.classList.contains("greep");
  e.preventDefault(); e.stopPropagation();

  var startX = e.clientX, startY = e.clientY;
  var beginTop = parseFloat(el.style.top) || 0;
  var beginHoog = parseFloat(el.style.height) || UUR_PX;
  var beginVan = minuten(a.tijd) || UUR_VAN*60;
  var beginDuur = Number(a.duurMin) || 60;
  var kolommen = [].slice.call(document.querySelectorAll(".dag-cel")).map(function(c){
    var r = c.getBoundingClientRect();
    return { datum: c.dataset.datum, links: r.left, rechts: r.right, cel: c };
  });
  var bezig = false, nieuweDatum = a.datum, nieuwVan = beginVan, nieuweDuur = beginDuur;

  function beweeg(ev){
    var dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (!bezig && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
    if (!bezig){ bezig = true; el.classList.add("sleept"); document.body.classList.add("bezig-slepen"); }

    if (rekken){
      var hoog = Math.max(UUR_PX/2, beginHoog + dy);
      nieuweDuur = Math.max(SNAP, Math.round(hoog/UUR_PX*60/SNAP)*SNAP);
      if (beginVan + nieuweDuur > UUR_TOT*60) nieuweDuur = UUR_TOT*60 - beginVan;
      el.style.height = Math.max(24, nieuweDuur/60*UUR_PX - 2)+"px";
      toonTip(ev, a.tijd+" - "+tijdStr(beginVan+nieuweDuur)+"  ("+duurTekst(nieuweDuur)+")");
      return;
    }
    // verplaatsen: eerst de dag onder de muis, dan het tijdstip
    var kol = kolommen.find(function(k){ return ev.clientX >= k.links && ev.clientX <= k.rechts; });
    if (kol && kol.datum !== nieuweDatum){
      nieuweDatum = kol.datum;
      kol.cel.appendChild(el);                 // in de kolom van die dag hangen
      el.style.left = "2px"; el.style.width = "calc(100% - 5px)"; el.style.zIndex = 40;
    }
    var top = beginTop + dy;
    nieuwVan = Math.round((top/UUR_PX*60 + UUR_VAN*60)/SNAP)*SNAP;
    nieuwVan = Math.max(UUR_VAN*60, Math.min(UUR_TOT*60 - nieuweDuur, nieuwVan));
    el.style.top = ((nieuwVan - UUR_VAN*60)/60*UUR_PX)+"px";
    toonTip(ev, dagNaam(nieuweDatum)+"  "+tijdStr(nieuwVan)+" - "+tijdStr(nieuwVan+nieuweDuur));
  }
  async function los(ev){
    document.removeEventListener("mousemove", beweeg);
    document.removeEventListener("mouseup", los);
    verbergTip();
    el.classList.remove("sleept"); document.body.classList.remove("bezig-slepen");
    if (!bezig) return;                        // het was toch een klik
    el.dataset.gesleept = "1";                 // de klik hierna niet als klik tellen
    var b = rekken
      ? { duurMin: nieuweDuur }
      : { datum: nieuweDatum, tijd: tijdStr(nieuwVan) };
    if ((b.datum===a.datum || b.datum===undefined) && (b.tijd===a.tijd || b.tijd===undefined)
        && (b.duurMin===a.duurMin || b.duurMin===undefined)) { teken(); return; }
    try{
      await bewaar(function(lijst){
        var i = lijst.findIndex(function(x){ return x.id===a.id; });
        if (i>=0) lijst[i] = Object.assign({}, lijst[i], b,
          { gewijzigdDoor: ik, gewijzigd: new Date().toISOString() });
        return lijst;
      });
      try{ if(window.fpLog) window.fpLog(rekken?"afspraak-duur-gewijzigd":"afspraak-verplaatst",
        (a.klant||"")+" -> "+(b.datum||a.datum)+" "+(b.tijd||a.tijd)+" "+duurTekst(b.duurMin||a.duurMin)); }catch(e){}
      teken();
    }catch(err){ alert(err.message); teken(); }
  }
  document.addEventListener("mousemove", beweeg);
  document.addEventListener("mouseup", los);
}
function duurTekst(m){
  m = Number(m)||0;
  if (m < 60) return m+" min";
  var u = Math.floor(m/60), r = m%60;
  return u+(r?","+String(Math.round(r/60*10)):"")+" uur";
}
function dagNaam(dISO){
  var d = new Date(dISO+"T12:00:00");
  return DAGEN[(d.getDay()+6)%7]+" "+d.getDate()+" "+MAANDEN[d.getMonth()];
}
/* Klein vlaggetje bij de muis, zodat je tijdens het slepen ziet waar je
   uitkomt zonder naar het blok te hoeven turen. */
function toonTip(ev, tekst){
  var t = $("sleepTip");
  if (!t){ t = document.createElement("div"); t.id = "sleepTip"; t.className = "sleeptip"; document.body.appendChild(t); }
  t.textContent = tekst;
  t.style.left = (ev.clientX+14)+"px";
  t.style.top = (ev.clientY+14)+"px";
  t.style.display = "block";
}
function verbergTip(){ var t = $("sleepTip"); if (t) t.style.display = "none"; }

/* De naam direct aanpassen. Enter of wegklikken bewaart, Escape laat het
   zoals het was. Alleen de naam: voor de rest is er het formulier, en een
   heel blok bewerkbaar maken leest onrustig. */
function bewerkNaam(el, naam){
  if (naam.dataset.bezig) return;
  var a = afspraken.find(function(x){ return x.id===el.dataset.id; });
  if (!a) return;
  naam.dataset.bezig = "1";
  var oud = a.klant || "";
  naam.innerHTML = "";
  var vak = document.createElement("input");
  vak.className = "naamvak";
  vak.value = oud;
  vak.maxLength = 120;
  naam.appendChild(vak);
  vak.focus(); vak.select();
  var af = false;
  async function klaar(bewaren){
    if (af) return; af = true;
    var nieuw = vak.value.trim();
    naam.removeAttribute("data-bezig");
    if (!bewaren || nieuw === oud || !nieuw) { teken(); return; }
    try{
      await bewaar(function(lijst){
        var i = lijst.findIndex(function(x){ return x.id===a.id; });
        if (i>=0) lijst[i] = Object.assign({}, lijst[i],
          { klant: nieuw, gewijzigdDoor: ik, gewijzigd: new Date().toISOString() });
        return lijst;
      });
      try{ if(window.fpLog) window.fpLog("afspraak-naam-gewijzigd", oud+" -> "+nieuw); }catch(e){}
    }catch(err){ alert(err.message); }
    teken();
  }
  vak.addEventListener("keydown", function(e){
    if (e.key==="Enter"){ e.preventDefault(); klaar(true); }
    if (e.key==="Escape"){ e.preventDefault(); klaar(false); }
  });
  vak.addEventListener("blur", function(){ klaar(true); });
  vak.addEventListener("mousedown", function(e){ e.stopPropagation(); });
  vak.addEventListener("click", function(e){ e.stopPropagation(); });
}

function blokken(items){
  var met = items.map(function(a){
    var van = minuten(a.tijd);
    if (van===null) return null;
    var duur = Number(a.duurMin)||60;
    return { a:a, van:van, tot:van+duur };
  }).filter(Boolean).sort(function(x,y){ return x.van-y.van || y.tot-x.tot; });

  // Overlappende afspraken over kolommetjes verdelen (greedy, zoals Outlook).
  var lanes = [];
  met.forEach(function(b){
    var l = 0;
    while (lanes[l] && lanes[l] > b.van) l++;
    lanes[l] = b.tot; b.lane = l;
  });
  met.forEach(function(b){
    var n = 1;
    met.forEach(function(o){ if (o!==b && o.van<b.tot && o.tot>b.van) n = Math.max(n, o.lane+1, b.lane+1); });
    b.breed = Math.max(n, b.lane+1);
  });

  return met.map(function(b){
    var a = b.a, c = cat(a);
    var top = (b.van-UUR_VAN*60)/60*UUR_PX;
    var hoog = Math.max(24, (b.tot-b.van)/60*UUR_PX-2);
    var w = 100/b.breed, links = b.lane*w;
    var sub = [a.plaats, a.wat].filter(Boolean).join(" · ");
    /* Wie het heeft ingepland staat altijd in beeld, ook op een klein blok.
       Gerrit (7 sep 2026): "Ik wil ook kunnen zien wie het heeft ingepland."
       Bij een laag blok is er geen ruimte voor een regel, dus dan wordt het
       een rondje met de initiaal rechtsboven; de hele naam staat in de tip. */
    var plander = a.door ? '<span class="planner" title="Ingepland door '+esc(planNaam(a.door))+
      (a.gewijzigdDoor && a.gewijzigdDoor!==a.door ? ', laatst gewijzigd door '+esc(planNaam(a.gewijzigdDoor)) : '')+'">'+
      esc(planNaam(a.door).slice(0,1).toUpperCase())+'</span>' : "";
    return '<div class="blok'+(a.klaar?" klaar":"")+'" data-id="'+esc(a.id)+'" data-datum="'+esc(a.datum)+'" style="top:'+top+'px;height:'+hoog+'px;'+
      'left:calc('+links+'% + 2px);width:calc('+w+'% - 5px);background:'+c.zacht+';border-left-color:'+c.kleur+';z-index:'+(2+b.lane)+'">'+
      plander+
      '<div class="t">'+esc(a.tijd)+(a.duurMin?'-'+tijdStr(b.tot):'')+'</div>'+
      '<div class="k" data-bewerk="klant" title="Klik om de naam aan te passen">'+betaalStip(a)+esc(a.klant||c.naam)+'</div>'+
      (hoog>50&&sub?'<div class="s">'+esc(sub)+'</div>':"")+
      (hoog>66&&a.wie?'<div class="s">\ud83d\udc64 '+esc(a.wie)+'</div>':"")+
      (hoog>82&&a.door?'<div class="d">ingepland door '+esc(planNaam(a.door))+'</div>':"")+
      '<div class="greep" title="Sleep om de afspraak langer of korter te maken"></div></div>';
  }).join("");
}

function kaartje(a){
  var c = cat(a);
  var sub = [a.plaats, a.wat].filter(Boolean).map(esc).join(" · ");
  var voet = [];
  if (a.wie) voet.push("👤 "+esc(a.wie));
  if (a.door) voet.push("gepland door "+esc(voornaam(a.door)));
  return '<div class="afs'+(a.klaar?" klaar":"")+'" data-id="'+esc(a.id)+'" style="border-left-color:'+c.kleur+'">'+
    '<div class="kop"><span class="tijd">'+esc(a.tijd||"hele dag")+'</span>'+
    '<span class="badge" style="background:'+c.zacht+';color:'+c.kleur+';filter:brightness(.75)">'+esc(c.naam)+'</span></div>'+
    '<div class="klant">'+betaalStip(a)+esc(a.klant||"(geen naam)")+'</div>'+
    (sub?'<div class="sub">'+sub+'</div>':"")+
    (voet.length?'<div class="sub">'+voet.join(" · ")+'</div>':"")+'</div>';
}

/* ── formulier ── */
function openForm(id, datumVoorstel, tijdVoorstel, voorvul){

  var nieuw = !a;
  if (nieuw) a = Object.assign({ id:"p"+Date.now()+Math.random().toString(36).slice(2,6),
    datum: datumVoorstel || iso(new Date()), tijd: tijdVoorstel||"", duurMin: 60, soort:"levering",
    klant:"", telefoon:"", plaats:"", ordernr:"", wat:"", wie:"", klaar:false, route:null }, voorvul || {});

  var namen = {};
  afspraken.forEach(function(x){ if(x.wie) namen[x.wie]=1; });
  var DUUR = [[30,"30 min"],[60,"1 uur"],[90,"1,5 uur"],[120,"2 uur"],[180,"3 uur"],[240,"4 uur"],[480,"hele dag"]];

  var laag = document.createElement("div");
  laag.className = "laag";
  laag.innerHTML = '<div class="formkaart">'+
    '<h3>'+(nieuw?"Nieuwe afspraak":"Afspraak wijzigen")+'</h3>'+
    '<div class="kolommen"><div>'+
    '<label>Categorie</label><div class="catkeus" id="fCats">'+
      Object.keys(CATS).map(function(k){ var c=CATS[k];
        return '<button type="button" data-cat="'+k+'" style="'+(a.soort===k?'border-color:'+c.kleur+';background:'+c.zacht:'')+'">'+
          '<span class="bol" style="background:'+c.kleur+'"></span>'+esc(c.naam)+'</button>'; }).join("")+'</div>'+
    '<div class="rij"><div><label>Datum</label><input type="date" id="fDatum" value="'+esc(a.datum)+'"></div>'+
    '<div><label>Tijd (leeg = hele dag)</label><input type="time" id="fTijd" value="'+esc(a.tijd)+'"></div>'+
    '<div><label>Duur</label><select id="fDuur">'+DUUR.map(function(d){
      return '<option value="'+d[0]+'"'+(Number(a.duurMin||60)===d[0]?" selected":"")+'>'+d[1]+'</option>'; }).join("")+'</select></div></div>'+
    '<label>Wie gaat erheen</label><input id="fWie" maxlength="80" value="'+esc(a.wie)+'" list="fNamen" placeholder="Naam of team">'+
    '<datalist id="fNamen">'+Object.keys(namen).sort().map(function(n){ return '<option value="'+esc(n)+'">'; }).join("")+'</datalist>'+
    '</div><div>'+
    '<label>Klant of onderwerp</label><input id="fKlant" maxlength="120" value="'+esc(a.klant)+'" placeholder="Naam van de klant">'+
    '<div class="rij2"><div><label>Telefoon</label><input id="fTel" maxlength="30" value="'+esc(a.telefoon)+'"></div>'+
    '<div><label>Ordernummer (mag leeg)</label><input id="fOrder" maxlength="20" value="'+esc(a.ordernr)+'"></div></div>'+
    '<label>Plaats of adres</label><input id="fPlaats" maxlength="160" value="'+esc(a.plaats)+'">'+
    '<label>Wat (model, klus, bijzonderheden)</label><textarea id="fWat" rows="3" maxlength="400">'+esc(a.wat)+'</textarea>'+
    '</div></div>'+
    (nieuw?"":'<label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:var(--ink);cursor:pointer">'+
      '<input type="checkbox" id="fKlaar" style="width:auto"'+(a.klaar?" checked":"")+'> Gedaan</label>')+
    (nieuw?"":'<div class="gepland-door">Ingepland door '+esc(planNaam(a.door||"?"))+
      (a.gewijzigdDoor&&a.gewijzigdDoor!==a.door?', laatst gewijzigd door '+esc(planNaam(a.gewijzigdDoor)):'')+'</div>')+
    '<div class="melding" id="fMelding"></div>'+
    '<div class="knoppen">'+
      (nieuw?"":'<button type="button" class="weg" id="fWeg">Verwijderen</button>')+
      '<button type="button" class="terug" id="fTerug">Annuleren</button>'+
      '<button type="button" class="doe" id="fDoe">Bewaren</button></div></div>';
  document.body.appendChild(laag);

  var soort = CATS[a.soort] ? a.soort : "intern";
  $("fCats").querySelectorAll("button").forEach(function(b){
    b.addEventListener("click", function(){
      soort = b.dataset.cat;
      $("fCats").querySelectorAll("button").forEach(function(x){ x.style.borderColor=""; x.style.background=""; });
      b.style.borderColor = CATS[soort].kleur; b.style.background = CATS[soort].zacht;
    });
  });
  function dicht(){ laag.remove(); }
  $("fTerug").addEventListener("click", dicht);
  laag.addEventListener("click", function(e){ if(e.target===laag) dicht(); });

  $("fDoe").addEventListener("click", async function(){
    var b = {
      id: a.id, datum: $("fDatum").value, tijd: $("fTijd").value,
      duurMin: Number($("fDuur").value)||60, soort: soort,
      klant: $("fKlant").value.trim(), telefoon: $("fTel").value.trim(),
      plaats: $("fPlaats").value.trim(), ordernr: $("fOrder").value.trim(),
      wat: $("fWat").value.trim(), wie: $("fWie").value.trim(),

      itsId: a.itsId || null,
      route: a.route || null,          // bij welke route van die dag hij hoort

        return lijst;
      });

      dicht(); teken();
    }catch(e){ $("fMelding").textContent = e.message; this.disabled=false; this.textContent="Bewaren"; }
  });

  if (!nieuw) $("fWeg").addEventListener("click", async function(){
    if (!confirm("Afspraak van "+(a.klant||"?")+" op "+a.datum+" verwijderen?")) return;
    this.disabled = true;
    try{
      await bewaar(function(lijst){ return lijst.filter(function(x){ return x.id!==a.id; }); });
      try{ if(window.fpLog) window.fpLog("afspraak-verwijderd", a.soort+" "+a.datum+" "+(a.klant||"")); }catch(e){}
      dicht(); teken();
    }catch(e){ $("fMelding").textContent = e.message; this.disabled=false; }
  });
}

/* ── servicemeldingen uit Logic4 (ITS) ──
   De werkvoorraad van de afdeling: alles op status Inplannen of Opnieuw
   inplannen uit het laatste half jaar. "Inplannen" haalt naam, adres en
   telefoon van de klant erbij en zet de melding als service-afspraak in de
   week. De koppeling blijft bewaard (itsId), zodat een melding die al in de
   planning staat dat ook laat zien. */
var itsMeldingen = null, itsToon = 30;

function itsGepland(id){
  return afspraken.some(function(a){ return Number(a.itsId)===Number(id); });
}
async function itsLaad(){
  try{
    var r = await fetch(W+"/planning/its", { headers:{ "X-Fonteyn-Auth": teamKey() } });
    var j = await r.json();
    if (!j.ok) throw new Error(j.error||"ophalen mislukte");
    itsMeldingen = j.meldingen || [];
  }catch(e){ itsMeldingen = null;
    $("itsLijst").innerHTML = '<div class="its-leeg">Meldingen ophalen lukte niet: '+esc(e.message)+'</div>';
    return;
  }
  itsTeken();
}
function itsTeken(){
  if (!Array.isArray(itsMeldingen)) return;
  var zoek = ($("itsZoek").value||"").toLowerCase();
  var raak = itsMeldingen.filter(function(m){
    if (!zoek) return true;
    return (m.naam+" "+m.plaats+" "+m.groep+" "+m.type+" "+m.omschrijving).toLowerCase().indexOf(zoek)>=0;
  });
  var vandaag = iso(new Date());
  $("itsTitel").textContent = "Servicemeldingen uit Logic4 · "+raak.length+" in te plannen";
  $("itsLijst").innerHTML = (raak.slice(0, itsToon).map(function(m){
    var telaat = m.uiterlijk && m.uiterlijk < vandaag;
    var sub = [m.type, m.groep, "gemeld "+m.gemeld].filter(Boolean).join(" · ")+
      (m.uiterlijk ? ' · <span class="'+(telaat?"telaat":"")+'">uiterlijk '+esc(m.uiterlijk)+'</span>' : "");
    var knop = itsGepland(m.id)
      ? '<span class="alGepland">in de planning ✓</span>'
      : '<button type="button" data-its="'+m.id+'">Inplannen</button>';
    return '<div class="its-rij"><div class="mid">'+
      '<div class="naam">'+esc(m.naam||"(zonder naam)")+' <span class="nr">· melding '+m.id+'</span></div>'+
      '<div class="sub">'+sub+'</div>'+
      (m.omschrijving?'<div class="om">'+esc(m.omschrijving.slice(0,160))+(m.omschrijving.length>160?"…":"")+'</div>':"")+
      '</div>'+knop+'</div>';
  }).join("") || '<div class="its-leeg">Geen meldingen gevonden.</div>')+
  (raak.length>itsToon ? '<button type="button" class="its-meer" id="itsMeer">Toon er meer ('+(raak.length-itsToon)+' te gaan)</button>' : "");

  $("itsLijst").querySelectorAll("button[data-its]").forEach(function(k){
    k.addEventListener("click", function(){ itsInplannen(Number(k.dataset.its), k); });
  });
  var meer = $("itsMeer");
  if (meer) meer.addEventListener("click", function(){ itsToon += 50; itsTeken(); });
}
async function itsInplannen(id, knop){
  var m = itsMeldingen.find(function(x){ return x.id===id; });
  if (!m) return;
  knop.disabled = true; knop.textContent = "Bezig…";
  var klant = null;
  if (m.debiteur){
    try{
      var r = await fetch(W+"/planning/its/klant?debiteur="+m.debiteur, { headers:{ "X-Fonteyn-Auth": teamKey() } });
      var j = await r.json();
      if (j.ok) klant = j.klant;
    }catch(e){}
  }
  knop.disabled = false; knop.textContent = "Inplannen";
  openForm(null, iso(new Date()), "", {
    soort: "service",
    klant: (klant && klant.naam) || m.naam || "",
    telefoon: (klant && klant.telefoon) || "",
    plaats: (klant && klant.adres) || "",
    wat: ("Melding "+m.id+" · "+[m.groep, m.omschrijving.slice(0,140)].filter(Boolean).join(" · ")).slice(0,400),
    itsId: m.id,
  });
}
$("itsKnop").addEventListener("click", function(){
  var aan = $("itsPaneel").classList.toggle("aan");
  if (aan && itsMeldingen === null) itsLaad();
});
$("itsZoek").addEventListener("input", function(){ itsToon = 30; itsTeken(); });

/* ── route van de dag ──
   De adressen van een dag in tijdsvolgorde, als route in Google Maps -
   vertrek en terugkomst bij Fonteyn in Uddel. Heeft een dag zowel
   bezorgwerk als service, dan kies je eerst wiens route je wilt. */
var THUIS = "Fonteyn, Uddel";
function routeStops(dISO, soorten){
  return afspraken.filter(function(a){
    return a.datum===dISO && a.plaats && !a.klaar &&
      (!soorten || soorten.indexOf(a.soort)>=0) && !filterUit[a.soort];
  }).sort(function(a,b){ return String(a.tijd||"99").localeCompare(String(b.tijd||"99")); })
    .map(function(a){ return a.plaats; });
}
function routeOpen(stops){
  if (!stops.length) return;
  var url = "https://www.google.com/maps/dir/" +
    [THUIS].concat(stops).concat([THUIS]).map(encodeURIComponent).join("/");
  try{ if(window.fpLog) window.fpLog("route-berekend", stops.length+" adressen"); }catch(e){}
  window.open(url, "_blank");
}
function routeKies(dISO, bijKnop){
  var lever = routeStops(dISO, ["levering","ophalen"]);
  var serv  = routeStops(dISO, ["service"]);
  var alles = routeStops(dISO, null);
  if (!alles.length) return;
  if (!lever.length || !serv.length){ routeOpen(alles); return; }
  var oud = document.querySelector(".route-menu"); if (oud) oud.remove();
  var menu = document.createElement("div");
  menu.className = "route-menu";
  menu.innerHTML =
    '<button type="button" data-r="lever">🚚 Bezorger ('+lever.length+' adressen)</button>'+
    '<button type="button" data-r="serv">🔧 Monteur ('+serv.length+' adressen)</button>'+
    '<button type="button" data-r="alles">Alles in één route ('+alles.length+')</button>';
  document.body.appendChild(menu);
  var r = bijKnop.getBoundingClientRect();
  menu.style.left = Math.min(window.innerWidth-190, r.left) + "px";
  menu.style.top = (r.bottom + window.scrollY + 4) + "px";
  menu.querySelectorAll("button").forEach(function(k){
    k.addEventListener("click", function(){
      menu.remove();
      routeOpen(k.dataset.r==="lever" ? lever : k.dataset.r==="serv" ? serv : alles);
    });
  });
  setTimeout(function(){ document.addEventListener("click", function weg(e){
    if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener("click", weg); }
  }); }, 0);
}

$("wie").textContent = ik;

function scrollNaarWerkdag(){
  // Bij openen rond 08:00 in beeld beginnen, niet om 06:00.
  var s = $("agendaScroll");
  if (s) s.scrollTop = Math.max(0, (8-UUR_VAN)*UUR_PX - 10);
}

/* ── start ── */
(async function(){
  tekenLegenda();
  var eerste = await lees();
  if (eerste === null){
    $("rooster").innerHTML = '<div style="grid-column:1/-1;padding:30px;color:var(--grijs)">De opslag is even niet bereikbaar. Herlaad de pagina om het opnieuw te proberen.</div>';
    return;
  }
  afspraken = eerste;
  teken();
  scrollNaarWerkdag();
  liveStart();
  // De nu-lijn elke minuut opnieuw; goedkoop, want teken() is puur lokaal.
  setInterval(function(){ teken(); }, 60000);
  /* Vangnet voor als de live-verbinding wegvalt (slaapstand, wifi). Elke
     halve minuut opnieuw ophalen kost bijna niets en houdt de agenda ook
     zonder verbinding actueel. */
  setInterval(function(){ if (!liveKlaar) ververs(); }, 30000);
  // Terug van een ander scherm of uit de slaapstand: meteen bijwerken.
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) ververs(); });
})();
</script>

<script>
/* Activiteitenlogboek — helper fpLog(actie,detail) + tegel-open melden */
(function(){
  var W="https://fonteyn-data-store.g-mulder.workers.dev/log";
  function apparaat(){
    var ua=navigator.userAgent||"";
    var app=ua.match(/fonteyn-dashboard\/([\d.]+)/i);
    var elc=ua.match(/Electron\/([\d.]+)/i);
    var versie=app?("app "+app[1]):(elc?("app · Electron "+elc[1]):"browser");
    var pm=ua.match(/(Windows NT [\d.]+|Mac OS X [\d_]+|Linux|Android|iPhone)/);
    var id=null;
    try{
      id=localStorage.getItem("fp.apparaat");
      if(!id){ id="PC-"+Math.random().toString(36).slice(2,8).toUpperCase(); localStorage.setItem("fp.apparaat",id); }
    }catch(e){}
    return {computer:id, platform:pm?pm[1].replace(/_/g,"."):null, versie:versie};
  }
  window.fpLog=function(action,detail){try{
    var email=(localStorage.getItem("fp.email")||"").toLowerCase();
    var key=localStorage.getItem("fp.teamkey")||"";
    if(!email||!key) return;
    var app=apparaat();
    fetch(W,{method:"POST",headers:{"Content-Type":"application/json","X-Fonteyn-Auth":key},body:JSON.stringify({user:email,tile:"planning",action:action||"open",detail:(detail||"").slice(0,1200),computer:app.computer,platform:app.platform,versie:app.versie})}).catch(function(){});
  }catch(e){}};
  window.fpLog(window.fpGeenToegang?"open-geweigerd":"open");
})();
</script>
