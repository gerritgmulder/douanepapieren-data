function stopHtml(a){
  var c = cat(a);
  var regel = [a.plaats, a.wat, a.ordernr].filter(Boolean).join(" - ");
  return '<div class="stop'+(a.klaar?" klaar":"")+(a.letop?" letop":"")+'"'+(MAG_BEWERKEN?' draggable="true"':'')+' data-id="'+esc(a.id)+'"'+
    ' style="border-left-color:'+c.kleur+'" title="'+esc((a.tijd?a.tijd+"  ":"")+(a.klant||"")+(regel?"  -  "+regel:""))+'">'+
    betaalStip(a)+'<span class="kl">'+(a.tijd?esc(a.tijd)+" ":"")+esc(a.klant||c.naam)+'</span>'+
    (regel?'<span class="rg">'+esc(regel)+'</span>':"")+
    (a.wie?'<span class="rg">\ud83d\udc64 '+esc(a.wie)+'</span>':"")+'</div>';
}

/* ── Print route ─────────────────────────────────────────────────────
   Voorblad plus de orderbevestigingen van de stops, in bezoekvolgorde. De
   opmaak zit in route-print.js; hier wordt alleen verzameld wat erin moet.

   Alleen stops met een ordernummer krijgen een bevestiging. Een servicemelding
   zonder order staat wel op het voorblad maar heeft er geen - die bestaat
   domweg niet. */
async function printRoute(dISO, nr){
  var eerste = (routesVan(dISO)[0]||{}).nr === nr;
  var stops = stopsVan(dISO, nr, eerste);
  if (!stops.length){ alert("Deze route heeft nog geen stops."); return; }
  var route = routesVan(dISO).find(function(r){ return r.nr===nr; }) || {};
  var nrs = stops.map(function(a){ return String(a.ordernr||"").trim(); })
                 .filter(function(x){ return /^\d{3,12}$/.test(x); });
  var orders = [];
  if (nrs.length){
    try{
      var r = await fetch(W+"/planning/route-print?orders="+encodeURIComponent(nrs.join(",")),
        { headers: { "X-Fonteyn-Auth": teamKey() } });
      var j = await r.json().catch(function(){ return null; });
      if (!r.ok || !j || !j.ok) throw new Error((j&&j.error)||("HTTP "+r.status));
      /* De volgorde van de route aanhouden, niet die van het antwoord: op het
         papier moet de eerste stop vooraan liggen. */
      orders = nrs.map(function(n){
        return (j.orders||[]).find(function(o){ return String(o.nr)===String(n); }) ||
               { nr:n, ok:false, error:"kwam niet terug uit Logic4" };
      });
    }catch(e){
      if(!confirm("De orders konden niet uit Logic4 worden opgehaald ("+e.message+").\n\nAlleen het voorblad printen?")) return;
    }
  }
  window.fpRoutePrint.print({
    datum: dISO, routeNr: nr, wie: rijdersVan(route).join(" & "),
    stops: stops.map(function(a){ return { tijd:a.tijd||"", klant:a.klant||"", plaats:a.plaats||"" }; }),
    orders: orders,
    logo: new URL("fonteyn-logo.png", location.href).href,
  });
  try{ if(window.fpLog) window.fpLog("route-geprint", "route "+nr+" van "+dISO+", "+stops.length+" stop(s)"); }catch(e){}
}

function koppelBord(){
  /* Kijken mag altijd: een stop aanklikken opent het formulier, dat zichzelf
     alleen-lezen maakt. Al het andere (slepen, plusknoppen, namen wijzigen)
     hangen we alleen aan als deze persoon mag bewerken. */
  // de printknop in de kop van een route
  $("bord").querySelectorAll(".routePrint").forEach(function(k){
    k.addEventListener("click", function(e){
      e.stopPropagation();
      printRoute(k.dataset.datum, Number(k.dataset.nr));
    });
  });
  // stop aanklikken = het formulier; slepen = naar een andere route of dag
  $("bord").querySelectorAll(".stop").forEach(function(el){
    el.addEventListener("click", function(){ if(!el.dataset.gesleept) openForm(el.dataset.id); delete el.dataset.gesleept; });
    el.addEventListener("dragstart", function(e){
      e.dataTransfer.setData("text/plain", el.dataset.id);
      e.dataTransfer.effectAllowed = "move";
      el.classList.add("sleept");
    });
    el.addEventListener("dragend", function(){
      el.classList.remove("sleept");
      /* Ook opruimen als er niet is losgelaten (Escape, of naast het bord).
         Anders blijft de streep staan waar je hem net overheen sleepte. */
      $("bord").querySelectorAll(".stop").forEach(function(x){ x.style.borderTop = ""; });
      $("bord").querySelectorAll(".route").forEach(function(x){ x.classList.remove("sleepdoel"); });
    });
  });
  /* Waar de stop terechtkomt hangt af van waar je loslaat: boven een andere
     stop komt hij ervóór, op de lege ruimte van de route komt hij achteraan.
     Zo kun je ook de volgorde bínnen een route veranderen, en dat is precies
     wat een route is - de volgorde waarin je rijdt. */
  // De hele-dag-balkjes openen gewoon het formulier.
  $("bord").querySelectorAll(".dagbalk").forEach(function(el){
    el.addEventListener("click", function(){ openForm(el.dataset.id); });
  });
  if (!MAG_BEWERKEN) return;

  var doelStop = null;
  $("bord").querySelectorAll(".stop").forEach(function(el){
    el.addEventListener("dragover", function(e){ e.preventDefault(); e.stopPropagation();
      doelStop = el.dataset.id;
      el.closest(".route").classList.add("sleepdoel");
      el.style.borderTop = "2px solid var(--lime)";
    });
    el.addEventListener("dragleave", function(){ el.style.borderTop = ""; });
  });
  $("bord").querySelectorAll(".route").forEach(function(r){
    r.addEventListener("dragover", function(e){ e.preventDefault(); r.classList.add("sleepdoel"); });
    r.addEventListener("dragleave", function(e){
      if (r.contains(e.relatedTarget)) return;
      r.classList.remove("sleepdoel"); doelStop = null;
    });
    r.addEventListener("drop", async function(e){
      e.preventDefault();
      r.classList.remove("sleepdoel");
      $("bord").querySelectorAll(".stop").forEach(function(x){ x.style.borderTop = ""; });
      var id = e.dataTransfer.getData("text/plain");
      var voor = doelStop; doelStop = null;
      var a = afspraken.find(function(x){ return x.id===id; });
      if (!a || voor === id) return;
      var nieuweDatum = r.dataset.datum, nieuwNr = Number(r.dataset.nr);
      var el = $("bord").querySelector('.stop[data-id="'+CSS.escape(id)+'"]');
      if (el) el.dataset.gesleept = "1";
      /* De hele route opnieuw nummeren, met de gesleepte stop op zijn nieuwe
         plek. Alleen het verplaatste record aanpassen zou niet werken: de rest
         staat nog op tijd en dan springt hij meteen terug. */
      var eerste = routesVan(nieuweDatum)[0].nr === nieuwNr;
      var rij = stopsVan(nieuweDatum, nieuwNr, eerste).filter(function(x){ return x.id !== id; });
      var plek = voor ? rij.findIndex(function(x){ return x.id === voor; }) : -1;
      if (plek < 0) rij.push(a); else rij.splice(plek, 0, a);
      var volgorde = {};
      rij.forEach(function(x, i){ volgorde[x.id] = i + 1; });
      try{
        await bewaar(function(lijst){
          return lijst.map(function(x){
            if (x.id === id) return Object.assign({}, x, { datum:nieuweDatum, route:nieuwNr,
              volg: volgorde[x.id], gewijzigdDoor:ik, gewijzigd:new Date().toISOString() });
            if (volgorde[x.id] != null) return Object.assign({}, x, { volg: volgorde[x.id] });
            return x;
          });
        });
        try{ if(window.fpLog) window.fpLog("stop-verplaatst",(a.klant||"")+" -> "+nieuweDatum+" route "+nieuwNr+
          " (plek "+volgorde[id]+")"); }catch(e){}
        teken();
      }catch(err){ alert(err.message); }
    });
  });
  // + stop, + route, route weghalen, naam van de rijder, dagnotitie
  $("bord").querySelectorAll(".plusstop").forEach(function(b){
    b.addEventListener("click", function(){
      openForm(null, b.dataset.datum, "", { route: Number(b.dataset.nr) });
    });
  });
  $("bord").querySelectorAll(".plusroute").forEach(function(b){
    b.addEventListener("click", function(){ voegRouteToe(b.dataset.datum); });
  });
  $("bord").querySelectorAll(".routeWeg").forEach(function(b){
    b.addEventListener("click", function(e){ e.stopPropagation(); haalRouteWeg(b.dataset.datum, Number(b.dataset.nr)); });
  });
  $("bord").querySelectorAll(".route .wie").forEach(function(el){
    el.addEventListener("click", function(){ bewerkRijder(el); });
  });
  /* Een plek erbij of eraf. Bij weghalen schuift een naam op de derde plek
     naar de tweede, zodat er niemand kwijtraakt. */
  $("bord").querySelectorAll(".plekErbij,.plekWeg").forEach(function(b){
    b.addEventListener("click", async function(e){
      e.stopPropagation();
      var dISO = b.dataset.datum, nr = Number(b.dataset.nr), erbij = b.classList.contains("plekErbij"), plek = Number(b.dataset.plek)||2;
      try{
        await bewaarBord(function(d){
          var lijst = Array.isArray(d.routes[dISO]) && d.routes[dISO].length ? d.routes[dISO] : routesVan(dISO).map(function(x){ return Object.assign({}, x); });
          var r = lijst.find(function(x){ return Number(x.nr)===nr; });
          if (!r){ r = { nr:nr, wie:"" }; lijst.push(r); }
          var n = plekkenVan(r);
          if (erbij) r.plekken = Math.min(3, n + 1);
          else {
            if (plek === 2){ r.wie2 = r.wie3 || ""; r.wie3 = ""; }
            else r.wie3 = "";
            r.plekken = Math.max(1, n - 1);
          }
          d.routes[dISO] = lijst;
        });
      }catch(err){ alert(err.message); }
      teken();
    });
  });
  $("bord").querySelectorAll(".dagnotitie").forEach(function(el){
    el.addEventListener("click", function(){ bewerkDagnotitie(el); });
  });
}

/* Routes en dagnotities bewaren. Ze zitten in dezelfde bucket als de
   afspraken, dus lezen-wijzigen-terugschrijven op de VERSE lijst - anders
   gooit dit scherm weg wat een collega net heeft gedaan. */
async function bewaarBord(wijzig){
  if (!MAG_BEWERKEN) throw new Error("Je kijkt mee met de planning; wijzigen doet de afdeling zelf.");
  var r = await fetch(W+"/data/"+BUCKET, { headers:{ "X-Fonteyn-Auth": teamKey() } });
  if (!r.ok) throw new Error("De opslag is niet bereikbaar. Probeer het zo nog eens.");
  var j = await r.json();
  var data = { afspraken: Array.isArray(j.afspraken)?j.afspraken:[],
               routes: (j.routes && typeof j.routes==="object") ? j.routes : {},
               notities: (j.notities && typeof j.notities==="object") ? j.notities : {} };
  wijzig(data);
  var put = await fetch(W+"/data/"+BUCKET, { method:"PUT",
    headers:{ "Content-Type":"application/json", "X-Fonteyn-Auth": teamKey() },
    body: JSON.stringify(data) });
  if (!put.ok) throw new Error("Bewaren mislukte (HTTP "+put.status+").");
  afspraken = data.afspraken; routesPerDag = data.routes; dagNotities = data.notities;
  liveStuur({ soort:"gewijzigd", wat:"planning" });
}
async function voegRouteToe(dISO){
  try{
    await bewaarBord(function(d){
      var lijst = Array.isArray(d.routes[dISO]) && d.routes[dISO].length ? d.routes[dISO] : [{nr:1,wie:""}];
      var nr = Math.max.apply(null, lijst.map(function(x){ return Number(x.nr)||0; })) + 1;
      lijst.push({ nr:nr, wie:"" });
      d.routes[dISO] = lijst;
    });
    try{ if(window.fpLog) window.fpLog("route-toegevoegd", dISO); }catch(e){}
    teken();
  }catch(e){ alert(e.message); }
}
async function haalRouteWeg(dISO, nr){
  var stops = stopsVan(dISO, nr, routesVan(dISO)[0].nr===nr);
  if (stops.length && !confirm("Route "+nr+" heeft "+stops.length+" stop(s). Die komen in de eerste route te staan. Doorgaan?")) return;
  try{
    await bewaarBord(function(d){
      var lijst = (d.routes[dISO]||[]).filter(function(x){ return Number(x.nr)!==nr; });
      d.routes[dISO] = lijst.length ? lijst : [{nr:1,wie:""}];
      var eerste = Number(d.routes[dISO][0].nr)||1;
      d.afspraken.forEach(function(a){ if (a.datum===dISO && Number(a.route)===nr) a.route = eerste; });
    });
    try{ if(window.fpLog) window.fpLog("route-verwijderd", dISO+" route "+nr); }catch(e){}
    teken();
  }catch(e){ alert(e.message); }
}
/* De naam van wie de route rijdt. Vaak twee namen ("BART EN JOEY"), dus een
   vrij tekstveld en geen keuzelijst. */
function bewerkRijder(el){
  if (el.dataset.bezig) return;
  el.dataset.bezig = "1";
  var dISO = el.dataset.datum, nr = Number(el.dataset.nr), plek = Number(el.dataset.plek)||1;
  var veld = plek === 1 ? "wie" : "wie"+plek;
  var oud = ((routesVan(dISO).find(function(x){ return Number(x.nr)===nr; })||{})[veld])||"";
  el.innerHTML = "";
  /* Een keuzelijst met de afdeling erin, en een invulveld eronder voor wie er
     niet in staat. De keuzelijst is een <select> met een lege eerste regel
     ("niemand"), zodat je een route ook weer kunt leegmaken. */
  var namen = collegas();
  var kies = document.createElement("select");
  kies.className = "naamkies";
  kies.style.width = "100%";
  var opties = [""].concat(namen);
  if (oud && opties.indexOf(oud) < 0) opties.push(oud);      // een eigen naam blijft staan
  opties.push("\u2026 andere naam");
  opties.forEach(function(n){
    var o = document.createElement("option");
    o.value = n; o.textContent = n === "" ? "wie rijdt?" : n;
    if (n === oud) o.selected = true;
    kies.appendChild(o);
  });
  el.appendChild(kies);
  var vak = document.createElement("input");
  vak.className = "naamvak"; vak.value = oud; vak.maxLength = 60;
  vak.style.cssText = "width:100%;margin-top:3px;display:none";
  el.appendChild(vak);
  kies.focus();
  kies.addEventListener("change", function(){
    if (kies.value === "\u2026 andere naam") {
      vak.style.display = ""; vak.value = ""; vak.focus();
    } else { klaar(true); }
  });
  var af = false;
  async function klaar(bewaren){
    if (af) return; af = true;
    var nieuw = (vak.style.display === "none")
      ? (kies.value === "\u2026 andere naam" ? "" : kies.value.trim())
      : vak.value.trim();
    el.removeAttribute("data-bezig");
    if (!bewaren || nieuw === oud) { teken(); return; }
    try{
      await bewaarBord(function(d){
        var lijst = Array.isArray(d.routes[dISO]) && d.routes[dISO].length ? d.routes[dISO] : [{nr:1,wie:""}];
        var r = lijst.find(function(x){ return Number(x.nr)===nr; });
        if (r) r[veld] = nieuw; else { var nr2 = { nr:nr, wie:"" }; nr2[veld] = nieuw; lijst.push(nr2); }
        d.routes[dISO] = lijst;
      });
      try{ if(window.fpLog) window.fpLog("route-rijder-gezet", dISO+" route "+nr+" plek "+plek+": "+nieuw); }catch(e){}
    }catch(err){ alert(err.message); }
    teken();
  }
  vak.addEventListener("keydown", function(e){
    if (e.key==="Enter"){ e.preventDefault(); klaar(true); }
    if (e.key==="Escape"){ e.preventDefault(); klaar(false); }
  });
  vak.addEventListener("blur", function(){ klaar(true); });
}
/* De regels onderaan de dag: "MAX 2 ROUTES", "route 1 alleen". */
function bewerkDagnotitie(el){
  if (el.dataset.bezig) return;
  el.dataset.bezig = "1";
  var dISO = el.dataset.datum, oud = dagNotities[dISO] || "";
  el.innerHTML = "";
  var vak = document.createElement("input");
  vak.className = "naamvak"; vak.value = oud; vak.maxLength = 160; vak.style.width = "100%";
  vak.placeholder = "bijv. MAX 2 ROUTES - route 1 alleen";
  el.appendChild(vak); vak.focus(); vak.select();
  var af = false;
  async function klaar(bewaren){
    if (af) return; af = true;
    var nieuw = vak.value.trim();
    el.removeAttribute("data-bezig");
    if (!bewaren || nieuw === oud) { teken(); return; }
    try{
      await bewaarBord(function(d){ if (nieuw) d.notities[dISO] = nieuw; else delete d.notities[dISO]; });
      try{ if(window.fpLog) window.fpLog("dagnotitie-gezet", dISO+": "+nieuw); }catch(e){}
    }catch(err){ alert(err.message); }
    teken();
  }
  vak.addEventListener("keydown", function(e){
    if (e.key==="Enter"){ e.preventDefault(); klaar(true); }
    if (e.key==="Escape"){ e.preventDefault(); klaar(false); }
  });
  vak.addEventListener("blur", function(){ klaar(true); });
}

/* ── slepen, vergroten en direct bewerken ────────────────────────────
   Gerrit (7 sep 2026): "Agendapunten moeten ook versleepbaar zijn (groter te
   maken, verslepen van dag, etc.). Het moet ook zeer makkelijk aanpasbaar
   zijn (even aanklikken en direct de tekst kunnen aanpassen)."

   Drie dingen op hetzelfde blok, dus ze moeten elkaar niet in de weg zitten:
     - slepen aan het blok         -> andere dag en/of ander tijdstip
     - slepen aan de onderrand     -> langer of korter
     - klikken op de naam          -> naam direct aanpassen
     - klikken op de rest          -> het hele formulier

   Onderscheid tussen klikken en slepen: pas ná vier pixels beweging is het
   slepen. Anders zou elke trillende muisklik de afspraak verzetten.

   Alles gaat in stapjes van een kwartier; dat is fijn genoeg om precies te
   plannen en grof genoeg om niet op 09:07 uit te komen. */
var SNAP = 15;                       // minuten
function koppelBlok(el){
  if (!MAG_BEWERKEN){
    el.style.cursor = "pointer";
    el.addEventListener("click", function(){ openForm(el.dataset.id); });
    return;
  }
  el.addEventListener("mousedown", startSleep);
  var naam = el.querySelector('[data-bewerk="klant"]');
  if (naam) naam.addEventListener("click", function(e){
    if (el.dataset.gesleept) return;
    e.stopPropagation();
    bewerkNaam(el, naam);
  });
  el.addEventListener("click", function(e){
    if (el.dataset.gesleept) { delete el.dataset.gesleept; return; }
    if (e.target.closest('[data-bewerk="klant"]') || e.target.classList.contains("greep")) return;
    e.stopPropagation();
    openForm(el.dataset.id);
  });
}
function startSleep(e){
  if (e.button !== 0) return;
  var el = e.currentTarget;
  var a = afspraken.find(function(x){ return x.id===el.dataset.id; });
  if (!a) return;
  if (a.herhaal) return;         // een reeks versleep je niet
  var rekken = e.target.classList.contains("greep");
  e.preventDefault(); e.stopPropagation();

  var startX = e.clientX, startY = e.clientY;
  var beginTop = parseFloat(el.style.top) || 0;
  var beginHoog = parseFloat(el.style.height) || UUR_PX;
  var beginVan = minuten(a.tijd) || UUR_VAN*60;
  var beginDuur = Number(a.duurMin) || 60;
  /* De stroken zijn de routes van elke dag; slepen naar een andere strook
     zet de afspraak in die route. */
  var kolommen = [].slice.call(document.querySelectorAll(".routekol")).map(function(c){
    var r = c.getBoundingClientRect();
    return { datum: c.dataset.datum, nr: Number(c.dataset.nr)||1, links: r.left, rechts: r.right, cel: c };
  });
  var beginRoute = Number(a.route)||0;
  var bezig = false, nieuweDatum = a.datum, nieuweRoute = beginRoute, nieuwVan = beginVan, nieuweDuur = beginDuur;

  function beweeg(ev){
    var dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (!bezig && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
    if (!bezig){ bezig = true; el.classList.add("sleept"); document.body.classList.add("bezig-slepen"); }

    if (rekken){
      var hoog = Math.max(UUR_PX/2, beginHoog + dy);
      nieuweDuur = Math.max(SNAP, Math.round(hoog/UUR_PX*60/SNAP)*SNAP);
      if (beginVan + nieuweDuur > UUR_TOT*60) nieuweDuur = UUR_TOT*60 - beginVan;
      el.style.height = Math.max(24, nieuweDuur/60*UUR_PX - 2)+"px";
      toonTip(ev, a.tijd+" - "+tijdStr(beginVan+nieuweDuur)+"  ("+duurTekst(nieuweDuur)+")");
      return;
    }
    // verplaatsen: eerst de dag onder de muis, dan het tijdstip
    var kol = kolommen.find(function(k){ return ev.clientX >= k.links && ev.clientX <= k.rechts; });
    if (kol && (kol.datum !== nieuweDatum || kol.nr !== nieuweRoute)){
      nieuweDatum = kol.datum; nieuweRoute = kol.nr;
      kol.cel.appendChild(el);                 // in de strook van die dag en route hangen
      el.style.left = "2px"; el.style.width = "calc(100% - 5px)"; el.style.zIndex = 40;
    }
    var top = beginTop + dy;
    nieuwVan = Math.round((top/UUR_PX*60 + UUR_VAN*60)/SNAP)*SNAP;
    nieuwVan = Math.max(UUR_VAN*60, Math.min(UUR_TOT*60 - nieuweDuur, nieuwVan));
    el.style.top = ((nieuwVan - UUR_VAN*60)/60*UUR_PX)+"px";
    toonTip(ev, dagNaam(nieuweDatum)+"  "+tijdStr(nieuwVan)+" - "+tijdStr(nieuwVan+nieuweDuur)+"  ·  route "+nieuweRoute);
  }
  async function los(ev){
    document.removeEventListener("mousemove", beweeg);
    document.removeEventListener("mouseup", los);
    verbergTip();
    el.classList.remove("sleept"); document.body.classList.remove("bezig-slepen");
    if (!bezig) return;                        // het was toch een klik
    el.dataset.gesleept = "1";                 // de klik hierna niet als klik tellen
    var b = rekken
      ? { duurMin: nieuweDuur }
      : { datum: nieuweDatum, tijd: tijdStr(nieuwVan), route: nieuweRoute || null };
    if ((b.datum===a.datum || b.datum===undefined) && (b.tijd===a.tijd || b.tijd===undefined)
        && (b.duurMin===a.duurMin || b.duurMin===undefined)
        && (b.route===undefined || (Number(b.route)||0)===beginRoute)) { teken(); return; }
    try{
      await bewaar(function(lijst){
        var i = lijst.findIndex(function(x){ return x.id===a.id; });
        if (i>=0) lijst[i] = Object.assign({}, lijst[i], b,
          { gewijzigdDoor: ik, gewijzigd: new Date().toISOString() });
        return lijst;
      });
      try{ if(window.fpLog) window.fpLog(rekken?"afspraak-duur-gewijzigd":"afspraak-verplaatst",
        (a.klant||"")+" -> "+(b.datum||a.datum)+" "+(b.tijd||a.tijd)+" "+duurTekst(b.duurMin||a.duurMin)); }catch(e){}
      teken();
    }catch(err){ alert(err.message); teken(); }
  }
  document.addEventListener("mousemove", beweeg);
  document.addEventListener("mouseup", los);
}
function duurTekst(m){
  m = Number(m)||0;
  if (m < 60) return m+" min";
  var u = Math.floor(m/60), r = m%60;
  return u+(r?","+String(Math.round(r/60*10)):"")+" uur";
}
/* De naam van de weekdag hoort uit de DATUM te komen, niet uit de plek in de
   lijst. Bij een werkweek klopte dat toevallig, maar bij een maandweergave
   loopt de teller door tot 30 en bestaat DAGEN[i] niet meer. */
function dagIndex(d){ return (d.getDay()+6)%7; }
function dagNaam(dISO){
  var d = new Date(dISO+"T12:00:00");
  return DAGEN[(d.getDay()+6)%7]+" "+d.getDate()+" "+MAANDEN[d.getMonth()];
}
/* Klein vlaggetje bij de muis, zodat je tijdens het slepen ziet waar je
   uitkomt zonder naar het blok te hoeven turen. */
function toonTip(ev, tekst){
  var t = $("sleepTip");
  if (!t){ t = document.createElement("div"); t.id = "sleepTip"; t.className = "sleeptip"; document.body.appendChild(t); }
  t.textContent = tekst;
  t.style.left = (ev.clientX+14)+"px";
  t.style.top = (ev.clientY+14)+"px";
  t.style.display = "block";
}
function verbergTip(){ var t = $("sleepTip"); if (t) t.style.display = "none"; }

/* De naam direct aanpassen. Enter of wegklikken bewaart, Escape laat het
   zoals het was. Alleen de naam: voor de rest is er het formulier, en een
   heel blok bewerkbaar maken leest onrustig. */
function bewerkNaam(el, naam){
  if (naam.dataset.bezig) return;
  var a = afspraken.find(function(x){ return x.id===el.dataset.id; });
  if (!a) return;
  naam.dataset.bezig = "1";
  var oud = a.klant || "";
  naam.innerHTML = "";
  var vak = document.createElement("input");
  vak.className = "naamvak";
  vak.value = oud;
  vak.maxLength = 120;
  naam.appendChild(vak);
  vak.focus(); vak.select();
  var af = false;
  async function klaar(bewaren){
    if (af) return; af = true;
    var nieuw = vak.value.trim();
    naam.removeAttribute("data-bezig");
    if (!bewaren || nieuw === oud || !nieuw) { teken(); return; }
    try{
      await bewaar(function(lijst){
        var i = lijst.findIndex(function(x){ return x.id===a.id; });
        if (i>=0) lijst[i] = Object.assign({}, lijst[i],
          { klant: nieuw, gewijzigdDoor: ik, gewijzigd: new Date().toISOString() });
        return lijst;
      });
      try{ if(window.fpLog) window.fpLog("afspraak-naam-gewijzigd", oud+" -> "+nieuw); }catch(e){}
    }catch(err){ alert(err.message); }
    teken();
  }
  vak.addEventListener("keydown", function(e){
    if (e.key==="Enter"){ e.preventDefault(); klaar(true); }
    if (e.key==="Escape"){ e.preventDefault(); klaar(false); }
  });
  vak.addEventListener("blur", function(){ klaar(true); });
  vak.addEventListener("mousedown", function(e){ e.stopPropagation(); });
  vak.addEventListener("click", function(e){ e.stopPropagation(); });
}

/* Zoeken in het raster: welke afspraak is raak op wat er in de zoekbalk
   staat. Ordernummer en ITS-nummer op de cijfers, de klantnaam op tekst. */
var rasterZoekTekst = "";
function zoekRaak(a){
  var q = rasterZoekTekst;
  if (!q) return false;
  var cijfers = q.replace(/\D/g,"");
  if (cijfers.length >= 3 && (String(a.ordernr||"").indexOf(cijfers) >= 0 || String(a.itsId||"").indexOf(cijfers) >= 0)) return true;
  return String(a.klant||"").toLowerCase().indexOf(q.toLowerCase()) >= 0;
}
function zoekKlas(a){
  if (!rasterZoekTekst) return "";
  return zoekRaak(a) ? " zoek-raak" : " zoek-dim";
}
function rasterZoekBijwerken(){
  var uit = $("rasterZoekUit"); if (!uit) return;
  if (!rasterZoekTekst){ uit.innerHTML = ""; return; }
  var week = weekLijst();
  var inBeeld = 0;
  week.forEach(function(w){ w.items.forEach(function(a){ if (zoekRaak(a)) inBeeld++; }); });
  var alle = afspraken.filter(zoekRaak).sort(function(x,y){ return String(x.datum).localeCompare(String(y.datum)); });
  if (inBeeld){ uit.innerHTML = inBeeld + " in beeld"; return; }
  if (!alle.length){ uit.innerHTML = "niets gevonden"; return; }
  var vandaag = iso(new Date());
  var doel = alle.find(function(a){ return a.datum >= vandaag; }) || alle[alle.length-1];
  uit.innerHTML = 'niet in deze periode · <button type="button" id="rasterZoekSpring">ga naar '+esc(dagNaam(doel.datum))+' '+esc(doel.datum.slice(8,10))+'-'+esc(doel.datum.slice(5,7))+'</button>';
  $("rasterZoekSpring").addEventListener("click", function(){
    maandag = weekStart(new Date(doel.datum+"T12:00:00"));
    if (periode === "dag") maandag = new Date(doel.datum+"T12:00:00");
    teken();
  });
}
/* De balken boven het raster: elke hele-dag-afspraak één balk over al zijn
   dagen. Overlappen twee balken in de tijd, dan komt de tweede op een regel
   eronder. Loopt een balk buiten de periode die je ziet, dan is de hoek aan
   die kant recht: dan zie je dat hij verder gaat. */
function tekenBanden(week){
  var band = $("dagbanden"); if (!band) return;
  var eerste = week[0].iso, laatste = week[week.length-1].iso;
  var gezien = {}, items = [];
  week.forEach(function(w){ w.items.forEach(function(a){
    if (minuten(a.tijd)!==null || gezien[a.id]) return;
    gezien[a.id] = 1; items.push(a);
  }); });
  var idx = {}; week.forEach(function(w,i){ idx[w.iso] = i; });
  var balken = items.map(function(a){
    /* Bij een herhaalde afspraak telt de voorkomen van deze week, niet de
       eerste keer. */
    var vk = null;
    for (var wi = 0; wi < week.length && !vk; wi++) vk = voorkomen(a, week[wi].iso);
    var van = vk ? vk.van : a.datum, tot = vk ? vk.tot : (a.datumTot && a.datumTot > a.datum ? a.datumTot : a.datum);
    var i0 = van < eerste ? 0 : idx[van], i1 = tot > laatste ? week.length-1 : idx[tot];
    return { a:a, i0:i0, i1:i1, links: van < eerste, rechts: tot > laatste };
  }).sort(function(x,y){ return x.i0-y.i0 || (y.i1-y.i0)-(x.i1-x.i0); });
  var regels = [];   // per regel de laatste bezette kolom
  balken.forEach(function(b){
    var r = 0; while (regels[r] != null && regels[r] >= b.i0) r++;
    regels[r] = b.i1; b.regel = r;
  });
  var laatsteRegel = balken.reduce(function(m,b){ return Math.max(m, b.regel+1); }, 0);
  band.innerHTML = '<div class="lbl" style="grid-row:1">hele dag</div>' +
    (MAG_BEWERKEN ? week.map(function(w,i){
      return '<div class="dagband-cel" data-datum="'+w.iso+'" data-idx="'+i+'" style="grid-column:'+(i+2)+';grid-row:'+(laatsteRegel+1)+'" title="Klik, of sleep over meerdere dagen, voor een afspraak van een hele dag"></div>';
    }).join("") : "") + balken.map(function(b){
    var a = b.a, c = cat(a);
    var meer = a.datumTot && a.datumTot > a.datum;
    return '<div class="dagband'+(a.klaar?" klaar":"")+zoekKlas(a)+(b.links?" door-links":"")+(b.rechts?" door-rechts":"")+'" data-id="'+esc(a.id)+'"'+
      ' style="grid-column:'+(b.i0+2)+' / '+(b.i1+3)+';grid-row:'+(b.regel+1)+';background:'+c.zacht+';border-left-color:'+c.kleur+'"'+
      ' title="'+esc(a.klant||c.naam)+(meer?' · '+esc(a.datum.split("-").reverse().join("-"))+' t/m '+esc(a.datumTot.split("-").reverse().join("-")):' · '+esc(a.datum.split("-").reverse().join("-")))+'">'+
      betaalStip(a)+(a.herhaal?'\u21bb ':'')+esc(a.klant||c.naam)+(a.wie?' <span class="wie">· '+esc(a.wie)+'</span>':'')+
      (MAG_BEWERKEN && !a.herhaal?'<div class="greep-r" title="Sleep om de laatste dag te verplaatsen"></div>':'')+'</div>';
  }).join("");
  if (MAG_BEWERKEN) koppelBanden(week);
}

/* Slepen in de band van hele dagen. Gerrit (11 sep 2026): "dat je iets kunt
   aanklikken om een hele-dag-afspraak te maken maar dat die ook uitsleepbaar
   is direct". Drie bewegingen:
     - over de lege cellen slepen: kiest een reeks dagen, en bij het loslaten
       opent het venster met die eerste en laatste dag al ingevuld;
     - een balk aan de rechterkant pakken: verlengt of verkort hem;
     - een balk in het midden pakken: verschuift hem, even lang.
   Alles werkt in hele dagen; welke dag onder de muis zit volgt uit de cellen
   onderaan de band, die precies de kolommen van het raster hebben. */
function dagPlus(isoDag, n){
  var d = new Date(isoDag+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d);
}
function dagenTussen(a, b){
  return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 86400000);
}
function koppelBanden(week){
  var band = $("dagbanden");
  var cellen = [].slice.call(band.querySelectorAll(".dagband-cel"));
  function dagOnder(x){
    var beste = null;
    cellen.forEach(function(c){ var r = c.getBoundingClientRect(); if (x >= r.left && x <= r.right) beste = c; });
    if (beste) return Number(beste.dataset.idx);
    // Buiten de cellen: de dichtstbijzijnde kant.
    var eerste = cellen[0].getBoundingClientRect(), laatste = cellen[cellen.length-1].getBoundingClientRect();
    return x < eerste.left ? 0 : (x > laatste.right ? cellen.length-1 : null);
  }
  // 1. Slepen over lege cellen = nieuwe afspraak over die dagen.
  cellen.forEach(function(cel){
    cel.addEventListener("mousedown", function(e){
      if (e.button !== 0) return;
      e.preventDefault();
      var i0 = Number(cel.dataset.idx), i1 = i0, bewogen = false;
      function verf(){ cellen.forEach(function(c){ var i = Number(c.dataset.idx); c.classList.toggle("kies", i >= Math.min(i0,i1) && i <= Math.max(i0,i1)); }); }
      function beweeg(ev){ var i = dagOnder(ev.clientX); if (i === null) return; if (i !== i1) bewogen = true; i1 = i; verf(); }
      function los(){
        document.removeEventListener("mousemove", beweeg); document.removeEventListener("mouseup", los);
        cellen.forEach(function(c){ c.classList.remove("kies"); });
        var a = Math.min(i0,i1), b = Math.max(i0,i1);
        openForm(null, week[a].iso, "", { datumTot: week[b].iso });
      }
      verf();
      document.addEventListener("mousemove", beweeg); document.addEventListener("mouseup", los);
    });
    // De gewone klik zit al in het mousedown/mouseup hierboven.
    cel.onclick = null;
  });
  // 2 en 3. Een balk verlengen of verschuiven.
  band.querySelectorAll(".dagband").forEach(function(el){
    el.addEventListener("mousedown", function(e){
      if (e.button !== 0) return;
      var a = afspraken.find(function(x){ return x.id === el.dataset.id; }); if (!a) return;
      if (a.herhaal) return;     // een reeks versleep je niet; open hem en pas de datum aan
      var rekken = e.target.classList.contains("greep-r");
      e.preventDefault(); e.stopPropagation();
      var startIdx = dagOnder(e.clientX); if (startIdx === null) return;
      var van = a.datum, tot = a.datumTot && a.datumTot > a.datum ? a.datumTot : a.datum;
      var nVan = van, nTot = tot, bezig = false;
      var eerste = week[0].iso, laatste = week[week.length-1].iso;
      function toon(){
        var i0 = nVan < eerste ? 0 : dagenTussen(eerste, nVan), i1 = nTot > laatste ? week.length-1 : dagenTussen(eerste, nTot);
        el.style.gridColumn = (i0+2)+" / "+(i1+3);
      }
      function beweeg(ev){
        var i = dagOnder(ev.clientX); if (i === null) return;
        var delta = i - startIdx;
        if (!bezig && delta === 0) return;
        if (!bezig){ bezig = true; el.classList.add("sleept"); document.body.classList.add("bezig-slepen"); }
        // Verlengen: de laatste dag schuift mee met de muis. Verschuiven: de
        // eerste en de laatste dag allebei, zodat hij even lang blijft.
        if (rekken){ nVan = van; nTot = dagPlus(tot, delta); if (nTot < van) nTot = van; }
        else { nVan = dagPlus(van, delta); nTot = dagPlus(tot, delta); }
        toon();
        toonTip(ev, (rekken ? "t/m " : "") + dagNaam(rekken ? nTot : nVan) + (rekken ? "" : " t/m " + dagNaam(nTot)));
      }
      async function los(){
        document.removeEventListener("mousemove", beweeg); document.removeEventListener("mouseup", los);
        verbergTip(); el.classList.remove("sleept"); document.body.classList.remove("bezig-slepen");
        if (!bezig) return;
        el.dataset.gesleept = "1";
        var b = { datum: nVan, datumTot: nTot > nVan ? nTot : null };
        if (b.datum === a.datum && (b.datumTot || null) === (a.datumTot || null)) { teken(); return; }
        try{
          await bewaar(function(lijst){
            var i = lijst.findIndex(function(x){ return x.id === a.id; });
            if (i >= 0) lijst[i] = Object.assign({}, lijst[i], b, { gewijzigdDoor: ik, gewijzigd: new Date().toISOString() });
            return lijst;
          });
          try{ if(window.fpLog) window.fpLog("afspraak-verplaatst", (a.klant||"")+" -> "+b.datum+(b.datumTot?" t/m "+b.datumTot:"")); }catch(e){}
          teken();
        }catch(err){ alert(err.message); teken(); }
      }
      document.addEventListener("mousemove", beweeg); document.addEventListener("mouseup", los);
    });
  });
}
function blokken(items){
  var met = items.map(function(a){
    var van = minuten(a.tijd);
    if (van===null) return null;
    var duur = Number(a.duurMin)||60;
    return { a:a, van:van, tot:van+duur };
  }).filter(Boolean).sort(function(x,y){ return x.van-y.van || y.tot-x.tot; });

  // Overlappende afspraken over kolommetjes verdelen (greedy, zoals Outlook).
  var lanes = [];
  met.forEach(function(b){
    var l = 0;
    while (lanes[l] && lanes[l] > b.van) l++;
    lanes[l] = b.tot; b.lane = l;
  });
  met.forEach(function(b){
    var n = 1;
    met.forEach(function(o){ if (o!==b && o.van<b.tot && o.tot>b.van) n = Math.max(n, o.lane+1, b.lane+1); });
    b.breed = Math.max(n, b.lane+1);
  });

  return met.map(function(b){
    var a = b.a, c = cat(a);
    var top = (b.van-UUR_VAN*60)/60*UUR_PX;
    var hoog = Math.max(24, (b.tot-b.van)/60*UUR_PX-2);
    var w = 100/b.breed, links = b.lane*w;
    var sub = [a.plaats, a.wat].filter(Boolean).join(" · ");
    /* Wie het heeft ingepland staat altijd in beeld, ook op een klein blok.
       Gerrit (7 sep 2026): "Ik wil ook kunnen zien wie het heeft ingepland."
       Bij een laag blok is er geen ruimte voor een regel, dus dan wordt het
       een rondje met de initiaal rechtsboven; de hele naam staat in de tip. */
    var plander = a.door ? '<span class="planner" title="Ingepland door '+esc(planNaam(a.door))+
      (a.gewijzigdDoor && a.gewijzigdDoor!==a.door ? ', laatst gewijzigd door '+esc(planNaam(a.gewijzigdDoor)) : '')+'">'+
      esc(planNaam(a.door).slice(0,1).toUpperCase())+'</span>' : "";
    return '<div class="blok'+(a.klaar?" klaar":"")+zoekKlas(a)+'" data-id="'+esc(a.id)+'" data-datum="'+esc(a.datum)+'" title="'+esc(a.tijd)+(a.duurMin?' - '+tijdStr(b.tot):'')+(a.wie?' · '+esc(a.wie):'')+'" style="top:'+top+'px;height:'+hoog+'px;'+
      'left:calc('+links+'% + 2px);width:calc('+w+'% - 5px);background:'+c.zacht+';border-left-color:'+c.kleur+';z-index:'+(2+b.lane)+'">'+
      plander+
      /* Gerrit (11 sep 2026): de tijden staan al aan de zijkant, dus die
         hoeven niet in het blok. Wat er wél in moet: ordernummer,
         ITS-nummer en klantnaam. De tijden staan nog in de tip. */
      ((a.ordernr||a.itsId)?'<div class="nr">'+(a.ordernr?esc(a.ordernr):'')+(a.ordernr&&a.itsId?' · ':'')+(a.itsId?'ITS '+esc(a.itsId):'')+'</div>':'')+
      '<div class="k" data-bewerk="klant" title="Klik om de naam aan te passen">'+betaalStip(a)+esc(a.klant||c.naam)+'</div>'+
      (hoog>62&&sub?'<div class="s">'+esc(sub)+'</div>':"")+
      (hoog>66&&a.wie?'<div class="s">\ud83d\udc64 '+esc(a.wie)+'</div>':"")+
      (hoog>82&&a.door?'<div class="d">ingepland door '+esc(planNaam(a.door))+'</div>':"")+
      '<div class="greep" title="Sleep om de afspraak langer of korter te maken"></div></div>';
  }).join("");
}

function kaartje(a){
  var c = cat(a);
  var sub = [a.plaats, a.wat].filter(Boolean).map(esc).join(" · ");
  var voet = [];
  if (a.wie) voet.push("👤 "+esc(a.wie));
  if (a.door) voet.push("gepland door "+esc(voornaam(a.door)));
  return '<div class="afs'+(a.klaar?" klaar":"")+'" data-id="'+esc(a.id)+'" style="border-left-color:'+c.kleur+'">'+
    '<div class="kop"><span class="tijd">'+esc(a.tijd||"hele dag")+'</span>'+
    '<span class="badge" style="background:'+c.zacht+';color:'+c.kleur+';filter:brightness(.75)">'+esc(c.naam)+'</span></div>'+
    '<div class="klant">'+betaalStip(a)+esc(a.klant||"(geen naam)")+'</div>'+
    (sub?'<div class="sub">'+sub+'</div>':"")+
    (voet.length?'<div class="sub">'+voet.join(" · ")+'</div>':"")+'</div>';
}

      '<input type="checkbox" id="fKlaar" style="width:auto"'+(a.klaar?" checked":"")+'> Gedaan</label>')+
    (nieuw?"":'<div class="gepland-door">Ingepland door '+esc(planNaam(a.door||"?"))+

     monteur onderweg nodig heeft. */
  if (!MAG_BEWERKEN){
    laag.querySelectorAll("input,select,textarea").forEach(function(v){ v.disabled = true; });

  var soort = CATS[a.soort] ? a.soort : "intern";
  $("fCats").querySelectorAll("button").forEach(function(b){

      $("fCats").querySelectorAll("button").forEach(function(x){ x.style.borderColor=""; x.style.background=""; });
      b.style.borderColor = CATS[soort].kleur; b.style.background = CATS[soort].zacht;
    });
  });
  $("fHeleDag").addEventListener("change", function(){
    var aan = this.checked;
    $("rijDagen").style.display = aan ? "" : "none";
    $("rijTijd").style.display = aan ? "none" : "";
    if (aan && !$("fDatumVan").value) $("fDatumVan").value = $("fDatum").value;
    if (aan && !$("fDatumTot").value) $("fDatumTot").value = $("fDatumVan").value;
  });
  $("fHerhaal").addEventListener("change", function(){ $("rijHerhaal").style.display = this.checked ? "" : "none"; });
  $("fDatumVan").addEventListener("change", function(){
    if (!$("fDatumTot").value || $("fDatumTot").value < this.value) $("fDatumTot").value = this.value;
  });
  /* Het ophalen zelf. Een ordernummer gaat naar Logic4; een ITS-nummer is een
     servicemelding en die hangt aan een debiteur, dus daar is een eigen weg
     voor. Welke van de twee het is zien we aan het nummer: een ordernummer is
     zeven cijfers, een ITS-nummer korter of met letters ervoor. */
  async function haalOrder(){
    var veld = $("fZoek"), knop = $("fZoekBtn"), uit = $("fZoekUit");
    var nr = String(veld.value||"").replace(/[^0-9A-Za-z]/g,"").trim();
    if (!nr){ uit.className="zoekuit"; uit.textContent="Vul eerst een nummer in."; return; }
    knop.disabled = true; uit.className="zoekuit"; uit.textContent="Zoeken in Logic4\u2026";
    // Alleen invullen wat nog leeg is: wat de planner zelf typte blijft staan.
    var zet = function(id, waarde){
      var el = $(id);
      if (el && waarde && !String(el.value||"").trim()) el.value = waarde;
    };
    try{
      if (/^\d{7,9}$/.test(nr)){
        var r = await fetch(W+"/planning/route-print?orders="+encodeURIComponent(nr),
          { headers: { "X-Fonteyn-Auth": teamKey() } });
        var j = await r.json().catch(function(){ return null; });
        if (!r.ok || !j || !j.ok) throw new Error((j&&j.error)||("HTTP "+r.status));
        var o = (j.orders||[])[0];
        if (!o || !o.ok) throw new Error((o&&o.error)||"order niet gevonden");
        var adr = o.leverenAan || o.besteldDoor || {};
        zet("fKlant", adr.naam || adr.bedrijf || "");
        zet("fTel", adr.telefoon || "");
        zet("fPlaats", [adr.straat, adr.postcode, adr.plaats].filter(Boolean).join(", "));
        zet("fOrder", String(o.nr));
        /* Wat er geleverd wordt is voor de monteur het belangrijkste, dus de
           eerste regel van de order (de spa zelf) komt in het veld Wat. */
        var eerste = (o.regels||[]).find(function(x){ return x.omschrijving && x.totaal; });
        if (eerste) zet("fWat", eerste.omschrijving);
        uit.className="zoekuit ok";
        uit.textContent = "Gevonden: " + (adr.naam || "order " + o.nr) +
          (o.leverdatum ? "  \u00b7  leverdatum " + String(o.leverdatum).slice(0,10).split("-").reverse().join("-") : "") +
          (o.leveringswijze ? "  \u00b7  " + o.leveringswijze : "");
      } else {
        // ITS: de servicemelding kent zijn debiteur, en daar zitten de
        // klantgegevens aan vast.
        /* Gerrit (11 sep 2026): "bij het invoeren van een ITS-melding
           [laadt hij] niet de klantgegevens (en niet alleen de melding)". De
           melding zelf kent alleen de naam en het debiteurnummer; naam,
           adres en telefoon komen van de debiteur, net als bij Inplannen
           vanuit het meldingenpaneel. */
        var r2 = await fetch(W+"/planning/its", { headers: { "X-Fonteyn-Auth": teamKey() } });
        var j2 = await r2.json().catch(function(){ return null; });
        var kaal = nr.replace(/\D/g,"");
        var m = ((j2&&j2.meldingen)||[]).find(function(x){ return String(x.id||"") === kaal; });
        if (!m){
          if (/^\d{5,6}$/.test(kaal)) throw new Error("geen servicemelding met nummer "+kaal+" (openstaand, laatste half jaar)");
          throw new Error("dit ITS-nummer staat niet in de openstaande servicemeldingen");
        }
        var klant = null;
        if (m.debiteur){
          try{
            var r3 = await fetch(W+"/planning/its/klant?debiteur="+m.debiteur, { headers:{ "X-Fonteyn-Auth": teamKey() } });
            var j3 = await r3.json();
            if (j3.ok) klant = j3.klant;
          }catch(e){}
        }
        zet("fKlant", (klant && klant.naam) || m.naam || "");
        zet("fTel", (klant && klant.telefoon) || "");
        zet("fPlaats", (klant && klant.adres) || "");
        zet("fWat", ("Melding "+m.id+" \u00b7 "+[m.groep, (m.omschrijving||"").slice(0,140)].filter(Boolean).join(" \u00b7 ")).slice(0,400));
        zet("fIts", String(m.id));
        if (soort === "levering"){ soort = "service"; var sb = $("fCats").querySelector('[data-cat="service"]'); if (sb) sb.click(); }
        uit.className="zoekuit ok";
        uit.textContent = "Gevonden: melding " + m.id + " van " + ((klant && klant.naam) || m.naam || "?") +
          (klant ? "" : " (klantgegevens niet gevonden bij de debiteur)");
      }
    }catch(e){
      uit.className="zoekuit bad";
      uit.textContent = "Niet gevonden: " + (e.message||e) + ". Je kunt het met de hand invullen.";
    }
    knop.disabled = false;
  }
  if (MAG_BEWERKEN){
    $("fZoekBtn").addEventListener("click", haalOrder);
    // Enter in het zoekveld doet hetzelfde, en bewaart de afspraak niet.
    $("fZoek").addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); haalOrder(); }
    });
  }

  function dicht(){ laag.remove(); }
  $("fTerug").addEventListener("click", dicht);
  laag.addEventListener("click", function(e){ if(e.target===laag) dicht(); });

  if (MAG_BEWERKEN) $("fDoe").addEventListener("click", async function(){
    var b = {
      id: a.id,
      datum: $("fHeleDag").checked ? $("fDatumVan").value : $("fDatum").value,
      tijd: $("fHeleDag").checked ? "" : $("fTijd").value,
      duurMin: Number($("fDuur").value)||120, soort: soort,
      /* Alleen een hele-dag-afspraak loopt over meerdere dagen; de laatste
         dag moet na de eerste liggen, anders is het gewoon één dag. */
      datumTot: ($("fHeleDag").checked && $("fDatumTot").value > $("fDatumVan").value) ? $("fDatumTot").value : null,
      herhaal: $("fHerhaal").checked ? "week" : null,
      herhaalTot: ($("fHerhaal").checked && $("fHerhaalTot").value) ? $("fHerhaalTot").value : null,
      klant: $("fKlant").value.trim(), telefoon: $("fTel").value.trim(),
      plaats: $("fPlaats").value.trim(), ordernr: $("fOrder").value.trim(),
      wat: $("fWat").value.trim(), wie: $("fWie").value.trim(),
      klaar: nieuw ? false : $("fKlaar").checked,
      itsId: Number(String($("fIts").value||"").replace(/\D/g,"")) || null,
      route: a.route || null,          // bij welke route van die dag hij hoort
      volg: a.volg != null ? a.volg : null,
      letop: $("fLetop").checked,
      door: nieuw ? ik : (a.door||ik), gewijzigdDoor: ik,
      gemaakt: a.gemaakt || new Date().toISOString(), gewijzigd: new Date().toISOString()
    };
    if (!b.datum){ $("fMelding").textContent = "Kies een datum."; return; }
    if (!b.klant){ $("fMelding").textContent = "Vul de naam van de klant of het onderwerp in."; return; }
    this.disabled = true; this.textContent = "Bezig…";
    try{
      await bewaar(function(lijst){
        var i = lijst.findIndex(function(x){ return x.id===b.id; });
        if (i>=0) lijst[i]=b; else lijst.push(b);
        return lijst;
      });
      try{ if(window.fpLog) window.fpLog(nieuw?"afspraak-gepland":"afspraak-gewijzigd",
        b.soort+" "+b.datum+" "+b.tijd+" "+b.klant); }catch(e){}
      dicht(); teken();
    }catch(e){ $("fMelding").textContent = e.message; this.disabled=false; this.textContent="Bewaren"; }
  });

  if (MAG_BEWERKEN && !nieuw) $("fWeg").addEventListener("click", async function(){
    if (!confirm("Afspraak van "+(a.klant||"?")+" op "+a.datum+" verwijderen?")) return;
    this.disabled = true;
    try{
      await bewaar(function(lijst){ return lijst.filter(function(x){ return x.id!==a.id; }); });
      try{ if(window.fpLog) window.fpLog("afspraak-verwijderd", a.soort+" "+a.datum+" "+(a.klant||"")); }catch(e){}
      dicht(); teken();
    }catch(e){ $("fMelding").textContent = e.message; this.disabled=false; }
  });
}

/* ── servicemeldingen uit Logic4 (ITS) ──
   De werkvoorraad van de afdeling: alles op status Inplannen of Opnieuw
   inplannen uit het laatste half jaar. "Inplannen" haalt naam, adres en
   telefoon van de klant erbij en zet de melding als service-afspraak in de
   week. De koppeling blijft bewaard (itsId), zodat een melding die al in de
   planning staat dat ook laat zien. */
var itsMeldingen = null, itsToon = 30;

function itsGepland(id){
  return afspraken.some(function(a){ return Number(a.itsId)===Number(id); });
}
async function itsLaad(){
  if (!MAG_BEWERKEN) return;      // meldingen inplannen hoort bij de afdeling
  try{
    var r = await fetch(W+"/planning/its", { headers:{ "X-Fonteyn-Auth": teamKey() } });
    var j = await r.json();
    if (!j.ok) throw new Error(j.error||"ophalen mislukte");
    itsMeldingen = j.meldingen || [];
  }catch(e){ itsMeldingen = null;
    $("itsLijst").innerHTML = '<div class="its-leeg">Meldingen ophalen lukte niet: '+esc(e.message)+'</div>';
    return;
  }
  itsTeken();
}
function itsTeken(){
  if (!Array.isArray(itsMeldingen)) return;
  var zoek = ($("itsZoek").value||"").toLowerCase();
  var raak = itsMeldingen.filter(function(m){
    if (!zoek) return true;
    return (m.naam+" "+m.plaats+" "+m.groep+" "+m.type+" "+m.omschrijving).toLowerCase().indexOf(zoek)>=0;
  });
  var vandaag = iso(new Date());
  $("itsTitel").textContent = "Servicemeldingen uit Logic4 · "+raak.length+" in te plannen";
  $("itsLijst").innerHTML = (raak.slice(0, itsToon).map(function(m){
    var telaat = m.uiterlijk && m.uiterlijk < vandaag;
    var sub = [m.type, m.groep, "gemeld "+m.gemeld].filter(Boolean).join(" · ")+
      (m.uiterlijk ? ' · <span class="'+(telaat?"telaat":"")+'">uiterlijk '+esc(m.uiterlijk)+'</span>' : "");
    var knop = itsGepland(m.id)
      ? '<span class="alGepland">in de planning ✓</span>'
      : '<button type="button" data-its="'+m.id+'">Inplannen</button>';
    return '<div class="its-rij"><div class="mid">'+
      '<div class="naam">'+esc(m.naam||"(zonder naam)")+' <span class="nr">· melding '+m.id+'</span></div>'+
      '<div class="sub">'+sub+'</div>'+
      (m.omschrijving?'<div class="om">'+esc(m.omschrijving.slice(0,160))+(m.omschrijving.length>160?"…":"")+'</div>':"")+
      '</div>'+knop+'</div>';
  }).join("") || '<div class="its-leeg">Geen meldingen gevonden.</div>')+
  (raak.length>itsToon ? '<button type="button" class="its-meer" id="itsMeer">Toon er meer ('+(raak.length-itsToon)+' te gaan)</button>' : "");

  $("itsLijst").querySelectorAll("button[data-its]").forEach(function(k){
    k.addEventListener("click", function(){ itsInplannen(Number(k.dataset.its), k); });
  });
  var meer = $("itsMeer");
  if (meer) meer.addEventListener("click", function(){ itsToon += 50; itsTeken(); });
}
async function itsInplannen(id, knop){
  var m = itsMeldingen.find(function(x){ return x.id===id; });
  if (!m) return;
  knop.disabled = true; knop.textContent = "Bezig…";
  var klant = null;
  if (m.debiteur){
    try{
      var r = await fetch(W+"/planning/its/klant?debiteur="+m.debiteur, { headers:{ "X-Fonteyn-Auth": teamKey() } });
      var j = await r.json();
      if (j.ok) klant = j.klant;
    }catch(e){}
  }
  knop.disabled = false; knop.textContent = "Inplannen";
  openForm(null, iso(new Date()), "", {
    soort: "service",
    klant: (klant && klant.naam) || m.naam || "",
    telefoon: (klant && klant.telefoon) || "",
    plaats: (klant && klant.adres) || "",
    wat: ("Melding "+m.id+" · "+[m.groep, m.omschrijving.slice(0,140)].filter(Boolean).join(" · ")).slice(0,400),
    itsId: m.id,
  });
}

$("itsZoek").addEventListener("input", function(){ itsToon = 30; itsTeken(); });

/* ── route van de dag ──
   De adressen van een dag in tijdsvolgorde, als route in Google Maps -
   vertrek en terugkomst bij Fonteyn in Uddel. Heeft een dag zowel
   bezorgwerk als service, dan kies je eerst wiens route je wilt. */
var THUIS = "Fonteyn, Uddel";
function routeStops(dISO, soorten){
  return afspraken.filter(function(a){
    return a.datum===dISO && a.plaats && !a.klaar &&
      (!soorten || soorten.indexOf(a.soort)>=0) && !filterUit[a.soort];
  }).sort(function(a,b){ return String(a.tijd||"99").localeCompare(String(b.tijd||"99")); })
    .map(function(a){ return a.plaats; });
}
function routeOpen(stops){
  if (!stops.length) return;
  var url = "https://www.google.com/maps/dir/" +
    [THUIS].concat(stops).concat([THUIS]).map(encodeURIComponent).join("/");
  try{ if(window.fpLog) window.fpLog("route-berekend", stops.length+" adressen"); }catch(e){}
  window.open(url, "_blank");
}
function routeKies(dISO, bijKnop){
  var lever = routeStops(dISO, ["levering","ophalen"]);
  var serv  = routeStops(dISO, ["service"]);
  var alles = routeStops(dISO, null);
  if (!alles.length) return;
  if (!lever.length || !serv.length){ routeOpen(alles); return; }
  var oud = document.querySelector(".route-menu"); if (oud) oud.remove();
  var menu = document.createElement("div");
  menu.className = "route-menu";
  menu.innerHTML =
    '<button type="button" data-r="lever">🚚 Bezorger ('+lever.length+' adressen)</button>'+
    '<button type="button" data-r="serv">🔧 Monteur ('+serv.length+' adressen)</button>'+
    '<button type="button" data-r="alles">Alles in één route ('+alles.length+')</button>';
  document.body.appendChild(menu);
  var r = bijKnop.getBoundingClientRect();
  menu.style.left = Math.min(window.innerWidth-190, r.left) + "px";
  menu.style.top = (r.bottom + window.scrollY + 4) + "px";
  menu.querySelectorAll("button").forEach(function(k){
    k.addEventListener("click", function(){
      menu.remove();
      routeOpen(k.dataset.r==="lever" ? lever : k.dataset.r==="serv" ? serv : alles);
    });
  });
  setTimeout(function(){ document.addEventListener("click", function weg(e){
    if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener("click", weg); }
  }); }, 0);
}

(async function(){
  tekenLegenda();
  var eerste = await lees();
  if (eerste === null){
    $("rooster").innerHTML = '<div style="grid-column:1/-1;padding:30px;color:var(--grijs)">De opslag is even niet bereikbaar. Herlaad de pagina om het opnieuw te proberen.</div>';
    return;
  }
  afspraken = eerste;
  teken();
  scrollNaarWerkdag();
  liveStart();
  // De nu-lijn elke minuut opnieuw; goedkoop, want teken() is puur lokaal.
  setInterval(function(){ teken(); }, 60000);
  /* Vangnet voor als de live-verbinding wegvalt (slaapstand, wifi). Elke
     halve minuut opnieuw ophalen kost bijna niets en houdt de agenda ook
     zonder verbinding actueel. */
  setInterval(function(){ if (!liveKlaar) ververs(); }, 30000);
  // Terug van een ander scherm of uit de slaapstand: meteen bijwerken.
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) ververs(); });
})();

<script>
/* Activiteitenlogboek — helper fpLog(actie,detail) + tegel-open melden */
(function(){
  var W="https://fonteyn-data-store.g-mulder.workers.dev/log";
  function apparaat(){
    var ua=navigator.userAgent||"";
    var app=ua.match(/fonteyn-dashboard\/([\d.]+)/i);
    var elc=ua.match(/Electron\/([\d.]+)/i);
    var versie=app?("app "+app[1]):(elc?("app · Electron "+elc[1]):"browser");
    var pm=ua.match(/(Windows NT [\d.]+|Mac OS X [\d_]+|Linux|Android|iPhone)/);
    var id=null;
    try{
      id=localStorage.getItem("fp.apparaat");
      if(!id){ id="PC-"+Math.random().toString(36).slice(2,8).toUpperCase(); localStorage.setItem("fp.apparaat",id); }
    }catch(e){}
    return {computer:id, platform:pm?pm[1].replace(/_/g,"."):null, versie:versie};
  }
  window.fpLog=function(action,detail){try{
    var email=(localStorage.getItem("fp.email")||"").toLowerCase();
    var key=localStorage.getItem("fp.teamkey")||"";
    if(!email||!key) return;
    var app=apparaat();
    fetch(W,{method:"POST",headers:{"Content-Type":"application/json","X-Fonteyn-Auth":key},body:JSON.stringify({user:email,tile:"planning",action:action||"open",detail:(detail||"").slice(0,1200),computer:app.computer,platform:app.platform,versie:app.versie})}).catch(function(){});
  }catch(e){}};
  window.fpLog(window.fpGeenToegang?"open-geweigerd":"open");
})();
</script>
