<script>
/* Toegangscontrole. Het dashboard verbergt de tegel al, maar met de terugknop
   is een pagina die een vórige gebruiker opende opnieuw te bereiken. */
(function(){
  var TOEGANG = window.fpToegang ? window.fpToegang.set("planning") : null;
  var email = (localStorage.getItem("fp.email")||"").toLowerCase();
  if (!localStorage.getItem("fp.session")) { location.replace("dashboard.html"); return; }
  if (TOEGANG && TOEGANG.has(email)) return;
  window.fpGeenToegang = true;
  document.write('<style>body{margin:0;font-family:Montserrat,-apple-system,sans-serif;background:#f5f4ef;color:#1f2937}'+
    '.gt{max-width:520px;margin:14vh auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:34px;text-align:center}'+
    '.gt h1{color:#144734;font-size:20px;margin:0 0 10px}.gt p{color:#6b7280;font-size:14px;line-height:1.5}'+
    '.gt a{display:inline-block;margin-top:14px;background:#144734;color:#fff;text-decoration:none;padding:10px 20px;border-radius:8px;font-size:13px}</style>'+
    '<div class="gt"><h1>Geen toegang</h1><p>De tegel Planning is niet beschikbaar voor jouw account.</p>'+
    '<a href="dashboard.html">&larr; Terug naar het dashboard</a></div>');
  window.stop();
})();
</script>

<!-- ══════════════════════════════════════════════════════════════════════
     PLANNING - weekagenda van de afdeling Spa planning

     Gerrit (24 aug 2026, met een schermafdruk van zijn Outlook erbij):
     de planning moet eruitzien als een echte agenda. Dus: een tijdraster
     met de uren onder elkaar, de hele week inclusief het weekend, door
     alle weken van het jaar te bladeren, categorieën met een eigen kleur,
     en op elke afspraak zichtbaar wie hem heeft ingepland.

     Een afspraak zonder tijd valt in de "hele dag"-strook bovenin, net als
     in Outlook. Afspraken die elkaar overlappen komen naast elkaar te
     staan. De rode lijn is het nu-moment.

     De afspraken staan in de bucket 'planning' bij de worker; iedereen van
     de afdeling kijkt dus naar dezelfde agenda. Bewaren leest eerst de
     verse stand en past dan alleen de eigen wijziging toe, zodat twee
     planners elkaar niet overschrijven.

     OTA: staat in manifest.json. Nooit opnieuw installeren.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --groen:#144734; --groen-donker:#0d3325; --lime:#8bc53f;
  --bg:#f5f4ef; --kaart:#fff; --ink:#1f2937; --grijs:#6b7280; --rand:#e5e7eb;
  --rood:#b91c1c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Montserrat",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);
     color:var(--ink);font-size:14px;-webkit-text-size-adjust:100%}

header{background:var(--groen);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;
       position:sticky;top:0;z-index:20;padding-top:calc(12px + env(safe-area-inset-top))}
header h1{margin:0;font-size:15px;font-weight:600;flex:1}
header a.knop,header button.knop{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);
       border-radius:8px;padding:7px 13px;font:inherit;font-size:12px;cursor:pointer;text-decoration:none}
header .wie{font-size:11px;opacity:.75}

main{max-width:1500px;margin:0 auto;padding:14px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}

/* ── weekbalk ── */
.weekbalk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.weekbalk h2{margin:0;font-size:16px;color:var(--groen);flex:1;min-width:200px}
.weekbalk button,.weekbalk input[type=date]{background:#fff;border:1px solid var(--rand);border-radius:9px;
       padding:8px 13px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.weekbalk button:hover{border-color:var(--lime)}
.weekbalk button.nieuw{background:var(--groen);color:#fff;border:0;font-weight:600}
.weekbalk button.nieuw:hover{background:var(--groen-donker)}
.weekbalk input[type=date]{cursor:text;color:var(--grijs);width:150px}

/* ── legenda: de categorieën, tevens filter ── */
.legenda{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cat-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rand);background:#fff;
       border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;user-select:none}
.cat-chip .bol{width:10px;height:10px;border-radius:50%}
/* Live meekijken: wie er nog meer in de agenda zit, en een kort seintje als
   een collega net iets heeft veranderd. */
.live-wie{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--grijs);margin-left:auto}
.live-stip{width:8px;height:8px;border-radius:50%;background:#8bc53f;box-shadow:0 0 0 3px rgba(139,197,63,.25)}
/* Stip voor de betaalstand van de order: groen betaald, oranje aanbetaald,
   rood niets binnen. Geen ordernummer of onbekende order = geen stip. */
.betaalstip{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;
       vertical-align:middle;flex:0 0 auto}
.legenda .betaal-uitleg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--grijs);margin-left:4px}
.live-melding{font-size:12px;color:var(--groen);font-weight:600;opacity:0;transition:opacity .3s;margin-left:10px;white-space:nowrap}
#legendaChips{display:inline-flex;gap:8px;flex-wrap:wrap}
.cat-chip.uit{opacity:.35}
.cat-chip.uit .bol{background:#d1d5db!important}

/* ── het agendaraster ── */
.agenda{background:#fff;border:1px solid var(--rand);border-radius:12px;overflow:hidden}
.agenda-scroll{overflow:auto;max-height:calc(100vh - 240px);min-height:420px;position:relative}
.rooster{display:grid;grid-template-columns:52px repeat(var(--dagen,7),minmax(var(--dagbreedte,96px),1fr))}
/* De routes van een dag naast elkaar, met hun naam erboven. */
.routekop-cel{display:flex;border-bottom:1px solid var(--rand);border-left:1px solid #f3f4f6;background:#fbfbf9}
.routekop{flex:1 1 0;min-width:0;padding:3px 4px;font-size:10px;line-height:1.25;border-left:1px dashed #e5e7eb;overflow:hidden}
.routekop:first-child{border-left:0}
.routekop .rnr{display:inline-block;background:var(--groen);color:#fff;border-radius:4px;padding:0 4px;font-weight:700;font-size:9.5px;margin-right:3px}
.routekop .rwie{color:var(--grijs);white-space:nowrap}
.routekol{position:absolute;top:0;bottom:0}
/* De balken van hele dagen. Zelfde kolomindeling als het raster eronder,
   zodat een balk precies boven zijn dagen staat; een balk over drie dagen
   is één stuk, niet drie losse blokjes. */
.rasterkop{position:sticky;top:0;z-index:8;background:#fff;border-bottom:2px solid var(--rand)}
.dagkoppen,.routekoppen,.dagbanden{display:grid;grid-template-columns:52px repeat(var(--dagen,7),minmax(var(--dagbreedte,96px),1fr))}
.dagbanden{background:#fff;border-top:1px solid var(--rand);padding:4px 0 6px}
/* Onder de balken een lege regel per dag: daar klik je om iets voor een hele
   dag te maken, zoals in Outlook. Gerrit (11 sep 2026): "moet je gewoon
   bovenaan kunnen klikken". */
.dagband-cel{margin:3px 3px 0;min-height:18px;border-radius:5px;border:1px dashed transparent;cursor:pointer}
.dagband-cel:hover,.dagband-cel.kies{border-color:var(--lime);background:#f7fbef}
.dagband-cel.kies{background:#e9f4d3;border-style:solid}
/* Slepen: een balk verschuiven, of aan de rechterkant langer of korter maken. */
.dagband{position:relative;cursor:grab}
.dagband.sleept{cursor:grabbing;opacity:.8;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.dagband .greep-r{position:absolute;top:0;bottom:0;right:0;width:9px;cursor:ew-resize}
.dagband:hover .greep-r{background:linear-gradient(to right,transparent,rgba(0,0,0,.14))}
.dagbanden .lbl{grid-column:1;font-size:10px;color:var(--grijs);text-align:right;padding:5px 6px 0;position:sticky;left:0;background:#fff;z-index:5}
.dagband{margin:3px 3px 0;border-radius:6px;border-left:4px solid;padding:3px 9px;font-size:11.5px;font-weight:600;
       cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:22px;line-height:16px}
.dagband .wie{font-weight:400;color:var(--grijs)}
.dagband.klaar{opacity:.42;text-decoration:line-through}
.dagband.door-links{border-top-left-radius:0;border-bottom-left-radius:0}
.dagband.door-rechts{border-top-right-radius:0;border-bottom-right-radius:0}
.dagband.zoek-raak{box-shadow:0 0 0 2px #c8102e}
.dagband.zoek-dim{opacity:.28}
.routekol.scheiding{border-left:1px dashed #e5e7eb}
/* Zoeken in het raster: raak licht op, de rest wordt vaag. */
.rasterzoek{display:flex;align-items:center;gap:10px;margin:-4px 0 10px}
.rasterzoek input{border:1px solid var(--rand);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;width:340px;max-width:100%}
.rasterzoek span{font-size:12px;color:var(--grijs)}
.rasterzoek span button{background:#fff;border:1px solid var(--rand);border-radius:7px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer;color:var(--groen);font-weight:600}
.blok.zoek-raak,.hd-blok.zoek-raak{box-shadow:0 0 0 2px #c8102e,0 3px 10px rgba(200,16,46,.25);z-index:7!important}
.blok.zoek-dim,.hd-blok.zoek-dim{opacity:.28}
/* Een hele-dag-balk die doorloopt naar de volgende dag. */
.hd-blok.door-rechts{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:-4px}
.hd-blok.door-links{border-top-left-radius:0;border-bottom-left-radius:0;border-left-width:0;margin-left:-4px}
.dag-kop{background:#fff;padding:8px 8px 6px;text-align:left}
.dag-kop .dnaam{font-size:11px;color:var(--grijs);text-transform:lowercase}
.dag-kop .dnum{font-size:17px;font-weight:700;color:var(--ink);line-height:1.2}
.dag-kop.vandaag .dnum{color:#fff;background:var(--groen);border-radius:50%;display:inline-block;
       width:28px;height:28px;text-align:center;line-height:28px;font-size:14px}
.hoek{position:sticky;left:0;background:#fff;z-index:8}
.heledag-cel{border-bottom:1px solid var(--rand);border-left:1px solid #f3f4f6;padding:3px 3px 5px;min-height:26px}
.heledag-label{border-bottom:1px solid var(--rand);font-size:10px;color:var(--grijs);text-align:right;
       padding:6px 6px 0;position:sticky;left:0;background:#fff;z-index:5}
.uur-label{font-size:10px;color:var(--grijs);text-align:right;padding-right:6px;transform:translateY(-6px);
       position:sticky;left:0;background:#fff;z-index:5}
.dag-cel{position:relative;border-left:1px solid #f3f4f6}
.dag-cel.weekend{background:#fafaf7}
.uurlijn{position:absolute;left:0;right:0;border-top:1px solid #f3f4f6;pointer-events:none}
.nu-lijn{position:absolute;left:0;right:0;border-top:2px solid #c8102e;z-index:4;pointer-events:none}
.nu-lijn::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:#c8102e}

/* ── afspraakblok in het raster ── */
.blok{position:absolute;border-radius:7px;padding:4px 6px;font-size:11px;line-height:1.3;cursor:pointer;
      overflow:hidden;border-left:4px solid;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.blok:hover{box-shadow:0 3px 10px rgba(0,0,0,.18);z-index:5!important}
.blok .nr{font-weight:700;font-size:10px;letter-spacing:.02em;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blok .k{font-weight:600;font-size:11.5px}
.blok .s{opacity:.8;font-size:10.5px}
.blok .d{opacity:.7;font-size:10px;font-style:italic}
.blok.klaar{opacity:.42}
/* Slepen en vergroten. De greep is een strookje onderaan het blok; hij valt
   niet op tot je er met de muis overheen gaat. */
.blok{cursor:grab}
.blok.sleept{cursor:grabbing;opacity:.85;box-shadow:0 8px 22px rgba(0,0,0,.28);z-index:60!important}
.blok .greep{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.blok:hover .greep{background:linear-gradient(to bottom,transparent,rgba(0,0,0,.14))}
body.bezig-slepen{cursor:grabbing;user-select:none}
/* Wie het heeft ingepland: een rondje met de eerste letter, rechtsboven. */
.blok .planner{position:absolute;top:3px;right:4px;width:15px;height:15px;border-radius:50%;
      background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.12);font-size:9px;font-weight:700;
      line-height:14px;text-align:center;color:#444;z-index:2}
/* De naam is aanklikbaar om hem direct aan te passen. */
.blok .k[data-bewerk]{cursor:text}
.blok .k[data-bewerk]:hover{text-decoration:underline dotted;text-underline-offset:2px}
.blok .naamvak{width:100%;border:1px solid var(--lime);border-radius:4px;padding:0 3px;
      font:inherit;font-size:11.5px;font-weight:600;background:#fff}
/* De keuzelijst met collega's in de kop van een route. Zelfde maat als het
   invulveld ernaast, zodat de kop niet verspringt als je van kiezen naar
   zelf typen gaat. */
.route > h4 .naamkies,.route > h4 .naamvak{width:100%;font:inherit;font-size:11px;font-weight:600;
      padding:0 3px;border:1px solid var(--lime);border-radius:4px;background:#fff;color:var(--ink);
      max-width:100%;box-sizing:border-box}
/* Het vlaggetje dat tijdens het slepen laat zien waar je uitkomt. */
.sleeptip{position:fixed;z-index:200;background:#111827;color:#fff;font-size:11.5px;font-weight:600;
      padding:4px 9px;border-radius:6px;pointer-events:none;white-space:nowrap;display:none;
      box-shadow:0 4px 14px rgba(0,0,0,.3)}
.blok.klaar .k{text-decoration:line-through}
.hd-blok{border-radius:6px;border-left:4px solid;padding:2px 6px;font-size:11px;font-weight:600;
      margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-blok.klaar{opacity:.42;text-decoration:line-through}

/* ── telefoonweergave: dagen onder elkaar ── */
.lijst{display:none}
@media (max-width:820px){
  .agenda{display:none}
  .lijst{display:block}
  /* Het routebord op een telefoon: dagen onder elkaar en per dag de routes
     onder elkaar, anders staan vijftien routekolommen op 375 pixels en zie
     je van geen enkele klant de naam (Gerrit, 12 sep 2026). */
  /* Dubbele klasse: de gewone regels voor .bord en .borddag staan verderop
     in dit bestand en zouden anders winnen. */
  .bord.bord{flex-direction:column}
  .bord .borddag{flex:0 0 auto}
  .borddag .routes{flex-direction:column}
  .routes .route{min-height:0;flex:0 0 auto}
}
.dagkaart{background:var(--kaart);border:1px solid var(--rand);border-radius:12px;padding:10px;margin-bottom:10px}
.dagkaart.vandaag{border-color:var(--lime);box-shadow:0 0 0 2px rgba(139,197,63,.25)}
.dagkaart h3{margin:0 0 2px;font-size:12.5px;color:var(--groen)}
.dagkaart .datum{font-size:11px;color:var(--grijs);margin-bottom:9px}
.dagkaart .leeg{font-size:12px;color:#d1d5db;padding:2px 0}
.afs{border:1px solid var(--rand);border-left:4px solid;border-radius:9px;padding:8px 9px;margin-bottom:7px;cursor:pointer;background:#fff}
.afs.klaar{opacity:.45}
.afs.klaar .klant{text-decoration:line-through}
.afs .kop{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.afs .tijd{font-weight:700;font-size:12.5px}
.afs .badge{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:1px 6px;border-radius:4px}
.afs .klant{font-size:13px;font-weight:600;margin-top:3px;line-height:1.35}
.afs .sub{font-size:11.5px;color:var(--grijs);margin-top:2px;line-height:1.45}
.plus{display:block;width:100%;margin-top:6px;background:none;border:1px dashed var(--rand);
       border-radius:8px;color:var(--grijs);font:inherit;font-size:12px;padding:7px;cursor:pointer}
.plus:hover{border-color:var(--lime);color:var(--groen)}

/* ── servicemeldingen uit Logic4 ── */
.its{background:#fff;border:1px solid var(--rand);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:none}
.its.aan{display:block}
.its-kop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.its-kop h3{margin:0;font-size:14px;color:var(--groen);flex:1}
.its-kop input{border:1px solid var(--rand);border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;width:220px}
.its-rij{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-top:1px solid #f3f4f6}
.its-rij .mid{flex:1;min-width:0}
.its-rij .naam{font-size:13px;font-weight:600}
.its-rij .naam .nr{color:var(--grijs);font-weight:400;font-size:11.5px}
.its-rij .sub{font-size:11.5px;color:var(--grijs);margin-top:2px;line-height:1.45}
.its-rij .om{font-size:12px;color:#4b5563;margin-top:3px;line-height:1.45}
.its-rij .telaat{color:var(--rood);font-weight:600}
.its-rij button{background:var(--groen);color:#fff;border:0;border-radius:8px;padding:8px 13px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;flex:none}
.its-rij button:hover{background:var(--groen-donker)}
.its-rij .alGepland{background:#e8f2d9;color:#3f6b21;border-radius:8px;padding:8px 13px;font-size:12px;font-weight:600;flex:none}
.its-meer{display:block;width:100%;margin-top:8px;background:none;border:1px dashed var(--rand);border-radius:8px;color:var(--grijs);font:inherit;font-size:12px;padding:8px;cursor:pointer}
.its-leeg{font-size:12.5px;color:var(--grijs);padding:6px 0}

/* ── routeknop ── */
.routePrint{background:none;border:0;cursor:pointer;font-size:12px;padding:0 3px;border-radius:5px;opacity:.55;line-height:1}
.routePrint:hover{opacity:1;background:#eef4e8}
.route-knop{background:none;border:0;cursor:pointer;font-size:14px;padding:2px 4px;border-radius:6px;float:right}
.route-knop:hover{background:#eef4e8}
.route-menu{position:absolute;background:#fff;border:1px solid var(--rand);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:30;padding:6px;min-width:170px}
.route-menu button{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;font-size:13px;padding:8px 10px;border-radius:7px;cursor:pointer}
.route-menu button:hover{background:#f4f9ec}

/* ── formulier (laag over de pagina) ── */
/* ── Routebord ────────────────────────────────────────────────────────
   Zo werkt de planning echt (Gerrit, 7 sep 2026, met de Outlook-agenda van
   de afdeling ernaast): per dag rijden er een paar routes, en elke route is
   een kolom met stops eronder. "Op maandag heb je route 1, route 2, route 3.
   En zo iedere dag. Ik wil dus dat je echt routes kunt toevoegen op een dag
   en die kunt vullen."

   Een tijdraster past daar niet op: de stops staan niet op een tijdstip maar
   op een volgorde binnen de route. Vandaar dit bord: dagen naast elkaar, in
   elke dag de routes naast elkaar, in elke route de stops onder elkaar. */
/* De dagen naast elkaar. Een dag met drie routes hoort breder te zijn dan een
   dag met één; anders vallen de laatste routes buiten beeld en zie je precies
   niet wat je zoekt. De breedte wordt per dag gezet uit het aantal routes. */
/* Alles op één scherm, net als de weekweergave in Outlook.
   ═══════════════════════════════════════════════════════════════════════
   Gerrit (7 sep 2026): "Als ik voor iedere dag 3 routes doe dan zie ik het
   niet op 1 scherm. Ik wil het wel allemaal op 1 scherm zonder horizontaal te
   scrollen kunnen zien. Dat kan op de afbeelding die ik je stuurde ook (in
   Outlook)."

   De dagen hadden een vaste breedte die met het aantal routes meegroeide -
   drie routes werd bijna vijfhonderd pixels per dag, en dan is een werkweek
   twee en een half scherm breed. Outlook doet het andersom: de dagen delen de
   ruimte die er is, en wat erin staat wordt smaller naarmate er meer in staat.

   Dus nu: de dagen zijn even breed en vullen samen het scherm, en de routes
   binnen een dag delen de breedte van die dag. Bij drie routes op vijf dagen
   is een routekolom een centimeter of twee - smal, maar je ziet de hele week
   in één blik en dat is waar het bord voor is. Wil je één dag groot zien, dan
   is daar de knop Dag voor. */
.bord{display:flex;gap:8px;padding-bottom:6px;align-items:stretch;width:100%}
.borddag{background:var(--kaart);border:1px solid var(--rand);border-radius:12px;overflow:hidden;
      flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.borddag.vandaag{border-color:var(--lime);box-shadow:0 0 0 2px rgba(139,197,63,.25)}
.borddag > h3{margin:0;padding:8px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;
      background:var(--groen);color:#fff;display:flex;align-items:center;gap:8px}
.borddag > h3 .dd{margin-left:auto;font-weight:400;opacity:.85;text-transform:none;letter-spacing:0}
.dagbalken{padding:5px 6px 0;display:flex;flex-direction:column;gap:3px}
.dagbalk{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
      border-radius:5px;padding:2px 7px;cursor:pointer;background:#eef0f2;color:#4b5563}
.dagbalk.let{background:#fee2e2;color:#b91c1c}
/* Het routebord: per dag de routes NAAST elkaar, elk met zijn eigen stops
   eronder. Gerrit (7 sep 2026) tekende het zo:

       Maandag                Dinsdag
       Route 1   Route 2      Route 1
       Stop 1    Stop 1       Stop 1
       Stop 2    Stop 2
       Stop 3    Stop 3

   Dat deed het bord al, maar je zag het niet: een route had alleen een klein
   groen nummertje en verder "wie rijdt?", en met één route per dag las een
   dag als een los tegeltje in plaats van als een kolom met routes. Nu staat
   er "Route 1" voluit boven elke kolom, met de naam van de rijder eronder,
   en heeft elke kolom een vaste minimumhoogte zodat een lege route er ook
   uitziet als een kolom waar iets in moet. */
.routes{display:flex;gap:5px;padding:6px;align-items:stretch}
.route{flex:1 1 0;min-width:0;border:1px solid var(--rand);border-radius:9px;background:#fff;
      display:flex;flex-direction:column;min-height:120px}
.route.sleepdoel{border-color:var(--lime);box-shadow:0 0 0 2px rgba(139,197,63,.35)}
.route > h4{margin:0;padding:6px 8px;font-size:11.5px;background:#eef4e8;border-bottom:1px solid var(--rand);
      border-radius:8px 8px 0 0;display:grid;grid-template-columns:1fr auto auto;
      grid-template-areas:"nr tel weg" "wie wie wie";gap:2px 5px;line-height:1.25}
.route > h4 .nr{grid-area:nr;color:var(--groen);font-weight:700;font-size:11.5px;
      text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.route > h4 .rijders{grid-area:wie;display:flex;flex-direction:column;gap:1px;min-width:0}
.route > h4 .rijder{display:flex;align-items:center;gap:3px;min-width:0}
.route > h4 .wie{font-weight:600;color:var(--ink);min-width:0;cursor:text;font-size:11px;flex:1;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route > h4 .plekWeg{background:none;border:0;color:var(--grijs);cursor:pointer;font-size:12px;line-height:1;padding:0 2px;flex:none}
.route > h4 .plekWeg:hover{color:var(--rood)}
.route > h4 .plekErbij{background:none;border:1px dashed var(--rand);border-radius:5px;color:var(--grijs);cursor:pointer;
      font:inherit;font-size:10px;padding:1px 6px;align-self:flex-start;margin-top:1px}
.route > h4 .plekErbij:hover{border-color:var(--lime);color:var(--groen)}
.route > h4 .wie:hover{text-decoration:underline dotted;text-underline-offset:2px}
/* Alleen-lezen: geen streepje en geen tekstcursor, anders lijkt het klikbaar. */
.route > h4 .wie.vast{cursor:default}
.route > h4 .wie.vast:hover{text-decoration:none}
.dagnotitie.vast{cursor:default}
.dagnotitie.vast:hover{color:var(--grijs)}
.route > h4 .tel{grid-area:tel;background:var(--groen);color:#fff;border-radius:999px;font-size:9.5px;font-weight:700;
      padding:1px 6px;align-self:center}
.route > h4 .weg{grid-area:weg;background:none;border:0;color:var(--grijs);cursor:pointer;font-size:13px;line-height:1;padding:0 2px}
.route > h4 .weg:hover{color:var(--rood)}
.route .stops{padding:4px;display:flex;flex-direction:column;gap:3px;flex:1}
.route .leegdrop{font-size:10.5px;color:#b7bfb9;text-align:center;padding:12px 2px;
      border:1px dashed var(--rand);border-radius:7px;margin:2px}
/* In een smalle kolom moet de tekst afbreken in plaats van de kolom
   openduwen; anders is het bord alsnog breder dan het scherm. */
.route .stop{overflow-wrap:anywhere;white-space:normal}
.route > h4 .nr{overflow:hidden;text-overflow:ellipsis}
.stop{border-radius:6px;border-left:4px solid;padding:3px 6px;font-size:11px;line-height:1.35;cursor:grab;
      background:#fff;border-top:1px solid var(--rand);border-right:1px solid var(--rand);border-bottom:1px solid var(--rand)}
.stop.sleept{opacity:.5}
.stop .kl{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop .rg{color:var(--grijs);font-size:10.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop.letop{background:#fee2e2;border-color:#b91c1c}
.stop.klaar{opacity:.45}
.stop.klaar .kl{text-decoration:line-through}
.route .plusstop{margin:0 4px 4px;background:none;border:1px dashed var(--rand);border-radius:6px;
      color:var(--grijs);font:inherit;font-size:10.5px;padding:3px;cursor:pointer}
.route .plusstop:hover{border-color:var(--lime);color:var(--groen)}
.plusroute{margin:0 6px 7px;background:none;border:1px dashed var(--rand);border-radius:8px;
      color:var(--grijs);font:inherit;font-size:11.5px;padding:5px;cursor:pointer;width:calc(100% - 12px)}
.plusroute:hover{border-color:var(--lime);color:var(--groen)}
.dagnotitie{margin:0 6px 7px;font-size:10.5px;color:var(--grijs);border-top:1px dashed var(--rand);padding-top:5px;cursor:text}
.dagnotitie:hover{color:var(--ink)}
.weergavekeus{display:inline-flex;border:1px solid var(--rand);border-radius:9px;overflow:hidden;background:#fff}
.weergavekeus button{border:0;background:#fff;font:inherit;font-size:12px;padding:7px 13px;cursor:pointer;color:var(--grijs)}
.weergavekeus button.aan{background:var(--groen);color:#fff;font-weight:600}

/* Het afsprakenvenster moet op élk bureaubladscherm passen zonder scrollen.
   Gerrit (7 sep 2026): "Nieuwe afspraak plannen, dat venster moet zo gemaakt
   zijn dat je niet hoeft te scrollen op welk desktopscherm dan ook."
   Een laptop van 1366x768 houdt ongeveer 660 pixels over; daar past dit in
   door twee kolommen te gebruiken en de tussenruimtes te halveren. */
.laag{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;
      align-items:center;justify-content:center;padding:12px;overflow-y:auto}
.zoekbalk{background:#f4f9ec;border:1px solid #dbe7cc;border-radius:10px;padding:9px 11px;margin:0 0 13px}
.zoekbalk label{display:block;font-size:11.5px;font-weight:700;color:var(--ink);margin:0 0 4px}
.zoekrij{display:flex;gap:7px}
.zoekrij input{flex:1 1 auto;min-width:0}
.zoekrij button{flex:0 0 auto;background:var(--groen,#144734);color:#fff;border:0;border-radius:8px;
   padding:0 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.zoekrij button:disabled{opacity:.55;cursor:default}
.zoekuit{font-size:11.5px;color:var(--grijs,#6b7280);margin-top:5px;min-height:14px}
.zoekuit.ok{color:#15803d}.zoekuit.bad{color:#b91c1c}
.formkaart{background:#fff;border-radius:14px;max-width:720px;width:100%;padding:16px 18px;margin:auto}
.formkaart h3{margin:0 0 8px;font-size:15px;color:var(--groen)}
.formkaart label{display:block;font-size:11.5px;color:var(--grijs);margin:8px 0 3px}
.formkaart input,.formkaart select,.formkaart textarea{width:100%;padding:6px 9px;border:1px solid var(--rand);
      border-radius:8px;font:inherit;font-size:13px;color:var(--ink);background:#fff}
.formkaart textarea{resize:vertical;min-height:38px}
.formkaart input:focus,.formkaart select:focus,.formkaart textarea:focus{outline:2px solid var(--lime);outline-offset:-1px}
.formkaart .rij{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.formkaart .rij2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.formkaart .heledagkeus{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer;margin:4px 0 6px}
.formkaart .heledagkeus input{width:auto}
/* Twee kolommen naast elkaar: links de afspraak, rechts de klantgegevens.
   Op een smal scherm vallen ze onder elkaar en mag er wél gescrold worden. */
.formkaart .kolommen{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:640px){ .formkaart .kolommen{grid-template-columns:1fr} }
.formkaart .knoppen{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.formkaart .knoppen button{font:inherit;font-size:13.5px;border-radius:9px;padding:11px 18px;cursor:pointer}
.formkaart .doe{background:var(--groen);color:#fff;border:0;font-weight:600;flex:1}
.formkaart .doe:hover{background:var(--groen-donker)}
.formkaart .weg{background:#fff;border:1px solid #fecaca;color:var(--rood)}
.formkaart .terug{background:#fff;border:1px solid var(--rand);color:var(--grijs)}
.catkeus{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px}
.catkeus button{display:flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;padding:9px 10px;
      border-radius:9px;border:2px solid var(--rand);background:#fff;cursor:pointer;font-weight:600;color:var(--ink)}
.catkeus .bol{width:11px;height:11px;border-radius:50%;flex:none}
.melding{font-size:12.5px;color:var(--rood);min-height:16px;margin-top:8px}
.gepland-door{font-size:11.5px;color:var(--grijs);margin-top:10px}
</style>

<body>

<header>

  <h1>📅 Planning</h1>
  <span class="wie" id="wie"></span>
  <button class="knop" id="uitKnop" type="button">Uitloggen</button>
</header>

<main>
  <div class="weekbalk">
    <h2 id="weekTitel">Week</h2>
    <button type="button" id="vorige" title="Vorige week">&larr;</button>
    <button type="button" id="vandaagKnop">Vandaag</button>
    <button type="button" id="volgende" title="Volgende week">&rarr;</button>
    <input type="date" id="springNaar" title="Spring naar de week van deze datum">
    <button type="button" id="itsKnop">🔧 Servicemeldingen</button>
    <button type="button" class="nieuw" id="nieuwKnop">+ Afspraak</button>
    <span class="weergavekeus" id="periodeKeus">
      <button type="button" data-periode="dag">Dag</button>
      <button type="button" data-periode="werkweek" class="aan">Werkweek</button>
      <button type="button" data-periode="week">Hele week</button>

      <button type="button" data-weergave="tijd">Tijdraster</button>
    </span>
  </div>
  <!-- Zoeken in het tijdraster. Gerrit (11 sep 2026): "een zoekbalk waarin je
       gemakkelijk het ordernummer, klantnaam of ITS-nummer kunt invullen en hij
       die dan in de planning uitlicht." Wat raak is licht op, de rest wordt
       vaag; staat de treffer buiten de periode die je ziet, dan springt de

  <div class="rasterzoek" id="rasterZoekBalk">

  <!-- Servicemeldingen uit Logic4 (ITS), status Inplannen. Aanklikken zet de
       melding als afspraak in de week, met naam, adres en telefoon erbij. -->
  <div class="its" id="itsPaneel">
    <div class="its-kop">
      <h3 id="itsTitel">Servicemeldingen uit Logic4</h3>
      <input type="search" id="itsZoek" placeholder="Zoek op naam, plaats of klus…">
    </div>
    <div id="itsLijst"><div class="its-leeg">Bezig met ophalen…</div></div>
  </div>

  <!-- het routebord: per dag de routes naast elkaar -->

  <!-- brede schermen: het tijdraster -->
  <div class="agenda" id="agendaHouder">
    <div class="agenda-scroll" id="agendaScroll">
      <!-- Hele dagen, als lange balken boven het raster. Gerrit (11 sep 2026):
           "als een lange balk bovenin, boven de planning, en niet in het
           raster van de dagen waar de afspraken staan." -->
      <!-- Blijft staan bij het scrollen: de dagen, de hele dagen en de routes.
           Gerrit (12 sep 2026): "Die datumbalk bovenaan moet fixed zijn zodat
           je die altijd blijft zien (inclusief afspraken die een hele dag
           duren)". Eén blok dat plakt, met dezelfde kolommen als het raster. -->
      <div class="rasterkop" id="rasterKop">
        <div class="dagkoppen" id="dagKoppen"></div>
        <div class="dagbanden" id="dagbanden"></div>
        <div class="routekoppen" id="routeKoppen"></div>
      </div>

  <!-- telefoon: de dagen onder elkaar -->

</main>

<div id="laagHouder"></div>

<script>
"use strict";

var W = "https://fonteyn-data-store.g-mulder.workers.dev";
var BUCKET = "planning";
var DAGEN = ["Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag","Zondag"];
var DAGKORT = ["ma","di","wo","do","vr","za","zo"];
var MAANDEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];

/* De categorieën. De sleutel wordt opgeslagen, dus die verandert nooit meer;
   naam en kleur mogen wel. 'levering' en 'service' waren er vanaf dag één,
   de rest kwam er op 24 aug 2026 bij ("en nog andere logische categorieën"). */
var CATS = {
  levering:     { naam:"Levering",              kleur:"#8bc53f", zacht:"#f1f8e5" },
  service:      { naam:"Service",               kleur:"#f59e0b", zacht:"#fef3d8" },
  /* Gerrit (12 sep 2026): Ophalen/retour en Showroom/bezichtiging eruit,
     Verlof erbij in het blauw. Een oude afspraak in een verdwenen categorie
     valt terug op Intern (zie cat). */
  verlof:       { naam:"Verlof",                kleur:"#3b82f6", zacht:"#e3edfd" },
  intern:       { naam:"Intern / overig",       kleur:"#6b7280", zacht:"#eef0f2" },
};
function cat(a){ return CATS[a.soort] || CATS.intern; }

var UUR_VAN = 6, UUR_TOT = 22;      // het raster loopt van 06:00 tot 22:00
var UUR_PX = 46;                    // hoogte van één uur

var ik = (localStorage.getItem("fp.email")||"").toLowerCase();
/* Mag deze persoon iets veranderen, of alleen kijken?
   ═══════════════════════════════════════════════════════════════════
   De monteurs van Service en de jongens van Plaatsing kijken op hun telefoon
   welke route ze rijden (Gerrit, 7 sep 2026). Zij zien de agenda volledig,
   maar mogen er niets in verzetten - anders staat er 's ochtends een route
   die niemand zo bedoeld heeft.

   Alles wat wijzigt hangt aan deze vlag: de knoppen verschijnen niet, slepen
   doet niets en het formulier opent zonder opslaan of verwijderen. */
/* Op de telefoon alleen kijken. Gerrit (12 sep 2026): "als iemand via zijn
   telefoon kijkt dat die geen aanpassingen kan doen in de agenda". De
   telefoonversie komt van /m/ en heeft de brug (mobiel-brug.js) geladen;
   daaraan herkennen we hem, niet aan de schermbreedte, want een smal venster
   op een pc blijft gewoon een pc. */
var OP_TELEFOON = !!(window.fpBrug || /^\/m\//.test(location.pathname));
var MAG_BEWERKEN = !OP_TELEFOON && (window.fpToegang ? window.fpToegang.mag("planning-bewerk", ik) : true);
var afspraken = [];
var maandag = weekStart(new Date());
var filterUit = {};                 // categorie-sleutel -> true als uitgevinkt

function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function teamKey(){ return localStorage.getItem("fp.teamkey")||""; }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function weekStart(d){
  var k = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  k.setDate(k.getDate() - (k.getDay()+6)%7);
  return k;
}
function weekNr(d){
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  var w1 = new Date(t.getFullYear(),0,4);
  return 1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7);
}
/* "gerwin@fonteyn.nl" of "fonteyn.gerwin" wordt "Gerwin" - dezelfde regel als
   het dashboard, zodat een naam er overal hetzelfde uitziet. */
function voornaam(wie){
  if (!wie) return "";
  var lokaal = String(wie).split("@")[0].replace(/^fonteyn\./i,"");
  return lokaal.split(/[.\-_]/).filter(Boolean).map(function(d){
    return d.charAt(0).toUpperCase()+d.slice(1).toLowerCase(); }).join(" ");
}
/* De naam van wie iets plande. Mike werkt op het service-account, dus
   "Servicespa" moet als Mike in beeld komen; de rest volgt de gewone regel.
   Namen van de afdeling (Gerrit, 7 sep 2026): Mike, Gerwin, Kevin, Bert-Jan,
   Tim en Bart. */
/* Hoe iemand heet op het bord. De inlognaam is niet altijd de naam die de
   afdeling gebruikt: Mike zit op spaservice@ en Bert-Jan schrijft zichzelf met
   een streepje. Wat hier niet in staat krijgt gewoon zijn voornaam. */
var PLANNERS = { "servicespa":"Mike", "spaservice":"Mike", "mike.deboer":"Mike de Boer",
                 "bertjan":"Bert-Jan", "bertjan.kok":"Bert-Jan Kok",
                 "bart.vdb":"Bart", "tim.geerestein":"Tim", "fonteynbot":"Fonteynbot",
                 "hans.vanputten":"Hans van Putten", "michael.berghorst":"Michael Berghorst",
                 "wouter.vedder":"Wouter Vedder", "thieme":"Thieme", "joeri":"Joeri",
                 "dylan":"Dylan", "joey":"Joey", "patrick":"Patrick" };

/* Wie er niet in de keuzelijst hoort. Ze mogen de planning wél zien - Chantal
   en Arno kijken mee, Dolf en Gerrit zitten overal bij - maar ze rijden geen
   route, en dan hoort hun naam ook niet in dat menu te staan. */
var NIET_OP_DE_WEG = ["gerrit","dolf","chantal","arno","don","fonteyn.don","maartens",
                      "fonteynbot","nomi","gretha","osman","manon","reinier.k"];
function planNaam(wie){
  var lokaal = String(wie||"").split("@")[0].replace(/^fonteyn\./i,"").toLowerCase();
  return PLANNERS[lokaal] || voornaam(wie);
}

/* Wie kan er op een route gezet worden.
   ═══════════════════════════════════════════════════════════════════════
   Gerrit (7 sep 2026): "Wie gaat erheen: dropdownmenu maken van de
   beschikbare collega's."

   De lijst komt uit toegang.js, uit de groep die Planning mag zien - dat is
   precies de afdeling: de service- en plaatsingsploeg plus Kevin en Gerwin.
   Zo hoeft er geen tweede lijst bijgehouden te worden die na een maand niet
   meer klopt; komt er iemand bij de afdeling, dan staat hij er hier vanzelf
   bij zodra hij toegang krijgt.

   Zelf typen blijft mogelijk. Er rijdt weleens iemand mee die niet in het
   dashboard staat (een uitzendkracht, een monteur van een leverancier), en
   dan moet je die naam gewoon kwijt kunnen. */
function collegas(){
  var uit = [];
  try {
    var set = window.fpToegang ? window.fpToegang.set("planning") : null;
    if (set) set.forEach(function(m){
      var lokaal = String(m||"").split("@")[0].replace(/^fonteyn\./i,"").toLowerCase();
      if (NIET_OP_DE_WEG.indexOf(lokaal) >= 0) return;
      var naam = planNaam(m);
      if (naam && uit.indexOf(naam) < 0) uit.push(naam);
    });
  } catch(e){}
  uit.sort(function(a,b){ return a.localeCompare(b); });
  return uit;
}
function minuten(t){ var m = String(t||"").match(/^(\d{1,2}):(\d{2})/); return m ? (+m[1])*60+(+m[2]) : null; }
function tijdStr(min){ return String(Math.floor(min/60)).padStart(2,"0")+":"+String(min%60).padStart(2,"0"); }

/* ── opslag ── */
async function lees(){
  try{
    var r = await fetch(W+"/data/"+BUCKET, { headers:{ "X-Fonteyn-Auth": teamKey() } });
    if(!r.ok) return null;
    var j = await r.json();
    // De routes en de dagnotities zitten in dezelfde bucket; die halen we hier
    // meteen op zodat het bord ze heeft.
    routesPerDag = (j && j.routes && typeof j.routes==="object") ? j.routes : {};
    dagNotities  = (j && j.notities && typeof j.notities==="object") ? j.notities : {};
    return (j && Array.isArray(j.afspraken)) ? j.afspraken : [];
  }catch(e){ return null; }
}
async function bewaar(wijzig){
  /* Vangnet. De knoppen zijn al weg voor wie niet mag bewerken, maar één
     vergeten koppeling zou anders alsnog de agenda van de afdeling
     veranderen. Liever hier hard tegenhouden. */
  if (!MAG_BEWERKEN) throw new Error("Je kijkt mee met de planning; wijzigen doet de afdeling zelf.");
  /* Verse gegevens ophalen, wijzigen, alles terugschrijven. LET OP: hier
     stond eerder alleen { afspraken }, en dat zou de routes en de
     dagnotities bij elke wijziging aan een afspraak wissen - KV kent alleen
     'vervang alles'. */
  var r0 = await fetch(W+"/data/"+BUCKET, { headers:{ "X-Fonteyn-Auth": teamKey() } });
  if (!r0.ok) throw new Error("De opslag is niet bereikbaar. Probeer het zo nog eens.");
  var j = await r0.json();
  var routes   = (j && j.routes && typeof j.routes==="object") ? j.routes : {};
  var notities = (j && j.notities && typeof j.notities==="object") ? j.notities : {};
  afspraken = wijzig(Array.isArray(j.afspraken) ? j.afspraken : []);
  routesPerDag = routes; dagNotities = notities;
  var r = await fetch(W+"/data/"+BUCKET, { method:"PUT",
    headers:{ "Content-Type":"application/json", "X-Fonteyn-Auth": teamKey() },
    body: JSON.stringify({ afspraken: afspraken, routes: routes, notities: notities }) });
  if(!r.ok) throw new Error("Bewaren mislukte (HTTP "+r.status+").");
  // De anderen die de agenda openhebben laten weten dat er iets veranderd is.
  liveStuur({ soort:"gewijzigd", wat:"planning" });
}

/* ── live meekijken ──────────────────────────────────────────────────
   Gerrit (7 sep 2026): de agenda moet live zijn. Voegt Kevin iets toe, dan
   ziet Gerwin het; haalt Kevin het weer weg, dan hoort het bij Gerwin ook te
   verdwijnen - en dat laatste ging mis, want zonder verbinding zag je alleen
   je eigen scherm van een minuut geleden.

   De kamer stuurt geen afspraken rond maar alleen een seintje "er is iets
   veranderd". Iedereen leest daarop de bucket opnieuw. Dat is bewust: een
   verwijderde afspraak is geen veld dat verandert maar een regel die er niet
   meer is, en die krijg je met losse veldjes nooit goed weg. Zo blijft KV de
   enige waarheid en klopt toevoegen, wijzigen én verwijderen.

   Valt de verbinding weg, dan werkt alles gewoon door: er staat een
   verversing van een halve minuut onder. */
var liveWs = null, liveKlaar = false, liveAanwezig = [];
function liveStuur(obj){
  if (liveKlaar && liveWs && liveWs.readyState === 1) { try{ liveWs.send(JSON.stringify(obj)); }catch(e){} }
}
function liveStart(){
  if (!teamKey()) return;
  try { liveWs = new WebSocket("wss://fonteyn-data-store.g-mulder.workers.dev/live/planning"); }
  catch(e){ return; }
  liveWs.addEventListener("open", function(){
    liveWs.send(JSON.stringify({ soort:"hallo", sleutel: teamKey(), wie: ik || "onbekend" }));
  });
  liveWs.addEventListener("message", function(ev){
    var d = null; try { d = JSON.parse(ev.data); } catch(e){ return; }
    if (d.soort === "welkom"){ liveKlaar = true; liveAanwezig = d.aanwezig||[]; toonAanwezig(); return; }
    if (d.soort === "erbij"){ if (liveAanwezig.indexOf(d.wie)<0) liveAanwezig.push(d.wie); toonAanwezig(); return; }
    // (dubbele namen kunnen ontstaan als iemand twee vensters open heeft)
    if (d.soort === "weg"){ liveAanwezig = liveAanwezig.filter(function(w){ return w!==d.wie; }); toonAanwezig(); return; }
    if (d.soort === "gewijzigd") ververs(d.wie);
  });
  liveWs.addEventListener("close", function(){
    liveKlaar = false; liveAanwezig = []; toonAanwezig();
    setTimeout(liveStart, 5000 + Math.random()*5000);
  });
  liveWs.addEventListener("error", function(){ try{ liveWs.close(); }catch(e){} });
}
/* Opnieuw ophalen en tekenen. Staat er een formulier open, dan wachten we:
   iemand midden in een afspraak het scherm onder handen wegtrekken is erger
   dan een paar seconden later bijwerken. */
var verversTimer = null;
async function ververs(doorWie){
  if (document.querySelector(".laag")) { clearTimeout(verversTimer); verversTimer = setTimeout(ververs, 1500); return; }
  var vers = await lees();
  if (vers === null) return;
  afspraken = vers;
  teken();
  if (doorWie && doorWie !== ik) meldBijgewerkt(doorWie);
}
/* Kort zichtbaar maken dat het scherm net is bijgewerkt door een collega.
   Zonder dat lijkt het alsof de agenda uit zichzelf verspringt. */
var meldTimer = null;
function meldBijgewerkt(wie){
  var el = $("liveMelding");
  if (!el) return;
  el.textContent = "Bijgewerkt door " + voornaam(wie);
  el.style.opacity = "1";
  clearTimeout(meldTimer);
  meldTimer = setTimeout(function(){ el.style.opacity = "0"; }, 4000);
}
function toonAanwezig(){
  var el = $("liveAanwezig");
  if (!el) return;
  /* Iemand met twee vensters open staat twee keer in de lijst; dan las het
     als "Gerwin, Gerwin kijken mee". Eén keer per persoon is genoeg. */
  var anderen = liveAanwezig.filter(function(w,i){ return w !== ik && liveAanwezig.indexOf(w)===i; });
  el.innerHTML = anderen.length
    ? '<span class="live-stip"></span>' + anderen.map(function(w){ return esc(voornaam(w)); }).join(", ") +
      (anderen.length===1 ? " kijkt mee" : " kijken mee")
    : "";
}

/* ── betaald, aanbetaald of niets ────────────────────────────────────
   Gerrit (7 sep 2026): "Bij Planning wil ik kunnen zien (met groen, oranje,
   rood) of een order volledig is betaald, aanbetaald of niet betaald."

   De afspraak heeft al een veld ordernummer. Daarmee vragen we bij Logic4 op
   wat de order kost en wat er binnen is. De worker onthoudt dat tien minuten,
   dus bladeren door de weken kost bijna niets.

   Staat er geen ordernummer op de afspraak, of kent Logic4 het nummer niet,
   dan komt er GEEN stip. Grijs zou "niet betaald" kunnen suggereren en dat
   weten we juist niet. */
var betaald = {};        // ordernummer -> {stand, bedrag, betaald, status}
var betaaldBezig = false;
var BETAALD = {
  betaald:    { kleur:"#3e7d3f", naam:"volledig betaald" },
  aanbetaald: { kleur:"#e0a300", naam:"aanbetaald" },
  open:       { kleur:"#c8102e", naam:"niet betaald" },
};
function betaalStip(a){
  var nr = String(a.ordernr||"").trim();
  if (!nr) return "";
  var b = betaald[nr];
  if (!b || !BETAALD[b.stand]) return "";
  var t = BETAALD[b.stand];
  var uitleg = "Order "+nr+": "+t.naam;
  if (b.bedrag) uitleg += " - "+euro(b.betaald)+" van "+euro(b.bedrag);
  if (b.status) uitleg += " ("+b.status+")";
  return '<span class="betaalstip" style="background:'+t.kleur+'" title="'+esc(uitleg)+'"></span>';
}
function euro(n){ return "\u20ac " + Number(n||0).toLocaleString("nl-NL",{minimumFractionDigits:2,maximumFractionDigits:2}); }
/* Alleen de ordernummers die nu in beeld staan opvragen. De worker haalt er
   maximaal dertig per keer op (een worker mag beperkt naar buiten); is er
   meer nodig, dan vraagt hij vanzelf de rest in een tweede ronde. */
async function haalBetaald(){
  if (betaaldBezig || !teamKey()) return;
  var nrs = {};
  weekLijst().forEach(function(d){ d.items.forEach(function(a){
    var nr = String(a.ordernr||"").trim();
    if (/^\d{4,12}$/.test(nr) && !betaald[nr]) nrs[nr] = 1;
  }); });
  var lijst = Object.keys(nrs);
  if (!lijst.length) return;
  betaaldBezig = true;
  try{
    var r = await fetch(W+"/planning/betaalstatus?orders="+lijst.join(","), { headers:{ "X-Fonteyn-Auth": teamKey() } });
    var j = await r.json();
    if (j && j.ok){
      Object.keys(j.orders||{}).forEach(function(k){ betaald[k] = j.orders[k]; });
      /* Nummers die Logic4 niet kent onthouden we óók, als "geen stand".
         Zonder dat zouden ze bij elke keer tekenen opnieuw worden opgevraagd
         en blijft het scherm zichzelf aan het bevragen. */
      if (!j.restant) lijst.forEach(function(nr){ if (!betaald[nr]) betaald[nr] = { stand:null }; });
      teken();
      // Nog niet alles opgehaald? Dan zo de rest.
      if (j.restant > 0) setTimeout(function(){ betaaldBezig = false; haalBetaald(); }, 400);
    }
  }catch(e){}
  betaaldBezig = false;
}

/* ── legenda + filter ── */

  /* De twee live-vakjes staan vast in de balk; alleen de categorie-chips

  var houder = $("legendaChips");

    Object.keys(BETAALD).map(function(k){
      return '<span class="betaalstip" style="background:'+BETAALD[k].kleur+'"></span>'+esc(BETAALD[k].naam); }).join(" ")+'</span>';

  document.querySelectorAll(".cat-chip").forEach(function(ch){

}

/* ── weekgegevens ── */
function weekLijst(){
  var uit = [];
  var begin = periodeStart(), n = periodeAantal();
  for (var i=0;i<n;i++){
    var dag = new Date(begin); dag.setDate(dag.getDate()+i);
    var dISO = iso(dag);
    uit.push({ datum: dag, iso: dISO,
      items: afspraken.filter(function(a){ return opDag(a, dISO) && !filterUit[a.soort]; })
        .sort(function(a,b){ return String(a.tijd||"99").localeCompare(String(b.tijd||"99")); }) });
  }
  return uit;
}
var MAANDVOL = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
function titel(){
  var begin = periodeStart(), n = periodeAantal();
  var einde = new Date(begin); einde.setDate(einde.getDate()+n-1);
  if (periode === "dag"){
    $("weekTitel").textContent = DAGEN[(begin.getDay()+6)%7]+" "+begin.getDate()+" "+
      MAANDVOL[begin.getMonth()]+" "+begin.getFullYear();
    return;
  }
  if (periode === "maand"){
    $("weekTitel").textContent = MAANDVOL[begin.getMonth()].charAt(0).toUpperCase()+
      MAANDVOL[begin.getMonth()].slice(1)+" "+begin.getFullYear();
    return;
  }
  $("weekTitel").textContent = "Week "+weekNr(begin)+" · "+
    begin.getDate()+" "+MAANDEN[begin.getMonth()]+" - "+einde.getDate()+" "+MAANDEN[einde.getMonth()]+" "+einde.getFullYear();
}

/* ── het tijdraster (brede schermen) ──
   Afspraken met een tijd komen als blok op de juiste hoogte; wie elkaar
   overlappen worden over kolommetjes verdeeld, net als in Outlook.
   Zonder tijd = de "hele dag"-strook bovenin. */
function teken(){
  titel();
  var week = weekLijst();
  haalBetaald();
  var routeStand = weergave === "routes";
  $("bord").style.display = routeStand ? "" : "none";
  var ah = $("agendaHouder"); if (ah) ah.style.display = routeStand ? "none" : "";
  var lj = $("lijst"); if (lj) lj.style.display = routeStand ? "none" : "";
  var zb = $("rasterZoekBalk"); if (zb) zb.style.display = routeStand ? "none" : "";
  /* Op het bord staan de dagen naast elkaar en schuift het horizontaal; dat
     werkt ook op een telefoon, dus daar is geen aparte lijstweergave voor
     nodig. */
  if (routeStand){ tekenBord(); if (itsMeldingen !== null) itsTeken(); return; }
  var vandaagISO = iso(new Date());
  var uren = UUR_TOT - UUR_VAN;

  var kopHtml = '<div class="hoek"></div>';
  week.forEach(function(w,i){
    var route = w.items.some(function(a){ return a.plaats && !a.klaar; })
      ? '<button type="button" class="route-knop" data-datum="'+w.iso+'" title="Route van deze dag in Google Maps">🚗</button>' : "";
    kopHtml += '<div class="dag-kop'+(w.iso===vandaagISO?" vandaag":"")+'">'+route+
      '<span class="dnaam">'+DAGKORT[dagIndex(w.datum)]+'</span><br><span class="dnum">'+w.datum.getDate()+'</span></div>';
  });
  var html = "";

  /* De routes van de dag, naast elkaar. Gerrit (11 sep 2026): "je moet bij
     TIJDRASTER ook kunnen zien om welke route het gaat" en "dat de routes
     naast elkaar staan". Elke dag krijgt per route een eigen strook, met de
     naam van de route erboven; wie er rijdt staat erbij zodra dat op het
     routebord is ingevuld. */
  var routeHtml = '<div class="heledag-label">route</div>';
  week.forEach(function(w){
    var routes = routesVan(w.iso);
    routeHtml += '<div class="routekop-cel">'+routes.map(function(r){
      var namen = rijdersVan(r).join(" & ");
      return '<div class="routekop"><span class="rnr">R'+r.nr+'</span>'+(namen?'<span class="rwie">'+esc(namen)+'</span>':'')+'</div>';
    }).join("")+'</div>';
  });

  /* Hele dagen staan niet in het raster maar als balken erboven; zie
     tekenBanden. */

  // urenkolom + 7 dagkolommen
  html += '<div style="height:'+(uren*UUR_PX)+'px;position:relative">';
  for (var u=UUR_VAN; u<=UUR_TOT; u++)
    html += '<div class="uur-label" style="position:absolute;right:0;top:'+((u-UUR_VAN)*UUR_PX)+'px;width:100%">'+String(u).padStart(2,"0")+'</div>';
  html += '</div>';

  var maxRoutes = 1;
  week.forEach(function(w,di){
    var isWeekend = di>=5;
    var routes = routesVan(w.iso);
    maxRoutes = Math.max(maxRoutes, routes.length);
    html += '<div class="dag-cel'+(isWeekend?" weekend":"")+'" data-datum="'+w.iso+'" style="height:'+(uren*UUR_PX)+'px">';
    for (var u2=1; u2<uren; u2++) html += '<div class="uurlijn" style="top:'+(u2*UUR_PX)+'px"></div>';
    if (w.iso===vandaagISO){
      var nu = new Date(); var nm = nu.getHours()*60+nu.getMinutes();
      var y = (nm - UUR_VAN*60)/60*UUR_PX;
      if (y>0 && y<uren*UUR_PX) html += '<div class="nu-lijn" style="top:'+y+'px"></div>';
    }
    /* Per route een eigen strook in de dagkolom. Een afspraak zonder
       routenummer hoort bij de eerste route, net als op het bord. */
    var br = 100/routes.length;
    routes.forEach(function(r, ri){
      var items = w.items.filter(function(a){
        if (minuten(a.tijd)===null) return false;
        var rn = Number(a.route)||0;
        return rn === r.nr || (!rn && ri===0);
      });
      html += '<div class="routekol'+(ri>0?" scheiding":"")+'" data-datum="'+w.iso+'" data-nr="'+r.nr+'" style="left:'+(ri*br)+'%;width:'+br+'%">'+blokken(items)+'</div>';
    });
    html += '</div>';
  });

  tekenBanden(week);
  /* Breed genoeg voor de routes naast elkaar, maar nooit breder dan het
     venster: opzij schuiven mag niet. Past het niet, dan worden de stroken
     smaller en zie je in het blok alleen het nummer en de naam. */
  ["rooster","rasterKop"].forEach(function(id){
    $(id).style.setProperty("--dagen", week.length);
    $(id).style.setProperty("--dagbreedte", Math.max(96, 84*maxRoutes) + "px");
  });
  $("rooster").style.minWidth = "0";
  $("dagKoppen").innerHTML = kopHtml;
  $("routeKoppen").innerHTML = routeHtml;
  $("rooster").innerHTML = html;

  // telefoonweergave
  $("lijst").innerHTML = week.map(function(w,i){
    var route = w.items.some(function(a){ return a.plaats && !a.klaar; })
      ? '<button type="button" class="route-knop" data-datum="'+w.iso+'" title="Route van deze dag in Google Maps">🚗</button>' : "";
    return '<div class="dagkaart'+(w.iso===vandaagISO?" vandaag":"")+'">'+route+
      '<h3>'+DAGEN[dagIndex(w.datum)]+'</h3><div class="datum">'+w.datum.getDate()+' '+MAANDEN[w.datum.getMonth()]+'</div>'+
      (w.items.length ? w.items.map(kaartje).join("") : '<div class="leeg">Nog niets gepland</div>')+
      '<button type="button" class="plus" data-datum="'+w.iso+'">+ afspraak</button></div>';
  }).join("");

  /* Klikken opent het formulier. Bij een blok in het raster geldt dat alleen
     als er niet gesleept is en niet op de naam is geklikt - dat wordt hieronder
     afgehandeld. */
  document.querySelectorAll(".hd-blok,.afs,.dagband").forEach(function(k){
    k.addEventListener("click", function(e){
      e.stopPropagation();
      if (k.dataset.gesleept){ delete k.dataset.gesleept; return; }
      if (e.target.classList.contains("greep-r")) return;
      openForm(k.dataset.id);
    });
  });
  document.querySelectorAll(".blok").forEach(koppelBlok);
  document.querySelectorAll(".plus").forEach(function(k){
    if (!MAG_BEWERKEN){ k.style.display = "none"; return; }
    k.addEventListener("click", function(){ openForm(null, k.dataset.datum); });
  });

  document.querySelectorAll(".route-knop").forEach(function(k){
    k.addEventListener("click", function(e){ e.stopPropagation(); routeKies(k.dataset.datum, k); });
  });
  // Ook het meldingenpaneel bijwerken: "in de planning" kan veranderd zijn.
  if (itsMeldingen !== null) itsTeken();
  rasterZoekBijwerken();
  // Klik op een leeg stuk dag = nieuwe afspraak op dat tijdstip, afgerond op het halve uur.
  document.querySelectorAll(".dag-cel").forEach(function(cel){
    if (!MAG_BEWERKEN) return;
    cel.addEventListener("click", function(e){
      var strook = e.target.classList.contains("routekol") ? e.target : null;
      if (e.target!==cel && !strook && !e.target.classList.contains("uurlijn")) return;
      var y = e.offsetY, min = UUR_VAN*60 + Math.round(y/UUR_PX*60/30)*30;
      openForm(null, cel.dataset.datum, tijdStr(Math.max(UUR_VAN*60, Math.min(UUR_TOT*60-30, min))),
        strook ? { route: Number(strook.dataset.nr) } : undefined);
    });
  });
}

/* ── ROUTEBORD ───────────────────────────────────────────────────────
   Per dag een paar routes, per route de stops eronder. De routes staan in
   dezelfde bucket als de afspraken, onder 'routes', per datum:

     routes: { "2026-09-07": [ {nr:1, wie:"Kevin"}, {nr:2, wie:"Gerwin"} ] }
     notities: { "2026-09-07": "MAX 2 ROUTES · route 1 alleen" }

   Een afspraak hoort bij een route via het veld 'route' (het nummer). Zit er
   geen nummer op, dan staat hij in de eerste route van die dag - anders zou
   een afspraak die vanuit Voorraadbeheer of de servicemeldingen binnenkomt
   nergens te zien zijn.

   De tijd blijft gewoon op de afspraak staan; die telt in het tijdraster en
   in de stop-regel. Op het bord gaat het om de volgorde binnen de route, en
   die volgt de tijd. */
/* Welke periode je ziet. Gerrit (7 sep 2026): "Bij de Planning moet het ook
   mogelijk zijn om Werkweek, Hele week, Maand, Dag te kunnen kiezen."
   Werkweek is de stand waar de afdeling in werkt (maandag t/m vrijdag), dus
   dat is de opening. De keuze blijft staan tussen bezoeken door. */
var periode = "werkweek";
try { var p0 = localStorage.getItem("fp.planperiode");
      if (["dag","werkweek","week","maand"].indexOf(p0)>=0) periode = p0; } catch(e){}
var PERIODE_DAGEN = { dag:1, werkweek:5, week:7 };
/* De eerste dag van de periode waar 'maandag' in valt. Bij een dagweergave is
   dat de dag zelf, bij een maand de eerste van die maand. */
function periodeStart(){
  if (periode === "dag") return new Date(maandag);
  if (periode === "maand") return new Date(maandag.getFullYear(), maandag.getMonth(), 1);
  return weekStart(maandag);
}
function periodeAantal(){
  if (periode === "maand"){
    var b = periodeStart();
    return new Date(b.getFullYear(), b.getMonth()+1, 0).getDate();
  }
  return PERIODE_DAGEN[periode] || 5;
}
/* Eén stap vooruit of achteruit. Een dag springt een dag, een week een week,
   een maand een maand - anders klopt "volgende" niet met wat je ziet. */
function schuifPeriode(richting){
  if (periode === "dag") maandag.setDate(maandag.getDate() + richting);
  else if (periode === "maand") maandag = new Date(maandag.getFullYear(), maandag.getMonth()+richting, 1);
  else maandag.setDate(maandag.getDate() + 7*richting);
}

var weergave = "routes";
try { var w0 = localStorage.getItem("fp.planweergave"); if (w0==="tijd"||w0==="routes") weergave = w0; } catch(e){}
var routesPerDag = {}, dagNotities = {};

/* Standaard drie routes per dag.
   Gerrit (8 sep 2026): "Ik zie dat je nu 6 routes op woensdag en 5 op ma/di en
   3 op do/vr hebt gemaakt. Houd het gewoon standaard 3 routes per dag."
   Er stond één route als standaard, en wat je daarna aanklikte bleef per dag
   bewaard. Zo liep het per dag uit elkaar. Drie is wat er normaal rijdt; meer
   of minder kan nog steeds per dag, dat blijft gewoon staan. */
var ROUTES_STANDAARD = 3;
/* Wie er op een route rijdt: standaard twee plekken, want ze rijden vaak met
   z'n tweeën (Gerrit, 12 sep 2026). Een tweede plek kan weg, een derde kan
   erbij. De namen staan in wie, wie2 en wie3; 'plekken' zegt hoeveel er
   getoond worden. */
function plekkenVan(r){ var n = Number(r && r.plekken); return (n >= 1 && n <= 3) ? n : 2; }
function rijdersVan(r){
  var uit = [r && r.wie, r && r.wie2, r && r.wie3].slice(0, plekkenVan(r));
  return uit.map(function(x){ return String(x||"").trim(); }).filter(Boolean);
}
function routesVan(dISO){
  var r = routesPerDag[dISO];
  if (Array.isArray(r) && r.length) return r;
  var uit = [];
  for (var i = 1; i <= ROUTES_STANDAARD; i++) uit.push({ nr:i, wie:"" });
  return uit;
}
/* Een afspraak zonder tijd is geen stop maar iets dat de hele dag geldt:
   "Mike vakantie", "Bertjan kantoor", "Kevin vrij". Op het bord van de
   afdeling staan die als balkjes bovenaan de dag, niet in een route. */
function heleDagVan(dISO){
  return afspraken.filter(function(a){
    return opDag(a, dISO) && !filterUit[a.soort] && minuten(a.tijd) === null;
  });
}
/* Valt deze afspraak op deze dag? Een gewone afspraak alleen op zijn eigen
   datum; een hele-dag-afspraak met 'tot en met' op elke dag ertussen. */
function opDag(a, dISO){
  if (a.herhaal === "week") return !!voorkomen(a, dISO);
  if (a.datum === dISO) return true;
  return !!(a.datumTot && minuten(a.tijd) === null && a.datum <= dISO && dISO <= a.datumTot);
}
/* Herhalen. Gerrit (12 sep 2026): "iedere woensdag is bijvoorbeeld 'Gerwin
   vrij' en dat moet hij niet iedere woensdag er opnieuw in moeten zetten."
   Een afspraak met herhaal 'week' komt elke week terug op dezelfde weekdag,
   vanaf zijn datum, tot en met herhaalTot als die is ingevuld. Duurt hij
   meerdere dagen, dan schuift die hele reeks mee. Deze functie geeft de
   voorkomen terug waar een dag in valt: zijn eerste en laatste dag. */
function voorkomen(a, dISO){
  var van = a.datum, tot = a.datumTot && a.datumTot > a.datum ? a.datumTot : a.datum;
  if (a.herhaal !== "week"){ return (van <= dISO && dISO <= tot) ? { van: van, tot: tot } : null; }
  var n = dagenTussen(van, dISO); if (n < 0) return null;
  var lengte = dagenTussen(van, tot), k = ((n % 7) + 7) % 7;
  if (k > lengte) return null;
  var start = dagPlus(dISO, -k);
  if (a.herhaalTot && start > a.herhaalTot) return null;
  return { van: start, tot: dagPlus(start, lengte) };
}
/* De stops van één route, op volgorde. 'volg' is de handmatige volgorde die
   ontstaat als iemand stops binnen een route versleept; staat die er niet,
   dan is de tijd leidend. Zo blijft een route die nooit is aangeraakt gewoon
   op tijd staan, en houdt een gesleepte route de volgorde die de planner
   heeft bedoeld. */
function stopsVan(dISO, nr, eerste){
  return afspraken.filter(function(a){
    if (!opDag(a, dISO) || filterUit[a.soort]) return false;
    if (minuten(a.tijd) === null) return false;          // hele-dag: staat bovenaan
    var rn = Number(a.route) || 0;
    return rn === nr || (!rn && eerste);
  }).sort(function(x,y){
    var vx = Number(x.volg), vy = Number(y.volg);
    if (isFinite(vx) && isFinite(vy) && vx !== vy) return vx - vy;
    if (isFinite(vx) !== isFinite(vy)) return isFinite(vx) ? -1 : 1;
    return String(x.tijd||"99").localeCompare(String(y.tijd||"99"));
  });
}

function tekenBord(){

  var vandaagISO = iso(new Date());
  var html = "";
  week.forEach(function(w,i){

       toelichting bij .bord in de stijlen hierboven. */
    var heleDag = heleDagVan(w.iso);
    var totaal = routes.reduce(function(n, r, ri){ return n + stopsVan(w.iso, r.nr, ri===0).length; }, 0);
    html += '<div class="borddag'+(w.iso===vandaagISO?" vandaag":"")+'" data-datum="'+w.iso+'">'+
      '<h3>'+DAGEN[dagIndex(w.datum)]+'<span class="dd">'+w.datum.getDate()+' '+MAANDEN[w.datum.getMonth()]+
        (totaal?' &middot; '+totaal+' stop'+(totaal===1?'':'s'):'')+'</span></h3>'+
      (heleDag.length ? '<div class="dagbalken">'+heleDag.map(function(a){
        return '<div class="dagbalk'+(a.letop?" let":"")+'" data-id="'+esc(a.id)+'" title="Klik om aan te passen">'+
          esc(a.klant||cat(a).naam)+'</div>'; }).join("")+'</div>' : "")+
      '<div class="routes">'+
      routes.map(function(r, ri){
        var stops = stopsVan(w.iso, r.nr, ri===0);
        return '<div class="route" data-datum="'+w.iso+'" data-nr="'+r.nr+'">'+
          '<h4><span class="nr">Route '+r.nr+'</span>'+
            '<span class="rijders">'+
              (function(){ var n = plekkenVan(r), uit = ""; for (var sl = 1; sl <= n; sl++){
                var naam = String(r[sl===1?"wie":"wie"+sl]||"").trim();
                uit += '<span class="rijder"><span class="wie'+(MAG_BEWERKEN?'':' vast')+'" data-datum="'+w.iso+'" data-nr="'+r.nr+'" data-plek="'+sl+'"'+
                  (MAG_BEWERKEN?' title="Klik om de naam aan te passen"':'')+'>'+
                  (naam ? '\ud83d\udc64 '+esc(naam) : '<span style="color:#b7bfb9;font-weight:400">'+(sl===1?"wie rijdt?":"wie rijdt mee?")+'</span>')+'</span>'+
                  (MAG_BEWERKEN && sl > 1 ? '<button type="button" class="plekWeg" data-datum="'+w.iso+'" data-nr="'+r.nr+'" data-plek="'+sl+'" title="Deze plek weghalen">&times;</button>' : '')+
                  '</span>';
              }
              if (MAG_BEWERKEN && n < 3) uit += '<button type="button" class="plekErbij" data-datum="'+w.iso+'" data-nr="'+r.nr+'" title="Nog iemand erbij">+ rijder</button>';
              return uit; })()+
            '</span>'+
            (stops.length ? '<span class="tel">'+stops.length+'</span>' : '')+
            /* Print route. Gerrit (10 sep 2026): de monteur krijgt een
               uitgeprint stel papieren mee, voorblad plus de orders in
               bezoekvolgorde. Alleen tonen als er iets te printen is. */
            (stops.length ? '<button type="button" class="routePrint" data-datum="'+w.iso+'" data-nr="'+r.nr+'" title="Deze route printen: voorblad en de orderbevestigingen">\ud83d\udda8</button>' : "")+
            (MAG_BEWERKEN?'<button type="button" class="weg routeWeg" data-datum="'+w.iso+'" data-nr="'+r.nr+'" title="Deze route weghalen">&times;</button>':"")+
          '</h4>'+
          '<div class="stops">'+
            (stops.length ? stops.map(stopHtml).join("")
              : '<div class="leegdrop">'+(MAG_BEWERKEN?"sleep hier een stop":"nog niets")+'</div>')+
          '</div>'+
          (MAG_BEWERKEN?'<button type="button" class="plusstop" data-datum="'+w.iso+'" data-nr="'+r.nr+'">+ stop</button>':"")+
        '</div>';
      }).join("")+
      '</div>'+

        ? '<div class="dagnotitie'+(MAG_BEWERKEN?'':' vast')+'" data-datum="'+w.iso+'"'+
          (MAG_BEWERKEN?' title="Klik om een notitie voor deze dag te zetten"':'')+'>'+
          (dagNotities[w.iso] ? esc(dagNotities[w.iso]) : "notitie voor deze dag…")+'</div>'
        : "")+

  $("bord").innerHTML = html;
