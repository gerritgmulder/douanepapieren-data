name = "fonteyn-data-store"
main = "src/worker.js"
compatibility_date = "2024-09-01"

# Sleutel-waarde-opslag in Cloudflare's KV. Per "bucket" (bv. "personeel")
# één JSON-blob met de complete state van die module.
kv_namespaces = [
  { binding = "FONTEYN_DATA", id = "3e8fa24719f04406a167d19d7600d6fa" }
]

# Het activiteitenlogboek. Stond in KV, maar daar herschreef elke klik de hele
# maandblob (112 kB) en dat is één KV-schrijfactie per handeling. Op een drukke
# dag was dat ruim de helft van de 1.000 gratis schrijfacties per dag, en dan
# valt het hele dashboard stil. In D1 is het één regel per gebeurtenis, en daar
# zijn er 100.000 per dag gratis in plaats van 1.000.
[[d1_databases]]
binding = "ACTIVITEIT"
database_name = "fonteyn-activiteit"
database_id = "61c6ba30-827b-4f44-b8a8-2e2cce051cf0"

# Het adres waarop een partner het portaal ziet. Alles wat het portaal
# terugstuurt (de inloglink in de mail, de terugkeer van Mollie, de knop in een
# uitnodiging) wordt hiermee opgemaakt in plaats van met de origin van het
# binnenkomende verzoek. Dat moet, want achter de Pages-proxy is die origin de
# worker zelf en dan wijst een inloglink weer naar workers.dev.
#
# Bewust een instelling en geen X-Forwarded-Host: zo'n header kan iedereen
# meesturen, en dan kan een vreemde een echte inloglink naar zijn eigen domein
# laten wijzen.
#
# Aangezet op 10 september 2026: het CNAME van partner.passionspas.com naar
# passion-partners.pages.dev staat in de DNS, het certificaat is er, en alle
# /dealers-routes geven op dat adres exact hetzelfde antwoord als op de
# workers.dev-link (nagemeten op /dealers, /dealers/welkom en /dealers/auth).
# Hierdoor wijst elke link in een uitnodiging, inloglink en betaalretour naar
# het eigen adres in plaats van naar fonteyn-data-store.g-mulder.workers.dev.
[vars]
DP_PUBLIC_ORIGIN = "https://partner.passionspas.com"

# Het taalmodel voor de tegel Vertalen. Zit op dit platform zelf, dus geen
# extra account en geen sleutel; 10.000 neuronen per dag gratis, elke nacht
# om 02:00 weer op nul. Zie het blok VERTALEN in worker.js voor waarom het
# geen DeepL of MyMemory is geworden.
[ai]
binding = "AI"

# Elk uur: voorraad (vrije hal-voorraad uit Logic4) + reserveringsstand
# (order-statussen, nieuwe aanbetalingen) verversen. Zie scheduled() in worker.js.
[triggers]
# Twee momenten, met opzet gescheiden.
#   elk uur op het hele uur : hal-voorraad, scheeps-ETA's en de reserveringen
#   :30 op 1, 7, 13 en 19u  : de productie (open inkooporders bij de fabrieken)
# Een worker mag per keer maar een beperkt aantal aanroepen naar buiten doen.
# De productiestap vraagt van élke open inkooporder de regels op en liep samen
# met de rest tegen dat plafond aan: op 8 sep 2026 waren die gegevens 21 uur
# oud terwijl ze elke 6 uur horen te verversen. Daardoor stond bij een spa die
# net besteld was nog "nog niet besteld bij de fabriek". Apart draaien geeft
# hem het hele budget voor zichzelf.
crons = ["0 * * * *", "30 1,7,13,19 * * *"]

# De "live kamer" voor samenwerken zoals in Google Documenten: iedereen die
# een klanttab van Voorraadbeheer open heeft, hangt via een WebSocket aan
# dezelfde kamer. Vinkjes, notities en wie-waar-zit gaan direct rond in
# plaats van via de 10-seconden-verversing. Durable Objects zijn sinds 2025
# ook op het gratis plan beschikbaar (met SQLite-opslag); wij bewaren er
# niets in - de KV-bucket blijft de waarheid - dus de limieten raken ons niet.
[durable_objects]
bindings = [{ name = "LIVE", class_name = "LiveKamer" }]

[[migrations]]
tag = "live-v1"
new_sqlite_classes = ["LiveKamer"]
