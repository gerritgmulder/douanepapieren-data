<!-- ═════════════════════════════════════════════════════════════════
     BEURS - de uitnodigingscampagne voor Piscine Global Europe 2026

     Gerrit (25 okt 2026): "Maak een nieuwe tegel voor Dolf en mij: Beurs.
     En maak hem aan de hand van bijgaand document." Het document is de
     README van de campagne (Formulemap maken/Passion/README.md): de beurs
     in Lyon, Dolfs elevator pitch, de zes koopmotieven, 17 talen met kop en
     onderwerpregels, en negen punten die vóór verzending of druk bevestigd
     moeten worden.

     De vaste inhoud staat hieronder in BEURS. Wat Dolf en Gerrit bijhouden
     (afvinken, status per taal, wie heeft nagelezen, notities) staat in de
     bucket "beurs", voor allebei hetzelfde.

     OTA: staat in manifest.json. Nooit opnieuw installeren.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
:root{ --rood:#c8102e; --rood-d:#9d0c24; --ink:#1f2937; --grijs:#6b7280; --rand:#e5e7eb; --bg:#f6f5f2; --groen:#15803d; --oranje:#c2410c; }
*{box-sizing:border-box}
body{margin:0;font-family:"Montserrat",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:#111;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--rood)}
header h1{margin:0;font-size:16px;font-weight:600;flex:1}
main{max-width:1180px;margin:0 auto;padding:16px 16px 60px}
.held{background:#fff;border:1px solid var(--rand);border-radius:14px;padding:18px 20px;margin-bottom:14px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.held h2{margin:0 0 4px;font-size:20px}
.held .waar{color:var(--grijs);font-size:13.5px;line-height:1.5}
.held .stand{display:inline-block;background:var(--rood);color:#fff;font-weight:700;border-radius:8px;padding:3px 10px;margin-top:6px}
.aftel{text-align:center;background:#fff5f5;border:1px solid #fecaca;border-radius:12px;padding:12px 18px;min-width:150px}
.aftel b{display:block;font-size:34px;color:var(--rood);line-height:1}
.aftel span{font-size:12px;color:var(--grijs)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--rand);margin-bottom:14px;flex-wrap:wrap}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:9px 14px;font:inherit;font-weight:600;font-size:14px;color:var(--grijs);cursor:pointer;white-space:nowrap}
.tab.aan{color:var(--rood);border-bottom-color:var(--rood)}
.kaart{background:#fff;border:1px solid var(--rand);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.kaart h3{margin:0 0 10px;font-size:15px}
.lead{color:var(--grijs);font-size:13px;line-height:1.55;margin:0 0 10px}
.pitch{font-size:22px;font-weight:700;line-height:1.25;margin:0 0 8px}
.citaat{border-left:4px solid var(--rood);padding:4px 0 4px 14px;margin:10px 0;font-size:14.5px;line-height:1.55}
.motieven{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.motief{border:1px solid var(--rand);border-radius:10px;padding:12px 14px}
.motief b{display:block;margin-bottom:4px}
.motief span{font-size:13px;color:var(--grijs);line-height:1.5}
.punt{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0efe8;align-items:flex-start}
.punt:last-child{border-bottom:0}
.punt input[type=checkbox]{width:22px;height:22px;flex:0 0 auto;margin-top:2px;accent-color:var(--groen);cursor:pointer}
.punt .tekst{flex:1;min-width:0}
.punt .tekst b{display:block;margin-bottom:3px}
.punt .tekst span{font-size:13px;color:var(--grijs);line-height:1.5;display:block}
.punt.af .tekst b{color:var(--groen)}
.punt textarea{width:100%;margin-top:6px;font:inherit;font-size:13px;border:1px solid var(--rand);border-radius:8px;padding:7px 9px;min-height:36px;resize:vertical}
.punt .wie{font-size:11.5px;color:var(--groen);margin-top:4px}
.voortgang{height:8px;background:#eee;border-radius:999px;overflow:hidden;margin:6px 0 2px}
.voortgang span{display:block;height:100%;background:var(--groen)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--grijs);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:7px 6px;border-bottom:1px solid var(--rand)}
td{padding:8px 6px;border-bottom:1px solid #f3f4f6;vertical-align:top;overflow-wrap:break-word}
td.taal{font-weight:700;white-space:nowrap}
td small{display:block;color:var(--grijs);font-size:11.5px;margin-top:2px}
select,input[type=text]{font:inherit;font-size:13px;border:1px solid var(--rand);border-radius:8px;padding:6px 8px;background:#fff;max-width:100%}
.st-concept{color:var(--grijs)}.st-nalezen{color:var(--oranje);font-weight:700}.st-klaar{color:var(--groen);font-weight:700}.st-verzonden{color:#1d4ed8;font-weight:700}
.tellers{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.teller{border:1px solid var(--rand);border-radius:999px;padding:4px 12px;font-size:12.5px;background:#fff}
.melding{font-size:12.5px;color:var(--groen);min-height:1em}
#fout{color:var(--rood);font-weight:600;margin-bottom:10px}
@media (max-width:760px){
  .held{grid-template-columns:1fr}
  table.talen thead{display:none}
  table.talen, table.talen tbody, table.talen tr, table.talen td{display:block;width:100%}
  table.talen tr{border:1px solid var(--rand);border-radius:10px;margin-bottom:8px;padding:6px 8px}
  table.talen td{border:0;padding:4px 2px}
}
</style>
</head>

var STATUS = [["concept", "Concept"], ["nalezen", "Bij de nalezer"], ["klaar", "Nagelezen, klaar"], ["verzonden", "Verzonden"]];
var data = { punten: {}, talen: {} }, tab = "lijst", bewaarTimer = null;
try { tab = sessionStorage.getItem("beurs.tab") || "lijst"; } catch(e) {}

function aftellen(){
  var nu = new Date(); nu.setHours(0,0,0,0);
  var d = Math.round((new Date(2026, 10, 17) - nu) / 864e5);
  $("dagen").textContent = d > 0 ? d : (d > -4 ? "nu" : "-");
  $("dagenTekst").textContent = d > 0 ? (d === 1 ? "dag tot de beurs" : "dagen tot de beurs") : (d > -4 ? "de beurs loopt" : "de beurs is geweest");
}
function wieTekst(o){ return o && o.door ? String(o.door).split("@")[0] + ", " + new Date(o.ts).toLocaleDateString("nl-NL", { day: "numeric", month: "short" }) : ""; }
function tekenLijst(){
  var af = BEURS.punten.filter(function(p){ return (data.punten[p.k]||{}).af; }).length;
  $("t-lijst").innerHTML = '<div class="kaart"><h3>Nog te bevestigen vóór verzending of druk</h3>' +
    '<p class="lead">' + af + ' van de ' + BEURS.punten.length + ' punten afgevinkt. Vink af wat geregeld is; zet erbij wat er is afgesproken.</p>' +
    '<div class="voortgang"><span style="width:' + Math.round(af / BEURS.punten.length * 100) + '%"></span></div>' +
    BEURS.punten.map(function(p, i){
      var s = data.punten[p.k] || {};
      return '<div class="punt' + (s.af ? " af" : "") + '"><input type="checkbox" data-punt="' + p.k + '"' + (s.af ? " checked" : "") + ' aria-label="' + esc(p.t) + '">' +
        '<div class="tekst"><b>' + (i + 1) + '. ' + esc(p.t) + '</b><span>' + esc(p.d) + '</span>' +
        '<textarea data-notitie="' + p.k + '" placeholder="Wat is er afgesproken?">' + esc(s.notitie || "") + '</textarea>' +
        (s.af ? '<div class="wie">Afgevinkt door ' + esc(wieTekst(s)) + '</div>' : '') + '</div></div>';
    }).join("") + '</div>';
  $("t-lijst").querySelectorAll("[data-punt]").forEach(function(c){ c.onchange = function(){ var s = data.punten[c.dataset.punt] = data.punten[c.dataset.punt] || {}; s.af = c.checked; s.door = ik; s.ts = new Date().toISOString(); bewaar(true); tekenLijst(); }; });
  $("t-lijst").querySelectorAll("[data-notitie]").forEach(function(t){ t.oninput = function(){ var s = data.punten[t.dataset.notitie] = data.punten[t.dataset.notitie] || {}; s.notitie = t.value; bewaar(false); }; });
}
function tekenTalen(){
  var tel = {}; STATUS.forEach(function(s){ tel[s[0]] = 0; });
  BEURS.talen.forEach(function(t){ tel[(data.talen[t[0]]||{}).status || "concept"]++; });
  $("t-talen").innerHTML = '<div class="kaart"><h3>Stand per taal</h3>' +
    '<div class="tellers">' + STATUS.map(function(s){ return '<span class="teller"><b>' + tel[s[0]] + '</b> ' + esc(s[1].toLowerCase()) + '</span>'; }).join("") + '</div>' +
    '<p class="lead">Per taal: de kop van de flyer, de twee onderwerpregels voor de e-mail, wie nakijkt en hoe ver het is.</p>' +
    '<table class="talen"><thead><tr><th>Taal</th><th>Kop en onderwerpregels</th><th>Nalezer</th><th>Stand</th></tr></thead><tbody>' +
    BEURS.talen.map(function(t){
      var s = data.talen[t[0]] || {}, st = s.status || "concept";
      return '<tr><td class="taal">' + esc(t[1]) + '<small>' + esc(t[0]) + '</small></td>' +
        '<td><b>' + esc(t[2]) + '</b><small>A: ' + esc(t[3]) + '</small><small>B: ' + esc(t[4]) + '</small><small style="color:#9ca3af">' + esc(t[5]) + '</small></td>' +
        '<td><input type="text" data-nalezer="' + t[0] + '" value="' + esc(s.nalezer || "") + '" placeholder="naam"></td>' +
        '<td><select data-status="' + t[0] + '" class="st-' + st + '">' + STATUS.map(function(x){ return '<option value="' + x[0] + '"' + (x[0] === st ? " selected" : "") + '>' + esc(x[1]) + '</option>'; }).join("") + '</select>' +
        (s.door ? '<small>' + esc(wieTekst(s)) + '</small>' : '') + '</td></tr>';
    }).join("") + '</tbody></table></div>';
  $("t-talen").querySelectorAll("[data-status]").forEach(function(sel){ sel.onchange = function(){ var s = data.talen[sel.dataset.status] = data.talen[sel.dataset.status] || {}; s.status = sel.value; s.door = ik; s.ts = new Date().toISOString(); bewaar(true); tekenTalen(); }; });
  $("t-talen").querySelectorAll("[data-nalezer]").forEach(function(inp){ inp.oninput = function(){ var s = data.talen[inp.dataset.nalezer] = data.talen[inp.dataset.nalezer] || {}; s.nalezer = inp.value; bewaar(false); }; });
