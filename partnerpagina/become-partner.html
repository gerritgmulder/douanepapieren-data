<!--
  Passion Spas - Become a Partner (openbare pagina, geen inlog)
  ═══════════════════════════════════════════════════════════════════════
  Gerrit (30 okt 2026): de flyer-mailing van Dolf (ongeveer 10.000 adressen)
  linkt hierheen in plaats van een pdf als bijlage. "Je kunt die flyer toch
  niet bekijken op partner.passionspas.com als je geen inlog hebt? Dus dan
  lijkt het me dat je daar een aparte landingspagina voor moet maken."

  Adres: partner.passionspas.com/become-partner (?lang=fr enz. voor een vaste
  taal). De worker geeft deze pagina, de flyers (partnerpagina/flyer-xx.pdf)
  en de foto's (partnerpagina/img/) door vanaf GitHub main.

  Het formulier gaat naar /become-partner/send. De worker bewaart de
  aanmelding (Passion Partners Beheer, blok Nieuwe aanmeldingen, met Arno als
  adviseur) en mailt info@passionspas.com. Er komt nooit direct een account
  uit; dat maakt Arno in Beheer (Gerrit, 30 okt 2026: keuze b, "zorg dat het
  veilig is").

  De teksten komen uit de flyer (Flyer dealers Lyon 2026/bron/teksten.json,
  goedgekeurd 26 okt 2026), aangevuld met die van het formulier. Taal: ?lang=,
  dan wat de bezoeker eerder koos, dan de browser, dan Engels.
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--rood:#d6232f;--rood-d:#b71c27;--zwart:#141414;--grijs:#6b6b6b;--tekst:#2b2b2b;--licht:#f4f2ef;--lijn:#e4e1dc;--blauw:#3f6fb6;--oranje:#ee7a1c;--groen:#2f5d3a;--wit:#fff}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:Montserrat,"Avenir Next","Helvetica Neue",Arial,sans-serif;color:var(--zwart);background:var(--wit);line-height:1.5;overflow-x:hidden}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
.binnen{max-width:1160px;margin:0 auto;padding:0 24px}
button,.knop{font:inherit;cursor:pointer}
.knop{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:2px solid var(--rood);background:var(--rood);color:#fff;white-space:nowrap;transition:background .15s,border-color .15s}
.knop:hover{background:var(--rood-d);border-color:var(--rood-d)}
.knop.licht{background:transparent;color:var(--zwart);border-color:var(--zwart)}
.knop.licht:hover{background:var(--zwart);color:#fff}
.knop.wit{background:#fff;color:var(--rood);border-color:#fff}
.knop.wit:hover{background:var(--licht);border-color:var(--licht)}

/* Kopbalk */
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--lijn);backdrop-filter:saturate(1.4) blur(6px)}
.top .binnen{display:flex;align-items:center;gap:18px;min-height:72px}
.top .logo img{height:44px;width:auto}
.talen{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.talen button{border:1px solid var(--lijn);background:#fff;color:var(--zwart);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.talen button:hover{border-color:var(--zwart)}
.talen button.aan{background:var(--zwart);border-color:var(--zwart);color:#fff}
.top .knop{padding:10px 18px;font-size:14px}

/* Opening */
.held{padding:56px 0 40px}
.held .binnen{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.beurs{display:inline-block;border-left:4px solid var(--rood);padding:2px 0 2px 12px;font-size:13px;font-weight:600;line-height:1.45;margin-bottom:22px}
.beurs b{display:block;color:var(--rood);text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.kicker{color:var(--rood);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin-bottom:12px}
h1{font-size:clamp(32px,5vw,54px);line-height:1.05;letter-spacing:-.015em;font-weight:700;margin-bottom:20px}
h1 span{color:var(--rood)}
.intro{font-size:17px;color:var(--tekst);max-width:560px;margin-bottom:28px}
.knoppen{display:flex;flex-wrap:wrap;gap:12px}

/* Cijfers */
.cijfers{background:var(--zwart);color:#fff;padding:34px 0}
.cijfers .binnen{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.cijfers div div{border-top:3px solid var(--rood);padding-top:12px}
.cijfers b{display:block;font-size:clamp(28px,3.6vw,40px);line-height:1.05;font-weight:700}
.cijfers span{display:block;color:#d4d4d4;font-size:14px;margin-top:6px}

/* Waarom */
section.blok{padding:64px 0}
h2{font-size:clamp(24px,3vw,34px);line-height:1.15;font-weight:700;margin-bottom:28px}
h2 i{font-style:normal;color:var(--rood)}
.kaarten{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 32px}
.kaart{border-top:4px solid var(--c);padding-top:14px}
.kaart h3{font-size:18px;margin-bottom:6px}
.kaart p{color:var(--tekst);font-size:15px}

/* Citaat */
.citaat{background:var(--licht);padding:56px 0}
.citaat .binnen{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.citaat .q{font-size:clamp(28px,3.8vw,44px);font-weight:700;line-height:1.1}
.citaat .q span{color:var(--rood)}
.citaat p{font-size:17px;color:var(--tekst);margin-top:16px}
.strook{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}

/* Zes P's */
.ps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.p{background:var(--licht);border-left:5px solid var(--c);padding:20px 20px 22px}
.p small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--grijs);font-weight:600;margin-bottom:4px}
.p h3{font-size:17px;margin-bottom:6px}
.p p{font-size:14.5px;color:var(--tekst)}

/* Portaal en stappen */
.twee{display:grid;grid-template-columns:1.1fr 1fr;gap:48px}
h4{font-size:22px;margin-bottom:16px}
.portaal ul{list-style:none}
.portaal li{position:relative;padding:11px 0 11px 24px;border-bottom:1px solid var(--lijn);font-size:15px}
.portaal li:before{content:"";position:absolute;left:0;top:18px;width:10px;height:10px;border-radius:50%;background:var(--rood)}
.stap{display:grid;grid-template-columns:40px 1fr;gap:14px;margin-bottom:20px}
.stap b.n{width:40px;height:40px;border-radius:50%;background:var(--zwart);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.stap h5{font-size:16px;margin-bottom:2px}
.stap p{font-size:14.5px;color:var(--tekst)}

/* Flyer */
.flyer{background:var(--zwart);color:#fff;padding:48px 0}
.flyer .binnen{display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap}
.flyer h2{margin-bottom:8px}
.flyer p{color:#d4d4d4;max-width:620px}

/* Lyon en formulier */
.aanmeld .binnen{display:grid;grid-template-columns:1fr 1.25fr;gap:40px;align-items:start}
.lyon{background:var(--rood);color:#fff;padding:32px;border-radius:4px}
.lyon h4{font-size:26px;margin-bottom:10px}
.lyon p{font-size:16px;line-height:1.6;margin-bottom:22px}
.lyon img{max-width:260px;margin:28px auto 0;background:#fff;border-radius:4px}
form{background:#fff;border:1px solid var(--lijn);border-radius:4px;padding:32px}
form h2{margin-bottom:8px}
form .uitleg{color:var(--tekst);margin-bottom:22px}
.velden{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.velden .breed{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
label .ster{color:var(--rood)}
input,select,textarea{width:100%;font:inherit;font-size:15px;color:var(--zwart);padding:12px 14px;border:1px solid #cfcac3;border-radius:4px;background:#fff}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--zwart);outline-offset:1px;border-color:var(--zwart)}
.verstopt{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
.privacy{font-size:12.5px;color:var(--grijs);margin:16px 0 18px}
#melding{margin-top:14px;font-size:14.5px;font-weight:600}
#melding.fout{color:var(--rood)}
.dank{display:none;text-align:center;padding:30px 10px}
.dank b{display:block;font-size:22px;margin-bottom:10px}
form.klaar .velden,form.klaar .privacy,form.klaar .verzend,form.klaar .uitleg,form.klaar #melding{display:none}
form.klaar .dank{display:block}

/* Voet */
footer{background:var(--zwart);color:#fff;padding:44px 0 36px}
footer .binnen{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-end}
footer h4{margin-bottom:8px}
footer p{color:#d4d4d4;font-size:15px;line-height:1.7}
footer a{text-decoration:none}
footer a:hover{text-decoration:underline}
footer .klein{font-size:13px;color:#a8a8a8}

@media (max-width:900px){
  .held .binnen,.citaat .binnen,.twee,.aanmeld .binnen{grid-template-columns:1fr}
  .held .foto{order:-1;max-width:520px}
  .cijfers .binnen{grid-template-columns:1fr 1fr}
  .kaarten,.ps{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .binnen{padding:0 16px}
  .top .binnen{flex-wrap:wrap;gap:10px;padding-top:10px;padding-bottom:10px}
  .top .logo img{height:36px}
  .top .knop{margin-left:auto}
  .talen{order:3;width:100%;margin-left:0}
  .talen button{padding:5px 10px;font-size:12px}
  .held{padding:28px 0 32px}
  .held .foto{max-width:300px;margin:0 auto}
  section.blok{padding:44px 0}
  .kaarten,.ps,.velden{grid-template-columns:1fr}
  .knoppen .knop{width:100%}
  .knop{white-space:normal;text-align:center}
  form,.lyon{padding:22px}
}
</style>

  var TALEN = ["en","nl","de","fr","it","es"];
  var LANDEN = ["AT","BE","BG","CH","CY","CZ","DE","DK","EE","ES","FI","FR","GB","GR","HR","HU","IE","IS","IT","LI","LT","LU","LV","MC","MT","NL","NO","PL","PT","RO","RS","SE","SI","SK","TR","UA","AD","AE","AU","CA","IL","MA","NZ","SA","US","ZA"];

  /* Waar de pagina staat: partner.passionspas.com/become-partner, of op het
     workers.dev-adres onder /dealers. De flyers, foto's en het formulier
     hangen daar steeds onder. */
  var basis = location.pathname.replace(/\/+$/, "");
  var voor = /^\/dealers(\/|$)/.test(location.pathname) ? "/dealers" : "";

  function bewaard(){ try { return localStorage.getItem("bp_taal") || ""; } catch(e){ return ""; } }
  function bewaar(t){ try { localStorage.setItem("bp_taal", t); } catch(e){} }
  var vraag = (new URLSearchParams(location.search).get("lang") || "").toLowerCase().slice(0,2);
  var browser = String((navigator.languages && navigator.languages[0]) || navigator.language || "").toLowerCase().slice(0,2);
  var taal = TALEN.indexOf(vraag) >= 0 ? vraag : TALEN.indexOf(bewaard()) >= 0 ? bewaard() : TALEN.indexOf(browser) >= 0 ? browser : "en";

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  var KLEUREN = ["var(--rood)","var(--blauw)","var(--oranje)","var(--groen)","var(--zwart)","var(--rood)"];

  function teken(){
    var t = Object.assign({}, FLYER[taal] || FLYER.en, FORM[taal] || FORM.en);
    document.documentElement.lang = taal;
    document.title = t.kicker + " - Passion Spas";
    document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = t[el.getAttribute("data-t")] || ""; });
    // Elke knop zegt bij aanwijzen wat hij doet, in de taal van de bezoeker.
    document.querySelectorAll(".knop[data-t]").forEach(function(el){ el.title = el.textContent; });
    // Teksten uit de flyer met opmaak (een rood woord, een regelafbreking); vaste bron, geen invoer van bezoekers.
    document.querySelectorAll("[data-h]").forEach(function(el){ el.innerHTML = t[el.getAttribute("data-h")] || ""; });
    document.getElementById("cijfers").innerHTML = t.cijfers.map(function(c){ return "<div><div><b>" + esc(c[0]) + "</b><span>" + esc(c[1]) + "</span></div></div>"; }).join("");
    document.getElementById("kaarten").innerHTML = t.kaarten.map(function(k, i){ return '<div class="kaart" style="--c:' + KLEUREN[i] + '"><h3>' + esc(k[0]) + "</h3><p>" + esc(k[1]) + "</p></div>"; }).join("");
    document.getElementById("ps").innerHTML = t.ps.map(function(p, i){ return '<div class="p" style="--c:' + KLEUREN[i] + '"><small>' + esc(p[0]) + "</small><h3>" + esc(p[1]) + "</h3><p>" + esc(p[2]) + "</p></div>"; }).join("");
    document.getElementById("portaal").innerHTML = t.portaal.map(function(r){ return "<li>" + esc(r) + "</li>"; }).join("");
    document.getElementById("stappen").innerHTML = t.stappen.map(function(s, i){ return '<div class="stap"><b class="n">' + (i + 1) + "</b><div><h5>" + esc(s[0]) + "</h5><p>" + esc(s[1]) + "</p></div></div>"; }).join("");
    document.querySelectorAll(".flyerLink").forEach(function(a){ a.href = basis + "/flyer/" + taal + ".pdf"; });
    document.getElementById("talen").innerHTML = TALEN.map(function(c){
      return '<button type="button" data-taal="' + c + '" class="' + (c === taal ? "aan" : "") + '" lang="' + c + '" title="' + esc(FORM[c].taalnaam) + '">' + esc(FORM[c].taalnaam) + "</button>";
    }).join("");
    landen(t);
  }

  function landen(t){
    var sel = document.getElementById("fLand"), was = sel.value;
    var namen = null;
    try { namen = new Intl.DisplayNames([taal], { type: "region" }); } catch(e){}
    var lijst = LANDEN.map(function(c){ var n = c; try { n = (namen && namen.of(c)) || c; } catch(e){} return { c: c, n: n }; });
    lijst.sort(function(a, b){ return a.n.localeCompare(b.n, taal); });
    sel.innerHTML = '<option value="">' + esc(t.kiesLand) + "</option>" +
      lijst.map(function(x){ return '<option value="' + x.c + '">' + esc(x.n) + "</option>"; }).join("") +
      '<option value="XX">' + esc(t.anderLand) + "</option>";
    sel.value = was;
  }

  document.getElementById("logo").src = voor + "/logo.png";
  document.querySelectorAll("[data-img]").forEach(function(img){ img.src = basis + "/img/" + img.getAttribute("data-img") + ".jpg"; img.loading = "lazy"; });
  document.getElementById("talen").addEventListener("click", function(e){
    var b = e.target.closest("button[data-taal]");
    if (!b) return;
    taal = b.getAttribute("data-taal"); bewaar(taal); teken();
  });
  teken();

  // Het formulier
  var begin = Date.now(), bezig = false;
  var form = document.getElementById("formulier"), melding = document.getElementById("melding");
  function zeg(tekst, fout){ melding.textContent = tekst || ""; melding.className = fout ? "fout" : ""; }
  form.addEventListener("submit", function(e){
    e.preventDefault();
    if (bezig) return;
    var t = Object.assign({}, FORM.en, FORM[taal] || {});
    var v = function(id){ return document.getElementById(id).value.trim(); };
    var gegevens = { naam: v("fNaam"), bedrijf: v("fBedrijf"), land: v("fLand"), email: v("fEmail"), telefoon: v("fTelefoon"),
                     bericht: v("fBericht"), website: v("fWebsite"), taal: taal, duur: Date.now() - begin };
    if (!gegevens.naam || !gegevens.bedrijf || !gegevens.land || !gegevens.email) { zeg(t.mist, true); return; }
    if (!/^[^\s@<>"]+@[^\s@<>"]+\.[a-z]{2,}$/i.test(gegevens.email)) { zeg(t.emailFout, true); document.getElementById("fEmail").focus(); return; }
    bezig = true;
    var knop = form.querySelector(".verzend"); knop.disabled = true; knop.textContent = t.bezig; zeg("");
    fetch(basis + "/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(gegevens) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { status: r.status, j: j }; }); })
      .then(function(a){
        if (a.status === 200 && a.j.ok) { form.classList.add("klaar"); form.scrollIntoView({ block: "center" }); return; }
        if (a.status === 429) { form.classList.add("klaar"); form.querySelector(".dank span").textContent = t.teVaak; return; }
        if (a.j && a.j.error === "email") { zeg(t.emailFout, true); return; }
        if (a.j && a.j.error === "velden") { zeg(t.mist, true); return; }
        zeg(t.fout, true);
      })
      .catch(function(){ zeg(t.fout, true); })
      .then(function(){ bezig = false; knop.disabled = false; knop.textContent = t.verstuur; });
  });
})();
</script>
