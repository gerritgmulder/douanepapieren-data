<!-- ══════════════════════════════════════════════════════════════════════
     MIJN ROUTE - voor de monteur, op zijn telefoon

     Gerrit (14 sep 2026): "ik moet Route 2 rijden op dinsdag 15 september,
     en in die route zitten 2 leveringen en 1 ITS-melding. Ik moet de 2
     orders die ik moet leveren volledig pakken door een paklijst langs te
     lopen. Ik moet dat kunnen aanvinken en als ik alles heb aangevinkt weet
     ik zeker dat ik de hele paklijst heb gepakt. Dat blijft wel zichtbaar
     maar wel afgevinkt."

     Wat hier staat: de routes waar jouw naam op staat, per dag, met de stops
     in de volgorde van de route. Bij een stop met een order staat de
     paklijst: elke regel van de order met een vinkje. Bij een servicemelding
     staat de melding zelf, met Garantie. De vinkjes worden centraal bewaard
     (bucket planning-paklijst), dus wat je in de loods afvinkt staat op de
     pc bij Kevin ook zo.

     Alles komt uit dezelfde bronnen als de tegel Planning: de afspraken en
     routes uit de bucket 'planning', de orderregels uit Logic4 via
     /planning/route-print, de meldingen via /planning/its. Hier wordt niets
     aan de planning veranderd; alleen de vinkjes zijn van jou.

     OTA: staat in manifest.json. Nooit opnieuw installeren.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --groen:#144734; --groen-donker:#0d3325; --lime:#8bc53f;
  --bg:#f5f4ef; --kaart:#fff; --ink:#1f2937; --grijs:#6b7280; --rand:#e5e7eb;
  --rood:#b91c1c; --oranje:#f97316; --goed:#16a34a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:"Montserrat",-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-text-size-adjust:100%}
header{background:var(--groen);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
       position:sticky;top:0;z-index:20;padding-top:calc(12px + env(safe-area-inset-top))}
header h1{margin:0;font-size:15px;font-weight:600;flex:1;min-width:0}
main{max-width:760px;margin:0 auto;padding:12px 12px calc(30px + env(safe-area-inset-bottom))}

.dagkeus{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 0 6px;-webkit-overflow-scrolling:touch}
.dagkeus button{flex:0 0 auto;background:#fff;border:1px solid var(--rand);border-radius:10px;padding:8px 11px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink);line-height:1.25;text-align:center}
.dagkeus button b{display:block;font-size:14px}
.dagkeus button.aan{background:var(--groen);color:#fff;border-color:var(--groen)}
.dagkeus button .stip{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lime);margin-left:4px;vertical-align:middle}

.route{background:var(--kaart);border:1px solid var(--rand);border-radius:14px;margin-bottom:12px;overflow:hidden}
.route > h2{margin:0;background:var(--groen);color:#fff;font-size:14px;padding:10px 14px;display:flex;align-items:center;gap:8px}
.route > h2 .nr{background:var(--lime);color:#102b1e;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700}
.route > h2 .wie{font-weight:400;opacity:.85;font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route > h2 .voortgang{font-size:12px;font-weight:600}
.stop{border-top:1px solid var(--rand);padding:12px 14px}
.stop .kop{display:flex;align-items:flex-start;gap:10px}
.stop .tijd{font-weight:700;font-size:15px;flex:0 0 auto}
.stop .naam{font-weight:600;font-size:15px}
.stop .sub{font-size:12.5px;color:var(--grijs);margin-top:2px;line-height:1.45}
.stop .sub a{color:var(--groen)}
.stop .soort{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
.stop .betaal{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;vertical-align:middle}
.stop .let{background:#fee2e2;border-left:4px solid var(--rood);padding:6px 10px;border-radius:8px;font-size:12.5px;margin-top:8px;font-weight:600}
.paklijst{margin-top:10px;border:1px solid var(--rand);border-radius:10px;overflow:hidden}
.paklijst .pk{display:flex;align-items:center;justify-content:space-between;background:#f8faf5;padding:7px 11px;font-size:12px;font-weight:700;color:var(--groen);text-transform:uppercase;letter-spacing:.04em}
.paklijst .pk .tel{font-weight:600;text-transform:none;letter-spacing:0;color:var(--grijs)}
.paklijst .pk .tel.klaar{color:var(--goed)}
.regel{display:flex;align-items:flex-start;gap:12px;padding:10px 11px;border-top:1px solid #f0f0ea;cursor:pointer;user-select:none}
.regel input{width:24px;height:24px;flex:0 0 auto;margin:0;accent-color:var(--groen);cursor:pointer}
.regel .om{flex:1;min-width:0;font-size:14px;line-height:1.35}
.regel .om small{display:block;color:var(--grijs);font-size:11.5px;margin-top:1px}
.regel .aantal{flex:0 0 auto;font-weight:700;font-size:15px;min-width:34px;text-align:right}
.regel.af .om{text-decoration:line-through;color:var(--grijs)}
.regel.af .aantal{color:var(--grijs)}
.melding{margin-top:10px;border:1px solid var(--rand);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
.melding .kopje{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--grijs);margin:0 0 3px}
.melding .stuk+.stuk{border-top:1.5px dashed #c7cbd1;margin-top:8px;padding-top:8px}
.garantie{display:inline-block;padding:3px 10px;border:2px solid;border-radius:7px;font-size:12.5px;font-weight:700;margin:8px 0 0}
.garantie.ja{border-color:var(--goed);color:var(--goed)}.garantie.nee{border-color:var(--rood);color:var(--rood)}
.leeg{background:var(--kaart);border:1px solid var(--rand);border-radius:12px;padding:22px;text-align:center;color:var(--grijs);font-size:13.5px;line-height:1.5}
.fout{background:#fee2e2;color:var(--rood);border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 10px}
.wacht{color:var(--grijs);font-size:12.5px;padding:6px 2px}
/* Het ordermemo uit Logic4. Kevin (17 sep 2026): "het enige wat ik nog mis
   is het ordermemo, dat moet er ook bij komen te staan." */
.memo{margin-top:8px;background:#fff7ed;border-left:4px solid var(--oranje);border-radius:8px;padding:7px 10px;font-size:13px;white-space:pre-wrap;line-height:1.45}
.memo b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#9a3412;margin-bottom:2px}
/* De opleverbon. */
.bonknop{margin-top:10px;width:100%;background:#fff;border:2px solid var(--groen);color:var(--groen);border-radius:10px;padding:10px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.bonknop .st{font-size:11.5px;font-weight:600;color:var(--grijs)}
.bonknop .st.klaar{color:var(--goed)}.bonknop .st.akkoord,.bonknop .st.gemaild{color:#2563eb}
.bon{margin-top:8px;border:2px solid var(--groen);border-radius:12px;padding:12px;background:#fff}
.bon h4{margin:12px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--groen);border-bottom:1px solid var(--rand);padding-bottom:4px}
.bon h4:first-child{margin-top:0}
.bon label{display:block;font-size:11.5px;color:var(--grijs);margin:6px 0 2px}
.bon input[type=text],.bon input[type=number],.bon textarea{width:100%;padding:8px 10px;border:1px solid var(--rand);border-radius:8px;font:inherit;font-size:14px;background:#fff}
.bon .rij2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bon .vraag{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #f0f0ea}
.bon .vraag .t{flex:1 1 160px;font-size:13.5px;line-height:1.3}
.bon .keus{display:flex;flex:0 0 auto;border:1px solid var(--rand);border-radius:9px;overflow:hidden}
.bon .keus button{border:0;background:#fff;font:inherit;font-size:12.5px;font-weight:600;padding:7px 10px;cursor:pointer;color:var(--grijs);min-width:44px}
.bon .keus button+button{border-left:1px solid var(--rand)}
.bon .keus button.ja.aan{background:var(--goed);color:#fff}
.bon .keus button.nee.aan{background:var(--rood);color:#fff}
.bon .keus button.nvt.aan{background:var(--grijs);color:#fff}
.bon .vraag input.reden{flex:1 1 100%;margin-top:2px;padding:7px 9px;border:1px solid #fca5a5;border-radius:8px;font:inherit;font-size:13px;background:#fff5f5}
.bon .segment{display:flex;gap:6px;flex-wrap:wrap}
.bon .segment button{flex:1 1 auto;border:1px solid var(--rand);background:#fff;border-radius:9px;padding:9px 8px;font:inherit;font-size:13px;font-weight:600;color:var(--grijs);cursor:pointer}
.bon .segment button.aan{background:var(--groen);color:#fff;border-color:var(--groen)}
.bon .geld{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px;margin:4px 0 8px}
.bon .geld b{text-align:right}
.bon .geld .open{color:var(--rood);font-weight:700}
.bon .hand{border:1px dashed #9ca3af;border-radius:10px;background:#fff;position:relative;touch-action:none}
.bon .hand canvas{display:block;width:100%;height:150px;border-radius:10px}
.bon .hand .wis{position:absolute;right:6px;top:6px;border:1px solid var(--rand);background:#fff;border-radius:7px;padding:3px 9px;font:inherit;font-size:11.5px;cursor:pointer}
.bon .hand .hint{position:absolute;left:10px;bottom:6px;font-size:11px;color:#9ca3af;pointer-events:none}
.bon .bonvoet{display:flex;gap:8px;margin-top:14px}
.bon .bonvoet button{flex:1;border-radius:10px;padding:12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--rand);background:#fff}
.bon .bonvoet button.doe{background:var(--groen);color:#fff;border-color:var(--groen)}
.bon .bonvoet button:disabled{opacity:.5}
.bon .melding{font-size:12.5px;margin-top:8px;min-height:16px}
.bon .melding.bad{color:var(--rood)}.bon .melding.ok{color:var(--goed)}
.bon .slot{background:#eff6ff;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#1e40af;margin-bottom:8px}
</style>

<body>
<header>
  <a class="fp-kop-knop" href="dashboard.html">&larr; Dashboard</a>
  <h1>🚚 Mijn route</h1>
</header>
<main>
  <div class="dagkeus" id="dagen"></div>
  <div id="fout"></div>
  <div id="inhoud"><p class="wacht">Bezig met ophalen&hellip;</p></div>
</main>

<script>
var W = "https://fonteyn-data-store.g-mulder.workers.dev";
var ik = (localStorage.getItem("fp.email")||"").toLowerCase();
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function teamKey(){ return localStorage.getItem("fp.teamkey")||""; }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
var DAGEN = ["ma","di","wo","do","vr","za","zo"], MAANDEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
function dagIndex(d){ return (d.getDay()+6)%7; }
function datumNL(s){ if(!s) return ""; var p=String(s).slice(0,10).split("-"); return p.length===3 ? p[2]+"-"+p[1]+"-"+p[0] : s; }

/* Dezelfde namen als op het routebord: Mike zit op het service-account,
   Bert-Jan schrijft zichzelf met een streepje. Wat hier niet in staat
   krijgt zijn voornaam. Een naam op een route past bij mij als hij gelijk is
   aan mijn naam, of aan mijn voornaam (Bert-Jan Kok is ook Bert-Jan). */
var PLANNERS = { "servicespa":"Mike", "spaservice":"Mike", "mike.deboer":"Mike de Boer",
                 "bertjan":"Bert-Jan", "bertjan.kok":"Bert-Jan Kok", "bart.vdb":"Bart",
                 "tim.geerestein":"Tim", "hans.vanputten":"Hans van Putten", "thieme":"Thieme",
                 "joeri":"Joeri", "dylan":"Dylan", "joey":"Joey", "patrick":"Patrick" };
function voornaam(wie){
  var lokaal = String(wie||"").split("@")[0].replace(/^fonteyn\./i,"");
  return lokaal.split(/[.\-_]/).filter(Boolean).map(function(d){ return d.charAt(0).toUpperCase()+d.slice(1).toLowerCase(); }).join(" ");
}
function mijnNaam(){
  var lokaal = ik.split("@")[0].replace(/^fonteyn\./,"");
  return PLANNERS[lokaal] || voornaam(ik);
}
function isIk(naam){
  var n = String(naam||"").trim().toLowerCase(), m = mijnNaam().toLowerCase();
  if (!n) return false;
  if (n === m) return true;
  var kort = function(x){ return x.replace(/[\s\-]/g,"").split(/\s/)[0]; };
  return n.split(/\s+/)[0] === m.split(/\s+/)[0] || kort(n) === kort(m);
}
var CATS = { levering:{naam:"Levering",kleur:"#3b82f6",vlak:"#bfdbfe"}, service:{naam:"Service",kleur:"#8b5cf6",vlak:"#ddd6fe"},
             verlof:{naam:"Verlof",kleur:"#06b6d4",vlak:"#a5f3fc"}, intern:{naam:"Intern",kleur:"#9ca3af",vlak:"#e5e7eb"} };
var BETAALD = { betaald:"#16a34a", aanbetaald:"#f97316", open:"#dc2626" };

var plan = { afspraken:[], routes:{} }, paklijst = {}, orders = {}, meldingen = null, betaald = {};
var dagGekozen = iso(new Date());

async function lees(pad, opties){
  var r = await fetch(W+pad, Object.assign({ headers:{ "X-Fonteyn-Auth": teamKey(), "X-Fonteyn-User": ik, "Content-Type":"application/json" } }, opties||{}));
  if (!r.ok){
    var t = ""; try{ var j = await r.json(); t = j && j.error ? j.error : ""; }catch(e){}
    throw new Error(t || ("HTTP "+r.status));
  }
  return r.json();
}
function minuten(t){ var m=String(t||"").match(/^(\d{1,2}):(\d{2})/); return m ? (+m[1])*60+(+m[2]) : null; }
function routesVan(dISO){
  var r = plan.routes[dISO];
  if (Array.isArray(r) && r.length) return r;
  return [{nr:1,wie:""},{nr:2,wie:""},{nr:3,wie:""}];
}
function rijders(r){ return [r.wie, r.wie2, r.wie3].map(function(x){ return String(x||"").trim(); }).filter(Boolean); }
function stopsVan(dISO, nr, eerste){
  return plan.afspraken.filter(function(a){
    if (a.datum !== dISO || minuten(a.tijd) === null) return false;
    var rn = Number(a.route)||0; return rn === nr || (!rn && eerste);
  }).sort(function(x,y){
    var vx=Number(x.volg), vy=Number(y.volg);
    if (isFinite(vx)&&isFinite(vy)&&vx!==vy) return vx-vy;
    if (isFinite(vx)!==isFinite(vy)) return isFinite(vx)?-1:1;
    return String(x.tijd||"99").localeCompare(String(y.tijd||"99"));
  });
}
/* Mijn routes op een dag: de routes waar mijn naam op staat. Staat mijn naam
   nergens die dag, dan alle routes met stops - dan weet je in elk geval wat
   er die dag rijdt. */
function mijnRoutes(dISO){
  var alle = routesVan(dISO), eerste = (alle[0]||{}).nr;
  var mijn = alle.filter(function(r){ return rijders(r).some(isIk); });
  var lijst = mijn.length ? mijn : alle;
  return lijst.map(function(r){ return { r:r, stops: stopsVan(dISO, r.nr, r.nr===eerste), vanMij: rijders(r).some(isIk) }; })
              .filter(function(x){ return x.stops.length; });
}

function tekenDagen(){
  var box = $("dagen"), html = "", vandaag = new Date();
  for (var i = -1; i < 14; i++){
    var d = new Date(vandaag); d.setDate(d.getDate()+i);
    var dISO = iso(d), heeft = mijnRoutes(dISO).some(function(x){ return x.vanMij; });
    html += '<button type="button" data-d="'+dISO+'" class="'+(dISO===dagGekozen?"aan":"")+'">'+
      DAGEN[dagIndex(d)]+' '+d.getDate()+' '+MAANDEN[d.getMonth()]+(heeft?'<span class="stip"></span>':'')+
      '<b>'+(i===0?"vandaag":i===1?"morgen":"&nbsp;")+'</b></button>';
  }
  box.innerHTML = html;
  box.querySelectorAll("button").forEach(function(b){ b.addEventListener("click", function(){ dagGekozen = b.dataset.d; tekenDagen(); teken(); }); });
  var aan = box.querySelector("button.aan"); if (aan) aan.scrollIntoView({ inline:"center", block:"nearest" });
}

function sleutel(nr, i){ return String(nr)+"|"+i; }
function gepakt(nr, i){ var v = paklijst[sleutel(nr,i)]; return !!(v && v.af); }

function stopHtml(a){
  var c = CATS[a.soort] || CATS.intern;
  var nr = String(a.ordernr||"").trim();
  var o = nr ? orders[nr] : null;
  var b = nr ? betaald[nr] : (a.itsId ? (betaald["its:"+a.itsId]||{}).info : null);
  var html = '<div class="stop" style="border-left:5px solid '+c.kleur+'">'+
    '<div class="kop"><div class="tijd">'+esc(a.tijd||"")+'</div><div style="flex:1;min-width:0">'+
    '<div class="naam">'+esc(a.klant||c.naam)+
      '<span class="soort" style="background:'+c.vlak+';color:'+c.kleur+'">'+esc(c.naam)+'</span>'+
      (b && BETAALD[b.stand] ? '<span class="betaal" style="background:'+BETAALD[b.stand]+'" title="'+esc(b.stand)+'"></span>' : '')+'</div>'+
    '<div class="sub">'+
      (a.plaats ? '<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a.plaats)+'" target="_blank" rel="noopener">'+esc(a.plaats)+'</a>' : '')+
      (a.telefoon ? ' &middot; <a href="tel:'+esc(String(a.telefoon).replace(/\s/g,""))+'">'+esc(a.telefoon)+'</a>' : '')+
      (nr ? ' &middot; order '+esc(nr) : '')+(a.itsId ? ' &middot; ITS '+esc(a.itsId) : '')+
    '</div>'+
    (a.wat && !a.itsId ? '<div class="sub">'+esc(a.wat)+'</div>' : '')+
    '</div></div>'+
    (a.letop ? '<div class="let">Let op: hier is iets bijzonders nodig (twee man, hijsen, karretje)</div>' : '');

  if (nr){
    if (!o) html += '<p class="wacht">Paklijst wordt opgehaald&hellip;</p>';
    else if (!o.ok) html += '<p class="fout">Order '+esc(nr)+' kon niet uit Logic4 worden opgehaald: '+esc(o.error||"")+'</p>';
    else {
      var regels = (o.regels||[]).filter(function(r){ return r.omschrijving; });
      var af = regels.filter(function(r,i){ return gepakt(nr,i); }).length;
      html += '<div class="paklijst"><div class="pk"><span>Paklijst</span><span class="tel'+(af===regels.length&&regels.length?" klaar":"")+'">'+
        (af===regels.length&&regels.length ? "Alles gepakt ✓" : af+" van "+regels.length+" gepakt")+'</span></div>'+
        regels.map(function(r,i){
          return '<label class="regel'+(gepakt(nr,i)?" af":"")+'"><input type="checkbox" data-nr="'+esc(nr)+'" data-i="'+i+'"'+(gepakt(nr,i)?" checked":"")+'>'+
            '<span class="om">'+esc(r.omschrijving)+(r.code?'<small>'+esc(r.code)+'</small>':'')+'</span>'+
            '<span class="aantal">'+esc(r.aantal)+'&times;</span></label>';
        }).join("")+'</div>';
    }
  }
  if (a.itsId){
    var m = (meldingen||[]).find(function(x){ return Number(x.id)===Number(a.itsId); });
    if (!meldingen) html += '<p class="wacht">Melding wordt opgehaald&hellip;</p>';
    else if (!m) html += '<div class="melding"><div class="kopje">Melding '+esc(a.itsId)+'</div>'+esc(a.wat||"(niet meer in de open meldingen)")+'</div>';
    else {
      var stukken = String(m.tekst||m.omschrijving||"").split(/\n\s*[_\-=]{3,}\s*\n?/).map(function(t){ return t.trim(); }).filter(Boolean);
      html += '<div class="melding">'+
        (m.garantie ? '<div class="garantie '+(/^ja/i.test(m.garantie)?"ja":"nee")+'">Garantie: '+(/^ja/i.test(m.garantie)?"JA":"NEE")+'</div><br>' : '')+
        stukken.map(function(t,i){ return '<div class="stuk"><div class="kopje">'+(i===0?"Melding "+esc(m.id):"Aanvulling "+i)+'</div>'+esc(t)+'</div>'; }).join("")+
        '</div>';
    }
  }
  /* Ordermemo uit Logic4 (het veld Notes, op de orderbevestiging "Order memo"). */
  if (o && o.ok && String(o.notities||"").trim())
    html += '<div class="memo"><b>Order memo</b>'+esc(String(o.notities).trim())+'</div>';
  html += bonBlok(a, o);
  return html + '</div>';
}

/* ═══════════════════════════════════════════════════════════════════════════
   OPLEVERBON
   ═══════════════════════════════════════════════════════════════════════════
   Kevin (17 sep 2026): de papieren checklist in de telefoon. Per stop een
   bon: de vragen (Ja / Nee / n.v.t., bij geen Ja een reden), het openstaande
   bedrag en wat er bij de klant is voldaan, en de handtekening van monteur
   en klant. Bewaren gaat vanzelf bij elke wijziging (concept); Afronden
   controleert alles en zet hem op klaar, waarna kantoor hem in Planning
   ziet, accordeert en naar de klant mailt. */
var bonnen = {}, bonOpen = {}, bonTimers = {}, bonIndex = {};
function bonVan(a, o){
  var id = String(a.id);
  if (bonnen[id]) return bonnen[id];
  var nr = String(a.ordernr||"").trim();
  var b = nr ? betaald[nr] : (a.itsId ? (betaald["its:"+a.itsId]||{}).info : null);
  var eerste = o && o.ok ? (o.regels||[]).find(function(r){ return r.omschrijving && r.totaal; }) : null;
  var lever = o && o.ok ? (o.leverenAan || o.besteldDoor || {}) : {};
  bonnen[id] = {
    id: id, datum: a.datum, tijd: a.tijd||"", klant: a.klant||"", plaats: a.plaats||"", telefoon: a.telefoon||"",
    klantMail: (lever.mail || (o && o.ok && (o.besteldDoor||{}).mail) || ""), ordernr: nr, itsId: a.itsId||null,
    monteur: mijnNaam(), monteur2: "", kenteken: "", soort: a.soort==="service" ? "service" : "levering",
    spaType: eerste ? eerste.omschrijving.split(/[|,]/)[0].trim() : "", serienr: "", adviseur: (o && o.ok && o.adviseur) || "",
    checklist: {}, betaling: { orderbedrag: b ? b.bedrag : 0, reedsBetaald: b ? b.betaald : 0,
      openstaand: b ? Math.round((b.bedrag - b.betaald)*100)/100 : null, methode: "", bedrag: 0, contantAan: "" },
    opmerking: "", handtekeningMonteur: "", handtekeningKlant: "", status: "concept"
  };
  return bonnen[id];
}
function geld(v){ return "\u20ac "+(Number(v)||0).toLocaleString("nl-NL",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function bonBlok(a, o){
  if (a.soort === "verlof" || a.soort === "intern") return "";
  var id = esc(String(a.id));
  /* Dicht: alleen de knop met de stand uit het overzicht. De bon zelf wordt
     pas gemaakt of opgehaald als de monteur hem opent, zodat de gegevens
     van de order (bedrag, mail) er dan al zijn. */
  if (!bonOpen[a.id]){
    var st0 = (bonnen[a.id] && bonnen[a.id].status) || (bonIndex[a.id] && bonIndex[a.id].status) || "";
    return '<button type="button" class="bonknop" data-bon="'+id+'"><span>\u25b8 Opleverbon</span><span class="st '+st0+'">'+esc(st0 ? (window.OPLEVERBON_STATUS||{})[st0]||st0 : "nog niet ingevuld")+'</span></button>';
  }

  var knop = '<button type="button" class="bonknop" data-bon="'+id+'"><span>\u25be Opleverbon</span><span class="st '+st+'">'+esc(stTekst)+'</span></button>';
  var slot = st === "akkoord" || st === "gemaild";
  var dis = slot ? " disabled" : "";
  var vragen = (window.OPLEVERBON_VRAGEN||[]).map(function(v){
    var ant = (bon.checklist[v.k]||{}).a || "", opm = (bon.checklist[v.k]||{}).opm || "";
    return '<div class="vraag"><span class="t">'+esc(v.t)+'</span><span class="keus">'+
      ["ja","nee","nvt"].map(function(x){ return '<button type="button" class="'+x+(ant===x?" aan":"")+'" data-vraag="'+v.k+'" data-a="'+x+'"'+dis+'>'+esc(OPLEVERBON_ANTWOORD[x])+'</button>'; }).join("")+'</span>'+
      (ant && ant!=="ja" ? '<input type="text" class="reden" data-reden="'+v.k+'" placeholder="Reden / extra info (verplicht)" value="'+esc(opm)+'" maxlength="300"'+dis+'>' : '')+'</div>';
  }).join("");
  var bt = bon.betaling;
  var betaling = bt.openstaand == null
    ? '<p class="wacht">Het orderbedrag kon niet worden opgehaald; vul hieronder in wat er is voldaan.</p>'
    : '<div class="geld"><span>Orderbedrag</span><b>'+geld(bt.orderbedrag)+'</b><span>Al betaald</span><b>'+geld(bt.reedsBetaald)+'</b>'+
      '<span>Openstaand</span><b class="'+(bt.openstaand>0.01?"open":"")+'">'+geld(bt.openstaand)+'</b></div>';
  return knop + '<div class="bon" data-bonvak="'+id+'">'+
    (slot ? '<div class="slot">Deze bon is op kantoor '+esc(stTekst)+'. Wijzigen kan niet meer.</div>' : '')+

    '<div class="rij2"><div><label>Monteur</label><input type="text" data-veld="monteur" value="'+esc(bon.monteur)+'" maxlength="80"'+dis+'></div>'+
    '<div><label>2e monteur</label><input type="text" data-veld="monteur2" value="'+esc(bon.monteur2)+'" maxlength="80"'+dis+'></div></div>'+
    '<label>Kenteken auto</label><input type="text" data-veld="kenteken" value="'+esc(bon.kenteken)+'" maxlength="12"'+dis+'>'+
    '<label>Soort</label><div class="segment">'+["levering","nalevering","service"].map(function(x){ return '<button type="button" data-soort="'+x+'" class="'+(bon.soort===x?"aan":"")+'"'+dis+'>'+x.charAt(0).toUpperCase()+x.slice(1)+'</button>'; }).join("")+'</div>'+
    '<h4>Spa</h4>'+
    '<div class="rij2"><div><label>Type spa</label><input type="text" data-veld="spaType" value="'+esc(bon.spaType)+'" maxlength="120"'+dis+'></div>'+
    '<div><label>Serienummer</label><input type="text" data-veld="serienr" value="'+esc(bon.serienr)+'" maxlength="60"'+dis+'></div></div>'+

    '<h4>Betaling</h4>'+betaling+
    '<label>Bij de klant voldaan</label><div class="segment">'+
      [["geen","Niets"],["bank","Per bank"],["contant","Contant"]].map(function(x){ return '<button type="button" data-methode="'+x[0]+'" class="'+(bt.methode===x[0]?"aan":"")+'"'+dis+'>'+x[1]+'</button>'; }).join("")+'</div>'+
    (bt.methode==="bank"||bt.methode==="contant" ? '<label>Bedrag</label><input type="number" inputmode="decimal" step="0.01" data-veld="bedrag" value="'+(bt.bedrag||"")+'"'+dis+'>' : '')+
    (bt.methode==="contant" ? '<label>Contant geld gaat naar</label><div class="segment">'+[["monteur","Monteur"],["kantoor","Kantoor"]].map(function(x){ return '<button type="button" data-contant="'+x[0]+'" class="'+(bt.contantAan===x[0]?"aan":"")+'"'+dis+'>'+x[1]+'</button>'; }).join("")+'</div>' : '')+
    '<h4>Opmerkingen</h4><textarea data-veld="opmerking" rows="2" maxlength="1000" placeholder="Bijzonderheden voor kantoor of de klant"'+dis+'>'+esc(bon.opmerking)+'</textarea>'+
    '<h4>Akkoord monteur</h4><div class="hand" data-hand="handtekeningMonteur"><canvas></canvas><button type="button" class="wis"'+dis+'>Wissen</button><span class="hint">Teken hier</span></div>'+
    '<h4>Akkoord klant</h4><label>Naam</label><input type="text" data-veld="klantNaamHandtekening" value="'+esc(bon.klantNaamHandtekening||bon.klant)+'" maxlength="80"'+dis+'>'+
    '<div class="hand" style="margin-top:6px" data-hand="handtekeningKlant"><canvas></canvas><button type="button" class="wis"'+dis+'>Wissen</button><span class="hint">Laat de klant hier tekenen</span></div>'+
    '<label>Mailadres klant (voor de bon)</label><input type="text" data-veld="klantMail" value="'+esc(bon.klantMail)+'" maxlength="120" inputmode="email"'+dis+'>'+
    '<div class="melding" data-melding="'+id+'"></div>'+
    (slot ? '' : '<div class="bonvoet"><button type="button" data-bewaar="'+id+'">Bewaren</button><button type="button" class="doe" data-afrond="'+id+'">'+(st==="klaar"?"Opnieuw afronden":"Bon afronden")+'</button></div>')+
    '</div>';
}
function koppelBon(box){
  box.querySelectorAll("[data-bon]").forEach(function(k){
    k.addEventListener("click", async function(){
      var id = k.dataset.bon;
      bonOpen[id] = !bonOpen[id];
      if (bonOpen[id] && !bonnen[id]){
        k.querySelector(".st").textContent = "ophalen\u2026";
        try{ var j = await lees("/planning/bon?id="+encodeURIComponent(id)); if (j.bon){ j.bon._geladen = true; bonnen[id] = j.bon; } }
        catch(e){}
      }
      teken();
    });
  });
  box.querySelectorAll("[data-bonvak]").forEach(function(vak){
    var id = vak.dataset.bonvak, bon = bonnen[id];
    if (!bon) return;
    var wijzig = function(){ bonBewaar(id, "concept"); };
    vak.querySelectorAll("[data-veld]").forEach(function(inp){
      inp.addEventListener("input", function(){
        if (inp.dataset.veld === "bedrag") bon.betaling.bedrag = parseFloat(String(inp.value).replace(",", ".")) || 0;
        else bon[inp.dataset.veld] = inp.value;
        wijzig();
      });
    });
    vak.querySelectorAll("[data-vraag]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.vraag; bon.checklist[k] = bon.checklist[k] || { a:"", opm:"" };
        bon.checklist[k].a = b.dataset.a; if (b.dataset.a === "ja") bon.checklist[k].opm = "";
        wijzig(); teken();
        var r = document.querySelector('[data-bonvak="'+id+'"] [data-reden="'+k+'"]'); if (r) r.focus();
      });
    });
    vak.querySelectorAll("[data-reden]").forEach(function(inp){
      inp.addEventListener("input", function(){ var k = inp.dataset.reden; bon.checklist[k] = bon.checklist[k] || { a:"", opm:"" }; bon.checklist[k].opm = inp.value; wijzig(); });
    });
    vak.querySelectorAll("[data-soort]").forEach(function(b){ b.addEventListener("click", function(){ bon.soort = b.dataset.soort; wijzig(); teken(); }); });
    vak.querySelectorAll("[data-methode]").forEach(function(b){ b.addEventListener("click", function(){ bon.betaling.methode = b.dataset.methode; if (b.dataset.methode==="geen") bon.betaling.bedrag = 0; if (b.dataset.methode!=="contant") bon.betaling.contantAan = ""; wijzig(); teken(); }); });
    vak.querySelectorAll("[data-contant]").forEach(function(b){ b.addEventListener("click", function(){ bon.betaling.contantAan = b.dataset.contant; wijzig(); teken(); }); });
    vak.querySelectorAll("[data-hand]").forEach(function(h){ koppelHandtekening(h, bon, h.dataset.hand, wijzig); });
    var bw = vak.querySelector("[data-bewaar]"); if (bw) bw.addEventListener("click", function(){ bonBewaar(id, "concept", true); });
    var af = vak.querySelector("[data-afrond]"); if (af) af.addEventListener("click", function(){ bonAfronden(id); });
  });
}
/* Handtekening: tekenen met vinger of pen, bewaard als kleine PNG. */
function koppelHandtekening(h, bon, veld, wijzig){
  var c = h.querySelector("canvas"), ctx = c.getContext("2d");
  var breed = h.clientWidth || 320, hoog = 150, dpr = Math.min(window.devicePixelRatio||1, 2);
  c.width = Math.round(breed*dpr); c.height = Math.round(hoog*dpr); ctx.scale(dpr,dpr);
  ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111";
  var hint = h.querySelector(".hint");
  if (bon[veld]){ var img = new Image(); img.onload = function(){ ctx.drawImage(img, 0, 0, breed, hoog); }; img.src = bon[veld]; if (hint) hint.style.display = "none"; }
  if (h.querySelector(".wis").disabled) return;
  var bezig = false, was = false;
  function pos(e){ var r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  c.addEventListener("pointerdown", function(e){ e.preventDefault(); bezig = true; was = true; c.setPointerCapture(e.pointerId); var p = pos(e); ctx.beginPath(); ctx.moveTo(p[0],p[1]); if (hint) hint.style.display = "none"; });
  c.addEventListener("pointermove", function(e){ if (!bezig) return; e.preventDefault(); var p = pos(e); ctx.lineTo(p[0],p[1]); ctx.stroke(); });
  function klaar(e){ if (!bezig) return; bezig = false; if (was){
    /* Kleiner bewaren dan het scherm: 600 breed is genoeg voor een handtekening. */
    var k = document.createElement("canvas"); k.width = 600; k.height = 200; k.getContext("2d").drawImage(c, 0, 0, 600, 200);
    bon[veld] = k.toDataURL("image/png"); wijzig(); } }
  c.addEventListener("pointerup", klaar); c.addEventListener("pointercancel", klaar); c.addEventListener("pointerleave", klaar);
  h.querySelector(".wis").addEventListener("click", function(){ ctx.clearRect(0,0,breed,hoog); bon[veld] = ""; was = false; if (hint) hint.style.display = ""; wijzig(); });
}
function bonMelding(id, tekst, klas){
  var m = document.querySelector('[data-melding="'+id+'"]'); if (m){ m.textContent = tekst; m.className = "melding "+(klas||""); }
}
function bonBewaar(id, status, meteen){
  var bon = bonnen[id]; if (!bon) return;
  clearTimeout(bonTimers[id]);
  bonTimers[id] = setTimeout(async function(){
    try{
      bon.status = status;
      var kopie = Object.assign({}, bon); delete kopie._geladen;
      var j = await lees("/planning/bon", { method:"POST", body: JSON.stringify({ bon: kopie }) });
      if (!j.ok) throw new Error(j.error||"niet bewaard");
      bonMelding(id, meteen ? "Bewaard." : "", "ok");
    }catch(e){ bonMelding(id, "Niet bewaard: "+e.message, "bad"); }
  }, meteen ? 0 : 700);
}
async function bonAfronden(id){
  var bon = bonnen[id]; if (!bon) return;
  var open = (window.OPLEVERBON_VRAGEN||[]).filter(function(v){ return !(bon.checklist[v.k]||{}).a; });
  if (open.length){ bonMelding(id, open.length+" vraag(en) nog niet beantwoord: "+open.slice(0,3).map(function(v){ return v.t; }).join(", ")+(open.length>3?" ...":""), "bad"); return; }
  var zonder = (window.OPLEVERBON_VRAGEN||[]).filter(function(v){ var c = bon.checklist[v.k]||{}; return c.a !== "ja" && !String(c.opm||"").trim(); });
  if (zonder.length){ bonMelding(id, "Vul een reden in bij: "+zonder.map(function(v){ return v.t; }).join(", "), "bad"); return; }
  if ((bon.betaling.methode==="bank"||bon.betaling.methode==="contant") && !(bon.betaling.bedrag>0)){ bonMelding(id, "Vul het bedrag in dat bij de klant is voldaan.", "bad"); return; }
  if (bon.betaling.methode==="contant" && !bon.betaling.contantAan){ bonMelding(id, "Geef aan of het contante geld bij de monteur of op kantoor is.", "bad"); return; }
  if (!bon.handtekeningMonteur){ bonMelding(id, "De handtekening van de monteur ontbreekt.", "bad"); return; }
  if (!bon.handtekeningKlant){ bonMelding(id, "De handtekening van de klant ontbreekt.", "bad"); return; }
  clearTimeout(bonTimers[id]);
  try{
    bon.status = "klaar";
    var kopie = Object.assign({}, bon); delete kopie._geladen;
    var j = await lees("/planning/bon", { method:"POST", body: JSON.stringify({ bon: kopie }) });
    if (!j.ok) throw new Error(j.error||"niet gelukt");
    try{ if (window.fpLog) window.fpLog("opleverbon-afgerond", "afspraak "+id+(bon.ordernr?" order "+bon.ordernr:"")); }catch(e){}
    teken();
    bonMelding(id, "Bon afgerond. Kantoor ziet hem nu in Planning.", "ok");
  }catch(e){ bon.status = "concept"; bonMelding(id, "Afronden mislukt: "+e.message, "bad"); }
}

function teken(){
  var box = $("inhoud"), lijst = mijnRoutes(dagGekozen);
  if (!lijst.length){
    box.innerHTML = '<div class="leeg">Geen route met stops op deze dag.</div>';
    return;
  }
  box.innerHTML = lijst.map(function(x){
    var alleOrders = x.stops.map(function(a){ return String(a.ordernr||"").trim(); }).filter(Boolean);
    var tot = 0, af = 0;
    alleOrders.forEach(function(nr){ var o = orders[nr]; if (o && o.ok){ (o.regels||[]).forEach(function(r,i){ if (r.omschrijving){ tot++; if (gepakt(nr,i)) af++; } }); } });
    return '<section class="route"><h2><span class="nr">Route '+esc(x.r.nr)+'</span>'+
      '<span class="wie">'+esc(rijders(x.r).join(" & ")||"nog niemand")+(x.vanMij?"":" (niet van jou)")+'</span>'+
      (tot ? '<span class="voortgang">'+af+'/'+tot+' gepakt</span>' : '')+'</h2>'+
      x.stops.map(stopHtml).join("")+'</section>';
  }).join("");
  box.querySelectorAll("input[type=checkbox][data-nr]").forEach(function(cb){
    cb.addEventListener("change", function(){ vink(cb.dataset.nr, Number(cb.dataset.i), cb.checked); });
  });
  koppelBon(box);
  haalOrders(lijst);
}

/* De orderregels voor de stops die in beeld staan, één keer per order. */
var bezig = {};
async function haalOrders(lijst){
  var nrs = [];
  lijst.forEach(function(x){ x.stops.forEach(function(a){
    var nr = String(a.ordernr||"").trim();
    if (/^\d{3,12}$/.test(nr) && !orders[nr] && !bezig[nr]) nrs.push(nr);
  }); });
  var its = [];
  lijst.forEach(function(x){ x.stops.forEach(function(a){ if (a.itsId && !bezig["its"]) its.push(a.itsId); }); });
  var wacht = [];
  if (nrs.length){
    nrs.forEach(function(n){ bezig[n]=1; });
    wacht.push(lees("/planning/route-print?orders="+encodeURIComponent(nrs.slice(0,15).join(","))).then(function(j){
      (j.orders||[]).forEach(function(o){ orders[String(o.nr)] = o; });
      nrs.forEach(function(n){ if (!orders[n]) orders[n] = { nr:n, ok:false, error:"niet gevonden" }; });
    }).catch(function(e){ nrs.forEach(function(n){ orders[n] = { nr:n, ok:false, error:e.message }; }); }));
    wacht.push(lees("/planning/betaalstatus?orders="+nrs.join(",")+(its.length?"&its="+its.join(","):"")).then(function(j){
      Object.keys(j.orders||{}).forEach(function(k){ betaald[k]=j.orders[k]; });
      Object.keys(j.its||{}).forEach(function(k){ betaald["its:"+k]=j.its[k]; });
    }).catch(function(){}));
  }
  if (its.length && meldingen === null){
    bezig["its"]=1;
    wacht.push(lees("/planning/its").then(function(j){ meldingen = j.meldingen||[]; }).catch(function(){ meldingen = []; }));
  }
  if (wacht.length){ await Promise.all(wacht); teken(); }
}

/* Een vinkje: meteen op het scherm, daarna bewaren. Lukt bewaren niet, dan
   gaat het vinkje terug en staat er waarom. */
var bewaarTimer = null;
async function vink(nr, i, aan){
  var k = sleutel(nr,i);
  var vorige = paklijst[k];
  paklijst[k] = { af: aan, door: ik, ts: new Date().toISOString() };
  teken();
  clearTimeout(bewaarTimer);
  bewaarTimer = setTimeout(async function(){
    try{
      var vers = await lees("/data/planning-paklijst");
      var alles = (vers && vers.regels) || {};
      Object.keys(paklijst).forEach(function(s){ alles[s] = paklijst[s]; });
      // Vinkjes van een order die al twee maanden weg is mogen weg.
      var grens = Date.now() - 60*86400000;
      Object.keys(alles).forEach(function(s){ var t = Date.parse((alles[s]||{}).ts||""); if (t && t < grens) delete alles[s]; });
      await lees("/data/planning-paklijst", { method:"PUT", body: JSON.stringify({ regels: alles, updated: new Date().toISOString() }) });
      try{ if (window.fpLog) window.fpLog(aan?"paklijst-gepakt":"paklijst-teruggezet", "order "+nr+" regel "+(i+1)); }catch(e){}
    }catch(e){
      if (vorige) paklijst[k] = vorige; else delete paklijst[k];
      $("fout").innerHTML = '<div class="fout">Vinkje niet bewaard: '+esc(e.message)+'. Probeer het zo nog eens.</div>';
      teken();
    }
  }, 400);
}

async function start(){
  // De teamsleutel komt bij een eerste login pas na een paar seconden binnen.
  for (var i = 0; i < 20 && !teamKey(); i++) await new Promise(function(r){ setTimeout(r, 500); });
  try{
    var pl = await lees("/data/planning");
    plan.afspraken = Array.isArray(pl.afspraken) ? pl.afspraken : [];
    plan.routes = (pl.routes && typeof pl.routes === "object") ? pl.routes : {};
    var pk = await lees("/data/planning-paklijst").catch(function(){ return {}; });
    paklijst = (pk && pk.regels) || {};
    var bi = await lees("/planning/bonnen").catch(function(){ return {}; });
    (bi.bonnen||[]).forEach(function(b){ bonIndex[b.id] = b; });
  }catch(e){
    $("fout").innerHTML = '<div class="fout">De planning kon niet worden opgehaald: '+esc(e.message)+'</div>';
  }
  /* Beginnen op de eerstvolgende dag met een route van mij, vandaag of later. */
  var vandaag = new Date();
  for (var d = 0; d < 14; d++){
    var dd = new Date(vandaag); dd.setDate(dd.getDate()+d);
    if (mijnRoutes(iso(dd)).some(function(x){ return x.vanMij; })){ dagGekozen = iso(dd); break; }
  }
  tekenDagen(); teken();
}
start();

<script>
/* Activiteitenlogboek - zelfde helper als in de andere tegels. */
(function(){
  var W="https://fonteyn-data-store.g-mulder.workers.dev/log";
  function apparaat(){
    var ua=navigator.userAgent||"", m=ua.match(/Fonteyn-Dashboard\/([\d.]+)/);
    var id=localStorage.getItem("fp.apparaat"); if(!id){ id="PC-"+Math.random().toString(36).slice(2,8).toUpperCase(); try{localStorage.setItem("fp.apparaat",id);}catch(e){} }
    return { computer:id, platform:(ua.match(/\(([^)]+)\)/)||[])[1]||"", versie: m?"app "+m[1]:"browser" };
  }
  window.fpLog=function(action,detail){
    var email=(localStorage.getItem("fp.email")||"").toLowerCase(), key=localStorage.getItem("fp.teamkey")||"";
    if(!email||!key) return;
    var app=apparaat();
    fetch(W,{method:"POST",headers:{"Content-Type":"application/json","X-Fonteyn-Auth":key},body:JSON.stringify({user:email,tile:"mijnroute",action:action||"open",detail:(detail||"").slice(0,1200),computer:app.computer,platform:app.platform,versie:app.versie})}).catch(function(){});
  };
  window.fpLog("open","");
})();
</script>
