<script>
  (function(){
    if (!localStorage.getItem("fp.session")) { location.replace("dashboard.html"); return; }
    var ik = (localStorage.getItem("fp.email")||"").toLowerCase();
    if (window.fpToegang && !fpToegang.mag("bakwagen", ik)) {
      document.addEventListener("DOMContentLoaded", function(){
        document.body.innerHTML = '<div style="max-width:420px;margin:14vh auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:34px;text-align:center;font-family:Montserrat,system-ui,sans-serif">' +
          '<h2 style="color:#144734;margin:0 0 8px">Toegang op aanvraag</h2><p style="color:#6b7280">De tegel Bakwagenroute is voor de bakwagenchauffeurs en de planning van de ritten.</p>' +

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakwagenroute - Fonteyn Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ═════════════════════════════════════════════════════════════════
     BAKWAGENROUTE - de ritten van onze eigen chauffeurs, per chauffeur

     Gerrit (16 okt 2026): "Ik wil dat je daar voor de bakwagen chauffeurs
     (onze eigen chauffeurs die op onze eigen 3 bakwagens spullen leveren aan
     klanten) een lijst maakt, per chauffeur, met de ritten die ze moeten
     rijden. Het is puur voor levering en retouren ophalen." Manon maakt de
     ritten elke dag aan in Logic4; de worker leest ze uit (/bakwagen/ritten).
     De chauffeur staat in de naam van de rit ("Eigenroute 16-10 Dani").

     Twee kanten (Gerrit, 16 okt 2026):
     - Manon en Nomi (groep bakwagen-planning) drukken op Ritten ophalen,
       zien alle eigen ritten vanaf vandaag, klikken er een aan, controleren
       hem en geven akkoord voor een chauffeur.
     - De chauffeur (Dani of Jordy met hun vaste bakwagen, of wie op de
       flexwagen rijdt met de inlog flex; eigen inlog zonder Logic4) ziet
       alleen zijn eigen goedgekeurde rit van vandaag, met per order de
       paklijst om af te vinken.

     Per stop, onder elkaar want het is voor de telefoon: ordernummer,
     klantnaam, telefoon, chauffeursinfo en een vak voor de handtekening van
     de klant, voor ontvangst of voor een retour. Daaronder een opmerking voor
     de chauffeur als er iets mis is ("er mist een kussen"); die komt als
     bericht bij Manon.

     Een handtekening die half af is blijft staan als de lijst ververst: het
     verversen wacht zolang er iets ingevuld en nog niet afgemeld is.

     OTA: staat in manifest.json. Nooit opnieuw installeren.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
:root{ --groen:#144734; --lime:#8bc53f; --ink:#1f2937; --grijs:#6b7280; --rand:#e5e7eb; --bg:#f5f4ef; --goed:#16a34a; --rood:#b91c1c; }
*{box-sizing:border-box}
body{margin:0;font-family:"Montserrat",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--groen);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:16px;font-weight:600;flex:1}
main{margin:14px auto;padding:0 14px 60px}
.balk{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.balk button,.balk input{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.balk button.aan{background:var(--groen);color:#fff;border-color:var(--groen);font-weight:600}
.balk .label{font-size:12px;font-weight:700;color:var(--grijs);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.dagtitel{font-size:17px;font-weight:700;color:var(--groen);margin:14px 2px 8px}
.rit{margin-bottom:18px}
.ritkop{background:var(--groen);color:#fff;border-radius:12px 12px 0 0;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ritkop b{font-size:15px;flex:1;min-width:0;overflow-wrap:break-word}
.ritkop span{font-size:12.5px;opacity:.9;white-space:nowrap}
.ritmemo{background:#fffbeb;border:1px solid #fde68a;border-top:0;padding:8px 14px;font-size:13.5px;white-space:pre-wrap}
.stops{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;padding-top:10px;align-items:start}
.stop{background:#fff;border:1px solid var(--rand);border-radius:12px;border-left:6px solid var(--lime);overflow:hidden}
.stop.af{border-left-color:var(--goed)}
.stopkop{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.stopkop .nr{flex:0 0 30px;height:30px;border-radius:50%;background:var(--groen);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.stop.af .stopkop .nr{background:var(--goed)}
.stopkop .wie{flex:1;min-width:0}
.stopkop .wie b{display:block;font-size:15.5px;overflow-wrap:break-word}
.stopkop .wie small{color:var(--grijs);font-size:12.5px}
.pil{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:#eef2e6;color:var(--groen)}
.pil.goed{background:#dcfce7;color:#15803d}
.pil.retour{background:#dbeafe;color:#1d4ed8}
.velden{padding:0 12px 12px}
.veld{border-top:1px solid #f0f0ea;padding:9px 0}
.veld .k{font-size:11.5px;font-weight:700;color:var(--grijs);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.veld .w{font-size:16px;overflow-wrap:break-word}
.veld .w.info{white-space:pre-wrap;font-size:15px;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:8px 10px}
.veld .w.zacht,.zacht{color:var(--grijs);font-size:14px}
.veld a.knop{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:#fff;border:2px solid var(--groen);color:var(--groen);border-radius:10px;padding:8px 14px;font-weight:700;text-decoration:none;font-size:14px}
.artikelen{margin:0;padding:0;list-style:none;font-size:14px}
.artikelen li{padding:3px 0}
.artikelen li.deel{padding-left:16px;color:var(--grijs);font-size:13px}
.afmeld{border-top:2px solid var(--groen);margin-top:4px;padding-top:10px}
.afmeld h4{margin:0 0 8px;font-size:14px;color:var(--groen)}
.segment{display:flex;gap:6px;margin-bottom:10px}
.segment button{flex:1;border:1px solid var(--rand);background:#fff;border-radius:10px;padding:11px 8px;font:inherit;font-size:14px;font-weight:600;color:var(--grijs);cursor:pointer}
.segment button.aan{background:var(--groen);border-color:var(--groen);color:#fff}
.afmeld label{display:block;font-size:12px;font-weight:700;color:var(--grijs);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 4px}
.afmeld input[type=text],.afmeld textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 11px;font:inherit;font-size:15px}
.afmeld textarea{min-height:70px;resize:vertical}
.hand{position:relative;border:2px dashed #cbd5e1;border-radius:12px;background:#fff;touch-action:none}
.hand canvas{display:block;width:100%;height:170px;border-radius:10px}
.hand .wis{position:absolute;right:6px;top:6px;border:1px solid var(--rand);background:#fff;border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.hand .hint{position:absolute;left:12px;bottom:8px;font-size:12.5px;color:#9ca3af;pointer-events:none}
.groot{width:100%;margin-top:12px;background:var(--groen);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.groot:disabled{opacity:.6}
.klein{background:#fff;border:1px solid var(--rand);border-radius:9px;padding:8px 12px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink);margin-top:8px}
.klaar{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px;font-size:14px}
.klaar b{color:#15803d}
.klaar img{display:block;width:100%;max-width:420px;margin-top:8px;border:1px solid var(--rand);border-radius:8px;background:#fff}
.melding{margin-top:8px;font-size:13.5px;font-weight:600}
.melding.slecht{color:var(--rood)}.melding.goed{color:var(--goed)}
.leeg{color:var(--grijs);padding:18px 4px;font-size:15px}
.fout{background:#fee2e2;color:var(--rood);padding:10px 12px;border-radius:10px;margin-bottom:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.tabs button.aan{background:var(--groen);color:#fff;border-color:var(--groen)}
.ophaal{background:var(--groen);color:#fff;border:0;border-radius:12px;padding:13px 22px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;margin:2px 0 12px}
.ophaal:disabled{opacity:.6}
.ritrij{background:#fff;border:1px solid var(--rand);border-radius:12px;margin-bottom:8px;overflow:hidden}
.ritrij .r1{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 14px;cursor:pointer}
.ritrij .r1 b{flex:1 1 220px;min-width:0;font-size:15px;overflow-wrap:break-word}
.ritrij .r1 small{color:var(--grijs);font-size:12.5px;white-space:nowrap}
.ritrij.open{border-color:var(--groen)}
.ritdetail{border-top:1px solid var(--rand);padding:10px 12px;background:#fafaf7}
.akkoordbalk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;padding:12px;border:2px solid var(--groen);border-radius:12px;background:#fff}
.akkoordbalk select{font:inherit;font-size:15px;padding:9px 11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
.akkoordbalk .groen{background:var(--groen);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.akkoordbalk .wit{background:#fff;color:var(--rood);border:1px solid #fca5a5;border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.pil.wacht{background:#fff7ed;color:#c2410c}
.paklijst{margin:0;padding:0;list-style:none}
.paklijst li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid #f3f3ef;font-size:14.5px}
.paklijst li:first-child{border-top:0}
.paklijst input{width:24px;height:24px;flex:0 0 auto;margin:0;accent-color:var(--goed)}
.paklijst li.deel{padding-left:16px;font-size:13.5px;color:var(--grijs)}
.paklijst li.gepakt span{color:var(--grijs);text-decoration:line-through}
.paklijst small{display:block;color:var(--grijs);font-size:12px}
.groet{font-size:20px;font-weight:700;color:var(--groen);margin:4px 2px 2px}
.fotos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fotos img{width:84px;height:84px;object-fit:cover;border-radius:9px;border:1px solid var(--rand);background:#f3f3ef;cursor:zoom-in}
.fotoknop{display:inline-flex;align-items:center;gap:6px;border:2px dashed var(--groen);color:var(--groen);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;background:#fff}
.fotoknop input{display:none}
.fotogroot{position:fixed;inset:0;z-index:99990;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.fotogroot img{max-width:100%;max-height:100%;border-radius:8px}
.zoekbalk{display:flex;gap:8px;margin-bottom:12px}
.zoekbalk input{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;font:inherit;font-size:15px}
.treffer{background:#fff;border:1px solid var(--rand);border-left:6px solid var(--goed);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.treffer .t1{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.treffer .t1 b{font-size:15px}
.treffer small{color:var(--grijs)}
.treffer .opm{margin-top:6px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:6px 9px;font-size:14px}
.treffer .handimg{display:block;max-width:360px;width:100%;margin-top:8px;border:1px solid var(--rand);border-radius:8px;background:#fff}
@media (max-width:600px){ main{padding:0 8px 60px} .stops{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <a class="fp-kop-knop" href="dashboard.html">&larr; Dashboard</a>
  <h1>🚛 Bakwagenroute</h1>
  <span id="stand" style="font-size:12px;opacity:.85"></span>
</header>
<main>
  <div id="fout"></div>
  <div class="tabs" id="tabs" hidden></div>
  <div id="planning" hidden></div>
  <div id="zoeken" hidden></div>
  <div id="onderweg" hidden>
    <div class="balk" id="dagen"></div>
    <div class="balk" id="chauffeurs"></div>
    <div id="lijst"></div>
  </div>
</main>
<script>
var W = "https://fonteyn-data-store.g-mulder.workers.dev";
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }
var ik = (localStorage.getItem("fp.email")||"").toLowerCase();
function teamKey(){ return localStorage.getItem("fp.teamkey")||""; }
async function lees(pad, opties){
  var o = Object.assign({ headers: { "X-Fonteyn-Auth": teamKey(), "X-Fonteyn-User": ik, "Content-Type": "application/json" } }, opties||{});
  var r = await fetch(W+pad, o);
  var j = await r.json().catch(function(){ return null; });
  if (!r.ok && !(j && j.error)) throw new Error("HTTP "+r.status);
  return j || {};
}
function isoVan(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function plusDagen(iso, n){ var d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return isoVan(d); }
function dagTekst(iso){ var d = new Date(iso+"T12:00:00"); return ["Zondag","Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag"][d.getDay()]+" "+d.getDate()+" "+["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"][d.getMonth()]; }
function tijd(ts){ var d = new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function bewaarLokaal(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function leesLokaal(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function naamVan(mail){ var m = String(mail||"").split("@")[0].replace(/^fonteyn\./,""); return m ? m.charAt(0).toUpperCase()+m.slice(1) : ""; }

/* Wie is er: de planning (Manon, Nomi) of een chauffeur (Dani, Jordy, flex,
   eigen inlog zonder Logic4). De worker controleert hetzelfde nog eens. */
var planner = !!(window.fpToegang && fpToegang.mag("bakwagen-planning", ik));
function chauffeurVanInlog(w){ w = String(w||"").toLowerCase(); if (/^dan[iy]([.@_ -]|$)/.test(w)) return "Dani"; if (/^jord[iy]([.@_ -]|$)/.test(w)) return "Jordy"; if (/^flex([.@_ -]|$)/.test(w)) return "Flex"; return ""; }
var ikChauffeur = chauffeurVanInlog(ik);
/* Gerrit (17 okt 2026): Dani en Jordy rijden elk een vaste bakwagen; de
   derde wagen is de flexwagen, die Manon inzet waar nodig. */
var CHAUFFEURS = ["Dani","Jordy","Flex"];
function wagenNaam(n){ return n === "Flex" ? "Flexwagen" : n ? "Bakwagen " + n : ""; }
function chauffeurNaam(n){ return n === "Flex" ? "Flexwagen" : n; }

var vandaag = isoVan(new Date());
var tab = planner ? (leesLokaal("fp.bw.tab") || "planning") : "onderweg";
/* Vanuit een melding: bakwagen.html?zoek=<order> opent meteen het zoeken. */
var zoekUitLink = (location.search.match(/[?&]zoek=([^&]*)/) || [])[1];
if (planner && zoekUitLink !== undefined) { tab = "zoeken"; }

/* ═══ PLANNING: ritten ophalen, controleren, akkoord geven ═══ */
var overzicht = null, openRit = null, ritDetail = {};
function tekenTabs(){
  if (!planner) { $("tabs").hidden = true; return; }
  $("tabs").hidden = false;
  $("tabs").innerHTML = '<button type="button" data-tab="planning"'+(tab==="planning"?' class="aan"':'')+'>Ritten klaarzetten</button>' +
    '<button type="button" data-tab="onderweg"'+(tab==="onderweg"?' class="aan"':'')+'>Onderweg per dag</button>' +
    '<button type="button" data-tab="zoeken"'+(tab==="zoeken"?' class="aan"':'')+'>Zoeken: handtekeningen en foto\'s</button>';
  $("tabs").querySelectorAll("[data-tab]").forEach(function(b){ b.addEventListener("click", function(){ tab = b.dataset.tab; bewaarLokaal("fp.bw.tab", tab); toon(); }); });
}
function toon(){
  tekenTabs();
  $("planning").hidden = tab !== "planning";
  $("onderweg").hidden = tab !== "onderweg";
  $("zoeken").hidden = tab !== "zoeken";
  if (tab === "planning") tekenPlanning(); else if (tab === "zoeken") tekenZoeken(); else if (!dagData) laadDag(0); else tekenDag();
}
function tekenPlanning(){
  var h = '<button type="button" class="ophaal" id="ophaal">'+(overzicht ? "Ritten opnieuw ophalen" : "Ritten ophalen")+'</button>';
  if (!overzicht) { h += '<p class="leeg">Druk op Ritten ophalen: dan staan hier alle eigen ritten uit het Rittenoverzicht van Logic4, vanaf vandaag. Klik een rit aan, controleer hem en geef akkoord; dan ziet de chauffeur hem op die dag in zijn tegel.</p>'; }
  else if (!overzicht.ritten.length) h += '<p class="leeg">In Logic4 staan er vanaf vandaag nog geen eigen ritten. Een rit hoort erbij als "Eigenroute" of "Eigen route" in de naam staat.</p>';
  else {
    /* Per dag: altijd de bakwagen van Dani en van Jordy, ook als Manon er nog
       geen rit voor maakte; de flexwagen alleen als er een flexrit is. Ritten
       zonder naam staan eronder om te koppelen. Altijd vandaag en de
       eerstvolgende werkdag, en verder elke dag met een rit. */
    var dagen = {};
    dagen[vandaag] = true;
    var volgende = plusDagen(vandaag, 1); if (new Date(volgende+"T12:00:00").getDay() === 0) volgende = plusDagen(volgende, 1);
    dagen[volgende] = true;
    overzicht.ritten.forEach(function(r){ dagen[r.datum] = true; });
    Object.keys(dagen).sort().forEach(function(dag){
      var opDag = overzicht.ritten.filter(function(r){ return r.datum === dag; });
      h += '<div class="dagtitel">'+esc(dagTekst(dag))+(dag === vandaag ? " (vandaag)" : dag === plusDagen(vandaag,1) ? " (morgen)" : "")+'</div>';
      ["Dani","Jordy","Flex"].forEach(function(w){
        var van = opDag.filter(function(r){ return r.chauffeur === w; });
        if (!van.length && w !== "Flex") h += '<div class="ritrij" style="opacity:.75"><div class="r1"><b>'+esc(wagenNaam(w))+'</b><small>nog geen rit in Logic4</small><span class="pil">Nog te maken</span></div></div>';
        van.forEach(function(r){ h += ritRij(r, wagenNaam(w)); });
      });
      opDag.filter(function(r){ return CHAUFFEURS.indexOf(r.chauffeur) < 0; }).forEach(function(r){ h += ritRij(r, "Nog aan een wagen te koppelen"); });
    });
  }
  $("planning").innerHTML = h;
  $("ophaal").addEventListener("click", ophalen);
  $("planning").querySelectorAll("[data-rit]").forEach(function(el){ el.addEventListener("click", function(){ openRit = openRit === el.dataset.rit ? null : el.dataset.rit; tekenPlanning(); if (openRit && !ritDetail[openRit]) laadRit(openRit, 0); }); });
  var d = $("detail"); if (d) { koppelDetail(d); laadFotos(d); }
}
function ritRij(r, wagen){
  var pil = r.akkoord ? '<span class="pil goed">✓ Klaar voor '+esc(chauffeurNaam(r.akkoord.chauffeur))+'</span>' : '<span class="pil wacht">Te controleren</span>';
  return '<div class="ritrij'+(openRit===r.id?' open':'')+'"><div class="r1" data-rit="'+esc(r.id)+'"><b>'+esc(wagen)+'</b><small>'+esc(r.naam)+' · '+(r.soort==="retour"?"retour ophalen":"levering")+' · '+r.aantal+' order'+(r.aantal===1?'':'s')+'</small>'+pil+'</div>' +
    (openRit === r.id ? '<div class="ritdetail" id="detail">'+detailHtml(r)+'</div>' : '') + '</div>';
}
async function ophalen(){
  var b = $("ophaal"); b.disabled = true; b.textContent = "Ritten worden opgehaald…";
  try { var j = await lees("/bakwagen/overzicht"); if (!j.ok) throw new Error(j.error || "onbekend"); overzicht = j; ritDetail = {}; $("fout").innerHTML = ""; }
  catch(e){ $("fout").innerHTML = '<div class="fout">Het ophalen vraagt nog een poging ('+esc(e.message)+').</div>'; }
  tekenPlanning();
}
async function laadRit(id, poging){
  try {
    var j = await lees("/bakwagen/rit?id="+encodeURIComponent(id));
    if (!j.ok) throw new Error(j.error || "onbekend");
    ritDetail[id] = j.rit; if (openRit === id) tekenPlanning();

var datum = vandaag, dagData = null;

/* De paklijst: wat er mee naar de klant gaat, en apart wat er bij een
   omruiling of retour mee terug komt (een regel met een min-aantal in de
   order). Onderdelen van een set staan in Logic4 met een * ervoor; die
   staan hier ingesprongen onder de set. */
function paklijstHtml(r, s, alleenKijken){
  if (!s.artikelen || !s.artikelen.length) return '';
  var regel = function(a, i){
    var pk = "fp.bw.pak:"+r.id+":"+s.order+":"+i, gepakt = !alleenKijken && leesLokaal(pk) === "1";
    var deel = a.deel || /^\*\s*/.test(a.naam), naam = a.naam.replace(/^\*\s*/, "");
    return '<li class="'+(deel?'deel ':'')+(gepakt?'gepakt':'')+'">' + (alleenKijken ? '' : '<input type="checkbox" data-pak="'+esc(pk)+'"'+(gepakt?' checked':'')+'>') +
      '<span>'+(deel?'':'<b>'+Math.abs(a.aantal)+'x</b> ')+esc(naam)+(a.code ? '<small>'+esc(a.code)+'</small>' : '')+'</span></li>'; };
  var mee = [], terug = [];
  s.artikelen.forEach(function(a, i){ (a.aantal < 0 ? terug : mee).push(regel(a, i)); });
  return (mee.length ? '<div class="veld"><div class="k">Paklijst: mee naar de klant</div><ul class="paklijst">' + mee.join("") + '</ul></div>' : '') +
    (terug.length ? '<div class="veld"><div class="k" style="color:#1d4ed8">Retour: mee terug van de klant</div><ul class="paklijst">' + terug.join("") + '</ul></div>' : '');
}
function stopHtml(r, s, i, opt){
  var eerste = r.stops.find(function(x){ return !x.af; });
  var k = sleutel(r.id, s.order), isOpen = opt.altijdOpen || (open[k] !== undefined ? open[k] : (eerste === s));
  var soortStop = s.af ? s.af.soort : ((concept[k] && concept[k].soort) || r.soort);
  var pil = s.af ? '<span class="pil goed">✓ '+(s.af.soort === "retour" ? "Retour opgehaald" : "Geleverd")+'</span>' : (opt.alleenKijken ? '' : (soortStop === "retour" ? '<span class="pil retour">Retour</span>' : '<span class="pil">Open</span>'));
  var h = '<div class="stop'+(s.af?' af':'')+'" data-stop="'+esc(k)+'"><div class="stopkop"'+(opt.altijdOpen?'':' data-klap="'+esc(k)+'"')+'><div class="nr">'+(i+1)+'</div>' +
    '<div class="wie"><b>'+esc(s.klant || ("Order "+s.order))+'</b><small>'+esc([s.plaats, "order "+s.order].filter(Boolean).join(" · "))+'</small></div>'+pil+'</div>';
  if (!isOpen) return h + '</div>';
  h += '<div class="velden">';
  if (s.gefactureerd) h += veld("Ordernummer", esc(s.order)) + '<div class="veld"><div class="w zacht">Deze order is al gefactureerd; de gegevens staan in Logic4 bij de factuur.</div></div>';
  else if (s.laden) h += veld("Ordernummer", esc(s.order)) + '<div class="veld"><div class="w zacht">De gegevens van deze order worden opgehaald…</div></div>';
  else {
    var adres = [s.adres, [s.postcode, s.plaats].filter(Boolean).join(" ")].filter(Boolean).join(", ");
    var info = [s.opmerkingRit, s.notities].filter(Boolean).join("\n\n");
    h += veld("Ordernummer", esc(s.order)) +
      veld("Klantnaam", esc(s.klant || "-") + (s.bedrijf && s.bedrijf !== s.klant ? '<br><small>'+esc(s.bedrijf)+'</small>' : '')) +
      veld("Telefoonnummer klant", s.telefoon ? esc(s.telefoon)+(opt.alleenKijken ? '' : '<br><a class="knop" href="tel:'+esc(s.telefoon.replace(/[^\d+]/g,""))+'">📞 Bellen</a>') : '<span class="zacht">Er staat nog geen nummer bij deze order in Logic4.</span>') +
      (adres ? veld("Adres", esc(adres)+(opt.alleenKijken ? '' : '<br><a class="knop" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(adres+(s.land && s.land !== "NL" ? ", "+s.land : ""))+'">🧭 Route</a>')) : '') +
      '<div class="veld"><div class="k">Chauffeurs info</div>'+(info ? '<div class="w info">'+esc(info)+'</div>' : '<div class="w zacht">Geen bijzonderheden.</div>')+'</div>' +
      paklijstHtml(r, s, opt.alleenKijken) +
      fotosHtml(r, s, !opt.alleenKijken);
  }
  if (!opt.alleenKijken) h += afmeldHtml(r, s, k);
  else if (s.af) h += '<div class="afmeld"><div class="klaar"><b>✓ '+(s.af.soort === "retour" ? "Retour opgehaald" : "Geleverd")+'</b> om '+tijd(s.af.ts)+(s.af.chauffeur ? ' door '+esc(chauffeurNaam(s.af.chauffeur)) : '')+(s.af.opmerking ? '<br><b style="color:#92400e">Opmerking:</b> '+esc(s.af.opmerking) : '')+'</div></div>';
  return h + '</div></div>';
}
function veld(k, w){ return '<div class="veld"><div class="k">'+k+'</div><div class="w">'+w+'</div></div>'; }

/* ═══ Foto's als bewijs (Gerrit, 16 okt 2026) ═══════════════════════════
   De chauffeur maakt bij een stop een of meer foto's, bijvoorbeeld als er
   een kussen mist bij een bank die hij retour haalt. De telefoon verkleint
   ze eerst tot een JPEG van hooguit 1600 pixels. */
var fotoUrl = {};
function fotosHtml(r, s, magToevoegen){
  var f = s.fotos || [];
  if (!f.length && !magToevoegen) return '';
  return '<div class="veld"><div class="k">Foto\'s</div><div class="fotos">' +
    f.map(function(x){ return '<img data-foto="'+esc(x.id)+'" alt="foto" title="'+esc((x.chauffeur||naamVan(x.door)||"")+" · "+tijd(x.ts))+'"'+(fotoUrl[x.id]?' src="'+fotoUrl[x.id]+'"':'')+'>'; }).join("") +
    (magToevoegen ? '<label class="fotoknop">📷 Foto toevoegen<input type="file" accept="image/*" capture="environment" multiple data-fotoin="'+esc(sleutel(r.id, s.order))+'"></label>' : '') +
    '</div><div class="melding" data-fotomelding="'+esc(sleutel(r.id, s.order))+'"></div></div>';
}
async function laadFotos(waar){
  var imgs = (waar || document).querySelectorAll("img[data-foto]");
  for (var i = 0; i < imgs.length; i++) {
    var img = imgs[i], id = img.dataset.foto;
    img.onclick = function(){ var u = fotoUrl[this.dataset.foto]; if (!u) return; var g = document.createElement("div"); g.className = "fotogroot"; g.innerHTML = '<img alt="foto">'; g.querySelector("img").src = u; g.onclick = function(){ g.remove(); }; document.body.appendChild(g); };
    if (fotoUrl[id]) { img.src = fotoUrl[id]; continue; }
    try {
      var r = await fetch(W+"/bakwagen/foto?id="+encodeURIComponent(id), { headers: { "X-Fonteyn-Auth": teamKey(), "X-Fonteyn-User": ik } });
      if (!r.ok) continue;
      fotoUrl[id] = URL.createObjectURL(await r.blob());
      document.querySelectorAll('img[data-foto="'+id+'"]').forEach(function(x){ x.src = fotoUrl[id]; });
    } catch(e){}
  }
}
function verklein(bestand){
  return new Promise(function(ok, nee){
    var u = URL.createObjectURL(bestand), img = new Image();
    img.onload = function(){
      var max = 1600, sch = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas"); c.width = Math.round(img.width * sch); c.height = Math.round(img.height * sch);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      ok(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = function(){ URL.revokeObjectURL(u); nee(new Error("deze foto vraagt een ander formaat; kies hem opnieuw")); };
    img.src = u;
  });
}
function koppelFotoKnoppen(waar, opnieuw){
  waar.querySelectorAll("[data-fotoin]").forEach(function(inp){ inp.addEventListener("change", async function(){
    var k = inp.dataset.fotoin, x = zoekStop(k), m = document.querySelector('[data-fotomelding="'+k+'"]');
    if (!x || !inp.files || !inp.files.length) return;
    var bestanden = [].slice.call(inp.files), gelukt = 0;
    for (var i = 0; i < bestanden.length; i++) {
      if (m) { m.className = "melding"; m.textContent = "Foto "+(i+1)+" van "+bestanden.length+" uploaden…"; }
      try {
        var data = await verklein(bestanden[i]);
        var j = await lees("/bakwagen/foto", { method: "POST", body: JSON.stringify({ rit: x.r.id, order: x.s.order, data: data, chauffeur: x.r.chauffeur || ikChauffeur }) });
        if (!j.ok) throw new Error(j.error || "onbekend");
        x.s.fotos = x.s.fotos || []; x.s.fotos.push({ id: j.id, ts: j.ts, door: ik, chauffeur: x.r.chauffeur || ikChauffeur });
        fotoUrl[j.id] = data; gelukt++;
      } catch(e) { if (m) { m.className = "melding slecht"; m.textContent = "Een foto vraagt nog een poging (" + e.message + "). Kies hem gerust opnieuw."; } }
    }
    try{ if (window.fpLog && gelukt) window.fpLog("bakwagen-foto", "rit " + x.r.id + " order " + x.s.order + ": " + gelukt + " foto('s)"); }catch(e){}
    if (gelukt) opnieuw();
  }); });
  laadFotos(waar);

function afmeldHtml(r, s, k){

    '<div class="hand"><canvas></canvas><button type="button" class="wis">Wissen</button><span class="hint">Laat de klant hier tekenen</span></div>' +
    '<label>Opmerking van de chauffeur</label><textarea data-veld="opmerking" placeholder="Is er iets mis? Bijvoorbeeld: er ontbreekt een kussen op een stoel.">'+esc(c.opmerking || "")+'</textarea>' +
    '<button type="button" class="groot" data-afmelden="'+esc(k)+'">Afmelden</button><div class="melding" data-melding="'+esc(k)+'"></div></div>';
}
function zoekStop(k){
  if (!dagData) return null;
  var d = k.split(":");
  var r = dagData.ritten.find(function(x){ return x.id === d[0]; }); if (!r) return null;
  var s = r.stops.find(function(x){ return x.order === d[1]; });
  return s ? { r: r, s: s } : null;
}
function koppelDag(){
  $("lijst").querySelectorAll("[data-klap]").forEach(function(el){ el.addEventListener("click", function(){
    var k = el.dataset.klap, x = zoekStop(k); if (!x) return;
    var eerste = x.r.stops.find(function(y){ return !y.af; });
    var nu = open[k] !== undefined ? open[k] : (eerste === x.s); open[k] = !nu; tekenDag();
  }); });
  koppelFotoKnoppen($("lijst"), tekenDag);
  $("lijst").querySelectorAll("[data-pak]").forEach(function(v){ v.addEventListener("change", function(){ bewaarLokaal(v.dataset.pak, v.checked ? "1" : ""); v.closest("li").classList.toggle("gepakt", v.checked); }); });
  $("lijst").querySelectorAll(".stop").forEach(function(vak){
    var k = vak.dataset.stop, x = zoekStop(k); if (!x) return;
    var c = concept[k] = concept[k] || {};
    vak.querySelectorAll("[data-soort]").forEach(function(b){ b.addEventListener("click", function(){ c.soort = b.dataset.soort; tekenDag(); }); });
    vak.querySelectorAll("[data-veld]").forEach(function(v){ v.addEventListener("input", function(){ c[v.dataset.veld] = v.value; }); });
    var h = vak.querySelector(".hand"); if (h) koppelHandtekening(h, c);
    var af = vak.querySelector("[data-afmelden]"); if (af) af.addEventListener("click", function(){ afmelden(k, af); });
    var op = vak.querySelector("[data-opnieuw]"); if (op) op.addEventListener("click", function(){ concept[k] = { opnieuw: true, soort: x.s.af.soort, naam: x.s.af.naam || "", opmerking: x.s.af.opmerking || "" }; open[k] = true; tekenDag(); });
    var th = vak.querySelector("[data-toonhand]"); if (th) th.addEventListener("click", async function(){
      th.disabled = true; th.textContent = "Even ophalen…";
      try { var d = k.split(":"); var j = await lees("/bakwagen/handtekening?rit="+encodeURIComponent(d[0])+"&order="+encodeURIComponent(d[1])); handCache[k] = j.hand || ""; tekenDag(); }
      catch(e){ th.disabled = false; th.textContent = "Handtekening bekijken"; }
    });
  });
}
/* Tekenen met vinger of pen, bewaard als kleine PNG (zelfde manier als de
   opleverbon in Mijn route). */
function koppelHandtekening(h, c){
  var cv = h.querySelector("canvas"), ctx = cv.getContext("2d");
  var breed = h.clientWidth || 320, hoog = 170, dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width = Math.round(breed*dpr); cv.height = Math.round(hoog*dpr); ctx.scale(dpr,dpr);
  ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111";
  var hint = h.querySelector(".hint");
  if (c.hand){ var img = new Image(); img.onload = function(){ ctx.drawImage(img, 0, 0, breed, hoog); }; img.src = c.hand; if (hint) hint.style.display = "none"; }
  var bezig = false, was = false;
  function pos(e){ var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener("pointerdown", function(e){ e.preventDefault(); bezig = true; was = true; cv.setPointerCapture(e.pointerId); var p = pos(e); ctx.beginPath(); ctx.moveTo(p[0],p[1]); if (hint) hint.style.display = "none"; });
  cv.addEventListener("pointermove", function(e){ if (!bezig) return; e.preventDefault(); var p = pos(e); ctx.lineTo(p[0],p[1]); ctx.stroke(); });
  function klaar(){ if (!bezig) return; bezig = false; if (was){ var k = document.createElement("canvas"); k.width = 600; k.height = 200; k.getContext("2d").drawImage(cv, 0, 0, 600, 200); c.hand = k.toDataURL("image/png"); } }
  cv.addEventListener("pointerup", klaar); cv.addEventListener("pointercancel", klaar); cv.addEventListener("pointerleave", klaar);
  h.querySelector(".wis").addEventListener("click", function(){ ctx.clearRect(0,0,breed,hoog); c.hand = ""; was = false; if (hint) hint.style.display = ""; });
}
async function afmelden(k, knop){
  var x = zoekStop(k); if (!x) return;
  var c = concept[k] || {}, m = document.querySelector('[data-melding="'+k+'"]');
  if (!c.hand) { if (m) { m.className = "melding slecht"; m.textContent = "Laat de klant eerst tekenen in het vak hierboven."; } return; }
  knop.disabled = true; knop.textContent = "Bezig met afmelden…";
  var soort = c.soort || x.r.soort;
  try {
    var j = await lees("/bakwagen/afmelden", { method: "POST", body: JSON.stringify({ rit: x.r.id, order: x.s.order, soort: soort, naam: c.naam || "", opmerking: c.opmerking || "", hand: c.hand, chauffeur: x.r.chauffeur || ikChauffeur, klant: x.s.klant || "" }) });
    if (!j.ok) throw new Error(j.error || "onbekend");
    x.s.af = { soort: soort, naam: c.naam || "", opmerking: c.opmerking || "", chauffeur: j.chauffeur || x.r.chauffeur, door: ik, ts: j.ts, getekend: true };
    handCache[k] = c.hand; delete concept[k]; open[k] = false;
    try{ if (window.fpLog) window.fpLog("bakwagen-afgemeld", "rit " + x.r.id + " order " + x.s.order + " " + soort + (x.s.af.opmerking ? " (met opmerking)" : "")); }catch(e){}
    tekenDag();
  } catch(e) {
    knop.disabled = false; knop.textContent = "Afmelden";
    if (m) { m.className = "melding slecht"; m.textContent = "Afmelden vraagt nog een poging (geen verbinding?). Wat je hebt ingevuld blijft staan; probeer het zo opnieuw."; }
  }
}
(async function(){
  for (var i = 0; i < 20 && !teamKey(); i++) await new Promise(function(r){ setTimeout(r, 500); });
  if (!planner && !ikChauffeur) { $("lijst").innerHTML = '<p class="leeg">Deze tegel is voor de bakwagenchauffeurs en de planning van de ritten.</p>'; $("onderweg").hidden = false; return; }
  toon();
  /* Elke twee minuten opnieuw, zodat een rit die later klaargezet wordt vanzelf
     verschijnt; maar nooit terwijl er iemand aan het tekenen of typen is. */
  setInterval(function(){ if (!document.hidden && tab === "onderweg" && !heeftConcept()) laadDag(0); }, 120000);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden && tab === "onderweg" && !heeftConcept()) laadDag(0); });
})();
</script>
