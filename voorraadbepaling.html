<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<script src="toegang.js"></script>
<script src="taal.js"></script>
<script src="kop.js"></script>
<script src="breedte.js"></script>
<script>
  (function(){
    if (!localStorage.getItem("fp.session")) { location.replace("dashboard.html"); return; }
    var ik = (localStorage.getItem("fp.email")||"").toLowerCase();
    if (window.fpToegang && !fpToegang.mag("voorraadbepaling", ik)) {
      document.addEventListener("DOMContentLoaded", function(){
        document.body.innerHTML = '<div style="max-width:420px;margin:14vh auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:34px;text-align:center;font-family:Montserrat,system-ui,sans-serif">' +
          '<h2 style="color:#144734;margin:0 0 8px">Voorraadbepaling</h2><p style="color:#6b7280">Deze tegel is voor Chantal en Arno.</p>' +
          '<a href="dashboard.html">&larr; Terug naar het dashboard</a></div>';
      });
    }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voorraadbepaling - Fonteyn Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ═════════════════════════════════════════════════════════════════
     VOORRAADBEPALING - zoals Chantal hem maakt (Gerrit, 19 okt 2026)

     Chantal maakt de lijst in Logic4 met de Rapportage Wizard en rekent in
     Excel door. Deze tegel doet hetzelfde, elke week opnieuw:
       verkocht       orderregels met orderdatum in de laatste 12 maanden,
                      magazijn Fonteyn, status afgehandeld / 30% aanbetaald /
                      volledig betaald / te factureren / gepland, Jazzi,
                      spa's en zwemspa's
       vrij           voorraad Uddel + op zee (Vrije voorraad Fonteyn/onderweg)
       in productie   open inkooporders bij de fabriek
       te produceren  verkocht / 52 x 7 (tussen 0 en 1: 1; tussen 3 en 7 naar boven)
       advies         te produceren - vrij - in productie
     Wat er na de berekening besteld moet worden, bestelt Chantal.
     De berekening staat in de worker (vb2Lijst).

     OTA: staat in manifest.json. Nooit opnieuw installeren.
     ═════════════════════════════════════════════════════════════════ -->
<style>
:root{ --groen:#144734; --lime:#8bc53f; --ink:#1f2937; --grijs:#6b7280; --rand:#e5e7eb; --bg:#f5f4ef; --oranje:#c2410c; }
*{box-sizing:border-box}
body{margin:0;font-family:"Montserrat",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px}
header{background:var(--groen);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:16px;font-weight:600;flex:1}
main{margin:16px auto;padding:0 14px 60px}
.kaart{background:#fff;border:1px solid var(--rand);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.lead{color:var(--grijs);font-size:12.5px;margin:0 0 10px;line-height:1.5}
.kop3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:6px 0 4px}
.kop3 div{background:#f8faf5;border:1px solid var(--rand);border-radius:10px;padding:10px 12px}
.kop3 b{display:block;font-size:20px}
.kop3 span{font-size:11.5px;color:var(--grijs)}
.balk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.knop{background:#fff;border:1px solid var(--rand);border-radius:9px;padding:7px 12px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--groen);font-weight:600}
.knop.vol{background:var(--groen);color:#fff;border-color:var(--groen)}
.tabs{display:inline-flex;border:1px solid var(--rand);border-radius:9px;overflow:hidden}
.tabs button{border:0;background:#fff;padding:7px 12px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--grijs)}
.tabs button.aan{background:var(--groen);color:#fff}
input[type=search]{border:1px solid var(--rand);border-radius:9px;padding:7px 10px;font:inherit;font-size:12.5px;min-width:180px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--grijs);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:7px 6px;border-bottom:1px solid var(--rand);white-space:nowrap;position:sticky;top:0;background:#fff}
td{padding:7px 6px;border-bottom:1px solid #f3f4f6;vertical-align:top;overflow-wrap:break-word}
.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pil{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pil.bij{background:#ffedd5;color:var(--oranje)}.pil.goed{background:#eef2e6;color:var(--groen)}
.min{color:var(--grijs)}
.melding{font-size:12.5px;color:var(--groen)}
</style>
</head>
<body>
<header>
  <a class="fp-kop-knop" href="dashboard.html">&larr; Dashboard</a>
  <h1>📊 Voorraadbepaling</h1>
</header>
<main>
  <div class="kaart">
    <p class="lead" id="uitleg">De lijst zoals Chantal hem maakt met de Rapportage Wizard in Logic4. Elke week: wat bij <b>Advies</b> boven nul staat, bestelt Chantal.</p>
    <div class="kop3" id="kop"></div>
    <div class="balk">
      <div class="tabs"><button type="button" id="tUit" class="aan">Per uitvoering</button><button type="button" id="tSpa">Per spa</button></div>
      <label style="font-size:12.5px"><input type="checkbox" id="bestellen"> alleen wat besteld moet worden</label>
      <input type="search" id="zoek" placeholder="Zoek op spa of kleur">
      <button type="button" class="knop" id="vers">Opnieuw uitrekenen</button>
      <button type="button" class="knop" id="excel">Download Excel</button>
      <button type="button" class="knop vol" id="vast">Vastleggen voor deze week</button>
      <span id="stand" class="melding"></span>
    </div>
    <div class="balk" id="weken" style="font-size:12px;color:var(--grijs)"></div>
  </div>
  <div class="kaart"><table><thead><tr><th id="kolNaam">Spa uitvoering</th><th class="n">Verkocht</th><th class="n">Vrije voorraad Fonteyn/onderweg</th><th class="n">In productie</th><th class="n">Spas te produceren</th><th class="n">Advies te produceren</th><th></th></tr></thead><tbody id="lijst"><tr><td colspan="7" class="lead">Lijst ophalen…</td></tr></tbody></table></div>
</main>
<script>
var W = "https://fonteyn-data-store.g-mulder.workers.dev";
var ik = (localStorage.getItem("fp.email")||"").toLowerCase();
function teamKey(){ return localStorage.getItem("fp.teamkey")||""; }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }
function nl(n, d){ return Number(n||0).toLocaleString("nl-NL", { maximumFractionDigits: d == null ? 2 : d }); }
function datumNL(v){ if(!v) return ""; var s=String(v).slice(0,10).split("-"); return s.length===3 ? s[2]+"-"+s[1]+"-"+s[0] : v; }
function kop(){ return { "X-Fonteyn-Auth": teamKey(), "X-Fonteyn-User": ik }; }
var data = null, weergave = "uit";
try { weergave = localStorage.getItem("fp.vb.weergave") || "uit"; } catch(e) {}
async function laad(vers){
  $("stand").textContent = vers ? "Opnieuw uitrekenen…" : "";
  try{
    var r = await fetch(W+"/voorraadbepaling?vb2=tegel"+(vers?"&vers=1":""), { headers: kop() });
    var j = await r.json();
    if (!j.ok) throw new Error(j.uitleg || j.error || ("HTTP "+r.status));
    data = j; teken();
    $("stand").textContent = "Stand " + new Date(j.ts).toLocaleString("nl-NL", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
  }catch(e){ $("lijst").innerHTML = '<tr><td colspan="7" class="lead">'+esc(e.message)+'</td></tr>'; $("stand").textContent = ""; }
}
function rijen(){
  if (!data) return [];
  var l = weergave === "spa" ? data.spas.map(function(x){ return Object.assign({ naam: x.model }, x); })
                             : data.uitvoeringen.map(function(x){ return Object.assign({ naam: x.uitvoering }, x); });
  var z = ($("zoek").value||"").trim().toLowerCase();
  if (z) l = l.filter(function(x){ return x.naam.toLowerCase().indexOf(z) >= 0; });
  if ($("bestellen").checked) l = l.filter(function(x){ return x.advies > 0; });
  return l;
}
function teken(){
  var j = data;
  $("tUit").classList.toggle("aan", weergave !== "spa"); $("tSpa").classList.toggle("aan", weergave === "spa");
  $("kolNaam").textContent = weergave === "spa" ? "Spa" : "Spa uitvoering";
  var bij = j.uitvoeringen.filter(function(x){ return x.advies > 0; });
  var stuks = bij.reduce(function(n, x){ return n + Math.ceil(x.advies); }, 0);
  $("kop").innerHTML =
    '<div><b>'+nl(j.totaal.regels,0)+'</b><span>verkocht (orderregels) van '+datumNL(j.periode.vanaf)+' t/m '+datumNL(j.periode.tot)+'</span></div>'+
    '<div><b>'+bij.length+'</b><span>uitvoeringen om te bestellen</span></div>'+
    '<div><b>'+nl(stuks,0)+'</b><span>spa\'s volgens het advies (naar boven afgerond)</span></div>';
  $("uitleg").innerHTML = 'De lijst zoals Chantal hem maakt met de Rapportage Wizard in Logic4: orders van '+datumNL(j.periode.vanaf)+' t/m '+datumNL(j.periode.tot)+
    ', magazijn Fonteyn, status afgehandeld, 30% aanbetaald, volledig betaald, te factureren of gepland, leverancier Jazzi, spa\'s en zwemspa\'s. '+
    '<b>Spas te produceren</b> = 7 weken verkoop. <b>Advies</b> = te produceren min vrije voorraad min in productie. Elke week: wat bij Advies boven nul staat, bestelt Chantal.';
  var l = rijen();
  $("lijst").innerHTML = l.length ? l.map(function(x){
    var pil = x.advies > 0 ? '<span class="pil bij">'+Math.ceil(x.advies)+' bestellen</span>' : '<span class="pil goed">genoeg</span>';
    return '<tr><td>'+esc(x.naam)+'</td><td class="n">'+nl(x.regels,0)+'</td><td class="n">'+nl(x.vrij,0)+'</td><td class="n">'+nl(x.inProductie,0)+'</td><td class="n">'+nl(x.teProduceren)+'</td><td class="n'+(x.advies>0?'':' min')+'">'+nl(x.advies)+'</td><td>'+pil+'</td></tr>';
  }).join("") : '<tr><td colspan="7" class="lead">Alles is voldoende op voorraad of in productie.</td></tr>';
  $("weken").innerHTML = (j.vastgelegd && j.vastgelegd.length) ? 'Vastgelegd: ' + j.vastgelegd.map(function(w){ return '<a href="#" data-w="'+esc(w)+'">'+esc(w.replace("-W"," week "))+'</a>'; }).join(" · ") : "";
  $("weken").querySelectorAll("a").forEach(function(a){ a.addEventListener("click", function(e){ e.preventDefault(); toonWeek(a.dataset.w); }); });
}
async function toonWeek(w){
  try{
    var r = await fetch(W+"/voorraadbepaling?vb2=week&w="+encodeURIComponent(w), { headers: kop() });
    var j = await r.json(); if (!j.ok) throw new Error(j.error || "HTTP "+r.status);
    data = j; teken();
    $("stand").textContent = "Vastgelegd " + w.replace("-W"," week ") + " door " + String((j.vastgelegd||{}).door||"").split("@")[0] + " · terug naar vandaag met Opnieuw uitrekenen";
  }catch(e){ $("stand").textContent = e.message; }
}
function excel(){
  if (!data) return;
  var l = rijen(), sep = ";";
  var kopRij = [weergave === "spa" ? "Spa" : "Spa uitvoering", "Verkocht", "Vrije voorraad Fonteyn/onderweg", "In productie", "Spas te produceren", "Advies te produceren"];
  var regels = [kopRij.join(sep)].concat(l.map(function(x){
    return ['"'+String(x.naam).replace(/"/g,'""')+'"', x.regels, x.vrij, x.inProductie, String(x.teProduceren).replace(".",","), String(x.advies).replace(".",",")].join(sep);
  }));
  var blob = new Blob(["﻿" + regels.join("\r\n")], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "Voorraadbepaling " + (data.periode ? data.periode.tot : "") + (weergave === "spa" ? " per spa" : " per uitvoering") + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
}
async function vastleggen(){
  if (!(await fpBevestig("De lijst van vandaag vastleggen voor deze week? Dan kun je later terugzien op welke stand er besteld is.", { knop: "Vastleggen" }))) return;
  try{
    var r = await fetch(W+"/voorraadbepaling?vb2=vastleggen", { method: "POST", headers: kop() });
    var j = await r.json(); if (!j.ok) throw new Error(j.error || "HTTP "+r.status);
    $("stand").textContent = "Vastgelegd voor " + j.week.replace("-W"," week ");
    laad(false);
  }catch(e){ $("stand").textContent = "Vastleggen vraagt een nieuwe poging: " + e.message; }
}
$("tUit").addEventListener("click", function(){ weergave = "uit"; try{ localStorage.setItem("fp.vb.weergave", weergave); }catch(e){} teken(); });
$("tSpa").addEventListener("click", function(){ weergave = "spa"; try{ localStorage.setItem("fp.vb.weergave", weergave); }catch(e){} teken(); });
$("bestellen").addEventListener("change", function(){ if (data) teken(); });
$("zoek").addEventListener("input", function(){ if (data) teken(); });
$("vers").addEventListener("click", function(){ laad(true); });
$("excel").addEventListener("click", excel);
$("vast").addEventListener("click", vastleggen);
(async function(){ for (var i=0;i<20&&!teamKey();i++) await new Promise(function(r){ setTimeout(r,500); }); laad(false); })();
</script>
<script>
(function(){
  var W="https://fonteyn-data-store.g-mulder.workers.dev/log";
  function apparaat(){ var ua=navigator.userAgent||"", m=ua.match(/Fonteyn-Dashboard\/([\d.]+)/); var id=localStorage.getItem("fp.apparaat"); if(!id){ id="PC-"+Math.random().toString(36).slice(2,8).toUpperCase(); try{localStorage.setItem("fp.apparaat",id);}catch(e){} } return { computer:id, platform:(ua.match(/\(([^)]+)\)/)||[])[1]||"", versie: m?"app "+m[1]:"browser" }; }
  window.fpLog=function(action,detail){ var email=(localStorage.getItem("fp.email")||"").toLowerCase(), key=localStorage.getItem("fp.teamkey")||""; if(!email||!key) return; var app=apparaat();
    fetch(W,{method:"POST",headers:{"Content-Type":"application/json","X-Fonteyn-Auth":key},body:JSON.stringify({user:email,tile:"voorraadbepaling",action:action||"open",detail:(detail||"").slice(0,1200),computer:app.computer,platform:app.platform,versie:app.versie})}).catch(function(){}); };
  window.fpLog("open","");
})();
</script>
</body>
</html>
