<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Fonteyn — Personeel</title>
<script src="toegang.js"></script>
<script src="taal.js"></script>
<script src="kop.js"></script>
<script src="breedte.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ═════════════════════════════════════════════════════════════════
     PERSONEEL - de buitenlandse medewerkers, hun shifts en hun uren

     Gerrit (23 okt 2026): "Chantal en ik gebruiken nu dit Excel document
     nog om de buitenlandse medewerkers bij te houden (Roemenen en Kroaten).
     Ik wil dat je dit document volledig maakt in de tegel Personeel waarbij
     het makkelijk is om het schema aan te vullen (iedere shift begint altijd
     op een woensdag, elke shift duurt twee weken) en een overzicht om de
     gegevens van de mensen (en nieuwe mensen) makkelijk toe te voegen."

     Tabbladen:
     - Schema: per kamer de woensdagen naast elkaar; een shift = 2 weken
       (wo t/m di). Klik op een leeg vak voor een nieuwe shift, met
       "herhalen om de 4 weken" (2 weken werken, 2 weken thuis).
     - Medewerkers: lijst en een kaart per persoon met alle gegevens.
     - Uren: gewerkte uren per week (uit het tabblad Overzicht).
     - Kamers vandaag, Vluchten (woensdag), Delano (facturen, € 500 per 144 uur).

     Opslag: bucket personeel ({employees, rooms, assignments, uren,
     urenNakijken, delano, vliegregels}). Ingelezen uit "Roemenen en
     Kroaten.xlsx" op 23 okt 2026; wat bij het inlezen niet zeker te koppelen
     was, staat in het schema met "nakijken".

     OTA: staat in manifest.json. Nooit opnieuw installeren.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
:root{ --groen:#144734; --groen-d:#0d3325; --lime:#8bc53f; --lime-d:#72a531; --ink:#1d1d1d; --grijs:#6b7280; --rand:#e0e0d8; --bg:#f5f4ef; --kaart:#fff; --rood:#b91c1c; --oranje:#c2410c; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:"Montserrat",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
header.hdr{background:var(--groen);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.hdr h1{margin:0;font-size:17px;font-weight:600;flex:1}
main{max-width:1320px;margin:0 auto;padding:18px 16px 50px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--rand);margin-bottom:16px}
.tab{padding:10px 16px;background:transparent;border:0;border-bottom:3px solid transparent;font:inherit;font-weight:600;font-size:14px;cursor:pointer;color:var(--grijs);margin-bottom:-2px;white-space:nowrap}
.tab.aan{color:var(--groen);border-bottom-color:var(--groen)}
.pane{display:none}.pane.aan{display:block}
.kaart{background:var(--kaart);border:1px solid var(--rand);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.kaart h2{font-size:15px;margin:0 0 10px;color:var(--groen)}
.balk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.balk .vul{flex:1}
.knop{background:var(--lime);color:var(--groen);border:0;border-radius:9px;padding:8px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.knop:hover{background:var(--lime-d);color:#fff}
.knop.wit{background:#fff;color:var(--groen);border:1px solid var(--rand);font-weight:600}
.knop.wit:hover{border-color:var(--groen);background:#fff;color:var(--groen)}
.knop.rood{background:#fff;color:var(--rood);border:1px solid #fca5a5}
.knop.klein{padding:5px 10px;font-size:12px}
.grijs{color:var(--grijs);font-size:12.5px}
.pil{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef2e6;color:var(--groen);white-space:nowrap}
.pil.oranje{background:#ffedd5;color:var(--oranje)}.pil.grijs{background:#f3f4f6;color:var(--grijs)}
input,select,textarea{font:inherit;font-size:13px;border:1px solid var(--rand);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lime);outline-offset:-1px;border-color:transparent}
#status{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--groen);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none}
#status.zie{opacity:1}#status.fout{background:var(--rood)}

/* ── Schema ── */
.rooster{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.rooster th,.rooster td{border-bottom:1px solid #eeede7;padding:0;height:42px;vertical-align:middle}
.rooster th.kamer{width:132px;text-align:left;padding:4px 10px;font-size:12.5px;background:#fafaf7;position:sticky;left:0}
.rooster th.kamer small{display:block;color:var(--grijs);font-weight:500;font-size:10.5px}
.rooster thead th{height:auto;padding:6px 2px;font-size:11.5px;color:var(--grijs);font-weight:600;text-align:center;background:#fafaf7}
.rooster thead th b{display:block;color:var(--ink);font-size:13px}
.rooster thead th.nu{color:var(--groen)} .rooster thead th.nu b{color:var(--groen)}
.rooster td.leeg{cursor:pointer;text-align:center;color:#cbd5c0;font-size:16px;border-left:1px dashed #f0efe8}
.rooster td.leeg:hover{background:#f4f9ee;color:var(--groen)}
.rooster td.shift{padding:3px}
.rooster td.shift .blok{border-radius:8px;padding:4px 8px;font-size:12.5px;font-weight:600;cursor:pointer;height:34px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:1px solid rgba(0,0,0,.08)}
.rooster td.shift .blok span{overflow:hidden;text-overflow:ellipsis}
.rooster td.shift .blok.nakijk{outline:2px dashed var(--oranje);outline-offset:-2px}
.rooster tr.huis th{background:var(--groen);color:#fff;text-align:left;padding:5px 10px;height:auto;font-size:12px}
.uitleg{font-size:12.5px;color:var(--grijs);margin:4px 0 10px;line-height:1.5}
/* Venster (shift, medewerker) */
.laag{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;z-index:40;padding:6vh 14px;overflow:auto}
.venster{background:#fff;border-radius:14px;max-width:620px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.venster h3{margin:0 0 12px;color:var(--groen);font-size:16px}
.velden{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 12px}
.velden label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:600;color:var(--grijs)}
.velden label.breed{grid-column:1/-1}
.velden textarea{min-height:64px;resize:vertical}
.vensterknoppen{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.vensterknoppen .links{margin-right:auto}
.melding{font-size:12.5px;font-weight:600;margin-top:8px}.melding.fout{color:var(--rood)}
/* ── Medewerkers ── */
table.lijst{width:100%;border-collapse:collapse;font-size:13px}
table.lijst th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--grijs);padding:7px 8px;border-bottom:1px solid var(--rand);background:#fafaf7}
table.lijst td{padding:8px;border-bottom:1px solid #f0efe8;vertical-align:top;overflow-wrap:break-word}
table.lijst tr.rij{cursor:pointer}table.lijst tr.rij:hover td{background:#f8faf5}
table.lijst tr.uit td{color:#9ca3af}
.naam b{font-weight:600}
/* ── Uren ── */
table.uren{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
table.uren th,table.uren td{padding:4px;border-bottom:1px solid #f0efe8;text-align:center}
table.uren th:first-child,table.uren td:first-child{text-align:left;width:190px}
table.uren th{font-size:11px;color:var(--grijs);font-weight:600;background:#fafaf7}
table.uren th b{display:block;color:var(--ink);font-size:12.5px}
table.uren input{width:100%;text-align:center;padding:5px 2px;font-size:12.5px}
table.uren td.tot{font-weight:700;color:var(--groen)}
/* ── Kamers ── */
.kamers{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.kamerkaart{border:1px solid var(--rand);border-radius:10px;padding:10px 12px;background:#fff}
.kamerkaart .huis{font-size:11px;color:var(--grijs);text-transform:uppercase;letter-spacing:.04em}
.kamerkaart .k{font-weight:700;color:var(--groen);margin:2px 0 6px}
.kamerkaart .wie{font-weight:600}.kamerkaart .wie.leeg{color:var(--grijs);font-weight:400;font-style:italic}
.wo{border:1px solid var(--rand);border-radius:10px;padding:12px 14px;background:#fff;margin-bottom:10px}
.wo .d{font-weight:700;color:var(--groen)}
.wo ul{margin:6px 0 0;padding-left:18px}.wo li{margin:3px 0}
@media (max-width:700px){ .rooster th.kamer{width:92px} header.hdr{padding:10px 12px} main{padding:12px 10px 40px} }
</style>
</head>
<body>
<header class="hdr">
  <a class="fp-kop-knop" href="dashboard.html">&larr; Dashboard</a>
  <h1>👥 Personeel</h1>
</header>
<main>
  <div class="tabs" id="tabs">
    <button class="tab aan" data-tab="schema">Schema</button>
    <button class="tab" data-tab="mensen">Medewerkers</button>
    <button class="tab" data-tab="uren">Uren</button>
    <button class="tab" data-tab="kamers">Kamers vandaag</button>
    <button class="tab" data-tab="vluchten">Vluchten</button>
    <button class="tab" data-tab="delano">Delano</button>
  </div>
  <section class="pane aan" id="pane-schema"></section>
  <section class="pane" id="pane-mensen"></section>
  <section class="pane" id="pane-uren"></section>
  <section class="pane" id="pane-kamers"></section>
  <section class="pane" id="pane-vluchten"></section>
  <section class="pane" id="pane-delano"></section>
</main>
<div id="status"></div>
<div id="laag"></div>
<script>
var W = "https://fonteyn-data-store.g-mulder.workers.dev";
var URL_DATA = W + "/data/personeel";
var ik = (localStorage.getItem("fp.email") || "").toLowerCase();
function teamKey(){ return localStorage.getItem("fp.teamkey") || ""; }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }
(function(){
  if (!localStorage.getItem("fp.session")) { location.replace("dashboard.html"); throw new Error("inloggen"); }
  if (window.fpToegang && !fpToegang.mag("personeel", ik)) {
    document.body.innerHTML = '<main style="padding:40px;text-align:center"><h2 style="color:#144734">Toegang op aanvraag</h2><p>De tegel Personeel is voor de planning van de buitenlandse medewerkers.</p><p><a href="dashboard.html">&larr; Dashboard</a></p></main>';
    throw new Error("geen toegang");
  }
})();

/* ── Datums ── */
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function datum(s){ return new Date(String(s).slice(0,10)+"T12:00:00"); }
function plus(s, n){ var d = datum(s); d.setDate(d.getDate()+n); return iso(d); }
var VANDAAG = iso(new Date());
function woensdagVan(s){ var d = datum(s), w = (d.getDay()+4)%7; d.setDate(d.getDate()-w); return iso(d); }   // de woensdag op of vóór deze dag
function isoWeek(s){ var d = datum(s); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); var j = d.getFullYear(), w1 = new Date(j,0,4,12); return [j, 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)]; }
function weekSleutel(s){ var w = isoWeek(s); return w[0]+"-W"+String(w[1]).padStart(2,"0"); }
var MND = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
function kort(s){ var d = datum(s); return d.getDate()+" "+MND[d.getMonth()]; }
function lang(s){ return datum(s).toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }

/* ── Gegevens en opslaan ── */
var st = { employees:[], rooms:[], assignments:[], uren:{}, urenNakijken:[], delano:{ regel:"", facturen:[] }, vliegregels:{} };
var geladen = null;   // wat de server had bij het laden, om samen te voegen
function naam(e){ return e ? ((e.voornaam||"")+" "+(e.achternaam||"")).trim() || "(naam volgt)" : "(onbekend)"; }
function persoon(id){ return st.employees.find(function(e){ return e.id === id; }); }
function kamer(id){ return st.rooms.find(function(r){ return r.id === id; }); }
function nieuwId(p){ return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
var KLEUREN = ["#cfe8d6","#fbd3cf","#fde3b8","#cfe0f1","#e4d6f1","#fcdcae","#cdeee7","#f9d2dc","#dcecc0","#efd1d1","#d6d0f3","#fff2b8","#cfeedf","#ecd9c6","#d0d3f3"];
function kleur(id){ var h = 0; String(id||"").split("").forEach(function(c){ h = (h*31 + c.charCodeAt(0)) >>> 0; }); return KLEUREN[h % KLEUREN.length]; }

async function laden(){
  var r = await fetch(URL_DATA + "?t=" + Date.now(), { headers: { "X-Fonteyn-Auth": teamKey() } });
  if (!r.ok) throw new Error("HTTP " + r.status);
  var j = await r.json();
  st.employees = j.employees || []; st.rooms = j.rooms || []; st.assignments = j.assignments || [];
  st.uren = j.uren || {}; st.urenNakijken = j.urenNakijken || []; st.delano = j.delano || { regel:"", facturen:[] }; st.vliegregels = j.vliegregels || {};
  geladen = JSON.parse(JSON.stringify(j));
}
/* Bewaren: eerst de laatste stand van de server ophalen en daar onze
   wijzigingen overheen leggen, zodat Chantal en Gerrit elkaars werk niet
   overschrijven als ze tegelijk bezig zijn. Per lijst op id. */
var bewaarTimer = null, gewijzigd = { employees:{}, assignments:{}, weg:{}, uren:{}, overig:false };
function wijzig(soort, id){ if (soort === "overig") gewijzigd.overig = true; else gewijzigd[soort][id] = true; clearTimeout(bewaarTimer); bewaarTimer = setTimeout(bewaar, 500); }
async function bewaar(){
  try {
    var r0 = await fetch(URL_DATA + "?t=" + Date.now(), { headers: { "X-Fonteyn-Auth": teamKey() } });
    var server = r0.ok ? await r0.json() : {};
    var samen = function(lijstServer, lijstMij, soort){
      var uit = (lijstServer || []).filter(function(x){ return !gewijzigd.weg[x.id]; });
      lijstMij.forEach(function(x){ if (!gewijzigd[soort][x.id]) return; var i = uit.findIndex(function(y){ return y.id === x.id; }); if (i >= 0) uit[i] = x; else uit.push(x); });
      return uit;
    };
    var uren = Object.assign({}, server.uren || {});
    Object.keys(gewijzigd.uren).forEach(function(k){ var p = k.split("|"); uren[p[0]] = Object.assign({}, uren[p[0]] || {}); if (st.uren[p[0]] && st.uren[p[0]][p[1]] !== undefined && st.uren[p[0]][p[1]] !== "") uren[p[0]][p[1]] = st.uren[p[0]][p[1]]; else delete uren[p[0]][p[1]]; });
    var data = Object.assign({}, server, {
      employees: samen(server.employees, st.employees, "employees"),
      assignments: samen(server.assignments, st.assignments, "assignments"),
      rooms: st.rooms, uren: uren,
      urenNakijken: gewijzigd.overig ? st.urenNakijken : (server.urenNakijken || st.urenNakijken),
      delano: gewijzigd.overig ? st.delano : (server.delano || st.delano),
      vliegregels: st.vliegregels, lastUpdated: new Date().toISOString(), door: ik });
    var r = await fetch(URL_DATA, { method: "PUT", headers: { "Content-Type": "application/json", "X-Fonteyn-Auth": teamKey() }, body: JSON.stringify(data) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    gewijzigd = { employees:{}, assignments:{}, weg:{}, uren:{}, overig:false };
    st.employees = data.employees; st.assignments = data.assignments; st.uren = data.uren;
    melding("Opgeslagen");
  } catch(e) { melding("Opslaan vraagt nog een poging: " + e.message, true); }
}
var meldTimer = null;
function melding(t, fout){ var m = $("status"); m.textContent = t; m.className = "zie" + (fout ? " fout" : ""); clearTimeout(meldTimer); meldTimer = setTimeout(function(){ m.className = ""; }, fout ? 6000 : 1800); }
function log(a, d){ try { if (window.fpLog) window.fpLog(a, d || ""); } catch(e) {} }

/* ── Tabbladen ── */
var tab = "schema";
try { tab = localStorage.getItem("fp.personeel.tab") || "schema"; } catch(e) {}
function toonTab(t){
  tab = t; try { localStorage.setItem("fp.personeel.tab", t); } catch(e) {}
  document.querySelectorAll(".tab").forEach(function(b){ b.classList.toggle("aan", b.dataset.tab === t); });
  document.querySelectorAll(".pane").forEach(function(p){ p.classList.toggle("aan", p.id === "pane-" + t); });
  ({ schema: tekenSchema, mensen: tekenMensen, uren: tekenUren, kamers: tekenKamers, vluchten: tekenVluchten, delano: tekenDelano })[t]();
}
document.querySelectorAll(".tab").forEach(function(b){ b.addEventListener("click", function(){ toonTab(b.dataset.tab); }); });

/* ═══ SCHEMA ═══════════════════════════════════════════════════════════
   Per kamer de woensdagen naast elkaar. Een shift begint op een woensdag en
   duurt twee weken (t/m de dinsdag), dus een blok beslaat twee kolommen. */
var schemaStart = plus(woensdagVan(VANDAAG), -14);
function aantalWeken(){ var b = ($("pane-schema").clientWidth || 1100) - 140; return Math.max(4, Math.min(16, Math.floor(b / 82))); }
function kamersOpVolgorde(){ return st.rooms.slice().sort(function(a,b){ return (a.sortOrder||0) - (b.sortOrder||0); }); }
function tekenSchema(){
  var n = aantalWeken(), weken = []; for (var i = 0; i < n; i++) weken.push(plus(schemaStart, 7*i));
  var eind = plus(weken[n-1], 6);
  var nakijk = st.assignments.filter(function(a){ return a.nakijken && a.totDatum >= VANDAAG; }).length;
  var h = '<div class="kaart"><div class="balk"><button class="knop wit" id="sVorige">&larr; 4 weken</button><button class="knop wit" id="sNu">Vandaag</button><button class="knop wit" id="sVolgende">4 weken &rarr;</button>' +
    '<span class="vul grijs" style="text-align:center">'+esc(kort(weken[0]))+' t/m '+esc(kort(eind))+' '+datum(eind).getFullYear()+'</span>' +
    '<button class="knop" id="sNieuw">+ Shift toevoegen</button></div>' +
    '<div class="uitleg">Elke shift begint op een <b>woensdag</b> en duurt <b>twee weken</b>. Klik op een leeg vak voor een nieuwe shift in die kamer, of op een naam om hem te wijzigen.'+
      (nakijk ? ' <span class="pil oranje">'+nakijk+' shift'+(nakijk===1?'':'s')+' nakijken</span> (gestippeld: bij het inlezen uit Excel niet zeker gekoppeld of zonder kamer)' : '')+'</div>' +
    '<table class="rooster"><thead><tr><th class="kamer"></th>' + weken.map(function(w){ var wk = isoWeek(w)[1], nu = w <= VANDAAG && VANDAAG <= plus(w,6);
      return '<th class="'+(nu?'nu':'')+'"><b>wo '+esc(kort(w))+'</b>week '+wk+'</th>'; }).join("") + '</tr></thead><tbody>';
  var huis = null;
  kamersOpVolgorde().concat([{ id: "", huisje: "Overig", kamer: "Kamer nog kiezen" }]).forEach(function(k){
    if (k.huisje !== huis) { huis = k.huisje; h += '<tr class="huis"><th colspan="'+(n+1)+'">'+esc(huis)+'</th></tr>'; }
    var shifts = st.assignments.filter(function(a){ return (a.roomId || "") === k.id && a.totDatum >= weken[0] && a.vanDatum <= eind; })
      .sort(function(a,b){ return a.vanDatum.localeCompare(b.vanDatum); });
    if (k.id === "" && !shifts.length) return;
    h += '<tr><th class="kamer">'+esc(k.kamer)+(k.alleenDames?'<small>alleen dames</small>':'')+'</th>';
    var i = 0;
    while (i < n) {
      var w = weken[i], we = plus(w, 6);
      var a = shifts.find(function(x){ return x.vanDatum <= we && x.totDatum >= w; });
      if (!a) { h += '<td class="leeg" data-leeg="'+esc(k.id)+'|'+w+'" title="Shift toevoegen">+</td>'; i++; continue; }
      var span = 1; while (i + span < n && a.totDatum >= weken[i+span]) span++;
      var tegelijk = shifts.filter(function(x){ return x !== a && x.vanDatum <= plus(weken[i+span-1],6) && x.totDatum >= w; });
      var e = persoon(a.employeeId);
      h += '<td class="shift" colspan="'+span+'"><div class="blok'+(a.nakijken?' nakijk':'')+'" data-shift="'+esc(a.id)+'" style="background:'+kleur(a.employeeId)+'" title="'+esc(naam(e)+' · '+kort(a.vanDatum)+' t/m '+kort(a.totDatum)+(a.naamExcel?' · in Excel: '+a.naamExcel:'')+(a.notities?' · '+a.notities:''))+'">'+
        '<span>'+esc(e ? (e.voornaam + (e.achternaam ? " " + e.achternaam.charAt(0) + "." : "")) : (a.naamExcel || "?"))+'</span>'+(tegelijk.length?'<span class="pil grijs">+'+tegelijk.length+'</span>':'')+'</div></td>';
      i += span;
    }
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  $("pane-schema").innerHTML = h;

/* Shift toevoegen of wijzigen. Herhalen = om de 4 weken weer twee weken
   (twee weken werken, twee weken thuis), zoals in het schema gebruikelijk. */
function shiftVenster(a, voor){
  var nieuw = !a; a = a || Object.assign({ id: nieuwId("a"), employeeId: "", roomId: "", vanDatum: woensdagVan(VANDAAG), totDatum: "", notities: "" }, voor || {});
  var weken = a.totDatum ? Math.max(1, Math.round((datum(a.totDatum) - datum(a.vanDatum)) / 864e5 / 7 + 1/7)) : 2;
  venster('<h3>'+(nieuw ? 'Shift toevoegen' : 'Shift wijzigen')+'</h3>' +
    (a.nakijken ? '<p class="uitleg" style="margin-top:0"><span class="pil oranje">nakijken</span> In het Excel stond hier <b>'+esc(a.naamExcel || "?")+'</b>'+(a.roomId?'':' zonder kamernummer')+'. Kies de juiste persoon en kamer; bij Bewaren is hij nagekeken.</p>' : '') +
    '<div class="velden"><label>Medewerker<select id="vMens">'+mensenKeuze(a.employeeId)+'</select></label>' +
    '<label>Kamer<select id="vKamer">'+kamerKeuze(a.roomId)+'</select></label>' +
    '<label>Aankomst (woensdag)<input type="date" id="vVan" value="'+esc(a.vanDatum)+'"></label>' +
    '<label>Duur<select id="vDuur">'+[1,2,3,4,6,8].map(function(w){ return '<option value="'+w+'"'+(w===weken?' selected':'')+'>'+w+' we'+(w===1?'ek':'ken')+'</option>'; }).join("")+'</select></label>' +
    (nieuw ? '<label class="breed" style="flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink)"><input type="checkbox" id="vHerhaal"> Herhalen om de 4 weken (2 weken werken, 2 weken thuis) t/m <input type="date" id="vTot" value="'+esc(plus(a.vanDatum, 7*24))+'" style="flex:0 0 auto"></label>' : '') +
    '<label class="breed">Notitie<input type="text" id="vNotitie" value="'+esc(a.notities||"")+'" placeholder="bijvoorbeeld: komt met eigen auto"></label></div>' +
    '<div class="melding" id="vMelding"></div>' +
    '<div class="vensterknoppen">'+(nieuw ? '' : '<button class="knop rood links" id="vWeg">Shift verwijderen</button>')+'<button class="knop wit" id="vSluit">Annuleren</button><button class="knop" id="vBewaar">Bewaren</button></div>');
  $("vSluit").onclick = sluit;
  $("vVan").onchange = function(){ var w = woensdagVan(this.value); if (w !== this.value) { this.value = w; $("vMelding").className = "melding"; $("vMelding").textContent = "Een shift begint op woensdag; de datum staat nu op woensdag " + kort(w) + "."; } };
  if ($("vWeg")) $("vWeg").onclick = async function(){
    if (!(await fpBevestig("Deze shift van "+naam(persoon(a.employeeId))+" ("+kort(a.vanDatum)+" t/m "+kort(a.totDatum)+") verwijderen?", { knop: "Verwijderen" }))) return;
    st.assignments = st.assignments.filter(function(x){ return x.id !== a.id; }); gewijzigd.weg[a.id] = true; wijzig("overig");
    log("shift-verwijderd", naam(persoon(a.employeeId)) + " " + a.vanDatum); sluit(); tekenSchema();
  };
  $("vBewaar").onclick = function(){
    var mens = $("vMens").value, van = woensdagVan($("vVan").value || VANDAAG), duur = Number($("vDuur").value) || 2;
    if (!mens) { $("vMelding").className = "melding fout"; $("vMelding").textContent = "Kies eerst de medewerker."; return; }
    var basis = { employeeId: mens, roomId: $("vKamer").value, notities: $("vNotitie").value.trim() };
    var reeks = [van];
    if (nieuw && $("vHerhaal") && $("vHerhaal").checked) { var tot = $("vTot").value || van; for (var d = plus(van, 28); d <= tot; d = plus(d, 28)) reeks.push(d); }
    // Botst het met een andere shift in dezelfde kamer?
    var bots = basis.roomId ? reeks.filter(function(v){ var t = plus(v, 7*duur-1); return st.assignments.some(function(x){ return x.id !== a.id && x.roomId === basis.roomId && x.vanDatum <= t && x.totDatum >= v; }); }) : [];
    reeks.forEach(function(v, i){
      var x = i === 0 ? a : { id: nieuwId("a") };
      Object.assign(x, basis, { vanDatum: v, totDatum: plus(v, 7*duur-1), nakijken: false });
      if (i > 0 || nieuw) st.assignments.push(x);
      wijzig("assignments", x.id);
    });
    var e = persoon(mens); if (e && !e.actief && reeks[reeks.length-1] >= VANDAAG) { e.actief = true; wijzig("employees", e.id); }
    log(nieuw ? "shift-toegevoegd" : "shift-gewijzigd", naam(e) + " " + van + (reeks.length > 1 ? " (" + reeks.length + "x)" : ""));
    sluit(); tekenSchema();
    if (bots.length) melding("Let op: in die kamer staat in " + bots.length + " van deze periodes al iemand.", true);
  };
}

    mensen.map(function(e){ var u = st.uren[e.id] || {}, tot = 0;
      var cellen = sleutels.map(function(k){ var v = u[k] === undefined ? "" : u[k]; var x = Number(String(v).replace(",",".")); if (!isNaN(x)) tot += x;
        return '<td><input data-u="'+esc(e.id)+'|'+k+'" value="'+esc(v)+'"></td>'; }).join("");
      return '<tr><td>'+esc(naam(e))+'</td>'+cellen+'<td class="tot">'+(tot ? Math.round(tot*100)/100 : "")+'</td></tr>'; }).join("") +
    '</tbody></table><p class="uitleg">Vul het aantal uren in, of een woord zoals <i>Weg</i>. Het wordt meteen bewaard.</p></div>';
  if (st.urenNakijken.length) h += '<div class="kaart"><h2>Uren uit Excel om te koppelen</h2><p class="uitleg">In het Excel stonden deze uren bij een verkeerde naam ("Mario Eduard" doorgetrokken). Kies bij wie ze horen.</p>' +

    st.uren[p[0]] = st.uren[p[0]] || {}; if (v === "") delete st.uren[p[0]][p[1]]; else st.uren[p[0]][p[1]] = isNaN(x) ? v : x;

/* ═══ VLUCHTEN ═══ Per woensdag wie er aankomt (shift begint) en wie er naar

  var mensen = st.employees.filter(function(e){ return e.bureau === "Delano"; }).sort(function(a,b){ return naam(a).localeCompare(naam(b)); });
  var som = function(id){ return Object.values(st.uren[id] || {}).reduce(function(n,v){ var x = Number(String(v).replace(",",".")); return n + (isNaN(x) ? 0 : x); }, 0); };
  var gef = function(id){ return (d.facturen || []).filter(function(f){ return f.employeeId === id; }).reduce(function(n,f){ return n + (Number(f.bedrag)||0); }, 0); };
  var eur = function(n){ return "€ " + (Number(n)||0).toLocaleString("nl-NL",{minimumFractionDigits:2,maximumFractionDigits:2}); };
  var h = '<div class="kaart"><h2>Delano</h2><p class="uitleg">'+esc(d.regel || "Voor elke medewerker die 144 uur maakt € 500 per factuur")+'</p>' +
    '<table class="lijst"><thead><tr><th>Medewerker</th><th>Uren totaal</th><th>Blokken van 144 uur</th><th>Volgens de regel</th><th>Gefactureerd</th></tr></thead><tbody>' +
    mensen.map(function(e){ var u = som(e.id), b = Math.floor(u/144); return '<tr><td>'+esc(naam(e))+'</td><td>'+Math.round(u)+'</td><td>'+b+'</td><td>'+eur(b*500)+'</td><td>'+eur(gef(e.id))+'</td></tr>'; }).join("") + '</tbody></table></div>' +
    '<div class="kaart"><h2>Facturen</h2><table class="lijst"><thead><tr><th>Datum</th><th>Medewerker</th><th>Bedrag</th><th></th></tr></thead><tbody>' +
    (d.facturen || []).slice().sort(function(a,b){ return String(b.datum).localeCompare(String(a.datum)); }).map(function(f, i){ return '<tr><td>'+esc(f.datum ? datum(f.datum).toLocaleDateString("nl-NL") : "")+'</td><td>'+esc(f.employeeId ? naam(persoon(f.employeeId)) : (f.naamExcel||""))+'</td><td>'+eur(f.bedrag)+'</td><td><button class="knop rood klein" data-fweg="'+esc(f.datum+"|"+f.employeeId+"|"+f.bedrag)+'">Verwijderen</button></td></tr>'; }).join("") +
    '</tbody></table><div class="balk" style="margin-top:10px"><input type="date" id="fDatum" value="'+VANDAAG+'"><select id="fMens">'+mensenKeuze("")+'</select><input type="text" id="fBedrag" placeholder="bedrag, bv. 500" style="width:130px"><button class="knop" id="fNieuw">Factuur toevoegen</button></div></div>';
  $("pane-delano").innerHTML = h;
  $("fNieuw").onclick = function(){ var b = Number(String($("fBedrag").value).replace(/[€\s.]/g,"").replace(",",".")); if (!$("fMens").value || !b) { melding("Kies de medewerker en vul het bedrag in.", true); return; }
    d.facturen = d.facturen || []; d.facturen.push({ datum: $("fDatum").value, employeeId: $("fMens").value, bedrag: b }); st.delano = d; wijzig("overig"); log("delano-factuur", naam(persoon($("fMens").value)) + " " + b); tekenDelano(); };
  document.querySelectorAll("[data-fweg]").forEach(function(btn){ btn.onclick = async function(){ if (!(await fpBevestig("Deze factuur verwijderen?", { knop: "Verwijderen" }))) return;
    var p = btn.dataset.fweg.split("|"); var i = d.facturen.findIndex(function(f){ return f.datum === p[0] && String(f.employeeId) === p[1] && String(f.bedrag) === p[2]; }); if (i >= 0) d.facturen.splice(i, 1); st.delano = d; wijzig("overig"); tekenDelano(); }; });
}

<script>
/* Activiteitenlogboek — helper fpLog(actie,detail) + tegel-open melden */
(function(){
  var W="https://fonteyn-data-store.g-mulder.workers.dev/log";
  // Apparaat + app-versie meesturen. Zonder dit was bij een onverwachte inlog
  // niet te achterhalen op wélke computer dat gebeurde. Alles komt uit de
  // pagina zelf, zodat dit werkt zonder dat er iets geïnstalleerd hoeft te
  // worden — updates gaan uitsluitend via de cloud.
  function apparaat(){
    // Alles hieruit komt uit de pagina zelf, zodat het werkt zonder dat iemand
    // iets hoeft te installeren. De user-agent verraadt of dit de app is
    // (Electron) of een gewone browser, en welke versie van de app het is.
    var ua=navigator.userAgent||"";
    var app=ua.match(/fonteyn-dashboard\/([\d.]+)/i);
    var elc=ua.match(/Electron\/([\d.]+)/i);
    var versie=app?("app "+app[1]):(elc?("app · Electron "+elc[1]):"browser");
    var pm=ua.match(/(Windows NT [\d.]+|Mac OS X [\d_]+|Linux|Android|iPhone)/);
    // Vaste sleutel per computer: een willekeurig nummer dat hier blijft staan.
    // Geen persoonsgegeven — het zegt alleen DAT het dezelfde computer is. De
    // herkenbare naam koppel je in het activiteitenlogboek.
    var id=null;
    try{
      id=localStorage.getItem("fp.apparaat");
      if(!id){ id="PC-"+Math.random().toString(36).slice(2,8).toUpperCase(); localStorage.setItem("fp.apparaat",id); }
    }catch(e){}
    return {computer:id, platform:pm?pm[1].replace(/_/g,"."):null, versie:versie};
  }
  window.fpLog=function(action,detail){try{
    var email=(localStorage.getItem("fp.email")||"").toLowerCase();
    var key=localStorage.getItem("fp.teamkey")||"";
    if(!email||!key) return;
    var tile=((location.pathname.split("/").pop()||"").replace(/\.html$/,""))||"tegel";
    var app=apparaat();
    fetch(W,{method:"POST",headers:{"Content-Type":"application/json","X-Fonteyn-Auth":key},body:JSON.stringify({user:email,tile:tile,action:action||"open",detail:(detail||"").slice(0,1200),rol:(window.fpRol||"medewerker"),computer:app.computer,platform:app.platform,versie:app.versie})}).catch(function(){});
  }catch(e){}};
  window.fpLog(window.fpGeenToegang?"open-geweigerd":"open");
})();
</script>

<script>
/* Nette upload-velden. De standaardknop van de browser ("Bestand kiezen",
   "Bestand uploaden") ziet er per systeem anders uit en past niet in de
   huisstijl. We verbergen het echte veld en zetten er een eigen knop voor,
   met de gekozen bestandsnaam ernaast. De kleuren komen uit de CSS-variabelen
   van de tegel, dus in de spa-tegels wordt dit vanzelf Passion-rood. */
(function(){
  var css=document.createElement("style");
  css.textContent=
    ".fp-upload{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}"+
    ".fp-upload input[type=file]{position:absolute!important;width:1px;height:1px;opacity:0;pointer-events:none}"+
    ".fp-upload-btn{display:inline-flex;align-items:center;gap:7px;background:var(--fonteyn-green,#144734);color:#fff;"+
      "border:0;border-radius:8px;padding:9px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;"+
      "transition:background .14s,transform .1s,box-shadow .14s}"+
    ".fp-upload-btn:hover{background:var(--fonteyn-green-dark,#0d3325);transform:translateY(-1px);box-shadow:0 3px 9px rgba(0,0,0,.13)}"+
    ".fp-upload-btn:active{transform:none}"+
    ".fp-upload-btn::before{content:'\\2191';font-weight:700}"+
    ".fp-upload-naam{font-size:12.5px;color:var(--muted,#6b7280);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}"+
    ".fp-upload-naam.gekozen{color:var(--ink,#1f2937);font-weight:600}";
  (document.head||document.documentElement).appendChild(css);

  function opmaak(inp){
    if(inp.dataset.fpMooi) return;
    inp.dataset.fpMooi="1";
    var wrap=document.createElement("span"); wrap.className="fp-upload";
    var knop=document.createElement("button"); knop.type="button"; knop.className="fp-upload-btn";
    knop.textContent=inp.multiple?"Bestanden kiezen":"Bestand kiezen";
    var naam=document.createElement("span"); naam.className="fp-upload-naam";
    naam.textContent="Kies een bestand";
    inp.parentNode.insertBefore(wrap,inp);
    wrap.appendChild(knop); wrap.appendChild(inp); wrap.appendChild(naam);
    knop.addEventListener("click",function(){ inp.click(); });
    inp.addEventListener("change",function(){
      var n=inp.files?inp.files.length:0;
      naam.textContent = n===0 ? "Kies een bestand"
        : (n===1 ? inp.files[0].name : n+" bestanden gekozen");
      naam.classList.toggle("gekozen", n>0);
    });
  }
  function scan(){ document.querySelectorAll("input[type=file]").forEach(opmaak); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",scan); else scan();
  // Tabellen en formulieren worden telkens opnieuw opgebouwd; nieuwe
  // upload-velden meteen meepakken.
  new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>


<script>
/* Europese datums, dashboard-breed. Chantal leest 2026-07-28 als Amerikaans;
   overal moet 28.07.2026 staan. De meeste tegels doen dat al bij het opbouwen
   van hun tabellen, maar dit is het vangnet: na elke wijziging in de pagina
   wordt losse tekst van de vorm JJJJ-MM-DD omgezet.
   Niet aangeraakt: invoervelden (die moeten ISO blijven, anders begrijpt de
   browser de datumkiezer niet), scripts, en <code>/<pre> waar een ISO-datum
   juist de bedoeling is. Een element met class="iso-datum" blijft ook staan. */
(function(){
  var OVERSLAAN = {INPUT:1, TEXTAREA:1, SELECT:1, OPTION:1, SCRIPT:1, STYLE:1, CODE:1, PRE:1};
  // Wel: "2026-07-28". Niet: "2026-07-28T09:12" (tijdstempel) en niet als er
  // meteen een cijfer of streepje op volgt (versienummers, referenties).
  var PATROON = /\b(\d{4})-(\d{2})-(\d{2})\b(?![T:\d-])/g;

  function magNiet(node){
    for (var el = node.parentNode; el && el.nodeType === 1; el = el.parentNode){
      if (OVERSLAAN[el.tagName]) return true;
      if (el.classList && el.classList.contains("iso-datum")) return true;
    }
    return false;
  }
  function loop(wortel){
    if (!wortel || wortel.nodeType !== 1) return;
    var w = document.createTreeWalker(wortel, NodeFilter.SHOW_TEXT, null);
    var raak = [], n;
    while ((n = w.nextNode())){
      if (n.nodeValue.indexOf("-") < 0) continue;
      PATROON.lastIndex = 0;
      if (PATROON.test(n.nodeValue) && !magNiet(n)) raak.push(n);
    }
    for (var i = 0; i < raak.length; i++){
      raak[i].nodeValue = raak[i].nodeValue.replace(PATROON, function(_, j, m, d){ return d + "." + m + "." + j; });
    }
  }

  var gepland = false;
  function plan(){
    if (gepland) return;
    gepland = true;
    requestAnimationFrame(function(){ gepland = false; loop(document.body); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", plan);
  else plan();
  new MutationObserver(plan).observe(document.documentElement, {childList:true, subtree:true, characterData:true});
})();
</script>
